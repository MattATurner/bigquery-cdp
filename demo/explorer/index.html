me.","sql":"-- =====================================================================\n-- 96 \u00b7 Cost model\n--\n-- Answers \"what would this cost at our volume?\" from MEASUREMENT, not\n-- from assumption.\n--\n-- The distinction matters. Every cost estimate for this kind of workload\n-- that you have ever been shown was built by assuming a tokens-per-record\n-- figure and a grey-zone percentage, and both of those assumptions are\n-- doing all the work. This stage instead reads:\n--\n--   \u00b7 the token counts the models themselves reported (usageMetadata)\n--   \u00b7 the bytes and slot-time BigQuery actually billed (INFORMATION_SCHEMA)\n--\n-- and multiplies by unit prices held in config.env, where they can be\n-- corrected in one place when they change.\n--\n-- Where something genuinely cannot be measured \u2014 AI.EMBED and AI.CLASSIFY\n-- do not return usage metadata \u2014 it is estimated, and the output column\n-- says so. Nothing here silently mixes the two.\n--\n-- >>> UNIT PRICES ARE LIST PRICES CAPTURED 14 SEP 2026 AND WILL GO STALE.\n-- >>> Re-verify before putting a number in front of a customer.\n-- =====================================================================\n\n-- ---------------------------------------------------------------------\n-- 96a \u00b7 Unit prices, stamped onto the run\n--\n-- Written to a table rather than inlined so that a cost figure produced\n-- six months from now can still be traced to the prices it assumed.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS\nSELECT\n  CURRENT_TIMESTAMP()                             AS captured_at,\n  DATE '2026-09-14'                               AS price_list_date,\n  CAST('${CDP_PRICE_EMBED_INPUT}'       AS FLOAT64) AS usd_per_1m_embed_input,\n  CAST('${CDP_PRICE_EXTRACT_INPUT}'     AS FLOAT64) AS usd_per_1m_extract_input,\n  CAST('${CDP_PRICE_EXTRACT_OUTPUT}'    AS FLOAT64) AS usd_per_1m_extract_output,\n  CAST('${CDP_PRICE_ADJUDICATE_INPUT}'  AS FLOAT64) AS usd_per_1m_adjudicate_input,\n  CAST('${CDP_PRICE_ADJUDICATE_OUTPUT}' AS FLOAT64) AS usd_per_1m_adjudicate_output,\n  CAST('${CDP_PRICE_BQ_PER_TIB}'        AS FLOAT64) AS usd_per_tib_scanned,\n  CAST('${CDP_PRICE_BQ_SLOT_HOUR}'      AS FLOAT64) AS usd_per_slot_hour,\n  CAST('${CDP_PRICE_STORAGE_GIB_MONTH}' AS FLOAT64) AS usd_per_gib_month,\n  '${CDP_EMBEDDING_ENDPOINT}'                     AS embedding_model,\n  '${CDP_EXTRACTION_MODEL}'                       AS extraction_model,\n  '${CDP_ADJUDICATOR_MODEL}'                      AS adjudicator_model;\n\n\n-- ---------------------------------------------------------------------\n-- 96b \u00b7 What the run actually consumed\n--\n-- One row per cost component. `basis` is the honesty column: MEASURED\n-- means the number came from the model or from BigQuery's own accounting,\n-- ESTIMATED means it was derived from input size.\n--\n-- The estimate uses 4 characters per token, which is the usual English\n-- rule of thumb. It is wrong for the identity strings the embedder sees \u2014\n-- names and postcodes tokenise worse than prose \u2014 so treat the embedding\n-- line as the softest number here.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.cost_components` AS\n\nWITH\n-- Extraction over call transcripts.\ncall_extract AS (\n  SELECT\n    'extraction_calls'                     AS component,\n    COUNT(*)                               AS calls,\n    SUM(IFNULL(input_tokens, 0))           AS input_tokens,\n    SUM(IFNULL(output_tokens, 0))          AS output_tokens,\n    COUNTIF(input_tokens IS NULL)          AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.stg_call_entities`\n),\n\n-- Extraction over support ticket bodies. Covers the AI.GENERATE call only.\nticket_extract AS (\n  SELECT\n    'extraction_tickets'                   AS component,\n    COUNT(*)                               AS calls,\n    SUM(IFNULL(input_tokens, 0))           AS input_tokens,\n    SUM(IFNULL(output_tokens, 0))          AS output_tokens,\n    COUNTIF(input_tokens IS NULL)          AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.stg_support_entities`\n),\n\n-- AI.CLASSIFY on the same ticket bodies. Returns a bare STRING, so there\n-- is no usage metadata to read and this is necessarily an estimate.\n-- Output is a single label, so output tokens are negligible but nonzero.\nticket_classify AS (\n  SELECT\n    'classification_tickets'               AS component,\n    COUNT(*)                               AS calls,\n    CAST(SUM(CHAR_LENGTH(IFNULL(t.body, ''))) / 4 AS INT64) AS input_tokens,\n    COUNT(*) * 5                           AS output_tokens,\n    COUNT(*)                               AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_support_tickets` AS t\n),\n\n-- Embeddings. AI.EMBED reports no usage metadata, so this is estimated\n-- from the length of the match key that was embedded.\nembedding AS (\n  SELECT\n    'embedding'                            AS component,\n    COUNT(*)                               AS calls,\n    CAST(SUM(CHAR_LENGTH(IFNULL(match_key, ''))) / 4 AS INT64) AS input_tokens,\n    0                                      AS output_tokens,\n    COUNT(*)                               AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`\n),\n\n-- Adjudication. Measured, and scoped to the model and prompt currently in\n-- force so a re-run under a new prompt does not double-count history.\nadjudication AS (\n  SELECT\n    'adjudication'                         AS component,\n    COUNT(*)                               AS calls,\n    SUM(IFNULL(input_tokens, 0))           AS input_tokens,\n    SUM(IFNULL(output_tokens, 0))          AS output_tokens,\n    COUNTIF(input_tokens IS NULL)          AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.adjudications`\n  WHERE model          = '${CDP_ADJUDICATOR_MODEL}'\n    AND prompt_version = '${CDP_PROMPT_VERSION}'\n),\n\nall_components AS (\n  SELECT * FROM call_extract\n  UNION ALL SELECT * FROM ticket_extract\n  UNION ALL SELECT * FROM ticket_classify\n  UNION ALL SELECT * FROM embedding\n  UNION ALL SELECT * FROM adjudication\n)\n\nSELECT\n  c.component,\n  c.calls,\n  c.input_tokens,\n  c.output_tokens,\n  c.unmeasured_calls,\n  CASE\n    WHEN c.calls = 0                      THEN 'NO_CALLS'\n    WHEN c.unmeasured_calls = 0           THEN 'MEASURED'\n    WHEN c.unmeasured_calls = c.calls     THEN 'ESTIMATED'\n    ELSE                                       'PARTIAL'\n  END                                     AS basis,\n  -- Price each component at its own model's rate. Embedding is input-only.\n  ROUND(\n    CASE c.component\n      WHEN 'embedding' THEN\n        c.input_tokens / 1e6 * p.usd_per_1m_embed_input\n      WHEN 'adjudication' THEN\n          c.input_tokens  / 1e6 * p.usd_per_1m_adjudicate_input\n        + c.output_tokens / 1e6 * p.usd_per_1m_adjudicate_output\n      ELSE\n          c.input_tokens  / 1e6 * p.usd_per_1m_extract_input\n        + c.output_tokens / 1e6 * p.usd_per_1m_extract_output\n    END, 6)                               AS usd_model_cost\nFROM all_components AS c\nCROSS JOIN `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS p;\n\n\n-- ---------------------------------------------------------------------\n-- 96c \u00b7 BigQuery compute, from BigQuery's own accounting\n--\n-- A view rather than a table, deliberately. INFORMATION_SCHEMA requires\n-- permissions the pipeline does not otherwise need, and it is queried\n-- lazily \u2014 so if the caller lacks access, this view fails on SELECT\n-- instead of breaking the build.\n--\n-- Scoped to jobs since the preflight stage ran, which is the first thing\n-- that happens after the datasets are created and is therefore a clean\n-- run-start marker.\n--\n-- The region qualifier must match the dataset location.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_compute` AS\nWITH run_start AS (\n  SELECT MIN(checked_at) AS t0\n  FROM `${CDP_PROJECT}.${CDP_DS}.preflight_result`\n)\nSELECT\n  COUNT(*)                                          AS jobs,\n  SUM(j.total_bytes_billed)                         AS bytes_billed,\n  ROUND(SUM(j.total_bytes_billed) / POW(1024, 4), 6) AS tib_billed,\n  SUM(j.total_slot_ms)                              AS slot_ms,\n  ROUND(SUM(j.total_slot_ms) / 3600000.0, 4)        AS slot_hours,\n  ROUND(SUM(j.total_bytes_billed) / POW(1024, 4) * p.usd_per_tib_scanned, 4)\n                                                    AS usd_on_demand,\n  ROUND(SUM(j.total_slot_ms) / 3600000.0 * p.usd_per_slot_hour, 4)\n                                                    AS usd_enterprise_slots\nFROM `region-${CDP_LOCATION}`.INFORMATION_SCHEMA.JOBS_BY_PROJECT AS j\nCROSS JOIN `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS p\nCROSS JOIN run_start AS r\nWHERE j.creation_time >= r.t0\n  AND j.job_type       = 'QUERY'\n  AND j.state          = 'DONE'\nGROUP BY p.usd_per_tib_scanned, p.usd_per_slot_hour;\n\n\n-- ---------------------------------------------------------------------\n-- 96d \u00b7 The answer\n--\n-- Total cost of the run, unit economics, and a linear extrapolation to\n-- the configured target volume.\n--\n-- READ THE CAVEATS COLUMN BEFORE QUOTING ANY OF THIS. In particular the\n-- extrapolation is LINEAR, and the component that is least likely to\n-- behave linearly is adjudication: the number of pairs that reach the\n-- grey zone depends on how well blocking discriminates, and blocking gets\n-- harder as the corpus grows and near-duplicates become denser. A 75x\n-- corpus will not produce exactly 75x the grey zone. It is more likely to\n-- produce somewhat more, which is why the sensitivity view exists.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_model` AS\nWITH\ntotals AS (\n  SELECT\n    SUM(usd_model_cost)                               AS usd_model_total,\n    SUM(IF(component = 'adjudication', usd_model_cost, 0)) AS usd_adjudication,\n    SUM(IF(component = 'embedding',    usd_model_cost, 0)) AS usd_embedding,\n    SUM(IF(component IN ('extraction_calls', 'extraction_tickets',\n                         'classification_tickets'), usd_model_cost, 0)) AS usd_extraction,\n    SUM(calls)                                        AS ai_calls,\n    SUM(input_tokens + output_tokens)                 AS total_tokens,\n    COUNTIF(basis IN ('ESTIMATED', 'PARTIAL'))        AS components_estimated\n  FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`\n),\ncorpus AS (\n  SELECT COUNT(*) AS records FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n),\npeople AS (\n  SELECT COUNT(*) AS people FROM `${CDP_PROJECT}.${CDP_DS}.golden_person`\n),\ntarget AS (\n  SELECT\n    CAST('${CDP_TARGET_RECORDS}'     AS INT64)   AS target_records,\n    CAST('${CDP_TARGET_PEOPLE}'      AS INT64)   AS target_people,\n    CAST('${CDP_REBUILDS_PER_MONTH}' AS INT64)   AS rebuilds_per_month\n)\nSELECT\n  -- What was actually built\n  c.records                                          AS demo_records,\n  pe.people                                          AS demo_people_resolved,\n  t.ai_calls,\n  t.total_tokens,\n\n  -- What it cost, by component\n  ROUND(t.usd_extraction,   4)                       AS usd_extraction,\n  ROUND(t.usd_embedding,    4)                       AS usd_embedding,\n  ROUND(t.usd_adjudication, 4)                       AS usd_adjudication,\n  ROUND(t.usd_model_total,  4)                       AS usd_model_total,\n\n  -- Unit economics \u2014 the number worth remembering\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * 1000, 4)\n                                                     AS usd_model_per_1k_records,\n\n  -- Linear extrapolation to the customer's volume\n  tg.target_records,\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * tg.target_records, 2)\n                                                     AS usd_model_at_target_per_rebuild,\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * tg.target_records\n        * tg.rebuilds_per_month, 2)                  AS usd_model_at_target_per_month,\n\n  -- Honesty\n  t.components_estimated,\n  CASE\n    WHEN t.components_estimated = 0 THEN 'All components measured from reported token counts.'\n    ELSE FORMAT(\n      '%d of 5 components estimated rather than measured (AI.EMBED and AI.CLASSIFY '\n      || 'do not report usage metadata). See cost_components.basis.',\n      t.components_estimated)\n  END                                                AS measurement_note,\n  'EXCLUDES BigQuery compute \u2014 see v_cost_compute and add it. '\n  || 'Extrapolation is LINEAR in record count; adjudication volume is the '\n  || 'component most likely to grow faster than linearly, because blocking '\n  || 'discriminates less well as the corpus densifies. Treat the target figure '\n  || 'as a floor, not a forecast.'                   AS caveats\nFROM totals AS t\nCROSS JOIN corpus AS c\nCROSS JOIN people AS pe\nCROSS JOIN target AS tg;\n\n\n-- ---------------------------------------------------------------------\n-- 96e \u00b7 Sensitivity\n--\n-- The single biggest driver of cost at scale is what fraction of\n-- candidate pairs reach the adjudicator. That is a threshold decision,\n-- not a fact about the data, and it is the lever a customer will actually\n-- want to pull.\n--\n-- This shows what the target-scale bill does as that fraction moves,\n-- holding everything else constant. It is the view to have on screen when\n-- someone asks \"can we make it cheaper?\" \u2014 the answer is yes, and the\n-- cost of doing so is recall, which v_scorecard quantifies.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_sensitivity` AS\nWITH base AS (\n  SELECT\n    (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.party_records`) AS records,\n    (SELECT SUM(IF(component = 'adjudication', usd_model_cost, 0))\n     FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`)               AS usd_adjudication,\n    (SELECT SUM(IF(component <> 'adjudication', usd_model_cost, 0))\n     FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`)               AS usd_fixed,\n    (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.adjudications`\n      WHERE model = '${CDP_ADJUDICATOR_MODEL}'\n        AND prompt_version = '${CDP_PROMPT_VERSION}')               AS pairs_judged,\n    CAST('${CDP_TARGET_RECORDS}' AS INT64)                          AS target_records\n),\nmultipliers AS (\n  SELECT * FROM UNNEST([0.25, 0.5, 1.0, 2.0, 4.0]) AS grey_zone_multiplier\n)\nSELECT\n  m.grey_zone_multiplier,\n  CAST(b.pairs_judged * m.grey_zone_multiplier AS INT64)      AS pairs_judged_equivalent,\n  ROUND((b.usd_fixed + b.usd_adjudication * m.grey_zone_multiplier)\n        / NULLIF(b.records, 0) * b.target_records, 2)         AS usd_at_target_per_rebuild,\n  CASE m.grey_zone_multiplier\n    WHEN 0.25 THEN 'Aggressive thresholds. Cheapest, and the option most likely to under-merge.'\n    WHEN 0.5  THEN 'Tighter than shipped.'\n    WHEN 1.0  THEN 'As configured and as scored \u2014 this is the row the scorecard describes.'\n    WHEN 2.0  THEN 'Looser thresholds, more pairs reviewed by the model.'\n    WHEN 4.0  THEN 'Very loose. Diminishing returns; check v_scorecard before paying for this.'\n  END                                                         AS interpretation\nFROM base AS b\nCROSS JOIN multipliers AS m\nORDER BY m.grey_zone_multiplier;\n","sql_lines":326,"results":[{"view":"v_cost_model","columns":["ai_calls","caveats","components_estimated","demo_people_resolved","demo_records","measurement_note","target_records","total_tokens","usd_adjudication","usd_embedding","usd_extraction","usd_model_at_target_per_month","usd_model_at_target_per_rebuild","usd_model_per_1k_records","usd_model_total"],"rows":[{"ai_calls":"395502","caveats":"EXCLUDES BigQuery compute \u2014 see v_cost_compute and add it. Extrapolation is LINEAR in record count; adjudication volume is the component most likely to grow faster than linearly, because blocking discriminates less well as the corpus densifies. Treat the target figure as a floor, not a forecast.","components_estimated":"5","demo_people_resolved":"13712","demo_records":"20000","measurement_note":"5 of 5 components estimated rather than measured (AI.EMBED and AI.CLASSIFY do not report usage metadata). See cost_components.basis.","target_records":"15000000","total_tokens":"409125","usd_adjudication":"0.0","usd_embedding":"0.0483","usd_extraction":"0.0367","usd_model_at_target_per_month":"255.2","usd_model_at_target_per_rebuild":"63.8","usd_model_per_1k_records":"0.0043","usd_model_total":"0.0851"}],"row_count":1},{"view":"v_cost_compute","columns":["bytes_billed","jobs","slot_hours","slot_ms","tib_billed","usd_enterprise_slots","usd_on_demand"],"rows":[{"bytes_billed":"24962400256","jobs":"178","slot_hours":"34.9158","slot_ms":"125696785","tib_billed":"0.022703","usd_enterprise_slots":"2.0949","usd_on_demand":"0.1419"}],"row_count":1},{"view":"v_cost_sensitivity","columns":["grey_zone_multiplier","interpretation","pairs_judged_equivalent","usd_at_target_per_rebuild"],"rows":[{"grey_zone_multiplier":"0.25","interpretation":"Aggressive thresholds. Cheapest, and the option most likely to under-merge.","pairs_judged_equivalent":"93281","usd_at_target_per_rebuild":"63.8"},{"grey_zone_multiplier":"0.5","interpretation":"Tighter than shipped.","pairs_judged_equivalent":"186562","usd_at_target_per_rebuild":"63.8"},{"grey_zone_multiplier":"1.0","interpretation":"As configured and as scored \u2014 this is the row the scorecard describes.","pairs_judged_equivalent":"373124","usd_at_target_per_rebuild":"63.8"},{"grey_zone_multiplier":"2.0","interpretation":"Looser thresholds, more pairs reviewed by the model.","pairs_judged_equivalent":"746248","usd_at_target_per_rebuild":"63.8"},{"grey_zone_multiplier":"4.0","interpretation":"Very loose. Diminishing returns; check v_scorecard before paying for this.","pairs_judged_equivalent":"1492496","usd_at_target_per_rebuild":"63.8"}],"row_count":5}]}]};

<script>
'use strict';

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
/* The SVG namespace is discovered from a parsed <svg> element rather than
   written out as a literal URI, so no URL of any kind appears in this file. */
var SVGNS = (function(){
  var probe = document.createElement('div');
  probe.innerHTML = '<svg></svg>';
  return probe.firstChild.namespaceURI;
})();
function svgEl(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null)
    n.setAttribute(k, String(attrs[k]));
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }

/* ---------- values ---------- */
var NUM_RE = /^-?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
function isNum(v){
  if (typeof v === 'number') return isFinite(v);
  return typeof v === 'string' && v.trim() !== '' && NUM_RE.test(v.trim());
}
function numOf(v){ return typeof v === 'number' ? v : parseFloat(String(v)); }
function group(n){
  var s = String(n), neg = s.charAt(0) === '-';
  if (neg) s = s.slice(1);
  var p = s.split('.'), i = p[0], out = '';
  for (var c = 0; c < i.length; c++){
    if (c > 0 && (i.length - c) % 3 === 0) out += ',';
    out += i.charAt(c);
  }
  return (neg ? '-' : '') + out + (p[1] !== undefined ? '.' + p[1] : '');
}
/* Display form for a cell. Integers get thousand separators; decimals and
   scientific notation (BigQuery hands back things like 1.9999E8) are shown
   as the number they actually are, never re-rounded beyond 4 places. */
function fmt(v){
  if (v === null || v === undefined) return '\u2014';
  if (typeof v === 'object') return JSON.stringify(v);
  var s = String(v);
  if (!isNum(s)) return s;
  var t = s.trim();
  if (/^-?\d+$/.test(t)) return group(t);
  var n = numOf(t);
  if (/[eE]/.test(t)) {
    return Number.isInteger(n) ? group(n) : group(n.toFixed(4).replace(/0+$/, '').replace(/\.$/, ''));
  }
  return group(t);
}
function bigInt(v){ return v === null || v === undefined ? '\u2014' : fmt(v); }

/* Look-ups against the inlined payload. */
var STAGES = DATA.stages || [];
function stage(id){
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return STAGES[i];
  return null;
}
function view(stageId, viewName){
  var s = stage(stageId);
  if (!s) return null;
  for (var i = 0; i < (s.results || []).length; i++)
    if (s.results[i].view === viewName && !s.results[i].error) return s.results[i];
  return null;
}
function row0(stageId, viewName){
  var v = view(stageId, viewName);
  return v && v.rows && v.rows.length ? v.rows[0] : null;
}
function cell(r, k){ return r && r[k] !== undefined ? r[k] : null; }

/* ---------- SQL highlighting ---------- */
var KEYWORDS = ('select from where group by order having limit offset as on join left right full inner outer cross ' +
  'union all distinct case when then else end and or not in is null true false create replace table view function ' +
  'procedure temp temporary if exists insert into values update set delete merge using with partition cluster options ' +
  'schema dataset declare begin default returns language js sql return call execute immediate over window rows range ' +
  'between unbounded preceding following current row asc desc cast safe_cast struct array unnest qualify recursive ' +
  'primary key foreign references grant to interval extract date datetime timestamp numeric bignumeric string bytes ' +
  'int64 float64 bool json geography exception raise loop while do for end_if assert drop alter add column rename ' +
  'describe explain lateral pivot unpivot tablesample repeatable model remote connection').split(' ');
var KWSET = {};
for (var _i = 0; _i < KEYWORDS.length; _i++) KWSET[KEYWORDS[_i]] = 1;

function esc(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
var TOKEN_RE = new RegExp(
  '(/\\*[\\s\\S]*?\\*/)' +          /* block comment  */
  '|(--[^\\n]*|#[^\\n]*)' +          /* line comment   */
  "|(\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?''')" +  /* triple quoted */
  "|('(?:\\\\.|[^'\\\\\\n])*'|\"(?:\\\\.|[^\"\\\\\\n])*\")" +  /* string      */
  '|(`[^`]*`)' +                     /* quoted ident   */
  '|(\\b\\d+(?:\\.\\d+)?(?:[eE][-+]?\\d+)?\\b)' + /* number  */
  '|([A-Za-z_][A-Za-z0-9_]*)',       /* word           */
  'g');

function highlight(sql){
  var out = '', last = 0, m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(sql)) !== null){
    out += esc(sql.slice(last, m.index));
    var t = m[0], cls = null;
    if (m[1] || m[2]) cls = 'k-com';
    else if (m[3] || m[4]) cls = 'k-str';
    else if (m[5]) cls = null;
    else if (m[6]) cls = 'k-num';
    else if (m[7]){
      var lower = t.toLowerCase();
      if (KWSET[lower]) cls = 'k-kw';
      else if (sql.charAt(m.index + t.length) === '(') cls = 'k-fn';
    }
    out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
    last = m.index + t.length;
  }
  out += esc(sql.slice(last));
  return out;
}
function numberedCode(sql){
  /* A trailing newline is a line terminator, not an extra line -- keep the
     gutter agreeing with the "N lines" count in the header. */
  var lines = highlight(sql.replace(/\n$/, '')).split('\n'), out = '';
  for (var i = 0; i < lines.length; i++)
    out += '<span class="ln">' + (i + 1) + '</span>' + lines[i] + '\n';
  return out;
}

/* ---------- tables ---------- */
var FILTER_AT = 12;   /* rows above this get a filter box */
var TRUNC_AT  = 140;  /* characters above this get truncated with a title */

function buildTable(res){
  var box = el('div');
  var cols = res.columns || [];
  var rows = (res.rows || []).slice();
  var numeric = {};
  cols.forEach(function(c){
    var seen = 0, num = 0;
    rows.forEach(function(r){
      var v = r[c];
      if (v === null || v === undefined || v === '') return;
      seen++; if (isNum(v)) num++;
    });
    numeric[c] = seen > 0 && num === seen;
  });

  var state = { col: null, dir: 1, q: '' };
  var scroll = el('div', 'tscroll');
  var table = el('table');
  var thead = el('thead'), htr = el('tr');
  var ths = {};
  cols.forEach(function(c){
    var th = el('th', numeric[c] ? 'n' : '');
    th.appendChild(document.createTextNode(c));
    var ar = el('span', 'ar', '\u25B4\u25BE');
    th.appendChild(ar);
    th.title = 'Sort by ' + c;
    th.addEventListener('click', function(){
      if (state.col === c) state.dir = -state.dir; else { state.col = c; state.dir = 1; }
      draw();
    });
    ths[c] = { th: th, ar: ar };
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = el('tbody');
  table.appendChild(tbody);
  scroll.appendChild(table);

  var shown = el('span', 'shown');
  if (rows.length > FILTER_AT){
    var bar = el('div', 'tbar');
    var inp = el('input', 'filter');
    inp.type = 'search';
    inp.placeholder = 'Filter ' + rows.length + ' rows\u2026';
    inp.setAttribute('aria-label', 'Filter rows of ' + res.view);
    inp.addEventListener('input', function(){ state.q = inp.value.toLowerCase(); draw(); });
    bar.appendChild(inp);
    bar.appendChild(shown);
    box.appendChild(bar);
  }
  box.appendChild(scroll);

  function visible(){
    if (!state.q) return rows;
    return rows.filter(function(r){
      for (var i = 0; i < cols.length; i++){
        var v = r[cols[i]];
        if (v !== null && v !== undefined && String(v).toLowerCase().indexOf(state.q) >= 0) return true;
      }
      return false;
    });
  }
  function draw(){
    var rs = visible().slice();
    if (state.col){
      var c = state.col, n = numeric[c], d = state.dir;
      rs.sort(function(a, b){
        var x = a[c], y = b[c];
        var xn = x === null || x === undefined || x === '';
        var yn = y === null || y === undefined || y === '';
        if (xn && yn) return 0;
        if (xn) return 1;      /* empties always sink */
        if (yn) return -1;
        if (n) return (numOf(x) - numOf(y)) * d;
        return String(x).localeCompare(String(y)) * d;
      });
    }
    cols.forEach(function(c){
      ths[c].th.classList.toggle('sorted', state.col === c);
      ths[c].ar.textContent = state.col === c ? (state.dir > 0 ? '\u25B4' : '\u25BE') : '\u25B4\u25BE';
    });
    clear(tbody);
    rs.forEach(function(r){
      var tr = el('tr');
      cols.forEach(function(c){
        var v = r[c];
        var td = el('td', numeric[c] ? 'n' : '');
        if (v === null || v === undefined || v === ''){
          td.className += ' nil';
          td.textContent = '\u2014';
        } else {
          var s = fmt(v);
          if (s.length > TRUNC_AT){
            /* slice one short of the budget so the ellipsis always buys the
               reader something -- a value only a character over the limit
               would otherwise be "truncated" to the same length. */
            var sp = el('span', 'trunc', s.slice(0, TRUNC_AT - 1) + '\u2026');
            sp.title = String(v);
            td.appendChild(sp);
          } else {
            td.textContent = s;
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    shown.textContent = rs.length === rows.length
      ? rows.length + ' rows'
      : rs.length + ' of ' + rows.length + ' rows';
  }
  draw();
  return box;
}

/* ---------- hand-rolled SVG: horizontal bars ---------- */
function barChart(rows, labelCol, valueCol, opts){
  opts = opts || {};
  var W = 760, LBL = opts.labelWidth || 190, PAD = 96, RH = 26, TOP = 4;
  var H = TOP * 2 + rows.length * RH;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.setAttribute('aria-label', opts.aria || 'bar chart');
  var max = 0;
  rows.forEach(function(r){ var v = numOf(r[valueCol]); if (isFinite(v) && v > max) max = v; });
  if (max <= 0) max = 1;
  var track = W - LBL - PAD;
  rows.forEach(function(r, i){
    var y = TOP + i * RH;
    var v = numOf(r[valueCol]); if (!isFinite(v)) v = 0;
    var w = Math.max(v > 0 ? 2 : 0, Math.round(track * (v / max)));
    var lbl = svgEl('text', { x: LBL - 12, y: y + 15, 'text-anchor': 'end', class: 's-lbl' });
    lbl.textContent = String(r[labelCol]);
    svg.appendChild(lbl);
    svg.appendChild(svgEl('rect', { x: LBL, y: y + 5, width: track, height: 14, rx: 3, class: 's-track' }));
    svg.appendChild(svgEl('rect', {
      x: LBL, y: y + 5, width: w, height: 14, rx: 3,
      class: 'b' + (opts.colour !== undefined ? opts.colour : (i % 5))
    }));
    var val = svgEl('text', { x: LBL + track + 10, y: y + 16, class: 's-val' });
    val.textContent = fmt(r[valueCol]);
    svg.appendChild(val);
  });
  return svg;
}

/* ---------- hand-rolled SVG: funnel ---------- */
/* Widths are log-scaled: the first step is five orders of magnitude bigger
   than the last, so a linear funnel would draw the last steps as nothing. */
function funnel(steps){
  var W = 760, LBL = 214, VAL = 132, RH = 54, TOP = 6;
  var cw = W - LBL - VAL, cx = LBL + cw / 2;
  var H = TOP * 2 + steps.length * RH;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.setAttribute('aria-label', 'pipeline funnel');
  var max = 0;
  steps.forEach(function(s){ if (s.value > max) max = s.value; });
  function width(v){
    if (!(v > 0)) return 6;
    var f = Math.log10(v + 1) / Math.log10(max + 1);
    return Math.max(24, cw * Math.pow(f, 3));
  }
  steps.forEach(function(s, i){
    var y = TOP + i * RH;
    var w1 = width(s.value);
    var w2 = width(i + 1 < steps.length ? steps[i + 1].value : s.value);
    var pts = [
      (cx - w1 / 2) + ',' + y,
      (cx + w1 / 2) + ',' + y,
      (cx + w2 / 2) + ',' + (y + RH - 8),
      (cx - w2 / 2) + ',' + (y + RH - 8)
    ].join(' ');
    var poly = svgEl('polygon', { points: pts, class: 'f-shape' });
    poly.setAttribute('opacity', String(0.92 - i * 0.11));
    svg.appendChild(poly);

    var lbl = svgEl('text', { x: LBL - 16, y: y + 19, 'text-anchor': 'end', class: 's-lbl' });
    lbl.textContent = s.label;
    svg.appendChild(lbl);
    if (s.source){
      var src = svgEl('text', { x: LBL - 16, y: y + 34, 'text-anchor': 'end', class: 's-lbl' });
      src.setAttribute('opacity', '.7');
      src.textContent = s.source;
      svg.appendChild(src);
    }
    var val = svgEl('text', { x: W - VAL + 16, y: y + 19, class: 's-val' });
    val.textContent = fmt(s.value);
    svg.appendChild(val);
    if (s.note){
      var nt = svgEl('text', { x: W - VAL + 16, y: y + 34, class: 's-lbl' });
      nt.textContent = s.note;
      svg.appendChild(nt);
    }
  });
  return svg;
}
function vizBox(title, svg, caption){
  var b = el('div', 'viz');
  if (title){
    var h = el('div', 'sec-h');
    h.appendChild(el('h3', null, title));
    b.appendChild(h);
  }

  if (caption) b.appendChild(el('div', 'cap', caption));

}

/* ---------- declarative chart specs -------------------------------------
   Optional decoration only. Anything whose view or columns are missing from
   the payload is skipped, so a changed pipeline degrades to tables alone. */
var CHART_SPECS = {
  v_source_profile:        { label: 'source_system', value: 'records',  title: 'Records per source system' },
  v_candidate_funnel:      { label: 'tier',          value: 'pairs',    title: 'Scored pairs by tier' },
  v_retrieval_legs:        { label: 'retrieved_by',  value: 'pairs_retrieved', title: 'Pairs retrieved, by leg' },
  v_adjudication_summary:  { label: 'verdict',       value: 'pairs',    title: 'Adjudicator verdicts' },
  v_graph_summary:         { label: 'element',       value: 'n',        title: 'Graph elements' },
  v_cluster_sizes:         { label: 'cluster_size',  value: 'people',   title: 'People by cluster size', labelWidth: 110 },
  v_survivorship_by_source:{ label: 'source_system', value: 'fields_won', title: 'Fields won per source' },
  v_embedding_health:      { label: 'source_system', value: 'embedded', title: 'Records embedded per source' },
  v_case_results:          { label: 'case_type',     value: 'recall',   title: 'Recall per hard case', labelWidth: 220 }
};
function chartFor(res){
  var spec = CHART_SPECS[res.view];
  if (!spec || !res.rows || !res.rows.length) return null;
  var cols = res.columns || [];
  if (cols.indexOf(spec.label) < 0 || cols.indexOf(spec.value) < 0) return null;
  var rows = res.rows.filter(function(r){ return isNum(r[spec.value]); });
  if (rows.length < 2 || rows.length > 24) return null;
  return vizBox(spec.title,
    barChart(rows, spec.label, spec.value, { labelWidth: spec.labelWidth, colour: 0, aria: spec.title }),
    'Drawn from ' + res.view + '.' + spec.value + '.');
}

/* ---------- a single stage ---------- */
function renderStage(main, idx){
  var s = STAGES[idx];
  clear(main);
  var w = el('div', 'wrap');

  w.appendChild(el('div', 'eyebrow',
    'Stage ' + s.num + ' \u00b7 ' + (idx + 1) + ' of ' + STAGES.length));
  w.appendChild(el('h2', null, s.title));
  if (s.summary) w.appendChild(el('p', 'lede', s.summary));

  /* SQL, collapsed by default */
  if (s.sql){
    var sec = el('div', 'sec');
    var box = el('div', 'sqlbox');
    var bar = el('button', 'sqlbar');
    bar.setAttribute('aria-expanded', 'false');
    bar.appendChild(el('span', 'car', '\u25B6'));
    bar.appendChild(el('span', 'lbl', 'SQL \u00b7 ' + s.id + '.sql'));
    bar.appendChild(el('span', 'meta', s.sql_lines + ' lines'));
    bar.appendChild(el('span', 'sp'));
    var hint = el('span', 'meta', 'show');
    bar.appendChild(hint);
    var body = el('div', 'sqlbody');
    var pre = el('pre', 'code');
    var rendered = false;
    bar.addEventListener('click', function(){
      var open = box.classList.toggle('open');
      bar.setAttribute('aria-expanded', open ? 'true' : 'false');
      hint.textContent = open ? 'hide' : 'show';
      if (open && !rendered){ pre.innerHTML = numberedCode(s.sql); rendered = true; }
    });
    body.appendChild(pre);
    box.appendChild(bar);
    box.appendChild(body);
    sec.appendChild(box);
    w.appendChild(sec);
  }

  /* results */
  var results = s.results || [];
  if (!results.length){
    var none = el('div', 'sec');
    none.appendChild(el('div', 'err',
      'This stage produces no result view of its own \u2014 it creates objects the later '
      + 'stages read. The SQL above is the whole story.'));
    w.appendChild(none);
  }
  results.forEach(function(res){
    var sec = el('div', 'sec');
    var head = el('div', 'sec-h');
    head.appendChild(el('h3', null, res.view));
    if (res.error){
      head.appendChild(el('span', 'badge', 'not available'));
      sec.appendChild(head);
      sec.appendChild(el('div', 'err',
        'This view was not available when the results were extracted' +
        (typeof res.error === 'string' && res.error !== 'not available' ? ' (' + res.error + ')' : '') +
        '. Re-run the stage, then extract_results.py, to populate it.'));
      w.appendChild(sec);
      return;
    }
    var n = res.row_count !== undefined ? res.row_count : (res.rows || []).length;
    head.appendChild(el('span', 'count', n + (n === 1 ? ' row' : ' rows')
      + ' \u00b7 ' + (res.columns || []).length + ' columns'));
    sec.appendChild(head);
    var chart = chartFor(res);
    if (chart){ chart.style.marginBottom = '16px'; sec.appendChild(chart); }
    sec.appendChild(buildTable(res));
    w.appendChild(sec);
  });

  var foot = el('div', 'foot');
  if (idx > 0) foot.appendChild(navLink('\u2190 ' + STAGES[idx - 1].num + ' ' + STAGES[idx - 1].title, idx - 1));
  if (idx < STAGES.length - 1) foot.appendChild(navLink(STAGES[idx + 1].num + ' ' + STAGES[idx + 1].title + ' \u2192', idx + 1));
  w.appendChild(foot);

  main.appendChild(w);
  main.scrollTop = 0;
}

function mark(){
  navItems.forEach(function(b, i){ b.classList.toggle('on', i - 1 === current); });

    d.classList.toggle('on', i === current);
    d.classList.toggle('seen', current >= 0 && i < current);
  });

    ? 'Stage explorer \u00b7 ' + DATA.project + '.' + DATA.dataset
    : STAGES[current].num + ' ' + STAGES[current].title + ' \u00b7 stage explorer';

function go(idx){
  if (idx < -1) idx = -1;
  if (idx > STAGES.length - 1) idx = STAGES.length - 1;
  current = idx;
  var main = document.getElementById('main');
  if (idx < 0) renderOverview(main); else renderStage(main, idx);
  mark();
  var dot = railDots[idx < 0 ? 0 : idx];
  if (dot && dot.scrollIntoView) dot.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

var THEME_KEY = 'cdp-explorer-theme';
function readTheme(){
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
function applyTheme(t){
  document.body.classList.toggle('dark', t === 'dark');
  var b = document.getElementById('theme');
  if (b){
    // Target the span, not lastChild: the markup has a newline after
    // </span>, so lastChild is a whitespace text node and writing to it
    // leaves the original label in place -- the button renders "Dark Dark".
    var lbl = b.querySelector('span');
    if (lbl) lbl.textContent = t === 'dark' ? 'Light' : 'Dark';
    b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
    b.title = t === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme';
  }
}
function initTheme(){
  applyTheme(readTheme() === 'dark' ? 'dark' : 'light');
  document.getElementById('theme').addEventListener('click', function(){
    var next = document.body.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage disabled */ }
  });
}

function initKeys(){
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target || {};
    var tag = (t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(current + 1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(current - 1); }
    else if (e.key === 'Home'){ e.preventDefault(); go(-1); }
    else if (e.key === 'End'){ e.preventDefault(); go(STAGES.length - 1); }
  });
}

function initChips(){
  var c = document.getElementById('chips');
  var bits = [DATA.project + '.' + DATA.dataset];
  if (DATA.location) bits.push(DATA.location);
  var corpus = DATA.corpus || {};
  if (corpus.records) bits.push(fmt(corpus.records) + ' records');
  if (corpus.people) bits.push(fmt(corpus.people) + ' people');
  bits.forEach(function(b){ c.appendChild(el('span', 'chip', b)); });
}

function boot(){
  initTheme();
  initChips();
  buildNav();
  buildRail();
  initKeys();
  go(-1);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
