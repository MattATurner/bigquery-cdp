${CDP_PROJECT}.${CDP_DS}.edge_holds_account`\nAS\nSELECT\n  a.person_id,\n  p.account_number AS account_id,\n  COUNT(*) AS assertions\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\nWHERE p.account_number IS NOT NULL\nGROUP BY a.person_id, p.account_number;\n\n-- 7 \u00b7 Person \u2014SUSPECTED_LINK\u2192 Person\n--\n-- The steward queue, expressed as graph edges rather than a side table.\n-- These are pairs the system refused to decide. Keeping them in the graph\n-- means downstream consumers can see that a profile is provisional,\n-- instead of discovering it when a customer complains.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_suspected_link`\nAS\nSELECT DISTINCT\n  LEAST(pa.person_id, pb.person_id)    AS person_id_a,\n  GREATEST(pa.person_id, pb.person_id) AS person_id_b,\n  d.confidence,\n  d.rationale,\n  d.contradiction,\n  d.decided_by,\n  d.retrieved_by\nFROM `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pa ON pa.record_id = d.record_id_a\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pb ON pb.record_id = d.record_id_b\nWHERE d.decision = 'STEWARD'\n  AND pa.person_id != pb.person_id;\n\n-- 8 \u00b7 Person \u2014RELATED_TO\u2192 Person\n--\n-- Asserted relationships, taken only from what somebody actually said.\n-- The call transcript case \u2014 \"I'm ringing about my wife's account\" \u2014\n-- produces a relationship edge, which is the correct outcome. The wrong\n-- outcome, and the easy one, is a merge.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_related_to`\nAS\nSELECT DISTINCT\n  caller.person_id                     AS person_id,\n  holder.person_id                     AS related_person_id,\n  IFNULL(c.relationship_to_account, 'UNSPECIFIED') AS relationship,\n  'CALL_TRANSCRIPT'                    AS asserted_by,\n  c.record_id                          AS evidence_record_id\nFROM `${CDP_PROJECT}.${CDP_DS}.stg_call_entities` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS caller\n  ON caller.record_id = c.record_id\n-- The account holder is identified by the account number the caller quoted.\nJOIN `${CDP_PROJECT}.${CDP_DS}.edge_holds_account` AS ha\n  ON ha.account_id = c.account_number\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_person` AS holder\n  ON holder.person_id = ha.person_id\nWHERE NOT c.caller_is_account_holder\n  AND c.account_number IS NOT NULL\n  AND caller.person_id != ha.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 70i \u00b7 Shape of the result\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_graph_summary` AS\nSELECT 'node \u00b7 person'         AS element, COUNT(*) AS n FROM `${CDP_PROJECT}.${CDP_DS}.node_person`\nUNION ALL SELECT 'node \u00b7 source record', COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_source_record`\nUNION ALL SELECT 'node \u00b7 household',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_household`\nUNION ALL SELECT 'node \u00b7 address',       COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_address`\nUNION ALL SELECT 'node \u00b7 email',         COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_email`\nUNION ALL SELECT 'node \u00b7 phone',         COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_phone`\nUNION ALL SELECT 'node \u00b7 account',       COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_account`\nUNION ALL SELECT 'edge \u00b7 resolves_to',   COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to`\nUNION ALL SELECT 'edge \u00b7 lives_at',      COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_lives_at`\nUNION ALL SELECT 'edge \u00b7 member_of',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_member_of`\nUNION ALL SELECT 'edge \u00b7 has_email',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_email`\nUNION ALL SELECT 'edge \u00b7 has_phone',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_phone`\nUNION ALL SELECT 'edge \u00b7 holds_account', COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_holds_account`\nUNION ALL SELECT 'edge \u00b7 suspected_link',COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_suspected_link`\nUNION ALL SELECT 'edge \u00b7 related_to',    COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_related_to`;\n\n\n-- ---------------------------------------------------------------------\n-- 70j \u00b7 Cluster size distribution\n--\n-- The distribution is more informative than the count. A long tail of\n-- enormous clusters is the signature of runaway transitive closure, and\n-- it is visible here before anyone looks at a single profile.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cluster_sizes` AS\nSELECT\n  source_record_count AS cluster_size,\n  COUNT(*)            AS people,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS pct_of_people\nFROM `${CDP_PROJECT}.${CDP_DS}.node_person`\nGROUP BY cluster_size\nORDER BY cluster_size;\n","sql_lines":614,"results":[{"view":"v_graph_summary","columns":["element","n"],"rows":[{"element":"node \u00b7 person","n":"13712"},{"element":"node \u00b7 source record","n":"20000"},{"element":"node \u00b7 household","n":"7641"},{"element":"node \u00b7 address","n":"8598"},{"element":"node \u00b7 email","n":"7739"},{"element":"node \u00b7 phone","n":"6669"},{"element":"node \u00b7 account","n":"4309"},{"element":"edge \u00b7 resolves_to","n":"20000"},{"element":"edge \u00b7 lives_at","n":"9106"},{"element":"edge \u00b7 member_of","n":"6590"},{"element":"edge \u00b7 has_email","n":"8004"},{"element":"edge \u00b7 has_phone","n":"6782"},{"element":"edge \u00b7 holds_account","n":"4348"},{"element":"edge \u00b7 suspected_link","n":"77462"},{"element":"edge \u00b7 related_to","n":"3"}],"row_count":15},{"view":"v_cluster_sizes","columns":["cluster_size","pct_of_people","people"],"rows":[{"cluster_size":"1","pct_of_people":"68.09","people":"9337"},{"cluster_size":"2","pct_of_people":"20.71","people":"2840"},{"cluster_size":"3","pct_of_people":"8.77","people":"1203"},{"cluster_size":"4","pct_of_people":"2.27","people":"311"},{"cluster_size":"5","pct_of_people":"0.12","people":"16"},{"cluster_size":"6","pct_of_people":"0.01","people":"1"},{"cluster_size":"8","pct_of_people":"0.02","people":"3"},{"cluster_size":"20","pct_of_people":"0.01","people":"1"}],"row_count":8}]},{"id":"80_survivorship","num":"80","title":"Survivorship","summary":"Picks the winning value per field when sources disagree, weighted by source trust.","sql":"-- =====================================================================\n-- 80 \u00b7 Survivorship\n--\n-- Resolution decides which records belong to one person. Survivorship\n-- decides what that person's name, address and phone number actually are\n-- when the records disagree \u2014 which they almost always do.\n--\n-- Two principles run through this stage:\n--\n--   1. Survivorship is per FIELD, not per record. The best address and\n--      the best email routinely come from different systems. Picking a\n--      single \"winning record\" and copying it wholesale throws away the\n--      one thing every other source was right about.\n--\n--   2. Every surviving value keeps its provenance. \"Where did this\n--      address come from, and when\" must be answerable in one query, by\n--      someone who was not in the room when the rules were written.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 80a \u00b7 Field assertions\n--\n-- Every value every source ever claimed, flattened to one row per\n-- assertion. Nothing is discarded here \u2014 the losing values are kept, and\n-- they are what makes the conflict count meaningful later.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_assertions`\nCLUSTER BY person_id, field\nAS\nSELECT\n  a.person_id,\n  p.record_id,\n  p.source_system,\n  p.source_trust,\n  p.source_ts,\n  f.field,\n  f.value_norm,\n  f.value_raw\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id,\nUNNEST([\n  STRUCT('forename' AS field, p.forename_norm AS value_norm, p.forename_norm AS value_raw),\n  STRUCT('surname',           p.surname_norm,                p.surname_norm),\n  STRUCT('full_name',         p.name_norm,                   p.raw_name),\n  STRUCT('address',           p.address_norm,                p.raw_address),\n  STRUCT('city',              UPPER(p.raw_city),             p.raw_city),\n  STRUCT('postcode',          p.postcode_norm,               p.raw_postcode),\n  STRUCT('email',             p.email_norm,                  p.raw_email),\n  STRUCT('phone',             p.phone_e164,                  p.raw_phone),\n  STRUCT('dob',               CAST(p.dob AS STRING),         CAST(p.dob AS STRING)),\n  STRUCT('account_number',    p.account_number,              p.account_number)\n]) AS f\nWHERE f.value_norm IS NOT NULL AND f.value_norm != '';\n\n\n-- ---------------------------------------------------------------------\n-- 80b \u00b7 The rule\n--\n-- Ordered, and the order is the policy:\n--\n--   1. source trust        a CRM address beats a bought one, always\n--   2. recency             within a trust tier, newer wins \u2014 this is what\n--                          makes a house move propagate\n--   3. corroboration       more sources asserting the same value\n--   4. record_id           a deterministic tie-break, so the same inputs\n--                          always produce the same golden record\n--\n-- Step 4 looks trivial and is not. Without it, two runs over identical\n-- data can disagree, and a customer's displayed address flickers between\n-- two equally-ranked values. That is the kind of bug that destroys trust\n-- in a platform and takes weeks to track down.\n--\n-- Recency is deliberately SECOND, not first. A fresh record from a\n-- third-party enrichment file should not overwrite a verified CRM\n-- address just because it arrived this morning.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nCLUSTER BY person_id, field\nAS\nWITH corroboration AS (\n  SELECT\n    person_id, field, value_norm,\n    COUNT(DISTINCT source_system) AS asserting_sources,\n    COUNT(*)                      AS assertions\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field, value_norm\n),\nranked AS (\n  SELECT\n    fa.*,\n    c.asserting_sources,\n    c.assertions,\n    ROW_NUMBER() OVER (\n      PARTITION BY fa.person_id, fa.field\n      ORDER BY\n        fa.source_trust DESC,\n        fa.source_ts DESC NULLS LAST,\n        c.asserting_sources DESC,\n        fa.record_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n  JOIN corroboration AS c\n    ON c.person_id = fa.person_id AND c.field = fa.field AND c.value_norm = fa.value_norm\n),\nconflict AS (\n  SELECT person_id, field, COUNT(DISTINCT value_norm) AS distinct_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field\n)\nSELECT\n  r.person_id,\n  r.field,\n  r.value_norm                       AS surviving_value_norm,\n  r.value_raw                        AS surviving_value,\n  r.record_id                        AS won_from_record_id,\n  r.source_system                    AS won_from_source,\n  r.source_trust,\n  r.source_ts                        AS asserted_at,\n  r.asserting_sources,\n  cf.distinct_values,\n  cf.distinct_values > 1             AS was_contested,\n  CONCAT(\n    'Selected from ', r.source_system,\n    ' (trust ', CAST(r.source_trust AS STRING), ')',\n    IF(cf.distinct_values > 1,\n       CONCAT(' over ', CAST(cf.distinct_values - 1 AS STRING), ' competing value(s)'),\n       ' \u2014 uncontested'),\n    '; corroborated by ', CAST(r.asserting_sources AS STRING), ' source(s).'\n  )                                  AS provenance\nFROM ranked AS r\nJOIN conflict AS cf ON cf.person_id = r.person_id AND cf.field = r.field\nWHERE r.rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 80c \u00b7 The golden record\n--\n-- The wide, consumable view of a person. This is what a marketer, an\n-- agent or a service desk actually reads.\n--\n-- Note the deliberate omission: no consent fields. Consent is computed in\n-- stage 85 under its own rules, and is never a survivorship outcome. If\n-- consent were resolved here it would inherit the \"highest trust wins\"\n-- logic, and a high-trust GRANTED would silently overwrite a\n-- low-trust WITHDRAWN. That is precisely the failure this build exists to\n-- prevent.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.golden_person`\nCLUSTER BY person_id\nAS\nSELECT\n  s.person_id,\n  MAX(IF(field = 'full_name',      surviving_value, NULL)) AS full_name,\n  MAX(IF(field = 'forename',       surviving_value, NULL)) AS forename,\n  MAX(IF(field = 'surname',        surviving_value, NULL)) AS surname,\n  MAX(IF(field = 'address',        surviving_value, NULL)) AS address,\n  MAX(IF(field = 'city',           surviving_value, NULL)) AS city,\n  MAX(IF(field = 'postcode',       surviving_value, NULL)) AS postcode,\n  MAX(IF(field = 'email',          surviving_value, NULL)) AS email,\n  MAX(IF(field = 'phone',          surviving_value, NULL)) AS phone,\n  SAFE.PARSE_DATE('%Y-%m-%d',\n    MAX(IF(field = 'dob',          surviving_value, NULL))) AS dob,\n  MAX(IF(field = 'account_number', surviving_value, NULL)) AS account_number,\n\n  -- How much of this profile was argued over. A high number is not a\n  -- problem in itself \u2014 it means the sources genuinely disagreed and the\n  -- rules did their job \u2014 but it is a useful steward triage signal.\n  COUNTIF(was_contested)                                   AS contested_fields,\n  COUNT(*)                                                 AS populated_fields,\n  MAX(source_trust)                                        AS best_source_trust,\n  MAX(asserted_at)                                         AS most_recent_assertion\nFROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\nGROUP BY s.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 80d \u00b7 Which sources actually win\n--\n-- Worth showing, because it is usually a surprise. If a low-trust source\n-- is winning a large share of fields, it is not because the rule is\n-- broken \u2014 it is because the high-trust sources are silent, and that is a\n-- data-capture problem rather than a matching one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_survivorship_by_source` AS\nSELECT\n  won_from_source                                   AS source_system,\n  ANY_VALUE(source_trust)                           AS trust,\n  COUNT(*)                                          AS fields_won,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2)  AS pct_of_fields_won,\n  COUNTIF(was_contested)                            AS won_against_competition,\n  ARRAY_AGG(DISTINCT field ORDER BY field)          AS fields\nFROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nGROUP BY won_from_source\nORDER BY fields_won DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 80e \u00b7 Show me one person, end to end\n--\n-- The single most useful query in the whole demo. Give it a person_id and\n-- it returns every field, the value that survived, where it came from,\n-- and what it beat.\n--\n--   SELECT * FROM cdp.tf_explain_person('PER-00000000deadbeef');\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_explain_person`(p_person_id STRING)\nAS (\n  SELECT\n    s.field,\n    s.surviving_value,\n    s.won_from_source,\n    s.source_trust,\n    s.asserted_at,\n    s.was_contested,\n    s.provenance,\n    -- The values that lost, so the decision can be challenged rather than\n    -- merely accepted.\n    ARRAY(\n      SELECT AS STRUCT fa.source_system, fa.value_raw, fa.source_trust, fa.source_ts\n      FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n      WHERE fa.person_id = s.person_id\n        AND fa.field     = s.field\n        AND fa.value_norm != s.surviving_value_norm\n      ORDER BY fa.source_trust DESC\n    ) AS rejected_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\n  WHERE s.person_id = p_person_id\n);\n","sql_lines":234,"results":[{"view":"v_survivorship_by_source","columns":["fields","fields_won","pct_of_fields_won","source_system","trust","won_against_competition"],"rows":[{"fields":["address","city","dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"37157","pct_of_fields_won":"43.0","source_system":"CRM","trust":"9","won_against_competition":"6187"},{"fields":["account_number","address","city","dob","forename","full_name","phone","postcode","surname"],"fields_won":"17077","pct_of_fields_won":"19.76","source_system":"LOYALTY","trust":"7","won_against_competition":"1584"},{"fields":["account_number","forename","full_name","surname"],"fields_won":"14616","pct_of_fields_won":"16.92","source_system":"POS","trust":"3","won_against_competition":"119"},{"fields":["dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"10130","pct_of_fields_won":"11.72","source_system":"ECOM","trust":"6","won_against_competition":"453"},{"fields":["address","email","forename","full_name","postcode","surname"],"fields_won":"5064","pct_of_fields_won":"5.86","source_system":"ENRICH","trust":"2","won_against_competition":"82"},{"fields":["account_number","address","email","forename","full_name","phone","postcode","surname"],"fields_won":"1629","pct_of_fields_won":"1.89","source_system":"SUPPORT","trust":"4","won_against_competition":"60"},{"fields":["account_number","address","dob","email","forename","full_name","postcode","surname"],"fields_won":"731","pct_of_fields_won":"0.85","source_system":"CALL","trust":"4","won_against_competition":"38"}],"row_count":7}]},{"id":"85_consent","num":"85","title":"Consent","summary":"Recomputes permissions at profile level. Merging two records never merges their consent.","sql":"-- =====================================================================\n-- 85 \u00b7 Consent\n--\n-- The stage that most MDM builds get wrong, and the one with legal\n-- consequences when they do.\n--\n-- Merging two records merges their behaviour, their orders and their\n-- addresses. It must NOT merge their permissions. Consent was given by a\n-- person, to a specific organisation, through a specific channel, for a\n-- specific purpose, at a specific moment \u2014 and joining two rows in a\n-- warehouse does not create permission that nobody ever gave.\n--\n-- Three rules, in order:\n--\n--   1. A suppression always wins. Deceased or minor indications override\n--      everything, including an explicit grant.\n--   2. An explicit withdrawal always wins over a grant, regardless of\n--      which is more recent. \"I changed my mind\" does not expire.\n--   3. Otherwise permission is the INTERSECTION, not the union. A profile\n--      may be contacted on a channel only where every contributing record\n--      agrees it may be.\n--\n-- Rule 3 is the expensive one, and the one commercial pressure pushes\n-- against. Stage 85d puts a number on exactly how many contacts it costs\n-- \u2014 and therefore how many unlawful contacts the union rule would have\n-- produced.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 85a \u00b7 Consent state per source record\n--\n-- Consent events are append-only, so the current state of a record is\n-- its most recent event for that channel and purpose. Nothing is\n-- rewritten; the history remains queryable.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.consent_record_state`\nCLUSTER BY record_id, channel\nAS\nSELECT * EXCEPT (rn)\nFROM (\n  SELECT\n    e.record_id,\n    e.channel,\n    e.purpose,\n    e.status,\n    e.captured_at,\n    e.consent_id,\n    ROW_NUMBER() OVER (\n      PARTITION BY e.record_id, e.channel, e.purpose\n      ORDER BY e.captured_at DESC, e.consent_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.src_consent_events` AS e\n)\nWHERE rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 85b \u00b7 Suppressions\n--\n-- Sourced from the risk classification in stage 20. These are not\n-- preferences and are not negotiable \u2014 a marketing send to a deceased\n-- customer's household is the kind of failure that reaches the press.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_suppression`\nCLUSTER BY person_id\nAS\nSELECT\n  a.person_id,\n  LOGICAL_OR(s.suppress_marketing)                            AS suppress_marketing,\n  ARRAY_AGG(DISTINCT s.risk_category IGNORE NULLS\n            ORDER BY s.risk_category)                         AS risk_categories,\n  ANY_VALUE(s.risk_evidence)                                  AS sample_evidence,\n  ARRAY_AGG(DISTINCT s.record_id ORDER BY s.record_id)        AS evidence_record_ids\nFROM `${CDP_PROJECT}.${CDP_DS}.stg_support_entities` AS s\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = s.record_id\nWHERE s.risk_category != 'NONE'\nGROUP BY a.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85c \u00b7 Effective permission per person, channel and purpose\n--\n-- Both rules are computed side by side. The union rule is not here\n-- because it is a reasonable option \u2014 it is here so that the cost of\n-- doing the right thing can be stated precisely instead of argued about.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_consent`\nCLUSTER BY person_id, channel\nAS\nWITH per_person AS (\n  SELECT\n    a.person_id,\n    c.channel,\n    c.purpose,\n    COUNT(*)                                             AS contributing_records,\n    LOGICAL_OR(c.status = 'WITHDRAWN')                   AS any_withdrawn,\n    LOGICAL_OR(c.status = 'GRANTED')                     AS any_granted,\n    LOGICAL_AND(c.status = 'GRANTED')                    AS all_granted,\n    COUNTIF(c.status = 'GRANTED')                        AS granted_count,\n    COUNTIF(c.status = 'WITHDRAWN')                      AS withdrawn_count,\n    COUNTIF(c.status = 'NOT_GIVEN')                      AS not_given_count,\n    MIN(IF(c.status = 'WITHDRAWN', c.captured_at, NULL)) AS first_withdrawn_at,\n    MAX(c.captured_at)                                   AS latest_event_at,\n    ARRAY_AGG(STRUCT(c.record_id, c.status, c.captured_at)\n              ORDER BY c.captured_at)                    AS evidence\n  FROM `${CDP_PROJECT}.${CDP_DS}.consent_record_state` AS c\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = c.record_id\n  GROUP BY a.person_id, c.channel, c.purpose\n),\n-- How many of a person's records could have carried a consent statement\n-- but do not. Under a strict reading, silence is not permission.\ncoverage AS (\n  SELECT person_id, COUNT(*) AS total_records\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment`\n  GROUP BY person_id\n)\nSELECT\n  p.person_id,\n  p.channel,\n  p.purpose,\n  p.contributing_records,\n  cv.total_records,\n  p.granted_count,\n  p.withdrawn_count,\n  p.not_given_count,\n\n  -- THE RULE\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted                                                    THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status,\n\n  -- The stricter reading: a record that never said anything counts\n  -- against permission rather than being ignored. Offered as a column\n  -- rather than imposed, because which reading applies is a legal\n  -- decision, not an engineering one \u2014 but it should be a decision\n  -- somebody consciously makes.\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted AND p.contributing_records = cv.total_records      THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status_strict,\n\n  -- The common, wrong implementation. Retained purely for comparison.\n  CASE\n    WHEN p.any_granted THEN 'GRANTED'\n    ELSE                    'NOT_GIVEN'\n  END                                        AS naive_union_status,\n\n  IFNULL(sp.suppress_marketing, FALSE)       AS suppressed,\n  sp.risk_categories,\n  p.first_withdrawn_at,\n  p.latest_event_at,\n  p.evidence,\n\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING'\n      THEN CONCAT('Suppressed: ', ARRAY_TO_STRING(sp.risk_categories, ', '),\n                  ' indication found in support contact.')\n    WHEN p.any_withdrawn\n      THEN CONCAT('Withdrawn on ', FORMAT_TIMESTAMP('%Y-%m-%d', p.first_withdrawn_at),\n                  '. Withdrawal is absolute and is not overridden by a later grant '\n                  'from another source.')\n    WHEN p.all_granted\n      THEN CONCAT('All ', CAST(p.contributing_records AS STRING),\n                  ' contributing record(s) granted permission on this channel.')\n    ELSE\n      CONCAT(CAST(p.granted_count AS STRING), ' of ',\n             CAST(p.contributing_records AS STRING),\n             ' contributing record(s) granted permission \u2014 not unanimous, '\n             'so permission is not inherited.')\n  END                                        AS explanation\nFROM per_person AS p\nJOIN coverage AS cv ON cv.person_id = p.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_suppression` AS sp ON sp.person_id = p.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85d \u00b7 What the rule costs, and what it prevents\n--\n-- The number to put in front of a CMO. The union rule produces a bigger\n-- audience; every extra contact in it is a contact the customer did not\n-- agree to, on a channel where at least one of their records says no.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_impact` AS\nSELECT\n  channel,\n  purpose,\n  COUNT(*)                                          AS people_with_a_stated_preference,\n  COUNTIF(naive_union_status = 'GRANTED')           AS audience_union_rule,\n  COUNTIF(effective_status = 'GRANTED')             AS audience_intersection_rule,\n  COUNTIF(effective_status_strict = 'GRANTED')      AS audience_strict_rule,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status != 'GRANTED')        AS contacts_the_union_rule_would_add,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status = 'WITHDRAWN')       AS of_which_explicitly_withdrawn,\n  COUNTIF(effective_status = 'SUPPRESSED')          AS suppressed_for_risk,\n  ROUND(100 * SAFE_DIVIDE(\n    COUNTIF(naive_union_status = 'GRANTED' AND effective_status != 'GRANTED'),\n    NULLIF(COUNTIF(naive_union_status = 'GRANTED'), 0)), 2) AS pct_of_union_audience_unlawful\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\nGROUP BY channel, purpose\nORDER BY channel, purpose;\n\n\n-- ---------------------------------------------------------------------\n-- 85e \u00b7 The conflict cases, named\n--\n-- The generator plants people whose records carry GRANTED, NOT_GIVEN and\n-- WITHDRAWN for the same channel across three different systems. This is\n-- not a contrived edge case: it is what happens when a customer signs up\n-- online, opts out in store, and never updates the app.\n--\n-- Put one of these on screen. It is the single clearest illustration of\n-- why \"merge the profiles\" and \"merge the permissions\" are different\n-- operations.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_conflicts` AS\nSELECT\n  c.person_id,\n  g.full_name,\n  c.channel,\n  c.purpose,\n  c.granted_count,\n  c.withdrawn_count,\n  c.not_given_count,\n  c.naive_union_status  AS would_have_been_contacted,\n  c.effective_status    AS actual_decision,\n  c.explanation,\n  c.evidence\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nWHERE c.granted_count > 0\n  AND (c.withdrawn_count > 0 OR c.not_given_count > 0)\nORDER BY c.withdrawn_count DESC, c.granted_count DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 85f \u00b7 The activation-safe audience\n--\n-- The only table any downstream campaign should read. If a marketer can\n-- reach person_consent directly, sooner or later somebody will write\n-- their own interpretation of the rules \u2014 and it will be the union one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS\nSELECT\n  c.person_id,\n  c.channel,\n  c.purpose,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nWHERE c.effective_status = 'GRANTED';\n","sql_lines":266,"results":[{"view":"v_consent_impact","columns":["audience_intersection_rule","audience_strict_rule","audience_union_rule","channel","contacts_the_union_rule_would_add","of_which_explicitly_withdrawn","pct_of_union_audience_unlawful","people_with_a_stated_preference","purpose","suppressed_for_risk"],"rows":[{"audience_intersection_rule":"1852","audience_strict_rule":"810","audience_union_rule":"2065","channel":"EMAIL","contacts_the_union_rule_would_add":"213","of_which_explicitly_withdrawn":"75","pct_of_union_audience_unlawful":"10.31","people_with_a_stated_preference":"3298","purpose":"MARKETING","suppressed_for_risk":"22"},{"audience_intersection_rule":"691","audience_strict_rule":"255","audience_union_rule":"704","channel":"EMAIL","contacts_the_union_rule_would_add":"13","of_which_explicitly_withdrawn":"4","pct_of_union_audience_unlawful":"1.85","people_with_a_stated_preference":"1142","purpose":"SERVICE","suppressed_for_risk":"0"},{"audience_intersection_rule":"728","audience_strict_rule":"253","audience_union_rule":"754","channel":"PHONE","contacts_the_union_rule_would_add":"26","of_which_explicitly_withdrawn":"8","pct_of_union_audience_unlawful":"3.45","people_with_a_stated_preference":"1208","purpose":"MARKETING","suppressed_for_risk":"8"},{"audience_intersection_rule":"212","audience_strict_rule":"68","audience_union_rule":"214","channel":"PHONE","contacts_the_union_rule_would_add":"2","of_which_explicitly_withdrawn":"1","pct_of_union_audience_unlawful":"0.93","people_with_a_stated_preference":"353","purpose":"SERVICE","suppressed_for_risk":"0"},{"audience_intersection_rule":"946","audience_strict_rule":"347","audience_union_rule":"999","chan 2:40","record_id":"ECOM-0d7b8797","status":"WITHDRAWN"},{"captured_at":"2025-09-14 09:30:21","record_id":"CRM-16c2673e","status":"GRANTED"}],"explanation":"Withdrawn on 2023-10-20. Withdrawal is absolute and is not overridden by a later grant from another source.","full_name":"Juliie Richard","granted_count":"1","not_given_count":"0","person_id":"PER-5f4b32618921b1ad","purpose":"MARKETING","withdrawn_count":"1","would_have_been_contacted":"GRANTED"},{"actual_decision":"WITHDRAWN","channel":"EMAIL","evidence":[{"captured_at":"2020-05-15 02:41:40","record_id":"LOY-2d496c24","status":"WITHDRAWN"},{"captured_at":"2022-12-31 02:41:15","record_id":"CRM-6e6d9500","status":"GRANTED"}],"explanation":"Withdrawn on 2020-05-15. Withdrawal is absolute and is not overridden by a later grant from another source.","full_name":"Huyentrang Dieu","granted_count":"1","not_given_count":"0","person_id":"PER-14d71f84c8c44a42","purpose":"MARKETING","withdrawn_count":"1","would_have_been_contacted":"GRANTED"},{"actual_decision":"WITHDRAWN","channel":"POST","evidence":[{"captured_at":"2019-10-24 22:37:44","record_id":"CRM-43963c6d","status":"GRANTED"},{"captured_at":"2022-10-22 11:16:55","record_id":"LOY-024422dd","status":"WITHDRAWN"}],"explanation":"Withdrawn on 2022-10-22. Withdrawal is absolute and is not overridden by a later grant from another source.","full_name":"Zeng, Fengying","granted_count":"1","not_given_count":"0","person_id":"PER-75b0e8df7d0ab3bd","purpose":"MARKETING","withdrawn_count":"1","would_have_been_contacted":"GRANTED"}],"row_count":60}]},{"id":"90_downstream","num":"90","title":"Downstream","summary":"The outputs: segments, households, shared-identifier risk, agent grounding and activation audiences.","sql":"-- =====================================================================\n-- 90 \u00b7 Downstream\n--\n-- Everything to this point was cost. This is the return.\n--\n-- Five things that are either impossible or unreliable without a\n-- mastered customer graph, and straightforward with one. None of them\n-- requires data to leave BigQuery, and none of them requires a separate\n-- CDP product.\n--\n--   90a  segmentation   \u00b7 RFM + k-means, on people rather than records\n--   90b  household      \u00b7 the unit families actually buy as\n--   90c  graph risk     \u00b7 shared identifiers, which only a graph exposes\n--   90d  agent grounding\u00b7 a profile an LLM can read and answer from\n--   90e  activation     \u00b7 audiences that are consent-safe by construction\n--\n-- The recurring point: every one of these was previously computed per\n-- source system, and therefore computed wrongly.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 90a \u00b7 Segmentation\n--\n-- RFM at person level. The comparison worth drawing on screen: the same\n-- calculation over raw POS records treats one customer with three loyalty\n-- cards as three lukewarm customers rather than one very good one. Every\n-- decision downstream \u2014 budget, offer, priority \u2014 then follows from a\n-- number that was never true.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_rfm`\nCLUSTER BY person_id\nAS\nWITH txns AS (\n  SELECT\n    a.person_id,\n    t.txn_ts,\n    t.amount_aud,\n    t.category\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = t.record_id\n),\nbounds AS (\n  SELECT MAX(txn_ts) AS as_of FROM txns\n)\nSELECT\n  t.person_id,\n  DATE_DIFF(DATE(b.as_of), DATE(MAX(t.txn_ts)), DAY)      AS recency_days,\n  COUNT(*)                                                AS frequency,\n  ROUND(SUM(t.amount_aud), 2)                             AS monetary_aud,\n  ROUND(AVG(t.amount_aud), 2)                             AS avg_basket_aud,\n  COUNT(DISTINCT t.category)                              AS category_breadth,\n  ARRAY_AGG(DISTINCT t.category ORDER BY t.category)      AS categories,\n  MIN(t.txn_ts)                                           AS first_purchase_at,\n  MAX(t.txn_ts)                                           AS last_purchase_at\nFROM txns AS t, bounds AS b\nGROUP BY t.person_id, b.as_of;\n\n\n-- Trained on the resolved population. Five clusters is a starting point,\n-- not a finding \u2014 the right number comes from silhouette scores on real\n-- data, and claiming otherwise in a demo would be dishonest.\nCREATE OR REPLACE MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`\nOPTIONS (\n  model_type            = 'KMEANS',\n  num_clusters          = 5,\n  standardize_features  = TRUE,\n  kmeans_init_method    = 'KMEANS++'\n) AS\nSELECT\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`;\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_segments`\nCLUSTER BY person_id\nAS\n-- ML.PREDICT passes non-feature columns straight through, so person_id\n-- comes back attached to its own prediction. Joining the result back to\n-- the input on floating-point equality would work here and break the\n-- first time a feature is rounded differently.\nSELECT\n  person_id,\n  CENTROID_ID AS segment_id,\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM ML.PREDICT(\n  MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`,\n  (\n    SELECT person_id, recency_days, frequency, monetary_aud, category_breadth\n    FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n  )\n);\n\n\n-- Segments are numbers until somebody names them. AI.GENERATE reads the\n-- centroid statistics and produces a label a marketer can use, which is\n-- a small thing that removes a genuinely annoying manual step.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.segment_labels`\nAS\nWITH profile AS (\n  SELECT\n    segment_id,\n    COUNT(*)                        AS people,\n    ROUND(AVG(recency_days), 1)     AS avg_recency_days,\n    ROUND(AVG(frequency), 1)        AS avg_frequency,\n    ROUND(AVG(monetary_aud), 2)     AS avg_spend_aud,\n    ROUND(AVG(category_breadth), 1) AS avg_categories\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_segments`\n  GROUP BY segment_id\n)\nSELECT\n  p.*,\n  AI.GENERATE(\n    prompt => (\n      'Name and describe a retail customer segment from these averages. '\n   || 'Be plain and commercial; avoid jargon and avoid inventing facts not '\n   || 'present in the numbers. Statistics: ',\n      TO_JSON_STRING(p)\n    ),\n    connection_id => '${CDP_CONNECTION_PATH}',\n    endpoint      => '${CDP_EXTRACTION_MODEL}',\n    output_schema => 'segment_name STRING, description STRING, suggested_action STRING'\n  ) AS g\nFROM profile AS p;\n\n\n-- ---------------------------------------------------------------------\n-- 90b \u00b7 Household\n--\n-- Families buy as a unit and are marketed to as individuals, which is how\n-- four people at one address receive four copies of the same catalogue.\n--\n-- The household is derived from resolved people sharing a current\n-- address. Note what it is NOT: it is not a merge. The four people remain\n-- four people with four sets of preferences.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.household_profile`\nCLUSTER BY household_id\nAS\nSELECT\n  h.household_id,\n  h.address_norm,\n  h.postcode_norm,\n  COUNT(DISTINCT m.person_id)                          AS people,\n  ROUND(SUM(IFNULL(r.monetary_aud, 0)), 2)             AS household_spend_aud,\n  SUM(IFNULL(r.frequency, 0))                          AS household_transactions,\n  MIN(r.recency_days)                                  AS most_recent_purchase_days,\n  ARRAY_AGG(DISTINCT g.surname IGNORE NULLS\n            ORDER BY g.surname)                        AS surnames,\n  -- More than one surname at an address is normal and is not evidence of\n  -- anything. It is recorded because it changes how a household offer\n  -- should be worded, not whether one should be sent.\n  COUNT(DISTINCT g.surname) > 1                        AS multi_surname,\n  COUNTIF(c.effective_status = 'GRANTED') > 0          AS at_least_one_contactable\nFROM `${CDP_PROJECT}.${CDP_DS}.node_household` AS h\nJOIN `${CDP_PROJECT}.${CDP_DS}.edge_member_of` AS m USING (household_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g ON g.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm`   AS r ON r.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\n  ON c.person_id = m.person_id AND c.channel = 'POST' AND c.purpose = 'MARKETING'\nGROUP BY h.household_id, h.address_norm, h.postcode_norm;\n\n\n-- The catalogue-duplication number. Unglamorous, immediately credible,\n-- and usually larger than anyone expects.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_household_waste` AS\nSELECT\n  COUNT(*)                                                   AS households,\n  SUM(people)                                                AS people,\n  SUM(GREATEST(people - 1, 0))                               AS duplicate_mailings_avoided,\n  ROUND(100 * SAFE_DIVIDE(SUM(GREATEST(people - 1, 0)), SUM(people)), 2)\n                                                             AS pct_of_mailings_avoidable,\n  COUNTIF(people > 1)                                        AS multi_person_households,\n  COUNTIF(multi_surname)                                     AS multi_surname_households\nFROM `${CDP_PROJECT}.${CDP_DS}.household_profile`\nWHERE at_least_one_contactable;\n\n\n-- ---------------------------------------------------------------------\n-- 90c \u00b7 Shared identifiers\n--\n-- A graph question that a flat customer table cannot answer at all:\n-- which identifiers are shared by people we have decided are different?\n--\n-- Most sharing is innocent \u2014 couples share a landline, families share an\n-- email. A phone number attached to fifteen unrelated people, across\n-- multiple postcode districts, is not innocent. Either resolution is\n-- wrong, or something is.\n--\n-- Note the framing: this surfaces things to look at, and asserts nothing.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_shared_identifiers` AS\nWITH shared_phone AS (\n  SELECT\n    'PHONE'                              AS identifier_type,\n    e.phone_id                           AS identifier,\n    COUNT(DISTINCT e.person_id)          AS people,\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20) AS person_ids,\n    ANY_VALUE(n.is_mobile)               AS is_personal_device\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_phone` AS e\n  JOIN `${CDP_PROJECT}.${CDP_DS}.node_phone` AS n ON n.phone_id = e.phone_id\n  GROUP BY e.phone_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_email AS (\n  SELECT\n    'EMAIL',\n    e.email_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_email` AS e\n  GROUP BY e.email_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_account AS (\n  SELECT\n    'LOYALTY_ACCOUNT',\n    e.account_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_holds_account` AS e\n  GROUP BY e.account_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n)\nSELECT *,\n  CASE\n    WHEN identifier_type = 'PHONE' AND is_personal_device AND people >= 5\n      THEN 'REVIEW \u00b7 a personal mobile shared by five or more people is unusual'\n    WHEN people >= 10\n      THEN 'REVIEW \u00b7 sharing at this scale is rarely a household'\n    WHEN people BETWEEN 2 AND 4\n      THEN 'EXPECTED \u00b7 consistent with a household or a couple'\n    ELSE 'MONITOR'\n  END AS assessment\nFROM (\n  SELECT * FROM shared_phone\n  UNION ALL SELECT * FROM shared_email\n  UNION ALL SELECT * FROM shared_account\n)\nORDER BY people DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 90d \u00b7 Grounding for agents\n--\n-- An agent cannot reason about a customer scattered across eight systems.\n-- It can reason about one profile with stated provenance and explicit\n-- gaps.\n--\n-- The profile deliberately carries what is NOT known \u2014\n-- fields_with_conflicting_sources \u2014 because an agent told that a date of\n-- birth is contested will ask, where an agent given a single clean value\n-- will assert.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_context`\nCLUSTER BY person_id\nAS\nWITH interactions AS (\n  SELECT\n    a.person_id,\n    CONCAT('[', p.source_system, ' ',\n           IFNULL(FORMAT_TIMESTAMP('%Y-%m-%d', p.source_ts), 'undated'), '] ',\n           IFNULL(p.evidence_note, p.raw_name)) AS line\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\n  WHERE p.evidence_note IS NOT NULL\n),\n\n-- These three were ARRAY(SELECT ... WHERE x.person_id = g.person_id) against\n-- other tables. BigQuery cannot de-correlate a subquery that references\n-- another table once it carries ORDER BY or LIMIT:\n--   \"Correlated subqueries that reference other tables are not supported\n--    unless they can be de-correlated, such as by transforming them into an\n--    efficient JOIN.\"\n-- So each is pre-aggregated per person and LEFT JOINed below. A join miss\n-- yields a NULL array, which BigQuery stores as an empty array -- identical\n-- to what the empty subquery produced.\nconsent_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(STRUCT(channel, purpose, effective_status)\n              ORDER BY channel, purpose) AS permissions\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\n  GROUP BY person_id\n),\n\ninteraction_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(line LIMIT 10) AS notable_interactions\n  FROM interactions\n  GROUP BY person_id\n),\n\ncontested_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(field ORDER BY field) AS fields_with_conflicting_sources\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\n  WHERE was_contested\n  GROUP BY person_id\n)\n\nSELECT\n  g.person_id,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode,\n  g.contested_fields,\n  n.source_systems,\n  n.source_record_count,\n  r.recency_days,\n  r.frequency,\n  r.monetary_aud,\n  ca.permissions,\n  ia.notable_interactions,\n  -- Explicit uncertainty. This is the field that stops an agent asserting\n  -- something it should have asked about.\n  co.fields_with_conflicting_sources\nFROM `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_person`   AS n USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN consent_agg     AS ca ON ca.person_id = g.person_id\nLEFT JOIN interaction_agg AS ia ON ia.person_id = g.person_id\nLEFT JOIN contested_agg   AS co ON co.person_id = g.person_id;\n\n\n-- Ask a question about a customer. The prompt forbids invention and\n-- requires the answer to cite which part of the profile it came from,\n-- which is the difference between grounding and guessing.\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_ask_about_person`(\n  p_person_id STRING, question STRING\n)\nAS (\n  SELECT\n    c.person_id,\n    question AS asked,\n    AI.GENERATE(\n      prompt => (\n        '''Answer a question about a customer using ONLY the profile below.\n\nIf the profile does not contain the answer, say so plainly and say what would need\nto be checked. Never infer, estimate or fill a gap.\n\nCite which part of the profile your answer came from.\n\nIf fields_with_conflicting_sources lists a field you rely on, say that the value is\ncontested and give the caveat.\n\nNever state or imply permission to contact on a channel unless permissions shows\nGRANTED for that channel.\n\nQUESTION: ''',\n        question,\n        '''\n\nPROFILE:\n''',\n        TO_JSON_STRING(c)\n      ),\n      connection_id => '${CDP_CONNECTION_PATH}',\n      endpoint      => '${CDP_EXTRACTION_MODEL}',\n      output_schema => 'answer STRING, grounded_in STRING, confident BOOL'\n    ) AS response\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_context` AS c\n  WHERE c.person_id = p_person_id\n);\n\n\n-- ---------------------------------------------------------------------\n-- 90e \u00b7 Activation\n--\n-- The final audience. Consent-safe by construction: it reads\n-- v_contactable, which only ever contains people whose every contributing\n-- record agreed.\n--\n-- A marketer cannot accidentally widen this audience, because the\n-- permission logic is not theirs to reinterpret.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_audience_lapsed_high_value` AS\nSELECT\n  c.person_id,\n  c.full_name,\n  c.email,\n  c.postcode,\n  r.monetary_aud,\n  r.recency_days,\n  r.frequency,\n  s.segment_id,\n  -- Nested, not flat: segment_labels stores the whole AI.GENERATE result in\n  -- column g, matching the convention in stages 20 and 60. The notebook\n  -- reads g.segment_name too, so the struct stays and the view reaches in.\n  l.g.segment_name,\n  l.g.suggested_action\nFROM `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_segments` AS s USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.segment_labels`  AS l\n  ON l.segment_id = s.segment_id\nWHERE c.channel = 'EMAIL'\n  AND c.purpose = 'MARKETING'\n  AND r.recency_days > 180\n  AND r.monetary_aud > 500;\n\n\n-- The before/after that justifies the whole programme. The same audience\n-- definition, computed on unresolved source records and on resolved\n-- people, produces different customers and a different spend figure.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_activation_before_after` AS\nWITH unresolved AS (\n  -- What you get treating every loyalty card as a customer.\n  SELECT\n    COUNT(DISTINCT t.loyalty_account_number)          AS customers,\n    ROUND(SUM(t.amount_aud), 2)                       AS total_spend,\n    ROUND(AVG(t.amount_aud), 2)                       AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  WHERE t.loyalty_account_number IS NOT NULL\n),\nresolved AS (\n  SELECT\n    COUNT(*)                                          AS customers,\n    ROUND(SUM(monetary_aud), 2)                       AS total_spend,\n    ROUND(AVG(avg_basket_aud), 2)                     AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n)\nSELECT 'unresolved \u00b7 one loyalty card = one customer' AS basis,\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)  AS spend_per_customer\nFROM unresolved\nUNION ALL\nSELECT 'resolved \u00b7 one person = one customer',\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)\nFROM resolved;\n","sql_lines":447,"results":[{"view":"v_household_waste","columns":["duplicate_mailings_avoided","households","multi_person_households","multi_surname_households","pct_of_mailings_avoidable","people"],"rows":[{"duplicate_mailings_avoided":"113","households":"761","multi_person_households":"102","multi_surname_households":"23","pct_of_mailings_avoidable":"12.93","people":"874"}],"row_count":1},{"view":"v_shared_identifiers","columns":["assessment","identifier","identifier_type","is_personal_device","people","person_ids"],"rows":[{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"stacy.biswas7@icloud.com","identifier_type":"EMAIL","is_personal_device":"false","people":"3","person_ids":["PER-43ef068467660145","PER-5ae vice":"false","people":"2","person_ids":["PER-1733c7aa31908326","PER-7136c1e420411138"]},{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"eileen_duncan@outlook.com","identifier_type":"EMAIL","is_personal_device":"false","people":"2","person_ids":["PER-3c65644ca6e22fe5","PER-5ac17ca62d37fdba"]}],"row_count":60},{"view":"v_activation_before_after","columns":["basis","customers","spend_per_customer","total_spend"],"rows":[{"basis":"resolved \u00b7 one person = one customer","customers":"5286","spend_per_customer":"90.8","total_spend":"479989.09"},{"basis":"unresolved \u00b7 one loyalty card = one customer","customers":"1658","spend_per_customer":"97.93","total_spend":"162366"}],"row_count":2}]},{"id":"95_scorecard","num":"95","title":"Scorecard","summary":"Marks its own homework against ground truth, per hard case, with a diagnosis of where each failure occurred.","sql":"-- =====================================================================\n-- 95 \u00b7 Scorecard\n--\n-- The only stage that is allowed to read ground truth, and the only one\n-- that matters.\n--\n-- Everything before this point is a demonstration of mechanism. A\n-- mechanism that has not been measured is a hypothesis. This stage\n-- measures it, including \u2014 especially \u2014 where it fails.\n--\n-- Two views are the deliverable:\n--   v_scorecard     the headline numbers, with the configuration that\n--                   produced them, so any figure can be reproduced\n--   v_case_results  the hard cases, one row each, pass or fail\n--\n-- If v_case_results shows failures, that is the correct outcome to\n-- present. A demo where every case passes on the first run is a demo\n-- whose cases are too easy, and an audience of practitioners will know it.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 95a \u00b7 Pair sets\n--\n-- Entity resolution is scored pairwise: for every pair of records, did\n-- the system agree with truth about whether they are the same person?\n--\n-- Pairwise scoring is used rather than cluster accuracy because it\n-- degrades gracefully. Cluster accuracy calls a nine-record cluster with\n-- one wrong member a total failure; pairwise scoring calls it eight\n-- correct decisions and one wrong one, which is a far more useful thing\n-- to act on.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.eval_pairs`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH truth_pairs AS (\n  SELECT\n    a.record_id AS record_id_a,\n    b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS b\n    ON a.true_person_id = b.true_person_id\n   AND a.record_id < b.record_id\n),\npredicted_pairs AS (\n  SELECT\n    a.record_id AS record_id_a,\n    b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS b\n    ON a.person_id = b.person_id\n   AND a.record_id < b.record_id\n),\ncombined AS (\n  SELECT record_id_a, record_id_b FROM truth_pairs\n  UNION DISTINCT\n  SELECT record_id_a, record_id_b FROM predicted_pairs\n)\nSELECT\n  c.record_id_a,\n  c.record_id_b,\n  t.record_id_a IS NOT NULL AS is_true_pair,\n  p.record_id_a IS NOT NULL AS is_predicted_pair,\n  CASE\n    WHEN t.record_id_a IS NOT NULL AND p.record_id_a IS NOT NULL THEN 'TP'\n    WHEN t.record_id_a IS     NULL AND p.record_id_a IS NOT NULL THEN 'FP'\n    ELSE                                                              'FN'\n  END AS outcome,\n  -- Why the system got it wrong, where that can be determined. A false\n  -- negative that was never retrieved is a search problem; one that was\n  -- retrieved and rejected is a scoring problem; one that reached the\n  -- adjudicator and was declined is a judgement problem. They need\n  -- completely different fixes.\n  f.retrieved_by,\n  ti.tier,\n  d.decision,\n  d.decided_by,\n  d.confidence\nFROM combined AS c\nLEFT JOIN truth_pairs AS t\n  ON t.record_id_a = c.record_id_a AND t.record_id_b = c.record_id_b\nLEFT JOIN predicted_pairs AS p\n  ON p.record_id_a = c.record_id_a AND p.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused` AS f\n  ON f.record_id_a = c.record_id_a AND f.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS ti\n  ON ti.record_id_a = c.record_id_a AND ti.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\n  ON d.record_id_a = c.record_id_a AND d.record_id_b = c.record_id_b;\n\n\n-- ---------------------------------------------------------------------\n-- 95b \u00b7 Headline scorecard\n--\n-- Every number here is measured on this run, on this corpus, with the\n-- configuration printed alongside it. None of it is quoted from anywhere\n-- else, and none of it should be repeated without the configuration\n-- attached.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_scorecard` AS\nWITH counts AS (\n  SELECT\n    COUNTIF(outcome = 'TP') AS tp,\n    COUNTIF(outcome = 'FP') AS fp,\n    COUNTIF(outcome = 'FN') AS fn\n  FROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs`\n),\nclusters AS (\n  SELECT\n    (SELECT COUNT(DISTINCT true_person_id)\n     FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth`)        AS true_people,\n    (SELECT COUNT(DISTINCT person_id)\n     FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment`)         AS predicted_people,\n    (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.party_records`) AS records\n),\n-- A predicted cluster containing two or more real people. The privacy\n-- failure, counted separately from the aggregate because it is not the\n-- same kind of error as a missed merge.\novermerges AS (\n  SELECT COUNT(*) AS n\n  FROM (\n    SELECT a.person_id\n    FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\n    JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS t USING (record_id)\n    GROUP BY a.person_id\n    HAVING COUNT(DISTINCT t.true_person_id) > 1\n  )\n),\n-- One real person spread across two or more predicted clusters.\nundermerges AS (\n  SELECT COUNT(*) AS n\n  FROM (\n    SELECT t.true_person_id\n    FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS t\n    JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a USING (record_id)\n    GROUP BY t.true_person_id\n    HAVING COUNT(DISTINCT a.person_id) > 1\n  )\n),\nsteward AS (\n  SELECT\n    COUNTIF(decision = 'STEWARD') AS queued,\n    COUNT(*)                      AS decisions\n  FROM `${CDP_PROJECT}.${CDP_DS}.match_decisions`\n),\nllm AS (\n  SELECT COUNT(*) AS adjudicated\n  FROM `${CDP_PROJECT}.${CDP_DS}.v_adjudications_current`\n),\ncandidates AS (\n  SELECT COUNT(*) AS evaluated FROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers`\n)\nSELECT\n  -- Quality\n  c.tp, c.fp, c.fn,\n  ROUND(SAFE_DIVIDE(c.tp, c.tp + c.fp), 4)                    AS pairwise_precision,\n  ROUND(SAFE_DIVIDE(c.tp, c.tp + c.fn), 4)                    AS pairwise_recall,\n  ROUND(SAFE_DIVIDE(2 * c.tp, 2 * c.tp + c.fp + c.fn), 4)     AS pairwise_f1,\n\n  -- The two error types, kept apart on purpose. They are not\n  -- interchangeable: an over-merge is a privacy incident, an under-merge\n  -- is a data-quality ticket.\n  o.n                                                         AS clusters_containing_multiple_people,\n  u.n                                                         AS people_split_across_clusters,\n\n  -- Shape\n  cl.records,\n  cl.true_people,\n  cl.predicted_people,\n  ROUND(SAFE_DIVIDE(cl.predicted_people, cl.true_people), 4)  AS people_count_ratio,\n\n  -- Cost and effort\n  cand.evaluated                                              AS pairs_evaluated,\n  l.adjudicated                                               AS pairs_sent_to_llm,\n  ROUND(100 * SAFE_DIVIDE(l.adjudicated, cand.evaluated), 3)  AS pct_of_pairs_using_an_llm,\n  s.queued                                                    AS pairs_queued_for_a_human,\n  ROUND(100 * SAFE_DIVIDE(s.queued, s.decisions), 2)          AS pct_of_decisions_deferred,\n\n  -- Reproducibility. These belong on the same row as the results; a\n  -- score without its configuration is an anecdote.\n  '${CDP_SEED}'                                               AS generator_seed,\n  '${CDP_TAU_HI}'                                             AS tau_high,\n  '${CDP_TAU_LO}'                                             AS tau_low,\n  '${CDP_ACCEPT_CONFIDENCE}'                                  AS accept_confidence,\n  '${CDP_ADJUDICATOR_MODEL}'                                  AS adjudicator_model,\n  '${CDP_PROMPT_VERSION}'                                     AS prompt_version,\n  '${CDP_EMBEDDING_ENDPOINT}'                                 AS embedding_endpoint,\n  CURRENT_TIMESTAMP()                                         AS scored_at\nFROM counts AS c, clusters AS cl, overmerges AS o, undermerges AS u,\n     steward AS s, llm AS l, candidates AS cand;\n\n\n-- ---------------------------------------------------------------------\n-- 95c \u00b7 Hard cases\n--\n-- Each planted case, scored on the pairs that involve it. A case passes\n-- only on perfect precision AND perfect recall within its own pairs \u2014\n-- there is no partial credit, because a case that half works is a case\n-- that fails on the customer it matters to.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_case_results` AS\nWITH case_pairs AS (\n  SELECT\n    -- Attribution is deliberate, not incidental. A pair is attributed to\n    -- the hard case on EITHER side; using whichever record happened to\n    -- sort first would silently hide half of every asymmetric case.\n    --\n    -- SINGLETON is scored rather than excluded. A singleton has no true\n    -- pairs at all, so every predicted pair involving one is a false\n    -- positive \u2014 which makes it the cleanest precision test in the\n    -- corpus, and the reason recall figures here are not inflated.\n    CASE\n      WHEN ta.case_type NOT IN ('NORMAL', 'SINGLETON') THEN ta.case_type\n      WHEN tb.case_type NOT IN ('NORMAL', 'SINGLETON') THEN tb.case_type\n      WHEN ta.case_type = 'SINGLETON' OR tb.case_type = 'SINGLETON' THEN 'SINGLETON'\n      ELSE 'NORMAL'\n    END AS case_type,\n    e.outcome,\n    e.retrieved_by,\n    e.tier,\n    e.decision,\n    e.decided_by,\n    e.record_id_a,\n    e.record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs` AS e\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS ta ON ta.record_id = e.record_id_a\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS tb ON tb.record_id = e.record_id_b\n),\nin_scope AS (\n  SELECT * FROM case_pairs WHERE case_type != 'NORMAL'\n),\nscored AS (\n  SELECT\n    case_type,\n    COUNT(*)                AS pairs_evaluated,\n    COUNTIF(outcome = 'TP') AS tp,\n    COUNTIF(outcome = 'FP') AS fp,\n    COUNTIF(outcome = 'FN') AS fn,\n    -- Where the failures came from, so a fail is actionable rather than\n    -- merely embarrassing.\n    COUNTIF(outcome = 'FN' AND retrieved_by IS NULL)              AS fn_never_retrieved,\n    COUNTIF(outcome = 'FN' AND tier = 'REJECT')                   AS fn_scored_too_low,\n    COUNTIF(outcome = 'FN' AND decided_by = 'LLM')                AS fn_declined_by_llm,\n    COUNTIF(outcome = 'FN' AND decision = 'STEWARD')              AS fn_awaiting_a_human,\n    COUNTIF(outcome = 'FP' AND decided_by = 'RULE')               AS fp_from_rules,\n    COUNTIF(outcome = 'FP' AND decided_by = 'LLM')                AS fp_from_llm,\n    COUNTIF(retrieved_by = 'SEMANTIC_ONLY')                       AS found_only_semantically,\n    COUNTIF(retrieved_by = 'LEXICAL_ONLY')                        AS found_only_lexically\n  FROM in_scope\n  GROUP BY case_type\n)\nSELECT\n  s.case_type,\n  cc.description,\n  cc.expected_outcome,\n  cc.deck_slide,\n  cc.target_instances,\n  s.pairs_evaluated,\n  s.tp, s.fp, s.fn,\n  ROUND(SAFE_DIVIDE(s.tp, s.tp + s.fp), 3) AS precision,\n  ROUND(SAFE_DIVIDE(s.tp, s.tp + s.fn), 3) AS recall,\n  s.fp = 0 AND s.fn = 0                    AS passed,\n  s.fn_never_retrieved,\n  s.fn_scored_too_low,\n  s.fn_declined_by_llm,\n  s.fn_awaiting_a_human,\n  s.fp_from_rules,\n  s.fp_from_llm,\n  s.found_only_semantically,\n  s.found_only_lexically,\n  CASE\n    WHEN s.fp = 0 AND s.fn = 0                THEN 'Handled correctly.'\n    WHEN s.fp > 0 AND cc.expected_outcome LIKE 'DO_NOT_MERGE%'\n      THEN 'OVER-MERGED \u2014 this is the serious direction of failure. Tighten before demoing.'\n    WHEN s.fn > 0 AND s.fn_never_retrieved > 0\n      THEN 'Missed at retrieval. Neither search leg surfaced the pair; blocking or embedding text is the place to look.'\n    WHEN s.fn > 0 AND s.fn_scored_too_low > 0\n      THEN 'Retrieved but scored below the grey zone. A threshold problem, not a search problem.'\n    WHEN s.fn > 0 AND s.fn_declined_by_llm > 0\n      THEN 'Reached the adjudicator and was declined. A prompt or evidence problem.'\n    WHEN s.fn_awaiting_a_human > 0\n      THEN 'Deferred to a steward. Arguably correct behaviour rather than a failure.'\n    ELSE 'Mixed failure \u2014 inspect the pairs directly.'\n  END AS diagnosis\nFROM scored AS s\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.case_catalogue` AS cc USING (case_type)\nORDER BY passed, case_type;\n\n\n-- ---------------------------------------------------------------------\n-- 95d \u00b7 Does hybrid retrieval actually earn its place?\n--\n-- The claim in the deck is that semantic-only and lexical-only\n-- architectures each miss a distinct class of true match. This is the\n-- test of that claim, against truth.\n--\n-- The honest reading: if \"recall from semantic alone\" and \"recall from\n-- lexical alone\" are both close to the hybrid figure, then hybrid is\n-- costing complexity for very little, and the deck should say so.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_retrieval_recall` AS\nWITH truth_pairs AS (\n  SELECT a.record_id AS record_id_a, b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS b\n    ON a.true_person_id = b.true_person_id AND a.record_id < b.record_id\n),\nretrieved AS (\n  SELECT\n    t.record_id_a,\n    t.record_id_b,\n    f.retrieved_by\n  FROM truth_pairs AS t\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused` AS f\n    ON f.record_id_a = t.record_id_a AND f.record_id_b = t.record_id_b\n)\nSELECT\n  COUNT(*)                                                       AS true_pairs,\n  COUNTIF(retrieved_by IS NOT NULL)                              AS retrieved_by_hybrid,\n  COUNTIF(retrieved_by IN ('LEXICAL_ONLY', 'BOTH'))              AS retrieved_by_lexical,\n  COUNTIF(retrieved_by IN ('SEMANTIC_ONLY', 'BOTH'))             AS retrieved_by_semantic,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IS NOT NULL), COUNT(*)), 2)\n                                                                 AS pct_recall_hybrid,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IN ('LEXICAL_ONLY','BOTH')), COUNT(*)), 2)\n                                                                 AS pct_recall_lexical_only_architecture,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IN ('SEMANTIC_ONLY','BOTH')), COUNT(*)), 2)\n                                                                 AS pct_recall_semantic_only_architecture,\n  COUNTIF(retrieved_by = 'LEXICAL_ONLY')                         AS pairs_a_semantic_system_would_miss,\n  COUNTIF(retrieved_by = 'SEMANTIC_ONLY')                        AS pairs_a_lexical_system_would_miss,\n  COUNTIF(retrieved_by IS NULL)                                  AS pairs_neither_leg_found\nFROM retrieved;\n\n\n-- ---------------------------------------------------------------------\n-- 95e \u00b7 The failures, individually\n--\n-- For the inevitable question: \"show me one it got wrong.\"\n--\n-- Having this query ready, and offering it before being asked, is worth\n-- more to a technical audience than any headline number.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_failures` AS\nSELECT\n  e.outcome,\n  e.record_id_a,\n  e.record_id_b,\n  a.match_key                AS record_a,\n  b.match_key                AS record_b,\n  ta.case_type               AS case_a,\n  tb.case_type               AS case_b,\n  ta.notes                   AS truth_note_a,\n  e.retrieved_by,\n  e.tier,\n  e.decision,\n  e.decided_by,\n  e.confidence,\n  t.combined_score,\n  t.rule_score,\n  t.similarity,\n  t.dob_conflict,\n  j.rationale                AS llm_rationale,\n  j.contradiction            AS llm_contradiction\nFROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs` AS e\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS a ON a.record_id = e.record_id_a\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS b ON b.record_id = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS ta ON ta.record_id = e.record_id_a\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS tb ON tb.record_id = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS t\n  ON t.record_id_a = e.record_id_a AND t.record_id_b = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.v_adjudications_current` AS j\n  ON j.record_id_a = e.record_id_a AND j.record_id_b = e.record_id_b\nWHERE e.outcome != 'TP'\n-- False positives first: they are the ones that matter most.\n--\n-- This was `ORDER BY e.outcome`, which sorts ascending, and 'FN' < 'FP' --\n-- so it did exactly the opposite of what the comment claimed and led with\n-- false negatives. An explicit CASE says the intent rather than relying on\n-- the alphabet.\n--\n-- The trailing record_id keys are a deterministic tiebreak, not decoration.\n-- This view is read through a LIMIT in the notebook, and without a total\n-- order the set of rows a human actually sees is arbitrary and can change\n-- between runs. A stable order makes the visible rows a fixed, reviewable\n-- set -- which is what lets the displayed records be vetted at all.\nORDER BY\n  CASE e.outcome WHEN 'FP' THEN 0 WHEN 'FN' THEN 1 ELSE 2 END,\n  t.combined_score DESC,\n  e.record_id_a,\n  e.record_id_b;\n","sql_lines":395,"results":[{"view":"v_scorecard","columns":["accept_confidence","adjudicator_model","clusters_containing_multiple_people","embedding_endpoint","fn","fp","generator_seed","pairs_evaluated","pairs_queued_for_a_human","pairs_sent_to_llm","pairwise_f1","pairwise_precision","pairwise_recall","pct_of_decisions_deferred","pct_of_pairs_using_an_llm","people_count_ratio","people_split_across_clusters","predicted_people","prompt_version","records","scored_at","tau_high","tau_low","tp","true_people"],"rows":[{"accept_confidence":"0.85","adjudicator_model":"gemini-3.5-flash","clusters_containing_multiple_people":"80","embedding_endpoint":"gemini-embedding-001","fn":"10410","fp":"398","generator_seed":"42","pairs_evaluated":"10773841","pairs_queued_for_a_human":"77704","pairs_sent_to_llm":"373124","pairwise_f1":"0.6076","pairwise_precision":"0.9546","pairwise_recall":"0.4456","pct_of_decisions_deferred":"90.48","pct_of_pairs_using_an_llm":"3.463","people_count_ratio":"1.714","people_split_across_clusters":"4431","predicted_people":"13712","prompt_version":"adjudicator-v1","records":"20000","scored_at":"2026-09-15 10:36:14","tau_high":"0.92","tau_low":"0.72","tp":"8366","true_people":"8000"}],"row_count":1},{"view":"v_case_results","columns":["case_type","deck_slide","description","diagnosis","expected_outcome","fn","fn_awaiting_a_human","fn_declined_by_llm","fn_never_retrieved","fn_scored_too_low","found_only_lexically","found_only_semantically","fp","fp_from_llm","fp_from_rules","pairs_evaluated","passed","precision","recall","target_instances","tp"],"rows":[{"case_type":"ACCOUNT_ONLY","deck_slide":"9","description":"Exactly two records for one person whose ONLY shared signal is the loyalty account number. Names, addresses, postcodes, emails and phones all differ. Pure vector similarity misses this; the lexical/BM25 leg is what earns it.","diagnosis":"Reached the adjudicator and was declined. A prompt or evidence problem.","expected_outcome":"MERGE","fn":"22","fn_awaiting_a_human":"22","fn_declined_by_llm":"22","fn_never_retrieved":"0","fn_scored_too_low":"0","found_only_lexically":"20","found_only_semantically":"0","fp":"0","fp_from_llm":"0","fp_from_rules":"0","pairs_evaluated":"22","passed":"false","precision":null,"recall":"0.0","target_instances":"22","tp":"0"},{"case_type":"DIACRITIC_VARIANT","deck_slide":"8","description":"One person whose name \u2014 and sometimes their suburb \u2014 is recorded with diacritics in one system and folded to plain ASCII in another (Jos\u00e9 Mu\u00f1oz / Jose Munoz, Nguy\u1ec5n / Nguyen, \u0141ukasz / Lukasz), with a minority written in the conventional transliteration that Unicode normalisation cannot recover (M\u00fcller / Mueller). Half the instances differ ONLY by the diacritic and are solvable by correct Unicode normalisation; the other half carry a second divergence so normalisation alone is not enough. The suburb slice drifts on PUNCTUATION and spacing (apostrophe and hyphen present or absent, St vs Saint) rather than on accents, because Australian place names carry almost no diacritics and inventing some would be dishonest; it exercises the same address-normalisation path.","diagnosis":"Retrieved but scored below the grey zone. A threshold problem, not a search problem.","expected_outcome":"MERGE","fn":"6","fn_awaiting_a_human":"2","fn_declined_by_llm":"2","fn_never_retrieved":"0","fn_scored_too_low":"4","found_
