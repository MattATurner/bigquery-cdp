:"table"},{"object":"pair_tiers","rows":10773842,"bytes":6997333222,"modified":"2026-09-30 02:59:43.166+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"},{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028413,"modified":"2026-09-30 23:02:19.996+00","dataset":"cdp","kind":"table"},{"object":"person_truth","rows":20000,"bytes":2147110,"modified":"2026-09-15 09:55:30.387+00","dataset":"cdp_truth","kind":"table"},{"object":"v_adjudications_current","rows":0,"bytes":0,"modified":"2026-09-30 23:00:53.218+00","dataset":"cdp","kind":"view"},{"object":"wesid_assignments","rows":60000,"bytes":6237155,"modified":"2026-09-30 23:04:11.013+00","dataset":"cdp","kind":"table"},{"object":"wesid_cluster","rows":38706,"bytes":3898955,"modified":"2026-09-30 23:04:13.491+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"eval_pairs","rows":18850,"bytes":1237239,"modified":"2026-09-30 23:11:21.199+00","dataset":"cdp","kind":"table"},{"object":"method_metrics","rows":18,"bytes":2274,"modified":"2026-09-30 23:11:27.936+00","dataset":"cdp","kind":"table"},{"object":"v_case_results","rows":0,"bytes":0,"modified":"2026-09-30 23:11:23.314+00","dataset":"cdp","kind":"view"},{"object":"v_failures","rows":0,"bytes":0,"modified":"2026-09-30 23:11:24.502+00","dataset":"cdp","kind":"view"},{"object":"v_method_comparison","rows":0,"bytes":0,"modified":"2026-09-30 23:11:29.232+00","dataset":"cdp","kind":"view"},{"object":"v_retrieval_recall","rows":0,"bytes":0,"modified":"2026-09-30 23:11:23.952+00","dataset":"cdp","kind":"view"},{"object":"v_scorecard","rows":0,"bytes":0,"modified":"2026-09-30 23:11:22.278+00","dataset":"cdp","kind":"view"}]}},{"id":"96_cost_model","num":"96","title":"Cost model","summary":"Measured token counts and bytes billed, extrapolated to the customer's real volume.","sql":"-- =====================================================================\n-- 96 \u00b7 Cost model\n--\n-- Answers \"what would this cost at our volume?\" from MEASUREMENT, not\n-- from assumption.\n--\n-- The distinction matters. Every cost estimate for this kind of workload\n-- that you have ever been shown was built by assuming a tokens-per-record\n-- figure and a grey-zone percentage, and both of those assumptions are\n-- doing all the work. This stage instead reads:\n--\n--   \u00b7 the token counts the models themselves reported (usageMetadata)\n--   \u00b7 the bytes and slot-time BigQuery actually billed (INFORMATION_SCHEMA)\n--\n-- and multiplies by unit prices held in config.env, where they can be\n-- corrected in one place when they change.\n--\n-- Where something genuinely cannot be measured \u2014 AI.EMBED and AI.CLASSIFY\n-- do not return usage metadata \u2014 it is estimated, and the output column\n-- says so. Nothing here silently mixes the two.\n--\n-- >>> UNIT PRICES ARE LIST PRICES CAPTURED 14 SEP 2026 AND WILL GO STALE.\n-- >>> Re-verify before putting a number in front of a customer.\n-- =====================================================================\n\n-- ---------------------------------------------------------------------\n-- 96a \u00b7 Unit prices, stamped onto the run\n--\n-- Written to a table rather than inlined so that a cost figure produced\n-- six months from now can still be traced to the prices it assumed.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS\nSELECT\n  CURRENT_TIMESTAMP()                             AS captured_at,\n  DATE '2026-09-14'                               AS price_list_date,\n  CAST('${CDP_PRICE_EMBED_INPUT}'       AS FLOAT64) AS usd_per_1m_embed_input,\n  CAST('${CDP_PRICE_EXTRACT_INPUT}'     AS FLOAT64) AS usd_per_1m_extract_input,\n  CAST('${CDP_PRICE_EXTRACT_OUTPUT}'    AS FLOAT64) AS usd_per_1m_extract_output,\n  CAST('${CDP_PRICE_ADJUDICATE_INPUT}'  AS FLOAT64) AS usd_per_1m_adjudicate_input,\n  CAST('${CDP_PRICE_ADJUDICATE_OUTPUT}' AS FLOAT64) AS usd_per_1m_adjudicate_output,\n  CAST('${CDP_PRICE_BQ_PER_TIB}'        AS FLOAT64) AS usd_per_tib_scanned,\n  CAST('${CDP_PRICE_BQ_SLOT_HOUR}'      AS FLOAT64) AS usd_per_slot_hour,\n  CAST('${CDP_PRICE_STORAGE_GIB_MONTH}' AS FLOAT64) AS usd_per_gib_month,\n  '${CDP_EMBEDDING_ENDPOINT}'                     AS embedding_model,\n  '${CDP_EXTRACTION_MODEL}'                       AS extraction_model,\n  '${CDP_ADJUDICATOR_MODEL}'                      AS adjudicator_model;\n\n\n-- ---------------------------------------------------------------------\n-- 96b \u00b7 What the run actually consumed\n--\n-- One row per cost component. `basis` is the honesty column: MEASURED\n-- means the number came from the model or from BigQuery's own accounting,\n-- ESTIMATED means it was derived from input size.\n--\n-- The estimate uses 4 characters per token, which is the usual English\n-- rule of thumb. It is wrong for the identity strings the embedder sees \u2014\n-- names and postcodes tokenise worse than prose \u2014 so treat the embedding\n-- line as the softest number here.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.cost_components` AS\n\nWITH\n-- Extraction over call transcripts.\ncall_extract AS (\n  SELECT\n    'extraction_calls'                     AS component,\n    COUNT(*)                               AS calls,\n    SUM(IFNULL(input_tokens, 0))           AS input_tokens,\n    SUM(IFNULL(output_tokens, 0))          AS output_tokens,\n    COUNTIF(input_tokens IS NULL)          AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.stg_call_entities`\n),\n\n-- Extraction over support ticket bodies. Covers the AI.GENERATE call only.\nticket_extract AS (\n  SELECT\n    'extraction_tickets'                   AS component,\n    COUNT(*)                               AS calls,\n    SUM(IFNULL(input_tokens, 0))           AS input_tokens,\n    SUM(IFNULL(output_tokens, 0))          AS output_tokens,\n    COUNTIF(input_tokens IS NULL)          AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.stg_support_entities`\n),\n\n-- AI.CLASSIFY on the same ticket bodies. Returns a bare STRING, so there\n-- is no usage metadata to read and this is necessarily an estimate.\n-- Output is a single label, so output tokens are negligible but nonzero.\nticket_classify AS (\n  SELECT\n    'classification_tickets'               AS component,\n    COUNT(*)                               AS calls,\n    CAST(SUM(CHAR_LENGTH(IFNULL(t.body, ''))) / 4 AS INT64) AS input_tokens,\n    COUNT(*) * 5                           AS output_tokens,\n    COUNT(*)                               AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_support_tickets` AS t\n),\n\n-- Embeddings. AI.EMBED reports no usage metadata, so this is estimated\n-- from the length of the match key that was embedded.\nembedding AS (\n  SELECT\n    'embedding'                            AS component,\n    COUNT(*)                               AS calls,\n    CAST(SUM(CHAR_LENGTH(IFNULL(match_key, ''))) / 4 AS INT64) AS input_tokens,\n    0                                      AS output_tokens,\n    COUNT(*)                               AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`\n),\n\n-- Adjudication. Measured, and scoped to the model and prompt currently in\n-- force so a re-run under a new prompt does not double-count history.\n--\n-- Calls whose token usage was not captured (ledger rows written before the\n-- usage_metadata parsing fix) are costed at the MEASURED per-call average of\n-- the same model and prompt -- including a '<prompt>-calibration' sample\n-- re-judged purely to measure tokens, which never counts as a verdict. They\n-- stay counted in unmeasured_calls, so basis reads PARTIAL or ESTIMATED.\nadj_calibration AS (\n  SELECT\n    AVG(input_tokens)  AS avg_in,\n    AVG(output_tokens) AS avg_out\n  FROM `${CDP_PROJECT}.${CDP_DS}.adjudications`\n  WHERE model = '${CDP_ADJUDICATOR_MODEL}'\n    AND prompt_version IN ('${CDP_PROMPT_VERSION}', '${CDP_PROMPT_VERSION}-calibration')\n    AND input_tokens IS NOT NULL\n),\n-- Scoped to ONE call per pair in the current grey zone -- i.e. what a clean\n-- rebuild costs. The ledger is append-only, so it also holds retries and\n-- pairs judged under earlier tier thresholds; that cumulative spend is\n-- reported separately as usd_adjudication_ledger_to_date in v_cost_model.\nadjudication AS (\n  SELECT\n    'adjudication'                         AS component,\n    COUNT(*)                               AS calls,\n    CAST(SUM(IFNULL(a.input_tokens,  c.avg_in))  AS INT64) AS input_tokens,\n    CAST(SUM(IFNULL(a.output_tokens, c.avg_out)) AS INT64) AS output_tokens,\n    COUNTIF(a.input_tokens IS NULL)        AS unmeasured_calls\n  FROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS t\n  JOIN `${CDP_PROJECT}.${CDP_DS}.v_adjudications_current` AS a\n    USING (record_id_a, record_id_b)\n  CROSS JOIN adj_calibration AS c\n  WHERE t.tier = 'GREY_ZONE'\n),\n\nall_components AS (\n  SELECT * FROM call_extract\n  UNION ALL SELECT * FROM ticket_extract\n  UNION ALL SELECT * FROM ticket_classify\n  UNION ALL SELECT * FROM embedding\n  UNION ALL SELECT * FROM adjudication\n)\n\nSELECT\n  c.component,\n  c.calls,\n  c.input_tokens,\n  c.output_tokens,\n  c.unmeasured_calls,\n  CASE\n    WHEN c.calls = 0                      THEN 'NO_CALLS'\n    WHEN c.unmeasured_calls = 0           THEN 'MEASURED'\n    WHEN c.unmeasured_calls = c.calls     THEN 'ESTIMATED'\n    ELSE                                       'PARTIAL'\n  END                                     AS basis,\n  -- Price each component at its own model's rate. Embedding is input-only.\n  ROUND(\n    CASE c.component\n      WHEN 'embedding' THEN\n        c.input_tokens / 1e6 * p.usd_per_1m_embed_input\n      WHEN 'adjudication' THEN\n          c.input_tokens  / 1e6 * p.usd_per_1m_adjudicate_input\n        + c.output_tokens / 1e6 * p.usd_per_1m_adjudicate_output\n      ELSE\n          c.input_tokens  / 1e6 * p.usd_per_1m_extract_input\n        + c.output_tokens / 1e6 * p.usd_per_1m_extract_output\n    END, 6)                               AS usd_model_cost\nFROM all_components AS c\nCROSS JOIN `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS p;\n\n\n-- ---------------------------------------------------------------------\n-- 96c \u00b7 BigQuery compute, from BigQuery's own accounting\n--\n-- A view rather than a table, deliberately. INFORMATION_SCHEMA requires\n-- permissions the pipeline does not otherwise need, and it is queried\n-- lazily \u2014 so if the caller lacks access, this view fails on SELECT\n-- instead of breaking the build.\n--\n-- Scoped to jobs since the preflight stage ran, which is the first thing\n-- that happens after the datasets are created and is therefore a clean\n-- run-start marker.\n--\n-- The region qualifier must match the dataset location.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_compute` AS\nWITH run_start AS (\n  SELECT MIN(checked_at) AS t0\n  FROM `${CDP_PROJECT}.${CDP_DS}.preflight_result`\n)\nSELECT\n  COUNT(*)                                          AS jobs,\n  SUM(j.total_bytes_billed)                         AS bytes_billed,\n  ROUND(SUM(j.total_bytes_billed) / POW(1024, 4), 6) AS tib_billed,\n  SUM(j.total_slot_ms)                              AS slot_ms,\n  ROUND(SUM(j.total_slot_ms) / 3600000.0, 4)        AS slot_hours,\n  ROUND(SUM(j.total_bytes_billed) / POW(1024, 4) * p.usd_per_tib_scanned, 4)\n                                                    AS usd_on_demand,\n  ROUND(SUM(j.total_slot_ms) / 3600000.0 * p.usd_per_slot_hour, 4)\n                                                    AS usd_enterprise_slots\nFROM `region-${CDP_LOCATION_LOWER}`.INFORMATION_SCHEMA.JOBS_BY_PROJECT AS j\nCROSS JOIN `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS p\nCROSS JOIN run_start AS r\nWHERE j.creation_time >= r.t0\n  AND j.job_type       = 'QUERY'\n  AND j.state          = 'DONE'\nGROUP BY p.usd_per_tib_scanned, p.usd_per_slot_hour;\n\n\n-- ---------------------------------------------------------------------\n-- 96d \u00b7 The answer\n--\n-- Total cost of the run, unit economics, and a linear extrapolation to\n-- the configured target volume.\n--\n-- READ THE CAVEATS COLUMN BEFORE QUOTING ANY OF THIS. In particular the\n-- extrapolation is LINEAR, and the component that is least likely to\n-- behave linearly is adjudication: the number of pairs that reach the\n-- grey zone depends on how well blocking discriminates, and blocking gets\n-- harder as the corpus grows and near-duplicates become denser. A 75x\n-- corpus will not produce exactly 75x the grey zone. It is more likely to\n-- produce somewhat more, which is why the sensitivity view exists.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_model` AS\nWITH\ntotals AS (\n  SELECT\n    SUM(usd_model_cost)                               AS usd_model_total,\n    SUM(IF(component = 'adjudication', usd_model_cost, 0)) AS usd_adjudication,\n    SUM(IF(component = 'embedding',    usd_model_cost, 0)) AS usd_embedding,\n    SUM(IF(component IN ('extraction_calls', 'extraction_tickets',\n                         'classification_tickets'), usd_model_cost, 0)) AS usd_extraction,\n    SUM(calls)                                        AS ai_calls,\n    SUM(input_tokens + output_tokens)                 AS total_tokens,\n    COUNTIF(basis IN ('ESTIMATED', 'PARTIAL'))        AS components_estimated\n  FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`\n),\ncorpus AS (\n  SELECT COUNT(*) AS records FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n),\npeople AS (\n  SELECT COUNT(*) AS people FROM `${CDP_PROJECT}.${CDP_DS}.golden_person`\n),\n-- Everything the adjudicator has been paid for under this model and prompt,\n-- including retries, earlier-threshold grey zones and the calibration\n-- sample. This is money already spent, NOT the cost of one rebuild.\nledger AS (\n  SELECT\n    COUNT(*) AS ledger_calls,\n    SUM(  IFNULL(a.input_tokens,  c.avg_in)  / 1e6 * p.usd_per_1m_adjudicate_input\n        + IFNULL(a.output_tokens, c.avg_out) / 1e6 * p.usd_per_1m_adjudicate_output)\n      AS usd_ledger\n  FROM `${CDP_PROJECT}.${CDP_DS}.adjudications` AS a\n  CROSS JOIN (\n    SELECT AVG(input_tokens) AS avg_in, AVG(output_tokens) AS avg_out\n    FROM `${CDP_PROJECT}.${CDP_DS}.adjudications`\n    WHERE model = '${CDP_ADJUDICATOR_MODEL}'\n      AND prompt_version IN ('${CDP_PROMPT_VERSION}', '${CDP_PROMPT_VERSION}-calibration')\n      AND input_tokens IS NOT NULL\n  ) AS c\n  CROSS JOIN `${CDP_PROJECT}.${CDP_DS}.ref_unit_prices` AS p\n  WHERE a.model = '${CDP_ADJUDICATOR_MODEL}'\n    AND a.prompt_version IN ('${CDP_PROMPT_VERSION}', '${CDP_PROMPT_VERSION}-calibration')\n),\ntarget AS (\n  SELECT\n    CAST('${CDP_TARGET_RECORDS}'     AS INT64)   AS target_records,\n    CAST('${CDP_TARGET_PEOPLE}'      AS INT64)   AS target_people,\n    CAST('${CDP_REBUILDS_PER_MONTH}' AS INT64)   AS rebuilds_per_month\n)\nSELECT\n  -- What was actually built\n  c.records                                          AS demo_records,\n  pe.people                                          AS demo_people_resolved,\n  t.ai_calls,\n  t.total_tokens,\n\n  -- What it cost, by component\n  ROUND(t.usd_extraction,   4)                       AS usd_extraction,\n  ROUND(t.usd_embedding,    4)                       AS usd_embedding,\n  ROUND(t.usd_adjudication, 4)                       AS usd_adjudication,\n  ROUND(t.usd_model_total,  4)                       AS usd_model_total,\n\n  -- Unit economics \u2014 the number worth remembering\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * 1000, 4)\n                                                     AS usd_model_per_1k_records,\n\n  -- Linear extrapolation to the customer's volume\n  tg.target_records,\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * tg.target_records, 2)\n                                                     AS usd_model_at_target_per_rebuild,\n  ROUND(t.usd_model_total / NULLIF(c.records, 0) * tg.target_records\n        * tg.rebuilds_per_month, 2)                  AS usd_model_at_target_per_month,\n\n  -- Money already spent on adjudication across iterations (not per rebuild)\n  l.ledger_calls                                     AS adjudication_ledger_calls,\n  ROUND(l.usd_ledger, 2)                             AS usd_adjudication_ledger_to_date,\n\n  -- Honesty\n  t.components_estimated,\n  CASE\n    WHEN t.components_estimated = 0 THEN 'All components measured from reported token counts.'\n    ELSE FORMAT(\n      '%d of 5 components estimated rather than measured (AI.EMBED and AI.CLASSIFY '\n      || 'do not report usage metadata; adjudication rows written before token capture '\n      || 'are costed at the measured per-call average of a calibration sample). '\n      || 'See cost_components.basis.',\n      t.components_estimated)\n  END                                                AS measurement_note,\n  'EXCLUDES BigQuery compute \u2014 see v_cost_compute and add it. '\n  || 'Per-rebuild figures assume ONE adjudication call per current grey-zone pair; '\n  || 'usd_adjudication_ledger_to_date is the cumulative spend including re-runs. '\n  || 'Extrapolation is LINEAR in record count; adjudication volume is the '\n  || 'component most likely to grow faster than linearly, because blocking '\n  || 'discriminates less well as the corpus densifies. Treat the target figure '\n  || 'as a floor, not a forecast.'                   AS caveats\nFROM totals AS t\nCROSS JOIN corpus AS c\nCROSS JOIN people AS pe\nCROSS JOIN ledger AS l\nCROSS JOIN target AS tg;\n\n\n-- ---------------------------------------------------------------------\n-- 96e \u00b7 Sensitivity\n--\n-- The single biggest driver of cost at scale is what fraction of\n-- candidate pairs reach the adjudicator. That is a threshold decision,\n-- not a fact about the data, and it is the lever a customer will actually\n-- want to pull.\n--\n-- This shows what the target-scale bill does as that fraction moves,\n-- holding everything else constant. It is the view to have on screen when\n-- someone asks \"can we make it cheaper?\" \u2014 the answer is yes, and the\n-- cost of doing so is recall, which v_scorecard quantifies.\n-- ---------------------------------------------------------------------\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cost_sensitivity` AS\nWITH base AS (\n  SELECT\n    (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.party_records`) AS records,\n    (SELECT SUM(IF(component = 'adjudication', usd_model_cost, 0))\n     FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`)               AS usd_adjudication,\n    (SELECT SUM(IF(component <> 'adjudication', usd_model_cost, 0))\n     FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`)               AS usd_fixed,\n    (SELECT calls FROM `${CDP_PROJECT}.${CDP_DS}.cost_components`\n      WHERE component = 'adjudication')                            AS pairs_judged,\n    CAST('${CDP_TARGET_RECORDS}' AS INT64)                          AS target_records\n),\nmultipliers AS (\n  SELECT * FROM UNNEST([0.25, 0.5, 1.0, 2.0, 4.0]) AS grey_zone_multiplier\n)\nSELECT\n  m.grey_zone_multiplier,\n  CAST(b.pairs_judged * m.grey_zone_multiplier AS INT64)      AS pairs_judged_equivalent,\n  ROUND((b.usd_fixed + b.usd_adjudication * m.grey_zone_multiplier)\n        / NULLIF(b.records, 0) * b.target_records, 2)         AS usd_at_target_per_rebuild,\n  CASE m.grey_zone_multiplier\n    WHEN 0.25 THEN 'Aggressive thresholds. Cheapest, and the option most likely to under-merge.'\n    WHEN 0.5  THEN 'Tighter than shipped.'\n    WHEN 1.0  THEN 'As configured and as scored \u2014 this is the row the scorecard describes.'\n    WHEN 2.0  THEN 'Looser thresholds, more pairs reviewed by the model.'\n    WHEN 4.0  THEN 'Very loose. Diminishing returns; check v_scorecard before paying for this.'\n  END                                                         AS interpretation\nFROM base AS b\nCROSS JOIN multipliers AS m\nORDER BY m.grey_zone_multiplier;\n","sql_lines":376,"results":[{"view":"v_cost_model","columns":["adjudication_ledger_calls","ai_calls","caveats","components_estimated","demo_people_resolved","demo_records","measurement_note","target_records","total_tokens","usd_adjudication","usd_adjudication_ledger_to_date","usd_embedding","usd_extraction","usd_model_at_target_per_month","usd_model_at_target_per_rebuild","usd_model_per_1k_records","usd_model_total"],"rows":[{"adjudication_ledger_calls":"115032","ai_calls":"64147","caveats":"EXCLUDES BigQuery compute \u2014 see v_cost_compute and add it. Per-rebuild figures assume ONE adjudication call per current grey-zone pair; usd_adjudication_ledger_to_date is the cumulative spend including re-runs. Extrapolation is LINEAR in record count; adjudication volume is the component most likely to grow faster than linearly, because blocking discriminates less well as the corpus densifies. Treat the target figure as a floor, not a forecast.","components_estimated":"5","demo_people_resolved":"13566","demo_records":"20000","measurement_note":"5 of 5 components estimated rather than measured (AI.EMBED and AI.CLASSIFY do not report usage metadata; adjudication rows written before token capture are costed at the measured per-call average of a calibration sample). See cost_components.basis.","target_records":"15000000","total_tokens":"69712806","usd_adjudication":"131.5064","usd_adjudication_ledger_to_date":"362.17","usd_embedding":"0.0483","usd_extraction":"0.0367","usd_model_at_target_per_month":"394774.25","usd_model_at_target_per_rebuild":"98693.56","usd_model_per_1k_records":"6.5796","usd_model_total":"131.5914"}],"row_count":1},{"view":"v_cost_compute","columns":["bytes_billed","jobs","slot_hours","slot_ms","tib_billed","usd_enterprise_slots","usd_on_demand"],"rows":[{"bytes_billed":"239937257472","jobs":"2441","slot_hours":"78.2807","slot_ms":"281810532","tib_billed":"0.218222","usd_enterprise_slots":"4.6968","usd_on_demand":"1.3639"}],"row_count":1},{"view":"v_cost_sensitivity","columns":["grey_zone_multiplier","interpretation","pairs_judged_equivalent","usd_at_target_per_rebuild"],"rows":[{"grey_zone_multiplier":"0.25","interpretation":"Aggressive thresholds. Cheapest, and the option most likely to under-merge.","pairs_judged_equivalent":"10442","usd_at_target_per_rebuild":"24721.24"},{"grey_zone_multiplier":"0.5","interpretation":"Tighter than shipped.","pairs_judged_equivalent":"20885","usd_at_target_per_rebuild":"49378.68"},{"grey_zone_multiplier":"1.0","interpretation":"As configured and as scored \u2014 this is the row the scorecard describes.","pairs_judged_equivalent":"41769","usd_at_target_per_rebuild":"98693.56"},{"grey_zone_multiplier":"2.0","interpretation":"Looser thresholds, more pairs reviewed by the model.","pairs_judged_equivalent":"83538","usd_at_target_per_rebuild":"197323.33"},{"grey_zone_multiplier":"4.0","interpretation":"Very loose. Diminishing returns; check v_scorecard before paying for this.","pairs_judged_equivalent":"167076","usd_at_target_per_rebuild":"394582.85"}],"row_count":5}],"run":{"statements":5,"steps":[{"op":"create table","object":"ref_unit_prices","kind":"table","rows":1},{"op":"create table","object":"cost_components","kind":"table","rows":5},{"op":"create view","object":"v_cost_compute","kind":"view","rows":0},{"op":"create view","object":"v_cost_model","kind":"view","rows":0},{"op":"create view","object":"v_cost_sensitivity","kind":"view","rows":0}],"inputs":[{"object":"adjudications","rows":488156,"bytes":194380232,"modified":"2026-09-30 23:10:51.807+00","dataset":"cdp","kind":"table"},{"object":"ext_support_tickets","rows":0,"bytes":0,"modified":"2026-09-15 09:55:26.176+00","dataset":"cdp","kind":"external"},{"object":"golden_person","rows":13566,"bytes":1835001,"modified":"2026-09-30 23:04:47.784+00","dataset":"cdp","kind":"table"},{"object":"pair_tiers","rows":10773842,"bytes":6997333222,"modified":"2026-09-30 02:59:43.166+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"},{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"},{"object":"preflight_result","rows":1,"bytes":136,"modified":"2026-09-15 09:55:01.151+00","dataset":"cdp","kind":"table"},{"object":"stg_call_entities","rows":442,"bytes":95985,"modified":"2026-09-15 09:58:12.738+00","dataset":"cdp","kind":"table"},{"object":"stg_support_entities","rows":968,"bytes":450060,"modified":"2026-09-15 10:01:08.431+00","dataset":"cdp","kind":"table"},{"object":"v_adjudications_current","rows":0,"bytes":0,"modified":"2026-09-30 23:00:53.218+00","dataset":"cdp","kind":"view"}],"outputs":[{"object":"cost_components","rows":5,"bytes":342,"modified":"2026-10-01 23:47:21.114+00","dataset":"cdp","kind":"table"},{"object":"ref_unit_prices","rows":1,"bytes":143,"modified":"2026-10-01 23:47:18.737+00","dataset":"cdp","kind":"table"},{"object":"v_cost_compute","rows":0,"bytes":0,"modified":"2026-10-01 23:47:22.188+00","dataset":"cdp","kind":"view"},{"object":"v_cost_model","rows":0,"bytes":0,"modified":"2026-10-01 23:47:23.197+00","dataset":"cdp","kind":"view"},{"object":"v_cost_sensitivity","rows":0,"bytes":0,"modified":"2026-10-01 23:47:23.922+00","dataset":"cdp","kind":"view"}]}}],"scenarios":[{"code":"A","file":"scenario_A.sql","title":"Scenario A \u00b7 Late-Arriving Fact & Cluster Stability","summary":"Proves that when a late support ticket arrives revealing a contradiction, the identity graph splits cleanly while preserving durable person_ids via person_crosswalk.","sql":"-- =====================================================================\n-- A \u00b7 Does person_id survive a re-run?\n--\n-- The question nobody asks in a demo and everybody hits in production.\n--\n-- If person_id is derived from the cluster \u2014 the smallest record_id, a\n-- hash of the members \u2014 then adding one record to a cluster changes the\n-- identifier for everyone in it. Downstream, suppression lists stop\n-- matching, audience memberships churn, and a customer who unsubscribed\n-- last month quietly becomes a new person who never did.\n--\n-- This build persists identifiers in a crosswalk and inherits them. To\n-- see it: run the pipeline, note the output below, then run\n--   ./run.sh --from 40\n-- and run this scenario again. minted_this_run should be 0 the second\n-- time, and first_seen should be unchanged.\n-- =====================================================================\n\nWITH churn AS (\n  SELECT\n    COUNT(*)                                                   AS people,\n    COUNTIF(minted_this_run)                                   AS minted_this_run,\n    COUNTIF(NOT minted_this_run)                               AS inherited\n  FROM `${CDP_PROJECT}.${CDP_DS}.node_person`\n),\nages AS (\n  SELECT\n    COUNT(DISTINCT person_id)                                  AS ids_in_crosswalk,\n    COUNT(*)                                                   AS records_mapped,\n    MIN(first_seen)                                            AS oldest_id_first_seen,\n    MAX(last_seen)                                             AS most_recent_touch,\n    COUNTIF(first_seen < last_seen)                            AS ids_seen_more_than_once\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_crosswalk`\n),\n-- The failure this design prevents, made concrete: how many downstream\n-- audience memberships would have been invalidated if identifiers were\n-- derived rather than persisted.\nexposure AS (\n  SELECT COUNT(*) AS contactable_rows_at_risk\n  FROM `${CDP_PROJECT}.${CDP_DS}.v_contactable`\n)\nSELECT\n  c.people,\n  c.minted_this_run,\n  c.inherited,\n  a.ids_in_crosswalk,\n  a.records_mapped,\n  a.ids_seen_more_than_once,\n  a.oldest_id_first_seen,\n  a.most_recent_touch,\n  e.contactable_rows_at_risk,\n  IF(c.minted_this_run = c.people,\n     'FIRST RUN \u2014 every identifier was minted. Re-run and compare.',\n     'RE-RUN \u2014 inherited identifiers held; only genuinely new clusters minted.')\n    AS interpretation\nFROM churn AS c, ages AS a, exposure AS e;\n","sql_lines":56},{"code":"B","file":"scenario_B.sql","title":"Scenario B \u00b7 Lexical vs. Semantic Retrieval Legs","summary":"Compares pairs found exclusively by SEARCH() lexical blocking, exclusively by VECTOR_SEARCH() semantic embeddings, and by both legs under Reciprocal Rank Fusion.","sql":"-- =====================================================================\n-- B \u00b7 The case for hybrid search\n--\n-- Two records for one person. Different names, different addresses,\n-- different emails. The only thing they share is a loyalty account\n-- number.\n--\n-- An embedding cannot help here. \"ACC-48213\" carries no semantic content;\n-- the model has nothing to represent. BM25 finds it instantly, because a\n-- rare alphanumeric token is exactly the high-IDF signal lexical search\n-- is built on.\n--\n-- The reverse case is in the same output: pairs found only semantically,\n-- where the names are so different that no keyword overlaps.\n--\n-- Run this alongside a live single-query lookup to make it tangible:\n--   SELECT * FROM `PROJECT.DATASET.tf_lookup_hybrid`('ACC-48213');\n--   SELECT * FROM `PROJECT.DATASET.tf_lookup_vector`('ACC-48213');\n-- =====================================================================\n\nWITH by_leg AS (\n  SELECT\n    t.retrieved_by,\n    COUNT(*)                                     AS pairs,\n    COUNTIF(t.tier != 'REJECT')                  AS survived_scoring,\n    COUNTIF(d.decision = 'LINK')                 AS became_links,\n    COUNTIF(t.acct_match)                        AS sharing_an_account_number,\n    COUNTIF(NOT t.surname_match)                 AS with_different_surnames,\n    ROUND(AVG(t.similarity), 3)                  AS avg_semantic_similarity\n  FROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS t\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\n    ON d.record_id_a = t.record_id_a AND d.record_id_b = t.record_id_b\n  GROUP BY t.retrieved_by\n)\nSELECT\n  retrieved_by,\n  pairs,\n  survived_scoring,\n  became_links,\n  sharing_an_account_number,\n  with_different_surnames,\n  avg_semantic_similarity,\n  CASE retrieved_by\n    WHEN 'LEXICAL_ONLY'\n      THEN 'Invisible to a vector-only architecture. Mostly shared identifiers.'\n    WHEN 'SEMANTIC_ONLY'\n      THEN 'Invisible to a keyword-only architecture. Nicknames, transliterations, married names.'\n    ELSE 'Found by both legs \u2014 the easy majority.'\n  END AS what_this_row_means\nFROM by_leg\nORDER BY became_links DESC;\n","sql_lines":51},{"code":"C","file":"scenario_C.sql","title":"Scenario C \u00b7 Consent Withdrawal & Principle P7","summary":"Demonstrates that merging two records NEVER merges their marketing permissions: WITHDRAWN always dominates GRANTED at equal timestamp, and channel contactability requires explicit consent on the winning contact record.","sql":"-- =====================================================================\n-- C \u00b7 Merging people is not merging permissions\n--\n-- One customer. Three systems. Online they opted in to email marketing.\n-- In store they explicitly opted out. In the app they were never asked.\n--\n-- Merge the records naively and the profile inherits the opt-in, because\n-- somewhere in the customer's history there is a GRANTED. The customer\n-- then receives an email they explicitly said no to \u2014 from the same\n-- organisation they said it to.\n--\n-- The intersection rule says permission exists only where every\n-- contributing record agrees, and an explicit withdrawal is absolute.\n--\n-- The last column is the one for the CMO: how much audience the correct\n-- rule costs. It is also, read the other way, how many unlawful contacts\n-- the convenient rule would have sent.\n-- =====================================================================\n\nSELECT\n  channel,\n  purpose,\n  people_with_a_stated_preference,\n  audience_union_rule                 AS audience_if_we_merge_permissions,\n  audience_intersection_rule          AS audience_under_the_intersection_rule,\n  contacts_the_union_rule_would_add   AS contacts_avoided,\n  of_which_explicitly_withdrawn       AS of_which_had_explicitly_said_no,\n  suppressed_for_risk,\n  pct_of_union_audience_unlawful      AS pct_of_the_easy_audience_that_was_unlawful\nFROM `${CDP_PROJECT}.${CDP_DS}.v_consent_impact`\nORDER BY contacts_avoided DESC;\n","sql_lines":31},{"code":"D","file":"scenario_D.sql","title":"Scenario D \u00b7 Contradiction Detection & Triangle Pruning","summary":"Inspects components where transitive closure linked conflicting DOBs, showing how pass-2 pruning severs weak bridges while preserving triangle-supported sub-clusters.","sql":"-- =====================================================================\n-- D \u00b7 Breaking the chain\n--\n-- A looks like B. B looks like C. Therefore A is C \u2014 and now one profile\n-- contains two different people, one of whom can see the other's orders.\n--\n-- This is transitive closure doing exactly what it is designed to do,\n-- and it is how entity resolution becomes a data breach. It cannot be\n-- fixed by better pair scoring, because the A\u2013C pair was never scored:\n-- it was inferred.\n--\n-- The defence is to distrust the closure. Every cluster is checked for\n-- internal contradiction, and a contradicted cluster is rebuilt using\n-- only edges strong enough to stand alone. The weak middle link falls\n-- away and the cluster splits where it should have.\n--\n-- Below: the clusters that were caught, and the OVERMERGE_BAIT case\n-- result. A non-zero contradicted-cluster count is a good sign \u2014 it means\n-- the trap was laid and the guard fired.\n-- =====================================================================\n\nWITH caught AS (\n  SELECT\n    COUNT(*)                     AS contradicted_clusters_found,\n    SUM(members)                 AS records_involved,\n    MAX(distinct_dobs)           AS worst_case_distinct_dobs\n  FROM `${CDP_PROJECT}.${CDP_DS}.component_conflicts`\n),\nsplit AS (\n  -- Edges that were accepted as links, but whose endpoints ended up in\n  -- different people after pruning. These are the links the contradiction\n  -- guard overrode.\n  SELECT COUNT(*) AS links_overridden_by_the_guard\n  FROM `${CDP_PROJECT}.${CDP_DS}.resolution_edges`\n  WHERE suppressed_by_contradiction\n),\nbait AS (\n  SELECT\n    IFNULL(MAX(tp), 0)        AS tp,\n    IFNULL(MAX(fp), 0)        AS fp,\n    IFNULL(MAX(fn), 0)        AS fn,\n    IFNULL(MAX(CAST(passed AS INT64)), 0) = 1 AS overmerge_bait_passed,\n    ANY_VALUE(diagnosis)      AS diagnosis\n  FROM `${CDP_PROJECT}.${CDP_DS}.v_case_results`\n  WHERE case_type = 'OVERMERGE_BAIT'\n),\noverall AS (\n  SELECT clusters_containing_multiple_people\n  FROM `${CDP_PROJECT}.${CDP_DS}.v_scorecard`\n)\nSELECT\n  c.contradicted_clusters_found,\n  c.records_involved,\n  c.worst_case_distinct_dobs,\n  s.links_overridden_by_the_guard,\n  o.clusters_containing_multiple_people AS over_merges_remaining,\n  b.overmerge_bait_passed,\n  b.tp AS bait_pairs_correct,\n  b.fp AS bait_pairs_over_merged,\n  b.fn AS bait_pairs_missed,\n  b.diagnosis\nFROM caught AS c, split AS s, bait AS b, overall AS o;\n","sql_lines":62},{"code":"E","file":"scenario_E.sql","title":"Scenario E \u00b7 Sub-Second Real-Time Hybrid Lookup","summary":"Calls cdp.tf_lookup_hybrid() and cdp.tf_lookup_vector() for low-latency point-of-sale or checkout identity resolution against 20,000 indexed records.","sql":"-- =====================================================================\n-- E \u00b7 Real-time resolution (appendix)\n--\n-- Everything else in this demo is batch: resolve the whole corpus, publish\n-- the graph, activate from it. That is the right default, because entity\n-- resolution is fundamentally an all-pairs problem.\n--\n-- But once the graph exists, resolving ONE inbound record against it is a\n-- different and much cheaper problem \u2014 a single probe into an index, not\n-- a self-join. That is what AI.SEARCH is for, and it is the capability the\n-- published 133x slot-efficiency figure describes.\n--\n-- This scenario simulates an inbound event. It takes a record that is\n-- already in the corpus, deliberately damages it the way a real web form\n-- would (a transposed pair of characters in the name), and asks: with no\n-- account number, no cookie, and no login, can we work out who this is?\n--\n-- Why a real record rather than a made-up one: because the ground truth\n-- is then known, so the answer can be checked rather than admired. The\n-- last column is the one that matters.\n--\n-- WHAT THIS IS NOT\n-- ----------------\n-- This is a single-query probe, not a service. A production real-time\n-- path needs a latency SLA, a decision on whether an uncertain match\n-- blocks the transaction or resolves asynchronously, and a policy for\n-- what happens when the probe creates a new person that the next batch\n-- run then merges away. None of that is in scope here. The claim is only\n-- that the retrieval primitive is fast enough to build on.\n-- =====================================================================\n\n-- Scripting rather than a single SELECT: AI.SEARCH and the lookup TVFs\n-- take a SCALAR query string, so the probe has to be materialised into a\n-- variable before it can be passed. This is the same constraint that\n-- forces the bulk path in stage 50 to use VECTOR_SEARCH against a query\n-- table instead.\n\nDECLARE probe_record_id STRING;\nDECLARE probe_person_id STRING;\nDECLARE clean_key       STRING;\nDECLARE probe_key       STRING;\nDECLARE cut             INT64;\n\n-- Pick a probe deterministically: a record belonging to a person who has\n-- several records, so there is something to find. Ordered by record_id so\n-- the same record is chosen on every run and the demo is repeatable.\nSET probe_record_id = (\n  SELECT e.record_id\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to` AS e\n  JOIN (\n    SELECT person_id\n    FROM `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to`\n    GROUP BY person_id\n    HAVING COUNT(*) >= 3\n    ORDER BY COUNT(*) DESC, MIN(person_id)\n    LIMIT 1\n  ) AS p USING (person_id)\n  ORDER BY e.record_id\n  LIMIT 1\n);\n\nSET probe_person_id = (\n  SELECT person_id\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to`\n  WHERE record_id = probe_record_id\n);\n\nSET clean_key = (\n  SELECT match_key\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`\n  WHERE record_id = probe_record_id\n);\n\n-- Damage it. Transposing two adjacent characters near the middle is the\n-- single most common human typing error, and it is exactly the kind of\n-- corruption that defeats an equality join while leaving both lexical and\n-- semantic retrieval a reasonable chance.\nSET cut = GREATEST(2, CAST(CHAR_LENGTH(clean_key) / 2 AS INT64));\nSET probe_key = CONCAT(\n  SUBSTR(clean_key, 1, cut - 1),\n  SUBSTR(clean_key, cut + 1, 1),\n  SUBSTR(clean_key, cut,     1),\n  SUBSTR(clean_key, cut + 2)\n);\n\n-- One probe. No self-join, no blocking pass, no full scan of the corpus.\nWITH hits AS (\n  SELECT *\n  FROM `${CDP_PROJECT}.${CDP_DS}.tf_lookup_hybrid`(probe_key)\n),\n-- Attach the person each candidate record already resolves to, and count\n-- how much of the retrieved set agrees. Agreement across several\n-- independently-retrieved records is a far stronger signal than any one\n-- record's similarity score.\nattributed AS (\n  SELECT\n    e.person_id,\n    COUNT(*)                          AS supporting_records,\n    MIN(h.record_id)                  AS example_record\n  FROM hits AS h\n  JOIN `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to` AS e\n    ON e.record_id = h.record_id\n  -- Exclude the probe record itself. Finding the record you just copied is\n  -- not a result, and leaving it in would make this look far better than\n  -- it is.\n  WHERE h.record_id != probe_record_id\n  GROUP BY e.person_id\n),\nranked AS (\n  SELECT\n    *,\n    ROW_NUMBER() OVER (ORDER BY supporting_records DESC, person_id) AS rn\n  FROM attributed\n),\n-- A single-row anchor, LEFT JOINed to the winner. Without this, a probe\n-- that retrieves nothing returns zero rows and the demo silently shows an\n-- empty table \u2014 which is the one outcome most worth seeing, because\n-- \"would have created a duplicate\" is the failure this whole system\n-- exists to prevent.\nanchor AS (SELECT 1 AS k)\nSELECT\n  probe_record_id                                      AS inbound_record,\n  clean_key                                            AS original_key,\n  probe_key                                            AS damaged_key_as_received,\n  (SELECT COUNT(*) FROM hits)                          AS candidates_retrieved,\n  r.person_id                                          AS resolved_to,\n  r.supporting_records,\n  r.example_record                                     AS matched_against,\n  probe_person_id                                      AS correct_answer,\n  -- The only column that matters.\n  CASE\n    WHEN r.person_id IS NULL            THEN 'NO MATCH \u2014 would create a new person'\n    WHEN r.person_id = probe_person_id  THEN 'CORRECT'\n    ELSE                                     'WRONG \u2014 resolved to a different person'\n  END                                                  AS outcome,\n  (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.party_search`)\n                                                       AS corpus_records_searched\nFROM anchor AS a\nLEFT JOIN ranked AS r ON r.rn = 1;\n","sql_lines":139}],"funnel":[{"label":"Source records landed","value":20000,"note":"every row from the eight sources, normalised"},{"label":"Pairs considered","value":10773842,"note":"after blocking cut the full cross product"},{"label":"Auto-matched on rules","value":4345,"note":"no LLM involved"},{"label":"Sent to the adjudicator","value":41769,"note":"the only pairs that cost model spend"},{"label":"Rejected before the LLM","value":10727728,"note":"scored or ruled out"},{"label":"Adjudicated MATCH","value":6526,"note":"LLM agreed they are the same person"},{"label":"Resolved people","value":13566,"note":"clusters published"},{"label":"True people (ground truth)","value":8000,"note":"what the answer should have been"}]};
</script>
<script>
'use strict';

/* ---------- tiny DOM helpers ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
/* The SVG namespace is discovered from a parsed <svg> element rather than
   written out as a literal URI, so no URL of any kind appears in this file. */
var SVGNS = (function(){
  var probe = document.createElement('div');
  probe.innerHTML = '<svg></svg>';
  return probe.firstChild.namespaceURI;
})();
function svgEl(tag, attrs){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null)
    n.setAttribute(k, String(attrs[k]));
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }

/* ---------- values ---------- */
var NUM_RE = /^-?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
function isNum(v){
  if (typeof v === 'number') return isFinite(v);
  return typeof v === 'string' && v.trim() !== '' && NUM_RE.test(v.trim());
}
function numOf(v){ return typeof v === 'number' ? v : parseFloat(String(v)); }
function group(n){
  var s = String(n), neg = s.charAt(0) === '-';
  if (neg) s = s.slice(1);
  var p = s.split('.'), i = p[0], out = '';
  for (var c = 0; c < i.length; c++){
    if (c > 0 && (i.length - c) % 3 === 0) out += ',';
    out += i.charAt(c);
  }
  return (neg ? '-' : '') + out + (p[1] !== undefined ? '.' + p[1] : '');
}
/* Display form for a cell. Integers get thousand separators; decimals and
   scientific notation (BigQuery hands back things like 1.9999E8) are shown
   as the number they actually are, never re-rounded beyond 4 places. */
function fmt(v){
  if (v === null || v === undefined) return '\u2014';
  if (typeof v === 'object') return JSON.stringify(v);
  var s = String(v);
  if (!isNum(s)) return s;
  var t = s.trim();
  if (/^-?\d+$/.test(t)) return group(t);
  var n = numOf(t);
  if (/[eE]/.test(t)) {
    return Number.isInteger(n) ? group(n) : group(n.toFixed(4).replace(/0+$/, '').replace(/\.$/, ''));
  }
  return group(t);
}
function bigInt(v){ return v === null || v === undefined ? '\u2014' : fmt(v); }

/* Look-ups against the inlined payload. */
var STAGES = DATA.stages || [];
function stage(id){
  for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return STAGES[i];
  return null;
}
function view(stageId, viewName){
  var s = stage(stageId);
  if (!s) return null;
  for (var i = 0; i < (s.results || []).length; i++)
    if (s.results[i].view === viewName && !s.results[i].error) return s.results[i];
  return null;
}
function row0(stageId, viewName){
  var v = view(stageId, viewName);
  return v && v.rows && v.rows.length ? v.rows[0] : null;
}
function cell(r, k){ return r && r[k] !== undefined ? r[k] : null; }

/* ---------- SQL highlighting ---------- */
var KEYWORDS = ('select from where group by order having limit offset as on join left right full inner outer cross ' +
  'union all distinct case when then else end and or not in is null true false create replace table view function ' +
  'procedure temp temporary if exists insert into values update set delete merge using with partition cluster options ' +
  'schema dataset declare begin default returns language js sql return call execute immediate over window rows range ' +
  'between unbounded preceding following current row asc desc cast safe_cast struct array unnest qualify recursive ' +
  'primary key foreign references grant to interval extract date datetime timestamp numeric bignumeric string bytes ' +
  'int64 float64 bool json geography exception raise loop while do for end_if assert drop alter add column rename ' +
  'describe explain lateral pivot unpivot tablesample repeatable model remote connection').split(' ');
var KWSET = {};
for (var _i = 0; _i < KEYWORDS.length; _i++) KWSET[KEYWORDS[_i]] = 1;

function esc(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
var TOKEN_RE = new RegExp(
  '(/\\*[\\s\\S]*?\\*/)' +          /* block comment  */
  '|(--[^\\n]*|#[^\\n]*)' +          /* line comment   */
  "|(\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?''')" +  /* triple quoted */
  "|('(?:\\\\.|[^'\\\\\\n])*'|\"(?:\\\\.|[^\"\\\\\\n])*\")" +  /* string      */
  '|(`[^`]*`)' +                     /* quoted ident   */
  '|(\\b\\d+(?:\\.\\d+)?(?:[eE][-+]?\\d+)?\\b)' + /* number  */
  '|([A-Za-z_][A-Za-z0-9_]*)',       /* word           */
  'g');

function highlight(sql){
  var out = '', last = 0, m;
  TOKEN_RE.lastIndex = 0;
  while ((m = TOKEN_RE.exec(sql)) !== null){
    out += esc(sql.slice(last, m.index));
    var t = m[0], cls = null;
    if (m[1] || m[2]) cls = 'k-com';
    else if (m[3] || m[4]) cls = 'k-str';
    else if (m[5]) cls = null;
    else if (m[6]) cls = 'k-num';
    else if (m[7]){
      var lower = t.toLowerCase();
      if (KWSET[lower]) cls = 'k-kw';
      else if (sql.charAt(m.index + t.length) === '(') cls = 'k-fn';
    }
    out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
    last = m.index + t.length;
  }
  out += esc(sql.slice(last));
  return out;
}
function numberedCode(sql){
  /* A trailing newline is a line terminator, not an extra line -- keep the
     gutter agreeing with the "N lines" count in the header. */
  var lines = highlight(sql.replace(/\n$/, '')).split('\n'), out = '';
  for (var i = 0; i < lines.length; i++)
    out += '<span class="code-line" data-line="' + (i + 1) + '"><span class="ln">' + (i + 1) + '</span>' + lines[i] + '</span>';
  return out;
}

var BQ_PATTERNS = [
  { re: /CREATE\s+(?:OR\s+REPLACE\s+)?SEARCH\s+INDEX/i, label: 'CREATE SEARCH INDEX' },
  { re: /CREATE\s+(?:OR\s+REPLACE\s+)?VECTOR\s+INDEX/i, label: 'CREATE VECTOR INDEX (IVF)' },
  { re: /ML\.GENERATE_EMBEDDING/i,                      label: 'ML.GENERATE_EMBEDDING' },
  { re: /\bVECTOR_SEARCH\s*\(/i,                        label: 'VECTOR_SEARCH() Semantic' },
  { re: /\bSEARCH\s*\(/i,                               label: 'SEARCH() Lexical' },
  { re: /AI\.GENERATE(?:_TABLE)?\s*\(/i,                label: 'AI.GENERATE Structured LLM' },
  { re: /\bsur_idf_weight\b|\bsurname_idf\b/i,          label: 'Fellegi-Sunter IDF Priors' },
  { re: /\brrf_score\b|SAFE_DIVIDE\(1,\s*60/i,          label: 'Reciprocal Rank Fusion (RRF)' },
  { re: /\btriangle_edges\b|\bhas_triangle_support\b/i, label: 'Triangle Neighborhood Pruning' },
  { re: /\bWHILE\b[\s\S]{1,120}EXECUTE\s+IMMEDIATE/i,   label: 'Procedural Graph Loop (WHILE)' },
  { re: /\bFARM_FINGERPRINT\b/i,                        label: 'Deterministic Hash ID' },
  { re: /\bv_golden_person_attribute_history\b/i,       label: 'SCD Type 2 Bitemporal History' },
  { re: /\bWITHDRAWN\b[\s\S]{1,160}\bGRANTED\b/i,       label: 'Principle P7 Consent Dominance' },
  { re: /CREATE\s+OR\s+REPLACE\s+TABLE\s+FUNCTION/i,    label: 'Table-Valued Function (TVF)' }
];

function detectBqFeatures(sql){
  var rawLines = (sql || '').split('\n');
  var found = [];
  BQ_PATTERNS.forEach(function(p){
    for (var i = 0; i < rawLines.length; i++){
      if (p.re.test(rawLines[i])){
        found.push({ label: p.label, line: i + 1 });
        break;
      }
    }
  });
  return found;
}

function createSqlWidget(title, sqlText, linesCount, forceOpen){
  var sec = el('div', 'sec');
  var box = el('div', 'sqlbox');
  var bar = el('div', 'sqlbar');
  bar.setAttribute('role', 'button');
  bar.setAttribute('tabindex', '0');

  var mode = readSqlMode();
  var isOpen = forceOpen !== undefined ? forceOpen : (mode !== 'compact');
  if (isOpen) box.classList.add('open');
  bar.setAttribute('aria-expanded', isOpen ? 'true' : 'false');

  bar.appendChild(el('span', 'car', '\u25B6'));
  bar.appendChild(el('span', 'lbl', title));
  bar.appendChild(el('span', 'meta', (linesCount || (sqlText || '').split('\n').length) + ' lines'));
  bar.appendChild(el('span', 'sp'));

  var copyBtn = el('button', 'copy-btn', 'Copy SQL');
  copyBtn.title = 'Copy BigQuery SQL to clipboard';
  copyBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(sqlText || '').then(function(){
        copyBtn.textContent = 'Copied \u2713';
        setTimeout(function(){ copyBtn.textContent = 'Copy SQL'; }, 1600);
      });
    }
  });
  bar.appendChild(copyBtn);

  var hint = el('span', 'meta', isOpen ? 'hide' : 'show');
  hint.style.marginLeft = '8px';
  bar.appendChild(hint);

  var feats = detectBqFeatures(sqlText);
  var featBar = null;
  if (feats.length){
    featBar = el('div', 'sql-feats');
    featBar.appendChild(el('span', 'ft-lbl', 'BigQuery SQL Features:'));
    feats.forEach(function(f){
      var fp = el('button', 'feat-pill');
      fp.innerHTML = esc(f.label) + ' <span class="fln">L' + f.line + '</span>';
      fp.title = 'Jump to line ' + f.line + ' in SQL';
      fp.addEventListener('click', function(e){
        e.stopPropagation();
        jumpToLine(f.line, 10);
      });
      featBar.appendChild(fp);
    });
  }

  var body = el('div', 'sqlbody');
  var pre = el('pre', 'code');
  var rendered = false;
  function ensureRendered(){
    if (!rendered){
      pre.innerHTML = numberedCode(sqlText || '');
      rendered = true;
    }
  }
  if (isOpen) ensureRendered();

  function toggleOpen(openState){
    var open = openState !== undefined ? openState : !box.classList.contains('open');
    box.classList.toggle('open', open);
    bar.setAttribute('aria-expanded', open ? 'true' : 'false');
    hint.textContent = open ? 'hide' : 'show';
    if (open) ensureRendered();
  }

  bar.addEventListener('click', function(){ toggleOpen(); });

  function jumpToLine(lineNum, count){
    toggleOpen(true);
    ensureRendered();
    var allLines = pre.querySelectorAll('.code-line');
    allLines.forEach(function(l){ l.classList.remove('hl'); });
    var targetEl = null;
    var span = count || 8;
    for (var i = 0; i < allLines.length; i++){
      var ln = parseInt(allLines[i].getAttribute('data-line'), 10);
      if (ln >= lineNum && ln < lineNum + span){
        allLines[i].classList.add('hl');
        if (!targetEl) targetEl = allLines[i];
      }
    }
    if (targetEl){
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      var topPos = targetEl.offsetTop - Math.max(40, body.clientHeight * 0.25);
      body.scrollTo({ top: Math.max(0, topPos), behavior: 'smooth' });
    }
  }

  function jumpToObject(objName){
    if (!objName || !sqlText) return;
    var rawLines = sqlText.split('\n');
    var escObj = objName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var createRe = new RegExp('(?:CREATE|TABLE|VIEW|FUNCTION|PROCEDURE|INDEX|INTO)\\s+[^;]*?\\b' + escObj + '\\b', 'i');
    var matchLine = -1;
    for (var i = 0; i < rawLines.length; i++){
      if (createRe.test(rawLines[i])){ matchLine = i + 1; break; }
    }
    if (matchLine < 0){
      var anyRe = new RegExp('\\b' + escObj + '\\b', 'i');
      for (var j = 0; j < rawLines.length; j++){
        if (anyRe.test(rawLines[j])){ matchLine = j + 1; break; }
      }
    }
    if (matchLine > 0) jumpToLine(matchLine, 12);
  }

  body.appendChild(pre);
  box.appendChild(bar);
  if (featBar) box.appendChild(featBar);
  box.appendChild(body);
  sec.appendChild(box);

  return { el: sec, jumpToLine: jumpToLine, jumpToObject: jumpToObject };
}

/* ---------- tables ---------- */
var FILTER_AT = 12;   /* rows above this get a filter box */
var TRUNC_AT  = 140;  /* characters above this get truncated with a title */

function buildTable(res){
  var box = el('div');
  var cols = res.columns || [];
  var rows = (res.rows || []).slice();
  var numeric = {};
  cols.forEach(function(c){
    var seen = 0, num = 0;
    rows.forEach(function(r){
      var v = r[c];
      if (v === null || v === undefined || v === '') return;
      seen++; if (isNum(v)) num++;
    });
    numeric[c] = seen > 0 && num === seen;
  });

  var state = { col: null, dir: 1, q: '' };
  var scroll = el('div', 'tscroll');
  var table = el('table');
  var thead = el('thead'), htr = el('tr');
  var ths = {};
  cols.forEach(function(c){
    var th = el('th', numeric[c] ? 'n' : '');
    th.appendChild(document.createTextNode(c));
    var ar = el('span', 'ar', '\u25B4\u25BE');
    th.appendChild(ar);
    th.title = 'Sort by ' + c;
    th.addEventListener('click', function(){
      if (state.col === c) state.dir = -state.dir; else { state.col = c; state.dir = 1; }
      draw();
    });
    ths[c] = { th: th, ar: ar };
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = el('tbody');
  table.appendChild(tbody);
  scroll.appendChild(table);

  var shown = el('span', 'shown');
  if (rows.length > FILTER_AT){
    var bar = el('div', 'tbar');
    var inp = el('input', 'filter');
    inp.type = 'search';
    inp.placeholder = 'Filter ' + rows.length + ' rows\u2026';
    inp.setAttribute('aria-label', 'Filter rows of ' + res.view);
    inp.addEventListener('input', function(){ state.q = inp.value.toLowerCase(); draw(); });
    bar.appendChild(inp);
    bar.appendChild(shown);
    box.appendChild(bar);
  }
  box.appendChild(scroll);

  function visible(){
    if (!state.q) return rows;
    return rows.filter(function(r){
      for (var i = 0; i < cols.length; i++){
        var v = r[cols[i]];
        if (v !== null && v !== undefined && String(v).toLowerCase().indexOf(state.q) >= 0) return true;
      }
      return false;
    });
  }
  function draw(){
    var rs = visible().slice();
    if (state.col){
      var c = state.col, n = numeric[c], d = state.dir;
      rs.sort(function(a, b){
        var x = a[c], y = b[c];
        var xn = x === null || x === undefined || x === '';
        var yn = y === null || y === undefined || y === '';
        if (xn && yn) return 0;
        if (xn) return 1;      /* empties always sink */
        if (yn) return -1;
        if (n) return (numOf(x) - numOf(y)) * d;
        return String(x).localeCompare(String(y)) * d;
      });
    }
    cols.forEach(function(c){
      ths[c].th.classList.toggle('sorted', state.col === c);
      ths[c].ar.textContent = state.col === c ? (state.dir > 0 ? '\u25B4' : '\u25BE') : '\u25B4\u25BE';
    });
    clear(tbody);
    rs.forEach(function(r){
      var tr = el('tr');
      cols.forEach(function(c){
        var v = r[c];
        var td = el('td', numeric[c] ? 'n' : '');
        if (v === null || v === undefined || v === ''){
          td.className += ' nil';
          td.textContent = '\u2014';
        } else {
          var s = fmt(v);
          if (s.length > TRUNC_AT){
            /* slice one short of the budget so the ellipsis always buys the
               reader something -- a value only a character over the limit
               would otherwise be "truncated" to the same length. */
            var sp = el('span', 'trunc', s.slice(0, TRUNC_AT - 1) + '\u2026');
            sp.title = String(v);
            td.appendChild(sp);
          } else {
            td.textContent = s;
          }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    shown.textContent = rs.length === rows.length
      ? rows.length + ' rows'
      : rs.length + ' of ' + rows.length + ' rows';
  }
  draw();
  return box;
}

/* ---------- hand-rolled SVG: horizontal bars ---------- */
function barChart(rows, labelCol, valueCol, opts){
  opts = opts || {};
  var W = 760, LBL = opts.labelWidth || 190, PAD = 96, RH = 26, TOP = 4;
  var H = TOP * 2 + rows.length * RH;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.setAttribute('aria-label', opts.aria || 'bar chart');
  var max = 0;
  rows.forEach(function(r){ var v = numOf(r[valueCol]); if (isFinite(v) && v > max) max = v; });
  if (max <= 0) max = 1;
  var track = W - LBL - PAD;
  rows.forEach(function(r, i){
    var y = TOP + i * RH;
    var v = numOf(r[valueCol]); if (!isFinite(v)) v = 0;
    var w = Math.max(v > 0 ? 2 : 0, Math.round(track * (v / max)));
    var lbl = svgEl('text', { x: LBL - 12, y: y + 15, 'text-anchor': 'end', class: 's-lbl' });
    lbl.textContent = String(r[labelCol]);
    svg.appendChild(lbl);
    svg.appendChild(svgEl('rect', { x: LBL, y: y + 5, width: track, height: 14, rx: 3, class: 's-track' }));
    svg.appendChild(svgEl('rect', {
      x: LBL, y: y + 5, width: w, height: 14, rx: 3,
      class: 'b' + (opts.colour !== undefined ? opts.colour : (i % 5))
    }));
    var val = svgEl('text', { x: LBL + track + 10, y: y + 16, class: 's-val' });
    val.textContent = fmt(r[valueCol]);
    svg.appendChild(val);
  });
  return svg;
}

/* ---------- hand-rolled SVG: funnel ---------- */
/* Widths are log-scaled: the first step is five orders of magnitude bigger
   than the last, so a linear funnel would draw the last steps as nothing. */
function funnel(steps){
  var W = 760, LBL = 214, VAL = 132, RH = 54, TOP = 6;
  var cw = W - LBL - VAL, cx = LBL + cw / 2;
  var H = TOP * 2 + steps.length * RH;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.setAttribute('aria-label', 'pipeline funnel');
  var max = 0;
  steps.forEach(function(s){ if (s.value > max) max = s.value; });
  function width(v){
    if (!(v > 0)) return 6;
    var f = Math.log10(v + 1) / Math.log10(max + 1);
    return Math.max(24, cw * Math.pow(f, 3));
  }
  steps.forEach(function(s, i){
    var y = TOP + i * RH;
    var w1 = width(s.value);
    var w2 = width(i + 1 < steps.length ? steps[i + 1].value : s.value);
    var pts = [
      (cx - w1 / 2) + ',' + y,
      (cx + w1 / 2) + ',' + y,
      (cx + w2 / 2) + ',' + (y + RH - 8),
      (cx - w2 / 2) + ',' + (y + RH - 8)
    ].join(' ');
    var poly = svgEl('polygon', { points: pts, class: 'f-shape' });
    poly.setAttribute('opacity', String(0.92 - i * 0.11));
    svg.appendChild(poly);

    var lbl = svgEl('text', { x: LBL - 16, y: y + 19, 'text-anchor': 'end', class: 's-lbl' });
    lbl.textContent = s.label;
    svg.appendChild(lbl);
    if (s.source){
      var src = svgEl('text', { x: LBL - 16, y: y + 34, 'text-anchor': 'end', class: 's-lbl' });
      src.setAttribute('opacity', '.7');
      src.textContent = s.source;
      svg.appendChild(src);
    }
    var val = svgEl('text', { x: W - VAL + 16, y: y + 19, class: 's-val' });
    val.textContent = fmt(s.value);
    svg.appendChild(val);
    if (s.note){
      var nt = svgEl('text', { x: W - VAL + 16, y: y + 34, class: 's-lbl' });
      nt.textContent = s.note;
      svg.appendChild(nt);
    }
  });
  return svg;
}

/* ---------- what actually ran, and the volumes either side ---------------
   Everything below is driven by steps.json. When that file was not supplied
   s.run is undefined and DATA.funnel is empty, every builder returns null,
   and the page renders exactly as it did before. */

var KIND_WORD = {
  table: 'table', view: 'view', routine: 'routine', index: 'index',
  assert: 'assert', schema: 'schema', temp: 'temp', external: 'external'
};
function pill(kind){
  var k = String(kind === null || kind === undefined ? '' : kind).toLowerCase();
  var safe = k.replace(/[^a-z0-9]+/g, '-');
  return el('span', 'pill' + (safe ? ' p-' + safe : ''), KIND_WORD[k] || (k || 'step'));
}
function plural(n, word){
  return fmt(n) + ' ' + word + (numOf(n) === 1 ? '' : 's');
}

/* A view or an external table carries no storage statistics in BigQuery, so
   its zeroes mean "not reported", not "empty". Say so rather than print a 0
   the reader would take at face value. */
function reportsVolume(o){
  if (!o) return false;
  if (o.kind === 'view' || o.kind === 'external') return false;
  return o.rows !== null && o.rows !== undefined;
}
function bytesH(b){
  var n = numOf(b);
  if (b === null || b === undefined || !isFinite(n) || n <= 0) return '\u2014';
  var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
  while (n >= 1024 && i < u.length - 1){ n = n / 1024; i++; }
  return (i === 0 ? String(Math.round(n)) : n.toFixed(n < 10 ? 1 : 0)) + ' ' + u[i];
}

function whatRan(s, sqlWidget){
  var run = s.run;
  if (!run || !(run.steps || []).length) return null;
  var steps = run.steps;
  var n = (run.statements === null || run.statements === undefined) ? steps.length : run.statements;

  var sec = el('div', 'sec');

  h.appendChild(el('h3', null, 'What ran'));
  h.appendChild(el('span', 'count',
    fmt(n) + (numOf(n) === 1 ? ' statement executed' : ' statements executed')
    + ' in BigQuery \u00b7 click any statement to jump to its SQL'));
  sec.appendChild(h);

  var ol = el('ol', 'steplist');
  steps.forEach(function(st){
    var li = el('li', sqlWidget ? 'clickable' : null);
    li.appendChild(pill(st.kind));
    li.appendChild(el('span', 'op', st.op));
    li.appendChild(el('span', 'obj', st.object));
    if (sqlWidget && st.object){
      li.appendChild(el('span', 'jump-tag', 'jump to SQL \u21B5'));
      li.title = 'Jump to ' + st.object + ' in SQL';
      li.addEventListener('click', function(){
        sqlWidget.jumpToObject(st.object);
      });
    }
    var r = el('span', 'rows');
    if (st.rows === null || st.rows === undefined){
      r.className = 'rows nr';
      r.textContent = '\u2014';
    } else {
      r.textContent = fmt(st.rows) + ' rows';
    }
    li.appendChild(r);
    ol.appendChild(li);
  });
  sec.appendChild(ol);
  sec.appendChild(el('div', 'note stepnote',
    'Row counts are what the object holds now, read from BigQuery metadata rather than '
    + 'from the script. Click any statement row above to scroll directly to its definition in the SQL panel.'));
  return sec;
}

function rowTotals(items){
  var t = { rows: 0, quiet: 0, objects: items.length };
  items.forEach(function(o){
    if (reportsVolume(o)) t.rows += numOf(o.rows); else t.quiet++;
  });
  return t;
}

function beforeAfter(s){

/* ---------- hand-rolled SVG: log-scaled pipeline bars ---------- */
/* The largest step is ~10.7M and the smallest a few thousand, so linear bar
   lengths would draw the tail as nothing at all. Lengths are log10, the axis
   starts at the round decade below the smallest value, and every bar carries
   its exact number so nothing rests on reading a length. */
function logFloor(items){
  var min = Infinity;
  items.forEach(function(it){
    var v = numOf(it.value);
    if (isFinite(v) && v > 0 && v < min) min = v;
  });
  if (!isFinite(min) || min <= 0) return 1;
  var b = Math.pow(10, Math.floor(Math.log(min) / Math.LN10));
  return b > 0 ? b : 1;
}
function funnelBars(items, opts){
  opts = opts || {};
  var W = 760, RH = 54, TOP = 6, BAR = 15;
  var H = TOP * 2 + items.length * RH;
  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img' });
  svg.setAttribute('aria-label', 'pipeline funnel, bar lengths on a logarithmic scale');
  var max = 0;
  items.forEach(function(it){ var v = numOf(it.value); if (isFinite(v) && v > max) max = v; });
  if (!(max > 0)) return svg;
  var base = opts.base || logFloor(items);
  if (base >= max) base = 1;
  var span = (Math.log(max / base) / Math.LN10) || 1;
  function width(v){
    if (!(v > base)) return 4;
    return Math.max(4, Math.round(W * ((Math.log(v / base) / Math.LN10) / span)));
  }
  items.forEach(function(it, i){
    var y = TOP + i * RH;
    var v = numOf(it.value); if (!isFinite(v)) v = 0;

    var lbl = svgEl('text', { x: 0, y: y + 13, class: 's-head' });
    lbl.textContent = it.label;
    svg.appendChild(lbl);

    var val = svgEl('text', { x: W, y: y + 13, 'text-anchor': 'end', class: 's-val' });
    val.textContent = fmt(v);
    svg.appendChild(val);

    svg.appendChild(svgEl('rect', { x: 0, y: y + 20, width: W, height: BAR, rx: 3, class: 's-track' }));
    svg.appendChild(svgEl('rect', { x: 0, y: y + 20, width: width(v), height: BAR, rx: 3, class: 'b0' }));

    if (it.note){
      var nt = svgEl('text', { x: 0, y: y + 47, class: 's-note' });
      nt.textContent = it.note;
      svg.appendChild(nt);
    }
  });
  return svg;
}
function pipelineFunnelSection(){
  var items = (DATA.funnel || []).filter(function(it){ return it && isNum(it.value); });
  if (items.length < 2) return null;
  var base = logFloor(items), max = 0, min = Infinity;
  items.forEach(function(it){
    var v = numOf(it.value);
    if (v > max) max = v;
    if (v < min) min = v;
  });
  var sec = el('div', 'sec');
  var h = el('div', 'sec-h');
  h.appendChild(el('h3', null, 'The pipeline, end to end'));
  h.appendChild(el('span', 'badge', 'log scale'));
  h.appendChild(el('span', 'count', items.length + ' checkpoints, in pipeline order'));
  sec.appendChild(h);
  sec.appendChild(vizBox(null, funnelBars(items, { base: base }),
    'Bar lengths are LOGARITHMIC, not linear. The largest step is ' + fmt(max)
    + ' and the smallest is ' + fmt(min) + ' \u2014 on a linear axis the tail would draw as '
    + 'nothing. Lengths are log10 from an axis starting at ' + fmt(base)
    + ', so read the printed numbers, not the lengths. Source: steps.json, extracted '
    + 'from the run.'));
  return sec;
}

  var corpus = DATA.corpus || {};
  Object.keys(corpus).forEach(function(k){
    pairs.push(['Corpus \u00b7 ' + k, fmt(corpus[k])]);
  });
  var models = DATA.models || {};
  Object.keys(models).forEach(function(k){ pairs.push(['Model \u00b7 ' + k, models[k]]); });
  var th = DATA.thresholds || {};
  Object.keys(th).forEach(function(k){ pairs.push([k, fmt(th[k])]); });
  cfg.appendChild(kvGrid(pairs));
  w.appendChild(cfg);

  /* pipeline at a glance */
  var pl = el('div', 'sec');
  var ph = el('div', 'sec-h');
  ph.appendChild(el('h3', null, 'The pipeline'));
  pl.appendChild(ph);
  var list = el('div', 'kv');
  STAGES.forEach(function(s, i){
    var r = el('div', 'row');
    var btn = el('button', 'k');
    btn.style.textAlign = 'left';
    btn.style.color = 'var(--accent)';
    btn.textContent = s.num + ' \u00b7 ' + s.title;
    btn.addEventListener('click', function(){ go(i); });
    r.appendChild(btn);
    var n = (s.results || []).length;
    r.appendChild(el('span', 'v', s.sql_lines + ' lines \u00b7 ' + n + (n === 1 ? ' view' : ' views')));
    list.appendChild(r);
  });
  pl.appendChild(list);
  w.appendChild(pl);

  var foot = el('div', 'foot');
  foot.appendChild(el('span', null, 'Self-contained page \u2014 no network access required.'));
  var kb = el('span');
  kb.appendChild(document.createTextNode('Navigate with '));
  kb.appendChild(el('kbd', null, '\u2190'));
  kb.appendChild(document.createTextNode(' '));
  kb.appendChild(el('kbd', null, '\u2192'));
  foot.appendChild(kb);
  w.appendChild(foot);

  main.appendChild(w);
  main.scrollTop = 0;
}

/* ---------- a single stage ---------- */
function renderStage(main, idx){
  var s = STAGES[idx];
  clear(main);
  var w = el('div', 'wrap');

  w.appendChild(el('div', 'eyebrow',
    'Stage ' + s.num + ' \u00b7 ' + (idx + 1) + ' of ' + STAGES.length));
  w.appendChild(el('h2', null, s.title));
  if (s.summary) w.appendChild(el('p', 'lede', s.summary));

  var grid = el('div', 'stage-grid');
  var sqlCol = el('div', 'sql-col');
  var resCol = el('div', 'res-col');

  var sqlWidget = null;
  if (s.sql){
    sqlWidget = createSqlWidget('BigQuery SQL \u00b7 ' + s.id + '.sql', s.sql, s.sql_lines);
    sqlCol.appendChild(sqlWidget.el);
  }

  /* what actually ran, then the volumes either side of it (steps.json) */
  var ran = whatRan(s, sqlWidget);
  if (ran) resCol.appendChild(ran);
  var ba = beforeAfter(s);
  if (ba) resCol.appendChild(ba);

  /* results */
  var results = s.results || [];
  if (!results.length){
    var none = el('div', 'sec');
    none.appendChild(el('div', 'err',
      'This stage produces no result view of its own \u2014 it creates objects the later '
      + 'stages read. The SQL on the left is the whole story.'));
    resCol.appendChild(none);
  }
  results.forEach(function(res){
    var sec = el('div', 'sec');
    var head = el('div', 'sec-h');
    head.appendChild(el('h3', null, res.view));
    if (res.error){
      head.appendChild(el('span', 'badge', 'not available'));
      sec.appendChild(head);
      sec.appendChild(el('div', 'err',
        'This view was not available when the results were extracted' +
        (typeof res.error === 'string' && res.error !== 'not available' ? ' (' + res.error + ')' : '') +
        '. Re-run the stage, then extract_results.py, to populate it.'));
      resCol.appendChild(sec);
      return;
    }
    var n = res.row_count !== undefined ? res.row_count : (res.rows || []).length;
    head.appendChild(el('span', 'count', n + (n === 1 ? ' row' : ' rows')
      + ' \u00b7 ' + (res.columns || []).length + ' columns'));
    sec.appendChild(head);
    var chart = chartFor(res);
    if (chart){ chart.style.marginBottom = '16px'; sec.appendChild(chart); }
    sec.appendChild(buildTable(res));
    resCol.appendChild(sec);
  });

  grid.appendChild(sqlCol);
  grid.appendChild(resCol);
  w.appendChild(grid);

  var foot = el('div', 'foot');
  if (idx > 0) foot.appendChild(navLink('\u2190 ' + STAGES[idx - 1].num + ' ' + STAGES[idx - 1].title, idx - 1));
  if (idx < STAGES.length - 1) foot.appendChild(navLink(STAGES[idx + 1].num + ' ' + STAGES[idx + 1].title + ' \u2192', idx + 1));
  w.appendChild(foot);

  main.appendChild(w);
  main.scrollTop = 0;
}

function renderHeroCases(main){
  clear(main);
  var w = el('div', 'wrap');
  w.appendChild(el('div', 'eyebrow', 'Interactive Walkthrough \u00b7 End-to-End Trace'));

    'Select any flagship hard case below to see the exact messy source records, how rule-based MDM fails, '
    + 'and which BigQuery SQL stages resolve it correctly. Click any stage button to jump directly to its production SQL.'));

    clear(contentBox);
    var topCard = el('div', 'sec');

        row.appendChild(el('span', 'v', pair[1]));

function navLink(text, idx){
  var b = el('button', null, text);
  b.style.color = 'var(--accent)';
  b.addEventListener('click', function(){ go(idx); });
  return b;
}

/* ---------- chrome: sidebar, rail, theme, sql mode, routing ---------- */
var current = -1;   /* -1 == overview, -2 == hero cases, -3 == scenarios, 0..N == stages */
var navItems = [], railDots = [];

function buildNav(){
  var nav = document.getElementById('nav');
  nav.appendChild(el('div', 'navhead', 'Overview & Walkthroughs'));

  var ov = el('button', 'navitem');
  ov.appendChild(el('span', 'nn', '\u2022'));
  ov.appendChild(el('span', 'nt', 'Run summary & scorecard'));
  ov.addEventListener('click', function(){ go(-1); });
  nav.appendChild(ov);
  navItems.push({ el: ov, idx: -1 });

  var hc = el('button', 'navitem');
  hc.appendChild(el('span', 'nn', '\u2605'));
  hc.appendChild(el('span', 'nt', 'Hero cases (trace a person)'));
  hc.addEventListener('click', function(){ go(-2); });
  nav.appendChild(hc);
  navItems.push({ el: hc, idx: -2 });

  var sc = el('button', 'navitem');
  sc.appendChild(el('span', 'nn', '\u26A1'));
  sc.appendChild(el('span', 'nt', 'Day-2 SQL scenarios (A\u2013E)'));
  sc.addEventListener('click', function(){ go(-3); });
  nav.appendChild(sc);
  navItems.push({ el: sc, idx: -3 });

  nav.appendChild(el('div', 'navhead', 'SQL Pipeline Stages'));
  STAGES.forEach(function(s, i){
    var b = el('button', 'navitem');
    b.appendChild(el('span', 'nn', s.num));
    b.appendChild(el('span', 'nt', s.title));
    b.appendChild(el('span', 'nmeta', s.sql_lines + 'L SQL'));
    b.addEventListener('click', function(){ go(i); });
    nav.appendChild(b);
    navItems.push({ el: b, idx: i });
  });
}
function buildRail(){
  var rail = document.getElementById('rail');
  rail.appendChild(el('span', 'rl', 'Pipeline'));
  STAGES.forEach(function(s, i){
    var step = el('div', 'rstep');
    if (i > 0) step.appendChild(el('span', 'rline'));
    var d = el('button', 'rdot', s.num);
    d.title = s.num + ' \u00b7 ' + s.title;
    d.setAttribute('aria-label', 'Stage ' + s.num + ': ' + s.title);
    d.addEventListener('click', function(){ go(i); });
    step.appendChild(d);
    rail.appendChild(step);
    railDots.push(d);
  });
}
function mark(){
  navItems.forEach(function(item){ item.el.classList.toggle('on', item.idx === current); });
  railDots.forEach(function(d, i){
    d.classList.toggle('on', i === current);
    d.classList.toggle('seen', current >= 0 && i < current);
  });
  if (current === -1) document.title = 'Stage explorer \u00b7 ' + DATA.project + '.' + DATA.dataset;
  else if (current === -2) document.title = 'Hero Cases \u00b7 stage explorer';
  else if (current === -3) document.title = 'Day-2 Scenarios \u00b7 stage explorer';
  else document.title = STAGES[current].num + ' ' + STAGES[current].title + ' \u00b7 stage explorer';
}
function go(idx, skipHash){
  if (idx < -3) idx = -1;
  if (idx > STAGES.length - 1) idx = STAGES.length - 1;
  current = idx;
  var main = document.getElementById('main');
  if (idx === -1) renderOverview(main);
  else if (idx === -2) renderHeroCases(main);
  else if (idx === -3) renderScenarios(main);
  else renderStage(main, idx);
  mark();
  if (!skipHash){
    var h = idx === -1 ? '#overview' : idx === -2 ? '#cases' : idx === -3 ? '#scenarios' : '#' + STAGES[idx].id;
    try { history.replaceState(null, '', h); } catch (e) {}
  }
  var dot = railDots[idx < 0 ? 0 : idx];
  if (dot && dot.scrollIntoView) dot.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

var SQL_MODE_KEY = 'cdp-explorer-sqlmode';
function readSqlMode(){
  try { return localStorage.getItem(SQL_MODE_KEY) || 'open'; } catch (e) { return 'open'; }
}
function applySqlMode(mode){
  document.body.classList.toggle('sql-split', mode === 'split');
  var b = document.getElementById('sqlmode');
  if (b){
    var lbl = b.querySelector('span');
    if (lbl){
      lbl.textContent = mode === 'split' ? 'SQL: Split View' : mode === 'compact' ? 'SQL: Compact' : 'SQL: Expanded';
    }
  }
}
function initSqlMode(){
  var initial = readSqlMode();
  applySqlMode(initial);
  var b = document.getElementById('sqlmode');
  if (b){
    b.addEventListener('click', function(){
      var cur = readSqlMode();
      var next = cur === 'open' ? 'split' : cur === 'split' ? 'compact' : 'open';
      try { localStorage.setItem(SQL_MODE_KEY, next); } catch (e) {}
      applySqlMode(next);
      go(current, true);
    });
  }
}

var THEME_KEY = 'cdp-explorer-theme';
function readTheme(){
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}
function applyTheme(t){
  document.body.classList.toggle('dark', t === 'dark');
  var b = document.getElementById('theme');
  if (b){
    var lbl = b.querySelector('span');
    if (lbl) lbl.textContent = t === 'dark' ? 'Light' : 'Dark';
    b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
    b.title = t === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme';
  }
}
function initTheme(){
  applyTheme(readTheme() === 'dark' ? 'dark' : 'light');
  document.getElementById('theme').addEventListener('click', function(){
    var next = document.body.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage disabled */ }
  });
}

function initKeys(){
  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target || {};
    var tag = (t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(current < 0 ? 0 : current + 1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); go(current <= 0 ? -1 : current - 1); }
    else if (e.key === 'Home'){ e.preventDefault(); go(-1); }
    else if (e.key === 'End'){ e.preventDefault(); go(STAGES.length - 1); }
  });
}

function initChips(){
  var c = document.getElementById('chips');
  var bits = [DATA.project + '.' + DATA.dataset];
  if (DATA.location) bits.push(DATA.location);
  var corpus = DATA.corpus || {};
  if (corpus.records) bits.push(fmt(corpus.records) + ' records');
  if (corpus.people) bits.push(fmt(corpus.people) + ' people');
  bits.forEach(function(b){ c.appendChild(el('span', 'chip', b)); });
}

function routeFromHash(){
  var h = (location.hash || '').replace(/^#/, '').trim();
  if (!h || h === 'overview') return -1;
  if (h === 'cases' || h === 'hero') return -2;
  if (h === 'scenarios' || h === 'day2') return -3;
  for (var i = 0; i < STAGES.length; i++){
    if (STAGES[i].id === h || STAGES[i].num === h || ('stage=' + STAGES[i].id) === h){
      return i;
    }
  }
  return -1;
}

function boot(){
  initTheme();
  initSqlMode();
  initChips();
  buildNav();
  buildRail();
  initKeys();
  window.addEventListener('hashchange', function(){ go(routeFromHash(), true); });
  go(routeFromHash(), true);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
