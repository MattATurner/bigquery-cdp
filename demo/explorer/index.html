_extraction_audit","kind":"view","rows":0}],"inputs":[{"object":"ext_call_manifest","rows":0,"bytes":0,"modified":"2026-09-15 09:55:28.271+00","dataset":"cdp","kind":"external"},{"object":"ext_pos_transactions","rows":0,"bytes":0,"modified":"2026-09-15 09:55:25.341+00","dataset":"cdp","kind":"external"},{"object":"ext_support_tickets","rows":0,"bytes":0,"modified":"2026-09-15 09:55:26.176+00","dataset":"cdp","kind":"external"},{"object":"ext_third_party_enrich","rows":0,"bytes":0,"modified":"2026-09-15 09:55:26.955+00","dataset":"cdp","kind":"external"},{"object":"obj_call_transcripts","rows":0,"bytes":0,"modified":"2026-09-15 09:55:27.713+00","dataset":"cdp","kind":"external"},{"object":"ref_source_trust","rows":7,"bytes":476,"modified":"2026-09-15 09:55:33.650+00","dataset":"cdp","kind":"table"},{"object":"src_crm_customers","rows":4155,"bytes":593271,"modified":"2026-09-15 09:55:18.637+00","dataset":"cdp","kind":"table"},{"object":"src_ecom_accounts","rows":3752,"bytes":330379,"modified":"2026-09-15 09:55:20.353+00","dataset":"cdp","kind":"table"},{"object":"src_loyalty_members","rows":3248,"bytes":367269,"modified":"2026-09-15 09:55:22.217+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"},{"object":"stg_call_entities","rows":442,"bytes":95985,"modified":"2026-09-15 09:58:12.738+00","dataset":"cdp","kind":"table"},{"object":"stg_support_entities","rows":968,"bytes":450060,"modified":"2026-09-15 10:01:08.431+00","dataset":"cdp","kind":"table"},{"object":"v_extraction_audit","rows":0,"bytes":0,"modified":"2026-09-15 10:01:16.472+00","dataset":"cdp","kind":"view"},{"object":"v_source_profile","rows":0,"bytes":0,"modified":"2026-09-15 10:01:15.647+00","dataset":"cdp","kind":"view"}]}},{"id":"30_embed","num":"30","title":"Embed","summary":"Generates an identity vector per record via a generated column. Embeddings are asynchronous by necessity, so run.sh waits for them before continuing.","sql":"-- =====================================================================\n-- 30 \u00b7 Embed and index\n--\n-- One text column, `match_key`, becomes two retrieval surfaces:\n--\n--   semantic \u00b7 an embedding, for \"Jon Smyth\" \u2248 \"Jonathan Smith\"\n--   lexical  \u00b7 BM25 over the same string, for \"ACC-48213\" = \"ACC-48213\"\n--\n-- Neither is sufficient alone, and the demo proves it in stage 50. An\n-- embedding will never represent an account number usefully; BM25 will\n-- never recognise a nickname. The whole argument for hybrid search rests\n-- on that asymmetry.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 30a \u00b7 Autonomous embedding generation\n--\n-- The embedding is a GENERATED ALWAYS column. There is no embedding job,\n-- no orchestration, no drift between the text and its vector: change\n-- match_key and BigQuery regenerates the vector itself. That is the\n-- single biggest operational difference from a hand-rolled pipeline, and\n-- it is worth pausing on in the room.\n--\n-- NOTE ON asynchronous:\n--   asynchronous = TRUE is MANDATORY, not a preference. BigQuery rejects\n--   a synchronous generated embedding column outright:\n--     \"Generated embedding column requires asynchronous option to be true\"\n--\n--   An earlier draft of this file set it to FALSE deliberately, reasoning\n--   that run.sh runs stages in sequence and stage 40 needs the vectors, so\n--   a background job would be raced with no SLEEP available in SQL. The\n--   reasoning was sound; the option it depended on does not exist.\n--\n--   So the race is real and has to be handled rather than designed away.\n--   The vectors are populated by a background job that is still running\n--   when this stage returns, and everything that consumes them now lives\n--   in stage 35. run.sh polls v_embedding_health between the two and will\n--   not continue until every row is embedded.\n--\n--   This matters most for party_vectors in stage 35: it is a CTAS with\n--   WHERE match_embedding.result IS NOT NULL, so running it early yields\n--   an EMPTY table and no error at all.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.party_search`\n(\n  record_id         STRING NOT NULL,\n  source_system     STRING,\n  source_trust      INT64,\n  match_key         STRING,\n  name_norm         STRING,\n  forename_norm     STRING,\n  surname_norm      STRING,\n  address_norm      STRING,\n  postcode_norm     STRING,\n  postcode_out      STRING,\n  email_norm        STRING,\n  phone_e164        STRING,\n  dob               DATE,\n  account_number    STRING,\n  identity_strength INT64,\n  blocking_keys     ARRAY<STRING>,\n\n  match_embedding   STRUCT<result ARRAY<FLOAT64>, status STRING>\n    GENERATED ALWAYS AS (\n      AI.EMBED(\n        match_key,\n        connection_id => '${CDP_CONNECTION_PATH}',\n        endpoint      => '${CDP_EMBEDDING_ENDPOINT}'\n      )\n    ) STORED OPTIONS (asynchronous = TRUE)\n)\nCLUSTER BY postcode_out, surname_norm\nOPTIONS (\n  description = 'Search surface for entity resolution. match_embedding is maintained by '\n             || 'BigQuery: there is no embedding pipeline to run or repair.'\n);\n\nINSERT INTO `${CDP_PROJECT}.${CDP_DS}.party_search`\n(\n  record_id, source_system, source_trust, match_key, name_norm, forename_norm,\n  surname_norm, address_norm, postcode_norm, postcode_out, email_norm,\n  phone_e164, dob, account_number, identity_strength, blocking_keys\n)\nSELECT\n  record_id, source_system, source_trust, match_key, name_norm, forename_norm,\n  surname_norm, address_norm, postcode_norm, postcode_out, email_norm,\n  phone_e164, dob, account_number, identity_strength, blocking_keys\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n-- A record with no identity text at all cannot be matched and would only\n-- pollute the vector space. Excluded here rather than filtered later, so\n-- the count difference is visible.\nWHERE match_key IS NOT NULL AND match_key != '';\n\n\n-- ---------------------------------------------------------------------\n-- 30b \u00b7 Did the embeddings actually land?\n--\n-- The status field on the generated column is the honest answer. Quota\n-- pressure produces partial failures that are easy to miss, and a silently\n-- unembedded record is a silently unmatched customer.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_embedding_health` AS\nSELECT\n  source_system,\n  COUNT(*)                                                        AS records,\n  COUNTIF(match_embedding.result IS NOT NULL)                     AS embedded,\n  COUNTIF(match_embedding.result IS NULL)                         AS missing,\n  COUNTIF(IFNULL(match_embedding.status, '') != '')               AS errored,\n  ANY_VALUE(NULLIF(match_embedding.status, ''))                   AS sample_error,\n  ANY_VALUE(ARRAY_LENGTH(match_embedding.result))                 AS dimensions\nFROM `${CDP_PROJECT}.${CDP_DS}.party_search`\nGROUP BY source_system\nORDER BY missing DESC, source_system;\n","sql_lines":116,"results":[{"view":"v_embedding_health","columns":["dimensions","embedded","errored","missing","records","sample_error","source_system"],"rows":[{"dimensions":"3072","embedded":"442","errored":"0","missing":"0","records":"442","sample_error":null,"source_system":"CALL"},{"dimensions":"3072","embedded":"4155","errored":"0","missing":"0","records":"4155","sample_error":null,"source_system":"CRM"},{"dimensions":"3072","embedded":"3752","errored":"0","missing":"0","records":"3752","sample_error":null,"source_system":"ECOM"},{"dimensions":"3072","embedded":"1842","errored":"0","missing":"0","records":"1842","sample_error":null,"source_system":"ENRICH"},{"dimensions":"3072","embedded":"3248","errored":"0","missing":"0","records":"3248","sample_error":null,"source_system":"LOYALTY"},{"dimensions":"3072","embedded":"5593","errored":"0","missing":"0","records":"5593","sample_error":null,"source_system":"POS"},{"dimensions":"3072","embedded":"968","errored":"0","missing":"0","records":"968","sample_error":null,"source_system":"SUPPORT"}],"row_count":7}],"run":{"statements":3,"steps":[{"op":"create table","object":"party_search","kind":"table","rows":20000},{"op":"insert into","object":"party_search","kind":"table","rows":20000},{"op":"create view","object":"v_embedding_health","kind":"view","rows":0}],"inputs":[{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"},{"object":"v_embedding_health","rows":0,"bytes":0,"modified":"2026-09-15 10:12:34.973+00","dataset":"cdp","kind":"view"}]}},{"id":"35_embed_finalise","num":"35","title":"Index","summary":"Builds the hybrid TREE_AH index for live lookup and a separate IVF index for the bulk all-pairs join.","sql":"-- =====================================================================\n-- 35 \u00b7 Embedding finalisation \u2014 indexes, bulk vector surface, lookups\n--\n-- WHY THIS IS A SEPARATE STAGE FROM 30\n--\n-- BigQuery requires a GENERATED ALWAYS embedding column to be declared\n-- OPTIONS(asynchronous = TRUE) \u2014 a synchronous generated embedding column\n-- is rejected outright (\"Generated embedding column requires asynchronous\n-- option to be true\"). So the vectors in party_search are populated by a\n-- background job that is still running when stage 30 returns.\n--\n-- Everything below needs those vectors to exist:\n--   30c  the TREE_AH hybrid index is built over match_embedding\n--   30d  party_vectors is a CTAS with WHERE match_embedding.result IS NOT\n--        NULL \u2014 run it too early and it silently yields an EMPTY table,\n--        no error, and every downstream stage then succeeds with the\n--        wrong numbers\n--\n-- run.sh therefore polls v_embedding_health between stage 30 and this one\n-- and refuses to continue until every row is embedded. SQL has no SLEEP,\n-- which is why the wait lives in bash rather than here.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 30c \u00b7 Hybrid index \u2014 for live, single-query lookup\n--\n-- TREE_AH with lexical_search_columns is what makes AI.SEARCH run in\n-- HYBRID mode: BM25 and vector retrieval over the same index, fused with\n-- reciprocal rank fusion. This is the path that carries the published\n-- slot-efficiency gain for single-query search, and it is the path a\n-- customer-facing agent would call.\n--\n-- Vector index creation requires at least 5,000 rows in the base table.\n-- With the default corpus (20,000 records) that is comfortably met; a\n-- smaller --records value will cause this statement to fail, which is why\n-- the README pins a minimum.\n-- ---------------------------------------------------------------------\n\nCREATE VECTOR INDEX IF NOT EXISTS idx_party_hybrid\nON `${CDP_PROJECT}.${CDP_DS}.party_search`(match_embedding)\n-- match_key must appear here as well as in lexical_search_columns:\n-- BigQuery rejects the index otherwise (\"Lexical search column match_key\n-- must be in the list of stored columns\"). The BM25 leg reads it from the\n-- index, so it has to be stored alongside the vector.\nSTORING (record_id, source_system, source_trust, match_key, name_norm, postcode_norm,\n         email_norm, phone_e164, dob, account_number, identity_strength)\nOPTIONS (\n  index_type             = 'TREE_AH',\n  distance_type          = 'COSINE',\n  lexical_search_columns = ['match_key']\n);\n\n\n-- ---------------------------------------------------------------------\n-- 30d \u00b7 Bulk vector surface\n--\n-- A second, plain ARRAY<FLOAT64> copy of the same vectors.\n--\n-- Why duplicate: stage 40 resolves the whole corpus against itself using\n-- VECTOR_SEARCH with a query *table*, which is the batch path. Stage 50's\n-- live demo uses AI.SEARCH with a single query string, which is the\n-- interactive path. Keeping them on separate, purpose-built indexes means\n-- neither is compromised to suit the other, and the demo can show both\n-- without caveats.\n--\n-- No extra embedding cost: the vectors are copied, not regenerated.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.party_vectors`\nCLUSTER BY postcode_out\nAS\nSELECT\n  record_id,\n  source_system,\n  source_trust,\n  match_key,\n  name_norm,\n  surname_norm,\n  postcode_out,\n  postcode_norm,\n  email_norm,\n  phone_e164,\n  dob,\n  account_number,\n  identity_strength,\n  match_embedding.result AS embedding\nFROM `${CDP_PROJECT}.${CDP_DS}.party_search`\nWHERE match_embedding.result IS NOT NULL;\n\nCREATE VECTOR INDEX IF NOT EXISTS idx_party_vectors\nON `${CDP_PROJECT}.${CDP_DS}.party_vectors`(embedding)\nSTORING (record_id, source_system, source_trust, name_norm, postcode_out,\n         email_norm, phone_e164, dob, account_number, identity_strength)\nOPTIONS (\n  index_type    = 'IVF',\n  distance_type = 'COSINE',\n  ivf_options   = '{\"num_lists\": 200}'\n);\n\n\n-- ---------------------------------------------------------------------\n-- 30e \u00b7 Search index for the lexical leg\n--\n-- BM25 over match_key. The account-number case is the one to watch:\n-- ACC-48213 is a single high-IDF token that BM25 scores decisively and an\n-- embedding model treats as noise.\n-- ---------------------------------------------------------------------\n\nCREATE SEARCH INDEX IF NOT EXISTS idx_party_text\nON `${CDP_PROJECT}.${CDP_DS}.party_search`(match_key)\nOPTIONS (analyzer = 'LOG_ANALYZER');\n\n\n-- ---------------------------------------------------------------------\n-- 30f \u00b7 Live lookup, two ways\n--\n-- These two table functions are the side-by-side that makes the hybrid\n-- argument concrete. Same corpus, same query, one retrieval mode\n-- different. Run both against an account number and the difference is\n-- not subtle.\n--\n--   SELECT * FROM cdp.tf_lookup_hybrid('ACC-48213');\n--   SELECT * FROM cdp.tf_lookup_vector('ACC-48213');\n--\n-- top_k is fixed at a literal because AI.SEARCH requires it; parameterise\n-- by editing the function if you need a different depth.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_lookup_hybrid`(probe STRING)\nAS (\n  SELECT 'HYBRID' AS retrieval_mode, s.base.* EXCEPT (match_embedding), s.distance\n  FROM AI.SEARCH(\n         TABLE `${CDP_PROJECT}.${CDP_DS}.party_search`,\n         'match_key',\n         probe,\n         top_k => 10,\n         mode  => 'HYBRID'\n       ) AS s\n);\n\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_lookup_vector`(probe STRING)\nAS (\n  SELECT 'VECTOR' AS retrieval_mode, s.base.* EXCEPT (match_embedding), s.distance\n  FROM AI.SEARCH(\n         TABLE `${CDP_PROJECT}.${CDP_DS}.party_search`,\n         'match_key',\n         probe,\n         top_k => 10,\n         mode  => 'VECTOR'\n       ) AS s\n);\n","sql_lines":152,"results":[],"run":{"statements":6,"steps":[{"op":"create vector index","object":"idx_party_hybrid","kind":"index","rows":null},{"op":"create table","object":"party_vectors","kind":"table","rows":20000},{"op":"create vector index","object":"idx_party_vectors","kind":"index","rows":null},{"op":"create search index","object":"idx_party_text","kind":"index","rows":null},{"op":"create table function","object":"tf_lookup_hybrid","kind":"routine","rows":null},{"op":"create table function","object":"tf_lookup_vector","kind":"routine","rows":null}],"inputs":[{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"party_vectors","rows":20000,"bytes":494670703,"modified":"2026-09-15 10:15:16.648+00","dataset":"cdp","kind":"table"}]}},{"id":"40_block","num":"40","title":"Block + Bipartite Graph","summary":"Cuts the comparison space with blocking keys and builds the Bipartite Profile-Identifier Graph with closed-form IDF rarity weights.","sql":"-- =====================================================================\n-- 40 \u00b7 Block\n--\n-- 20,000 records is 199,990,000 possible pairs. Comparing them all is\n-- both unaffordable and unnecessary: the overwhelming majority of pairs\n-- share nothing at all.\n--\n-- Blocking is the cheap, deterministic first pass that throws most of\n-- them away. It is also the stage where recall is most often silently\n-- lost \u2014 anything blocking misses, no amount of clever scoring\n-- downstream can recover. So this stage does two things: it generates the\n-- pairs, and it reports honestly on what it discarded.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 40a \u00b7 Block sizes\n--\n-- A block is every record sharing one key. Most are tiny. A few are\n-- pathological \u2014 a dense urban postcode district, or a null-ish key that\n-- slipped through normalisation \u2014 and those are what turn a blocking\n-- stage into a runaway self-join.\n--\n-- Oversized blocks are dropped rather than sampled, and the drop is\n-- recorded. Silently truncating a block is how you end up unable to\n-- explain why one customer never got resolved.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.block_stats`\nAS\nWITH exploded AS (\n  SELECT record_id, key\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`, UNNEST(blocking_keys) AS key\n)\nSELECT\n  key,\n  SPLIT(key, ':')[OFFSET(0)]                       AS key_type,\n  COUNT(*)                                         AS members,\n  COUNT(*) * (COUNT(*) - 1) / 2                    AS pairs_implied,\n  -- A block of N members implies N(N-1)/2 comparisons, so this grows\n  -- quadratically and a single junk key can dominate the whole run.\n  -- Past the threshold the key is not discriminating anything and is\n  -- almost certainly a data artefact (a default postcode, a placeholder\n  -- phone number, an unparsed address).\n  --\n  -- Parameterised because it MUST move with corpus size: 500 was right at\n  -- 20k records, and leaving it there at 200k would discard genuine\n  -- signal \u2014 a real postcode in a dense urban area legitimately holds\n  -- thousands of people once the corpus is national.\n  --\n  -- Dropped keys are recorded here rather than filtered silently, so\n  -- v_blocking_by_key can show exactly what recall was traded away.\n  COUNT(*) > ${CDP_MAX_BLOCK_SIZE}                 AS oversized\nFROM exploded\nGROUP BY key\nHAVING COUNT(*) > 1;\n\n\n-- ---------------------------------------------------------------------\n-- 40b \u00b7 Candidate pairs from deterministic keys\n--\n-- Each key type carries a different weight, and the weights are ordinal\n-- rather than calibrated \u2014 they order the evidence, they do not claim to\n-- measure it:\n--\n--   AC  account number      100  a shared loyalty account is near-proof\n--   EM  email               90   strong, but couples do share addresses\n--   PH  phone               80   strong, but landlines are household-level\n--   ND  surname + DOB       70   strong together, weak apart\n--   SX  soundex + outward   30   a hint, nothing more\n--   PC  postcode district   10   a neighbourhood, not a person\n--\n-- Note what is deliberately absent: no pair is *accepted* here. This\n-- stage only decides what is worth looking at.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_blocked`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH exploded AS (\n  SELECT p.record_id, key\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search` AS p, UNNEST(p.blocking_keys) AS key\n),\nusable AS (\n  SELECT e.record_id, e.key\n  FROM exploded AS e\n  JOIN `${CDP_PROJECT}.${CDP_DS}.block_stats` AS b USING (key)\n  WHERE NOT b.oversized\n),\npaired AS (\n  SELECT\n    a.record_id AS record_id_a,\n    b.record_id AS record_id_b,\n    a.key\n  FROM usable AS a\n  JOIN usable AS b\n    ON a.key = b.key\n   -- Ordering the pair once removes the mirror image and self-comparison\n   -- in a single predicate.\n   AND a.record_id < b.record_id\n)\nSELECT\n  record_id_a,\n  record_id_b,\n  ARRAY_AGG(DISTINCT SPLIT(key, ':')[OFFSET(0)] ORDER BY SPLIT(key, ':')[OFFSET(0)]) AS key_types,\n  ARRAY_AGG(key ORDER BY key)                                                        AS matched_keys,\n  MAX(CASE SPLIT(key, ':')[OFFSET(0)]\n        WHEN 'AC' THEN 100\n        WHEN 'EM' THEN 90\n        WHEN 'PH' THEN 80\n        WHEN 'ND' THEN 70\n        WHEN 'SX' THEN 30\n        WHEN 'PC' THEN 10\n        ELSE 0\n      END)                                                                           AS block_strength,\n  COUNT(DISTINCT key)                                                                AS keys_shared\nFROM paired\nGROUP BY record_id_a, record_id_b;\n\n\n-- ---------------------------------------------------------------------\n-- 40c \u00b7 The reduction, stated plainly\n--\n-- This is the number to put on screen. Not because the ratio is\n-- impressive in itself \u2014 any blocking scheme produces a large one \u2014 but\n-- because it sets up the honest question that follows: what did we lose?\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_blocking_funnel` AS\nWITH n AS (\n  SELECT COUNT(*) AS records FROM `${CDP_PROJECT}.${CDP_DS}.party_search`\n),\ndropped AS (\n  SELECT\n    IFNULL(SUM(IF(oversized, members, 0)), 0)        AS members_in_dropped_blocks,\n    IFNULL(SUM(IF(oversized, pairs_implied, 0)), 0)  AS pairs_in_dropped_blocks,\n    COUNTIF(oversized)                               AS blocks_dropped\n  FROM `${CDP_PROJECT}.${CDP_DS}.block_stats`\n),\nkept AS (\n  SELECT COUNT(*) AS candidate_pairs\n  FROM `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_blocked`\n)\nSELECT\n  n.records,\n  n.records * (n.records - 1) / 2                               AS pairs_brute_force,\n  kept.candidate_pairs,\n  ROUND(\n    100 * (1 - SAFE_DIVIDE(kept.candidate_pairs,\n                           n.records * (n.records - 1) / 2)), 4) AS pct_eliminated,\n  SAFE_DIVIDE(n.records * (n.records - 1) / 2, kept.candidate_pairs) AS reduction_factor,\n  dropped.blocks_dropped,\n  dropped.pairs_in_dropped_blocks,\n  -- Honest caveat: pairs that only ever co-occurred in an oversized block\n  -- are not in the candidate set. The semantic leg in stage 50 is the\n  -- safety net for exactly this, which is a large part of why it exists.\n  'Pairs lost to oversized blocks are recovered, if at all, by the semantic leg in stage 50.'\n    AS caveat\nFROM n, dropped, kept;\n\n\n-- ---------------------------------------------------------------------\n-- 40d \u00b7 Where the keys come from\n--\n-- Breaks the candidate set down by the strongest key that produced it.\n-- The interesting row is AC: a small number of pairs, carrying almost all\n-- of the certainty in the system, and every one of them invisible to a\n-- purely semantic approach.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_blocking_by_key` AS\nSELECT\n  CASE block_strength\n    WHEN 100 THEN 'AC \u00b7 shared account number'\n    WHEN  90 THEN 'EM \u00b7 shared email'\n    WHEN  80 THEN 'PH \u00b7 shared phone'\n    WHEN  70 THEN 'ND \u00b7 surname + date of birth'\n    WHEN  30 THEN 'SX \u00b7 soundex + outward postcode'\n    WHEN  10 THEN 'PC \u00b7 postcode district only'\n    ELSE          'unknown'\n  END                                    AS strongest_key,\n  block_strength,\n  COUNT(*)                               AS pairs,\n  ROUND(AVG(keys_shared), 2)             AS avg_keys_shared\nFROM `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_blocked`\nGROUP BY strongest_key, block_strength\nORDER BY block_strength DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 40e \u00b7 Bipartite identifier graph \u2014 membership & temporal history\n--\n-- Models each source record's identifiers as edges in a bipartite graph\n-- (SourceRecord / Profile <-> Identifier), matching the WesID_nodes and\n-- WesID_edges pattern:\n--\n--   \u00b7 Personal & household identifiers extracted from party_records\n--     (email, phone, loyalty_account, street address)\n--   \u00b7 Promiscuous operational hubs (shared call-centre callback numbers,\n--     in-store checkout kiosk emails, and shared POS terminal device IDs)\n--     that attach to hundreds of unrelated customer records and cause\n--     naive Connected Components to collapse into a \"hairball\"\n--   \u00b7 Temporal supersession history (has_identifier_history) tracking\n--     when a recycled mobile phone or email moved from one customer to\n--     another (transit_to).\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.has_identifier`\nCLUSTER BY record_id, identifier_type\nAS\nWITH real_identifiers AS (\n  SELECT\n    record_id,\n    CONCAT('EM:', email_norm)   AS identifier_id,\n    'email'                     AS identifier_type,\n    source_system = 'CRM'       AS is_anchor,\n    source_system               AS sources,\n    source_system               AS first_seen_in,\n    source_ts                   AS from_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n  WHERE email_norm IS NOT NULL AND email_norm != ''\n\n  UNION ALL\n\n  SELECT\n    record_id,\n    CONCAT('PH:', phone_e164)   AS identifier_id,\n    'phone'                     AS identifier_type,\n    source_system = 'LOYALTY'   AS is_anchor,\n    source_system               AS sources,\n    source_system               AS first_seen_in,\n    source_ts                   AS from_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n  WHERE phone_e164 IS NOT NULL AND phone_e164 != ''\n\n  UNION ALL\n\n  SELECT\n    record_id,\n    CONCAT('AC:', account_number) AS identifier_id,\n    'loyalty_account'             AS identifier_type,\n    TRUE                          AS is_anchor,\n    source_system                 AS sources,\n    source_system                 AS first_seen_in,\n    source_ts                     AS from_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n  WHERE account_number IS NOT NULL AND account_number != ''\n),\n-- Deterministic operational hubs: call-centre fallback numbers, in-store\n-- kiosk checkout emails, and shared store tablet device IDs. A small\n-- fraction of records touch two hubs, chaining them into one giant\n-- component under naive Connected Components.\nhub_identifiers AS (\n  SELECT\n    record_id,\n    CASE MOD(ABS(FARM_FINGERPRINT(CONCAT(record_id, '|hub1'))), 6)\n      WHEN 0 THEN 'PH:+61290001111'\n      WHEN 1 THEN 'PH:+61390002222'\n      WHEN 2 THEN 'EM:kiosk.syd@store-checkout.com.au'\n      WHEN 3 THEN 'EM:kiosk.mel@store-checkout.com.au'\n      WHEN 4 THEN 'EM:service.desk@contact-centre.com.au'\n      ELSE        'DV:KIOSK-TERMINAL-AU-01'\n    END                         AS identifier_id,\n    CASE MOD(ABS(FARM_FINGERPRINT(CONCAT(record_id, '|hub1'))), 6)\n      WHEN 0 THEN 'phone'\n      WHEN 1 THEN 'phone'\n      WHEN 2 THEN 'email'\n      WHEN 3 THEN 'email'\n      WHEN 4 THEN 'email'\n      ELSE        'device_id'\n    END                         AS identifier_type,\n    FALSE                       AS is_anchor,\n    source_system               AS sources,\n    source_system               AS first_seen_in,\n    source_ts                   AS from_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n  WHERE MOD(ABS(FARM_FINGERPRINT(CONCAT(record_id, '|hub_gate'))), 100) < 16\n\n  UNION ALL\n\n  -- Bridge records that also touched a second shared kiosk/call-centre hub\n  SELECT\n    record_id,\n    'PH:+61890003333'           AS identifier_id,\n    'phone'                     AS identifier_type,\n    FALSE                       AS is_anchor,\n    source_system               AS sources,\n    source_system               AS first_seen_in,\n    source_ts                   AS from_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n  WHERE MOD(ABS(FARM_FINGERPRINT(CONCAT(record_id, '|hub_gate'))), 100) < 2\n)\nSELECT * FROM real_identifiers\nUNION ALL\nSELECT * FROM hub_identifiers;\n\n\n-- Full temporal history including closed/recycled phone links (HAD_IDENTIFIER)\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.has_identifier_history`\nCLUSTER BY record_id, identifier_id\nAS\nWITH current_rows AS (\n  SELECT\n    FARM_FINGERPRINT(CONCAT(record_id, '|', identifier_id, '|current')) AS row_id,\n    record_id,\n    identifier_id,\n    identifier_type,\n    is_anchor,\n    from_ts,\n    CAST(NULL AS TIMESTAMP) AS to_ts,\n    CAST(NULL AS STRING)    AS transit_to,\n    TRUE                    AS is_current,\n    FALSE                   AS is_deleted,\n    sources\n  FROM `${CDP_PROJECT}.${CDP_DS}.has_identifier`\n),\n-- Historical phone recycling events: where two records share a phone but\n-- have conflicting dates of birth, record the earlier holder as a superseded\n-- historical link with transit_to pointing to the later holder.\nrecycled AS (\n  SELECT\n    FARM_FINGERPRINT(CONCAT(a.record_id, '|PH:', a.phone_e164, '|hist')) AS row_id,\n    a.record_id,\n    CONCAT('PH:', a.phone_e164) AS identifier_id,\n    'phone'                     AS identifier_type,\n    FALSE                       AS is_anchor,\n    a.source_ts                 AS from_ts,\n    b.source_ts                 AS to_ts,\n    b.record_id                 AS transit_to,\n    FALSE                       AS is_current,\n    FALSE                       AS is_deleted,\n    a.source_system             AS sources\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS b\n    ON a.phone_e164 = b.phone_e164\n   AND a.record_id != b.record_id\n   AND a.dob IS NOT NULL AND b.dob IS NOT NULL AND a.dob != b.dob\n   AND IFNULL(a.source_ts, TIMESTAMP '2020-01-01') < IFNULL(b.source_ts, TIMESTAMP '2025-01-01')\n  WHERE a.phone_e164 IS NOT NULL\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY a.record_id, a.phone_e164 ORDER BY b.source_ts) = 1\n)\nSELECT * FROM current_rows\nUNION ALL\nSELECT * FROM recycled;\n\n\n-- ---------------------------------------------------------------------\n-- 40f \u00b7 Identifier nodes with degree, IDF rarity weight, and hub flag\n--\n-- Degree is a property of the Identifier node itself. Computing it once\n-- here makes both the SQL rarity rule and the 2-hop neighbourhood\n-- features a simple lookup rather than a repeated self-join.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.identifier`\nCLUSTER BY identifier_type, identifier_id\nAS\nWITH total AS (\n  SELECT GREATEST(COUNT(*), 1) AS n_profiles\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records`\n),\ncur AS (\n  SELECT\n    identifier_id,\n    ANY_VALUE(identifier_type)                   AS identifier_type,\n    COUNT(DISTINCT record_id)                    AS degree,\n    COUNTIF(is_anchor)                           AS n_anchor_links,\n    STRING_AGG(DISTINCT sources, '|' ORDER BY sources) AS sources,\n    MIN(from_ts)                                 AS first_seen_ts,\n    MAX(from_ts)                                 AS last_seen_ts\n  FROM `${CDP_PROJECT}.${CDP_DS}.has_identifier`\n  GROUP BY identifier_id\n),\nhist AS (\n  SELECT\n    identifier_id,\n    COUNT(DISTINCT record_id)                    AS degree_all_time\n  FROM `${CDP_PROJECT}.${CDP_DS}.has_identifier_history`\n  GROUP BY identifier_id\n)\nSELECT\n  c.identifier_id,\n  c.identifier_type,\n  c.degree,\n  IFNULL(h.degree_all_time, c.degree)            AS degree_all_time,\n  c.n_anchor_links,\n  -- Inverse document frequency: rare identifiers carry high weight (~9.9\n  -- for a pair); promiscuous hubs carry low weight and are flagged.\n  ROUND(LN(SAFE_DIVIDE(t.n_profiles, GREATEST(c.degree, 1))), 4) AS idf_weight,\n  c.degree > 25                                  AS is_promiscuous,\n  c.sources,\n  c.first_seen_ts,\n  c.last_seen_ts\nFROM cur AS c\nLEFT JOIN hist AS h USING (identifier_id)\nCROSS JOIN total AS t;\n\n\n-- ---------------------------------------------------------------------\n-- 40g \u00b7 Co-observed identifier links (linked_identifier)\n--\n-- Identifiers observed together on the same customer record (the\n-- WesID_edges pattern). Stored as unordered non-promiscuous pairs.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.linked_identifier`\nCLUSTER BY lhs_identifier_id, rhs_identifier_id\nAS\nSELECT\n  a.identifier_id            AS lhs_identifier_id,\n  b.identifier_id            AS rhs_identifier_id,\n  ANY_VALUE(a.identifier_type) AS lhs_type,\n  ANY_VALUE(b.identifier_type) AS rhs_type,\n  ANY_VALUE(a.record_id)     AS observed_on_record,\n  ANY_VALUE(a.sources)       AS edge_source,\n  MIN(a.from_ts)             AS from_ts\nFROM `${CDP_PROJECT}.${CDP_DS}.has_identifier` AS a\nJOIN `${CDP_PROJECT}.${CDP_DS}.has_identifier` AS b\n  ON a.record_id = b.record_id\n AND a.identifier_id < b.identifier_id\nJOIN `${CDP_PROJECT}.${CDP_DS}.identifier` AS ia ON ia.identifier_id = a.identifier_id\nJOIN `${CDP_PROJECT}.${CDP_DS}.identifier` AS ib ON ib.identifier_id = b.identifier_id\nWHERE NOT ia.is_promiscuous AND NOT ib.is_promiscuous\nGROUP BY 1, 2;\n\n\n-- ---------------------------------------------------------------------\n-- 40h \u00b7 IDF-weighted bipartite projection & 2-hop neighbourhood summary\n--\n-- Projects Profile -> Identifier -> Profile (2 hops) and computes:\n--   1. The shared-identifier rarity weight (promiscuous hubs weight 0)\n--   2. What each profile holds in its 1-hop neighbourhood that it does\n--      NOT share with the other profile (unshared emails, phones, and\n--      loyalty accounts) \u2014 the structural signal that separates a\n--      two-person household from a single person's sparse duplicate.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.profile_projection`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH shared AS (\n  SELECT\n    a.record_id      AS record_id_a,\n    b.record_id      AS record_id_b,\n    a.identifier_id,\n    i.identifier_type,\n    i.degree,\n    i.is_promiscuous,\n    IF(i.is_promiscuous, 0.0, i.idf_weight) AS effective_weight\n  FROM `${CDP_PROJECT}.${CDP_DS}.has_identifier` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.has_identifier` AS b\n    ON a.identifier_id = b.identifier_id\n   AND a.record_id < b.record_id\n  JOIN `${CDP_PROJECT}.${CDP_DS}.identifier` AS i\n    ON i.identifier_id = a.identifier_id\n  -- Cap fan-out expansion on massive hubs: we sample hub-only pairs up to\n  -- a rank cap for graph diagnostics while never expanding 500k+ hub pairs.\n  WHERE NOT i.is_promiscuous\n     OR MOD(ABS(FARM_FINGERPRINT(CONCAT(a.record_id, '|', b.record_id))), 25) = 0\n),\nagg AS (\n  SELECT\n    record_id_a,\n    record_id_b,\n    ROUND(SUM(effective_weight), 4)                             AS weight,\n    COUNT(*)                                                    AS n_shared,\n    COUNTIF(NOT is_promiscuous)                                 AS n_shared_non_hub,\n    STRING_AGG(identifier_id,   '|' ORDER BY identifier_id)     AS shared_identifiers,\n    STRING_AGG(identifier_type, '|' ORDER BY identifier_id)     AS shared_types,\n    LOGICAL_OR(is_promiscuous)                                  AS via_hub,\n    LOGICAL_AND(is_promiscuous)                                 AS hub_only,\n    MIN(degree)                                                 AS min_shared_degree\n  FROM shared\n  GROUP BY record_id_a, record_id_b\n)\nSELECT\n  g.*,\n  -- 2-hop neighbourhood check: does each profile hold its own distinct,\n  -- unshared identifier of the same type? Two inboxes or two personal\n  -- mobiles alongside a shared phone/address is the signature of a\n  -- two-person household rather than a single person's duplicate record.\n  (pa.email_norm IS NOT NULL AND pb.email_norm IS NOT NULL\n   AND pa.email_norm != pb.email_norm)                          AS unshared_email_both,\n  (pa.phone_e164 IS NOT NULL AND pb.phone_e164 IS NOT NULL\n   AND pa.phone_e164 != pb.phone_e164)                          AS unshared_phone_both,\n  (pa.account_number IS NOT NULL AND pb.account_number IS NOT NULL\n   AND pa.account_number != pb.account_number)                  AS unshared_acct_both\nFROM agg AS g\nJOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS pa ON pa.record_id = g.record_id_a\nJOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS pb ON pb.record_id = g.record_id_b;\n\n","sql_lines":491,"results":[{"view":"v_blocking_funnel","columns":["blocks_dropped","candidate_pairs","caveat","pairs_brute_force","pairs_in_dropped_blocks","pct_eliminated","records","reduction_factor"],"rows":[{"blocks_dropped":"0","candidate_pairs":"10529763","caveat":"Pairs lost to oversized blocks are recovered, if at all, by the semantic leg in stage 50.","pairs_brute_force":"1.9999E8","pairs_in_dropped_blocks":"0.0","pct_eliminated":"94.7349","records":"20000","reduction_factor":"18.992830133023887"}],"row_count":1}],"run":{"statements":9,"steps":[{"op":"create table","object":"block_stats","kind":"table","rows":11124},{"op":"create table","object":"candidate_pairs_blocked","kind":"table","rows":10529763},{"op":"create view","object":"v_blocking_funnel","kind":"view","rows":0},{"op":"create view","object":"v_blocking_by_key","kind":"view","rows":0},{"op":"create table","object":"has_identifier","kind":"table","rows":28906},{"op":"create table","object":"has_identifier_history","kind":"table","rows":28906},{"op":"create table","object":"identifier","kind":"table","rows":18724},{"op":"create table","object":"linked_identifier","kind":"table","rows":8726},{"op":"create table","object":"profile_projection","kind":"table","rows":44944}],"inputs":[{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"},{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"block_stats","rows":11124,"bytes":433920,"modified":"2026-09-15 10:15:47.495+00","dataset":"cdp","kind":"table"},{"object":"candidate_pairs_blocked","rows":10529763,"bytes":583100325,"modified":"2026-09-15 10:16:32.339+00","dataset":"cdp","kind":"table"},{"object":"has_identifier","rows":28906,"bytes":1940303,"modified":"2026-09-30 01:58:35.767+00","dataset":"cdp","kind":"table"},{"object":"has_identifier_history","rows":28906,"bytes":2038909,"modified":"2026-09-30 01:58:38.304+00","dataset":"cdp","kind":"table"},{"object":"identifier","rows":18724,"bytes":1638910,"modified":"2026-09-30 01:58:41.357+00","dataset":"cdp","kind":"table"},{"object":"linked_identifier","rows":8726,"bytes":763858,"modified":"2026-09-30 01:58:43.548+00","dataset":"cdp","kind":"table"},{"object":"profile_projection","rows":44944,"bytes":4539367,"modified":"2026-09-30 01:58:47.288+00","dataset":"cdp","kind":"table"},{"object":"v_blocking_by_key","rows":0,"bytes":0,"modified":"2026-09-15 10:16:34.505+00","dataset":"cdp","kind":"view"},{"object":"v_blocking_funnel","rows":0,"bytes":0,"modified":"2026-09-15 10:16:33.894+00","dataset":"cdp","kind":"view"}]}},{"id":"50_candidates","num":"50","title":"Candidates + 2-Hop Features","summary":"Runs both retrieval legs, fuses them with reciprocal rank fusion, computes 1-hop/2-hop SQL graph features, and tiers each pair: auto-match, grey zone, or reject.","sql":"-- =====================================================================\n-- 50 \u00b7 Candidates\n--\n-- Three retrieval legs, then one scoring pass.\n--\n--   lexical   \u00b7 deterministic keys from stage 40 \u2014 exact, cheap, brittle\n--   semantic  \u00b7 VECTOR_SEARCH over the embeddings \u2014 tolerant, fuzzy, blind\n--               to alphanumeric identifiers\n--   hybrid    \u00b7 reciprocal rank fusion of the two\n--\n-- The claim the deck makes is that neither leg alone is adequate. Stage\n-- 50e measures the overlap so the claim can be checked rather than\n-- asserted, and stage 95 scores each leg against ground truth.\n--\n-- Nothing here decides a merge. This stage decides what is worth the cost\n-- of deciding.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 50a \u00b7 Semantic retrieval\n--\n-- Every record is used as a probe against the whole corpus. top_k\n-- includes the record's own perfect self-match, so the effective depth is\n-- one less than configured.\n--\n-- COSINE because match_key strings vary wildly in length \u2014 a POS row is a\n-- handful of tokens, a CRM row is a paragraph \u2014 and magnitude would\n-- otherwise stand in for information content.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_semantic`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH knn AS (\n  SELECT\n    query.record_id AS probe_id,\n    base.record_id  AS match_id,\n    distance\n  FROM VECTOR_SEARCH(\n    TABLE `${CDP_PROJECT}.${CDP_DS}.party_vectors`, 'embedding',\n    (SELECT record_id, embedding FROM `${CDP_PROJECT}.${CDP_DS}.party_vectors`),\n    'embedding',\n    top_k         => ${CDP_TOPK},\n    distance_type => 'COSINE'\n  )\n  WHERE query.record_id != base.record_id\n)\nSELECT\n  LEAST(probe_id, match_id)    AS record_id_a,\n  GREATEST(probe_id, match_id) AS record_id_b,\n  -- A pair can be retrieved from both directions with slightly different\n  -- neighbour sets; keep the best observation of it.\n  MIN(distance)                AS distance,\n  1 - MIN(distance)            AS similarity,\n  -- Retrieved from both directions is a mild positive signal: the pair is\n  -- mutually near, not just near in one crowded neighbourhood.\n  COUNT(*) = 2                 AS mutual\nFROM knn\nGROUP BY record_id_a, record_id_b;\n\n\n-- ---------------------------------------------------------------------\n-- 50b \u00b7 Reciprocal rank fusion\n--\n-- RRF combines two ranked lists without needing their scores to be\n-- comparable \u2014 which matters, because a BM25 score and a cosine distance\n-- have no common unit and no stable way to normalise between corpora.\n--\n--   RRF(d) = \u03a3 over legs of  1 / (k + rank_leg(d))\n--\n-- k = 60 is the value from the original Cormack et al. paper and the de\n-- facto default. Its effect is to flatten the top of each list: with\n-- k = 60, ranks 1 and 2 differ by about 1.6%, so a document has to be\n-- consistently high across both legs to win, rather than spiking in one.\n-- That is precisely the property we want here \u2014 a pair that only one leg\n-- likes is exactly the pair a human should look at.\n--\n-- A pair missing from a leg contributes nothing from that leg, rather\n-- than a penalty. Absence is not evidence against.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH all_pairs AS (\n  SELECT record_id_a, record_id_b FROM `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_blocked`\n  UNION DISTINCT\n  SELECT record_id_a, record_id_b FROM `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_semantic`\n),\njoined AS (\n  SELECT\n    p.record_id_a,\n    p.record_id_b,\n    l.block_strength,\n    l.key_types,\n    l.matched_keys,\n    l.keys_shared,\n    s.similarity,\n    s.mutual,\n    -- Tested on a payload column, not a join key: with an outer join the\n    -- key is present on both sides by construction and would always look\n    -- matched.\n    l.block_strength IS NOT NULL AS found_lexical,\n    s.similarity     IS NOT NULL AS found_semantic\n  FROM all_pairs AS p\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_blocked` AS l\n    ON l.record_id_a = p.record_id_a AND l.record_id_b = p.record_id_b\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_semantic` AS s\n    ON s.record_id_a = p.record_id_a AND s.record_id_b = p.record_id_b\n),\n-- Ranks are computed per probe record over both directions of each pair,\n-- so that a record's neighbourhood rank is invariant to alphabetical ID prefix order.\ndirected_ranks AS (\n  SELECT\n    record_id_a, record_id_b,\n    IF(found_lexical,\n       RANK() OVER (PARTITION BY probe ORDER BY block_strength DESC, keys_shared DESC),\n       NULL) AS dir_rank_lexical,\n    IF(found_semantic,\n       RANK() OVER (PARTITION BY probe ORDER BY similarity DESC),\n       NULL) AS dir_rank_semantic\n  FROM (\n    SELECT record_id_a AS probe, record_id_a, record_id_b, found_lexical, found_semantic, block_strength, keys_shared, similarity FROM joined\n    UNION ALL\n    SELECT record_id_b AS probe, record_id_a, record_id_b, found_lexical, found_semantic, block_strength, keys_shared, similarity FROM joined\n  )\n),\npair_ranks AS (\n  SELECT\n    record_id_a, record_id_b,\n    MIN(dir_rank_lexical)  AS rank_lexical,\n    MIN(dir_rank_semantic) AS rank_semantic\n  FROM directed_ranks\n  GROUP BY record_id_a, record_id_b\n),\nranked AS (\n  SELECT\n    j.*,\n    pr.rank_lexical,\n    pr.rank_semantic\n  FROM joined AS j\n  JOIN pair_ranks AS pr USING (record_id_a, record_id_b)\n)\nSELECT\n  *,\n  IFNULL(SAFE_DIVIDE(1, 60 + rank_lexical),  0)\n    + IFNULL(SAFE_DIVIDE(1, 60 + rank_semantic), 0) AS rrf_score,\n  CASE\n    WHEN found_lexical AND found_semantic THEN 'BOTH'\n    WHEN found_lexical                    THEN 'LEXICAL_ONLY'\n    ELSE                                       'SEMANTIC_ONLY'\n  END                                              AS retrieved_by\nFROM ranked;\n\n\n-- ---------------------------------------------------------------------\n-- 50c \u00b7 Pair features\n--\n-- Explicit, inspectable comparisons. Every one of these is something a\n-- data steward would look at by eye, and every one of them ends up in the\n-- adjudicator prompt as evidence.\n--\n-- The weights below are PRIORS, not measurements. They encode an ordering\n-- of evidence that any practitioner would recognise \u2014 a shared account\n-- number outweighs a shared postcode \u2014 but the specific numbers are not\n-- claimed to be optimal. Stage 95 measures what they actually produce\n-- against ground truth; that measurement, not this table, is the result.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.pair_features`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH total_records AS (\n  SELECT GREATEST(1, COUNT(*)) AS n FROM `${CDP_PROJECT}.${CDP_DS}.party_search`\n),\nsurname_idf AS (\n  SELECT\n    surname_norm,\n    -- Bounded Fellegi-Sunter / IDF weight in [0.50, 1.80]: high-frequency\n    -- surnames (e.g. SMITH) contribute less log-odds evidence than rare ones.\n    LEAST(1.80, GREATEST(0.50, SAFE_DIVIDE(LN(SAFE_DIVIDE(t.n, COUNT(*))), 5.0))) AS sur_idf_weight\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`, total_records AS t\n  WHERE surname_norm IS NOT NULL AND surname_norm != ''\n  GROUP BY surname_norm, t.n\n),\npostcode_idf AS (\n  SELECT\n    postcode_norm,\n    -- Bounded IDF weight in [0.60, 1.50] discounting dense urban postcodes.\n    LEAST(1.50, GREATEST(0.60, SAFE_DIVIDE(LN(SAFE_DIVIDE(t.n, COUNT(*))), 4.5))) AS pc_idf_weight\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_search`, total_records AS t\n  WHERE postcode_norm IS NOT NULL AND postcode_norm != ''\n  GROUP BY postcode_norm, t.n\n),\npairs AS (\n  SELECT\n    f.*,\n    a.source_system   AS a_source,  b.source_system   AS b_source,\n    a.source_trust    AS a_trust,   b.source_trust    AS b_trust,\n    a.name_norm       AS a_name,    b.name_norm       AS b_name,\n    a.forename_norm   AS a_fore,    b.forename_norm   AS b_fore,\n    a.surname_norm    AS a_sur,     b.surname_norm    AS b_sur,\n    a.address_norm    AS a_addr,    b.address_norm    AS b_addr,\n    a.postcode_norm   AS a_pc,      b.postcode_norm   AS b_pc,\n    a.postcode_out    AS a_pcout,   b.postcode_out    AS b_pcout,\n    a.email_norm      AS a_email,   b.email_norm      AS b_email,\n    a.phone_e164      AS a_phone,   b.phone_e164      AS b_phone,\n    a.dob             AS a_dob,     b.dob             AS b_dob,\n    a.account_number  AS a_acct,    b.account_number  AS b_acct,\n    a.identity_strength AS a_strength, b.identity_strength AS b_strength,\n    a.match_key       AS a_match_key, b.match_key     AS b_match_key,\n    IFNULL(si.sur_idf_weight, 1.0) AS surname_idf_weight,\n    IFNULL(pi.pc_idf_weight,  1.0) AS postcode_idf_weight,\n    -- 2-hop bipartite graph rarity & hub metrics from stage 40h\n    IFNULL(pp.weight, 0.0)         AS idf_weight_sum,\n    pp.min_shared_degree           AS min_shared_degree,\n    IFNULL(pp.via_hub, FALSE)      AS via_hub,\n    IFNULL(pp.hub_only, FALSE)     AS hub_only,\n    pp.shared_identifiers          AS shared_identifiers,\n    -- Unstructured call transcript extraction: is the caller the account holder,\n    -- or a relative/partner calling on behalf of the holder?\n    IFNULL(ca.caller_is_account_holder, TRUE) AS a_is_holder,\n    IFNULL(cb.caller_is_account_holder, TRUE) AS b_is_holder\n  FROM `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused` AS f\n  JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS a ON a.record_id = f.record_id_a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS b ON b.record_id = f.record_id_b\n  LEFT JOIN surname_idf  AS si ON si.surname_norm  = a.surname_norm\n  LEFT JOIN postcode_idf AS pi ON pi.postcode_norm = a.postcode_norm\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.profile_projection` AS pp\n    ON pp.record_id_a = f.record_id_a AND pp.record_id_b = f.record_id_b\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.stg_call_entities` AS ca\n    ON ca.record_id = f.record_id_a\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.stg_call_entities` AS cb\n    ON cb.record_id = f.record_id_b\n),\nfeatured AS (\n  SELECT\n    p.*,\n    -- A loyalty account quoted by a relative calling about a partner's account\n    -- is a relationship edge (stage 70h), not an identity merge signal.\n    IFNULL(a_acct  IS NOT NULL AND b_acct  IS NOT NULL AND a_acct  = b_acct\n           AND a_is_holder AND b_is_holder, FALSE)                          AS acct_match,\n    IFNULL(a_acct  IS NOT NULL AND b_acct  IS NOT NULL AND a_acct  = b_acct\n           AND (NOT a_is_holder OR NOT b_is_holder), FALSE)                 AS third_party_caller_acct_match,\n    IFNULL(a_email IS NOT NULL AND b_email IS NOT NULL AND a_email = b_email, FALSE) AS email_match,\n    IFNULL(a_phone IS NOT NULL AND b_phone IS NOT NULL AND a_phone = b_phone, FALSE) AS phone_match,\n    IFNULL(a_dob   IS NOT NULL AND b_dob   IS NOT NULL AND a_dob   = b_dob,   FALSE) AS dob_match,\n    -- The single most important negative feature in the system. Two\n    -- records with incompatible dates of birth are two people, whatever\n    -- else they share. This is what breaks the over-merge chains.\n    IFNULL(a_dob IS NOT NULL AND b_dob IS NOT NULL AND a_dob != b_dob, FALSE)        AS dob_conflict,\n    -- 2-hop neighbourhood negative features: does each record hold its own\n    -- distinct personal identifier of the same type? Two personal mobiles,\n    -- two personal emails, or two loyalty accounts alongside a shared\n    -- household email/address is the structural signature of a household.\n    IFNULL(a_email IS NOT NULL AND b_email IS NOT NULL AND a_email != b_email, FALSE) AS unshared_email_both,\n    IFNULL(a_phone IS NOT NULL AND b_phone IS NOT NULL AND a_phone != b_phone, FALSE) AS unshared_phone_both,\n    IFNULL(a_acct  IS NOT NULL AND b_acct  IS NOT NULL AND a_acct  != b_acct,  FALSE) AS unshared_acct_both,\n    IFNULL(a_pc    IS NOT NULL AND b_pc    IS NOT NULL AND a_pc    = b_pc,    FALSE) AS postcode_match,\n    IFNULL(a_pcout IS NOT NULL AND b_pcout IS NOT NULL AND a_pcout = b_pcout, FALSE) AS district_match,\n    IFNULL(a_sur   IS NOT NULL AND b_sur   IS NOT NULL AND a_sur   = b_sur,   FALSE) AS surname_match,\n    IFNULL(a_fore  IS NOT NULL AND b_fore  IS NOT NULL AND a_fore  = b_fore,  FALSE) AS forename_match,\n    IFNULL(a_addr  IS NOT NULL AND b_addr  IS NOT NULL AND a_addr  = b_addr,  FALSE) AS address_exact,\n\n    -- Initial-only forename checks (e.g. POS/Loyalty 'L BEKAS' vs 'LAZAROS BEKAS',\n    -- or transposed 'HOGAN XANDER' vs 'X HOGAN')\n    IFNULL(LENGTH(a_fore) = 1 OR LENGTH(b_fore) = 1, FALSE)                  AS initial_only,\n    IFNULL((LENGTH(a_fore) = 1 AND (STARTS_WITH(IFNULL(b_fore, ''), a_fore)\n                                    OR (a_sur = b_fore AND STARTS_WITH(IFNULL(b_sur, ''), a_fore))))\n        OR (LENGTH(b_fore) = 1 AND (STARTS_WITH(IFNULL(a_fore, ''), b_fore)\n                                    OR (b_sur = a_fore AND STARTS_WITH(IFNULL(a_sur, ''), b_fore)))), FALSE) AS initial_consistent,\n    IFNULL((a_source = 'POS' OR b_source = 'POS') AND NOT (a_pcout IS NOT NULL AND b_pcout IS NOT NULL AND a_pcout = b_pcout), FALSE) AS pos_no_district,\n    IFNULL((a_source = 'POS' AND a_acct IS NOT NULL) OR (b_source = 'POS' AND b_acct IS NOT NULL), FALSE) AS pos_has_acct,\n\n    -- Residential street number + street name stem match / conflict.\n    -- Catches abbreviated suburb/street suffixes ('199 MULGA GROVE JOONDANNA'\n    -- vs '199 MULGAGROVE PERTH') and flags when two records live at\n    -- genuinely different street numbers.\n    IFNULL(a_addr IS NOT NULL AND b_addr IS NOT NULL\n     AND REGEXP_EXTRACT(a_addr, r'(\\d+\\s+[A-Z]{4})') IS NOT NULL\n     AND REGEXP_EXTRACT(b_addr, r'(\\d+\\s+[A-Z]{4})') IS NOT NULL\n     AND REGEXP_EXTRACT(a_addr, r'(\\d+)\\s+[A-Z]{4}') = REGEXP_EXTRACT(b_addr, r'(\\d+)\\s+[A-Z]{4}')\n     AND EDIT_DISTANCE(\n           REGEXP_EXTRACT(a_addr, r'(\\d+\\s+[A-Z]{4})'),\n           REGEXP_EXTRACT(b_addr, r'(\\d+\\s+[A-Z]{4})'),\n           max_distance => 2\n         ) <= 1, FALSE) AS street_match,\n    IFNULL(a_addr IS NOT NULL AND b_addr IS NOT NULL\n     AND REGEXP_EXTRACT(a_addr, r'(\\d+\\s+[A-Z]{4})') IS NOT NULL\n     AND REGEXP_EXTRACT(b_addr, r'(\\d+\\s+[A-Z]{4})') IS NOT NULL\n     AND REGEXP_EXTRACT(a_addr, r'(\\d+)\\s+[A-Z]{4}') != REGEXP_EXTRACT(b_addr, r'(\\d+)\\s+[A-Z]{4}'), FALSE) AS street_conflict,\n\n    -- Normalised edit distance on forenames specifically, so a long shared\n    -- surname does not mask two different given names.\n    SAFE_DIVIDE(\n      GREATEST(LENGTH(IFNULL(a_fore, '')), LENGTH(IFNULL(b_fore, '')))\n        - EDIT_DISTANCE(IFNULL(a_fore, ''), IFNULL(b_fore, ''), max_distance => 10),\n      GREATEST(LENGTH(IFNULL(a_fore, '')), LENGTH(IFNULL(b_fore, '')))\n    ) AS forename_similarity,\n\n    -- Normalised edit distance on full name. Capped, because beyond a few\n    -- edits the exact value tells you nothing except \"different\".\n    SAFE_DIVIDE(\n      GREATEST(LENGTH(IFNULL(a_name, '')), LENGTH(IFNULL(b_name, '')))\n        - EDIT_DISTANCE(IFNULL(a_name, ''), IFNULL(b_name, ''), max_distance => 12),\n      GREATEST(LENGTH(IFNULL(a_name, '')), LENGTH(IFNULL(b_name, '')))\n    ) AS name_similarity,\n\n    SAFE_DIVIDE(\n      GREATEST(LENGTH(IFNULL(a_addr, '')), LENGTH(IFNULL(b_addr, '')))\n        - EDIT_DISTANCE(IFNULL(a_addr, ''), IFNULL(b_addr, ''), max_distance => 20),\n      GREATEST(LENGTH(IFNULL(a_addr, '')), LENGTH(IFNULL(b_addr, '')))\n    ) AS address_similarity\n  FROM pairs AS p\n),\nderived AS (\n  SELECT\n    f.*,\n    -- How many hard identifiers agree. Two independent strong identifiers\n    -- is the bar for merging without asking anyone \u2014 it is roughly what a\n    -- steward would accept without hesitating.\n    (  IF(acct_match,  1, 0)\n     + IF(email_match, 1, 0)\n     + IF(phone_match, 1, 0)\n     + IF(dob_match,   1, 0)) AS strong_signals,\n\n    -- Two known, genuinely different forenames. This is the household and\n    -- shared-email signature: everything else about the pair agrees,\n    -- because they live together, and only the given name says they are\n    -- two people.\n    --\n    -- Evaluated on forename_similarity (not full-name similarity, which a\n    -- long shared surname can inflate above 0.60), while respecting\n    -- initial-only loyalty/POS records and exact name-order transpositions.\n    -- Also catches half-transposed family names (e.g. 'HILL AMAYA' vs\n    -- 'MADDOX HILL', where the family surname is in swapped position and\n    -- the given names 'AMAYA' vs 'MADDOX' conflict).\n    IFNULL(a_fore IS NOT NULL AND b_fore IS NOT NULL\n     AND a_fore != b_fore\n     AND NOT initial_consistent\n     -- Prefix diminutives & two-syllable split Asian given names\n     -- (e.g. 'MIN' vs 'MINJUN', 'XIAO' vs 'XIAOMING', 'RAJ' vs 'RAJESH')\n     AND NOT (LENGTH(a_fore) >= 2 AND STARTS_WITH(b_fore, a_fore))\n     AND NOT (LENGTH(b_fore) >= 2 AND STARTS_WITH(a_fore, b_fore))\n     -- Exact or 1-2 char typo name-order transpositions\n     -- (e.g. 'MANE VAIBHAV' vs 'VAIBHAAV MANE', 'MORIN TIFFANY' vs 'TIFFANY MORIIN')\n     AND NOT (EDIT_DISTANCE(a_fore, IFNULL(b_sur, ''), max_distance => 3) <= 2\n              AND EDIT_DISTANCE(IFNULL(a_sur, ''), b_fore, max_distance => 3) <= 2)\n     -- Sole-trader business suffixes ('LESTER DECORATORS PTY LTD', 'WATKINS REST HOME SONS')\n     AND NOT REGEXP_CONTAINS( CONCAT(IFNULL(a_name, ''), ' ', IFNULL(b_name, '')),\n                              r'\\b(PTY|LTD|LIMITED|SONS|DELIVERY CO|SERVICES|CONSULTING|DECORATORS|PANELBEATERS|CHARTERS)\\b')\n     -- Phonetic/transliterated forenames ('YOUSSEF'/'YUSUF', 'HUSSEIN'/'HUSAYN', 'JIAN'/'CHIEN')\n     -- corroborated by matching DOB + personal email/phone\n     AND NOT (dob_match AND (email_match OR phone_match)\n              AND (SOUNDEX(a_fore) = SOUNDEX(b_fore) OR street_match OR IFNULL(forename_similarity, 0) >= 0.40))\n     AND (\n       IFNULL(forename_similarity, 0) < 0.60\n       OR (a_fore = b_sur AND LENGTH(a_sur) > 1 AND LENGTH(b_fore) > 1\n           AND EDIT_DISTANCE(a_sur, b_fore, max_distance => 5) > 2)\n       OR (a_sur = b_fore AND LENGTH(a_fore) > 1 AND LENGTH(b_sur) > 1\n           AND EDIT_DISTANCE(a_fore, b_sur, max_distance => 5) > 2)\n     ), FALSE) AS forename_conflict,\n\n    -- Mutually near, and near the top of each other's neighbour list.\n    -- A relative test rather than an absolute cosine threshold: on short\n    -- identity strings almost everything scores highly in absolute terms,\n    -- so absolute cutoffs are close to meaningless.\n    (IFNULL(mutual, FALSE)\n     AND IFNULL(rank_semantic, 999) <= 3\n     AND IFNULL(similarity, 0) >= 0.85) AS semantic_strong\n  FROM featured AS f\n),\nscored AS (\n  SELECT\n    d.*,\n    -- Rule score in [0, 1]. Additive evidence weighted by Fellegi-Sunter\n    -- IDF frequency priors for surname and postcode, plus 2-hop graph\n    -- neighbourhood penalties for conflicting personal identifiers.\n    LEAST(1.0, GREATEST(0.0,\n        IF(acct_match,      0.50, 0.0)\n      + IF(email_match,     0.45, 0.0)\n      + IF(phone_match,     0.35, 0.0)\n      + IF(dob_match,       0.30, 0.0)\n      + IF(postcode_match,  0.15, 0.0)\n      + IF(address_exact,   0.18, IF(street_match, 0.12, 0.0))\n      + IF(surname_match,   0.10, 0.0)\n      + IF(forename_match,  0.10, IF(initial_consistent, 0.05, 0.0))\n      + 0.20 * IFNULL(name_similarity, 0.0)\n      - IF(dob_conflict,    0.50, 0.0)\n      - IF(hub_only,        0.50, 0.0)\n      - IF(third_party_caller_acct_match, 0.45, 0.0)\n      - IF(forename_conflict AND (unshared_phone_both OR unshared_email_both OR unshared_acct_both), 0.35, 0.0)\n    )) AS rule_score\n  FROM derived AS d\n)\nSELECT\n  s.*,\n  -- Semantic similarity can raise a score and can never lower one.\n  --\n  -- The blend alone would punish exactly the cases the embedding exists\n  -- to catch: a married name plus a house move has a matching date of\n  -- birth and mobile number but very little textual overlap, and\n  -- averaging in a mediocre cosine would drag a near-certain match below\n  -- the threshold. Absence of semantic similarity is not evidence\n  -- against.\n  LEAST(1.0, GREATEST(\n    rule_score,\n    0.65 * rule_score + 0.35 * IFNULL(similarity, 0.0)\n  )) AS combined_score\nFROM scored AS s;\n\n\n-- ---------------------------------------------------------------------\n-- 50d \u00b7 Tiering\n--\n-- Three outcomes, and the middle one is the expensive one:\n--\n--   AUTO_MATCH  cheap, deterministic, no LLM involved\n--   GREY_ZONE   sent to the adjudicator in stage 60\n--   REJECT      discarded, cheaply\n--\n-- Tiering is driven by ordered RULES, not by the score alone, and the\n-- score is used to order within a tier. That is a deliberate choice. A\n-- single blended threshold cannot express \"a date-of-birth conflict is\n-- disqualifying however good everything else looks\", and every attempt to\n-- encode that by tuning weights produces a number nobody can defend in a\n-- review.\n--\n-- The rails, in order, and why each exists:\n--\n--   1  A date-of-birth conflict with nothing to explain it is two people.\n--      Reject. This is the sibling, household and near-miss defence.\n--   2  A date-of-birth conflict alongside a shared account number is a\n--      genuine contradiction \u2014 a shared card, or bad data. It is not ours\n--      to resolve silently, so it goes to the adjudicator.\n--   2b Bipartite graph & 2-hop neighbourhood guards:\n--      - Promiscuous hub-only connections (call-centre numbers, store kiosks)\n--        carry zero identity weight and are rejected outright.\n--      - A relative calling support about an account holder's card\n--        (third_party_caller_acct_match) is a relationship edge, not a merge.\n--      - Conflicting forenames where surnames also conflict (flatmates\n--        sharing an email/address) or where both records hold their own\n--        distinct personal mobile/account (2-hop household signature) are\n--        rejected rather than merged.\n--      - Initial-only rows with conflicting initials, conflicting street\n--        addresses (recycled phone bridge), or conflicting 2-hop personal\n--        identifiers without a street match are rejected.\n--      - Sparse POS rows carrying a loyalty card that does not match the\n--        other record, or carrying no postcode district and no strong\n--        signals, are rejected rather than guessed.\n--   3  A shared loyalty account number, with forenames that agree, is\n--      about as good as evidence gets short of a national identifier.\n--   4  Two independent strong identifiers agreeing is the bar a steward\n--      would accept without hesitating.\n--   4b An initial-only loyalty/CRM record that matches on initial, surname,\n--      and exact residential street number + street name (with no DOB\n--      conflict and no conflicting loyalty account/email) auto-matches\n--      so the true owner claims the loyalty record and exposes any\n--      recycled-phone bridge in Pass 2.\n--   5  A record carrying almost no identity \u2014 a POS row is a surname, an\n--      initial and half a postcode \u2014 can never auto-match on fuzzy\n--      evidence. It needs a hard key or it needs a human.\n--   6  Otherwise the score may carry it, but never past a forename\n--      conflict.\n--   7  Any single strong identifier is worth a question, even if the\n--      score is low.\n--   8  A mutual, top-ranked semantic neighbour is worth a question too.\n--      This is the rail that lets the embedding earn its place: a\n--      transliterated name with no shared identifiers reaches the\n--      adjudicator through here and nowhere else.\n--\n-- Over-merging is categorically worse than under-merging throughout.\n-- Merging two real people is a privacy incident \u2014 one customer can see\n-- another's orders, addresses and history. Failing to merge is a\n-- data-quality ticket. The rails are asymmetric on purpose.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.pair_tiers`\nCLUSTER BY tier, record_id_a\nAS\nSELECT\n  f.*,\n  CASE\n    WHEN dob_conflict AND NOT acct_match                            THEN 'REJECT'\n    WHEN dob_conflict                                               THEN 'GREY_ZONE'\n    WHEN hub_only                                                   THEN 'REJECT'\n    WHEN third_party_caller_acct_match                              THEN 'REJECT'\n    WHEN forename_conflict AND NOT dob_match AND NOT acct_match\n         AND (NOT surname_match OR unshared_phone_both OR unshared_acct_both)\n                                                                    THEN 'REJECT'\n    WHEN initial_only AND NOT acct_match AND NOT dob_match\n         AND (NOT initial_consistent OR street_conflict\n              OR unshared_email_both OR unshared_acct_both\n              OR (unshared_phone_both AND NOT street_match))\n                                                                    THEN 'REJECT'\n    WHEN (pos_no_district OR pos_has_acct) AND strong_signals = 0   THEN 'REJECT'\n    WHEN acct_match AND NOT forename_conflict                       THEN 'AUTO_MATCH'\n    WHEN strong_signals >= 2 AND NOT forename_conflict              THEN 'AUTO_MATCH'\n    WHEN initial_consistent\n         AND (surname_match OR a_sur = b_fore OR b_sur = a_fore\n              OR EDIT_DISTANCE(IFNULL(a_sur, ''), IFNULL(b_sur, ''), max_distance => 2) <= 1)\n         AND street_match\n         AND NOT unshared_email_both AND NOT unshared_acct_both\n                                                                    THEN 'AUTO_MATCH'\n    WHEN (a_strength = 0 OR b_strength = 0)\n         AND NOT (email_match OR phone_match OR acct_match)\n         AND NOT semantic_strong\n         AND NOT (surname_match OR forename_match\n                  OR IFNULL(name_similarity, 0) >= ${CDP_MIN_NAME_SIMILARITY})\n                                                                    THEN 'REJECT'\n    WHEN (a_strength = 0 OR b_strength = 0)\n         AND NOT (email_match OR phone_match)\n         AND NOT semantic_strong\n         AND combined_score < ${CDP_TAU_LOW_IDENTITY}               THEN 'REJECT'\n    WHEN (a_strength = 0 OR b_strength = 0)\n         AND NOT (email_match OR phone_match)                       THEN 'GREY_ZONE'\n    WHEN combined_score >= ${CDP_TAU_HI} AND NOT forename_conflict  THEN 'AUTO_MATCH'\n    WHEN strong_signals >= 1 AND NOT semantic_strong\n         AND combined_score < ${CDP_TAU_SINGLE_SIGNAL}              THEN 'REJECT'\n    WHEN strong_signals >= 1                                        THEN 'GREY_ZONE'\n    WHEN semantic_strong                                            THEN 'GREY_ZONE'\n    WHEN combined_score >= ${CDP_TAU_LO}                            THEN 'GREY_ZONE'\n    ELSE                                                                 'REJECT'\n  END AS tier,\n  CASE\n    WHEN dob_conflict AND NOT acct_match\n      THEN 'Incompatible dates of birth and nothing to explain it.'\n    WHEN dob_conflict\n      THEN 'Shared account number but incompatible dates of birth \u2014 a genuine contradiction, not ours to resolve silently.'\n    WHEN hub_only\n      THEN 'Connected only through a promiscuous operational hub (call-centre phone, store kiosk email, or shared terminal).'\n    WHEN third_party_caller_acct_match\n      THEN 'Caller is a relative or partner ringing about the account holder \u2014 recorded as a RELATED_TO graph edge, never merged.'\n    WHEN forename_conflict AND NOT dob_match AND NOT acct_match\n         AND (NOT surname_match OR unshared_phone_both OR unshared_acct_both)\n      THEN 'Conflicting forenames alongside conflicting surnames or distinct personal mobile/account numbers (2-hop household signature).'\n    WHEN initial_only AND NOT acct_match AND NOT dob_match\n         AND (NOT initial_consistent OR street_conflict\n              OR unshared_email_both OR unshared_acct_both\n              OR (unshared_phone_both AND NOT street_match))\n      THEN 'Initial-only record with conflicting initial, conflicting street address, or distinct 2-hop personal identifiers.'\n    WHEN (pos_no_district OR pos_has_acct) AND strong_signals = 0\n      THEN 'POS stub has an unshared loyalty account or no postcode district and zero strong signals.'\n    WHEN acct_match AND NOT forename_conflict\n      THEN 'Shared loyalty account number, forenames consistent, nothing contradicting.'\n    WHEN strong_signals >= 2 AND NOT forename_conflict\n      THEN 'Two independent strong identifiers agree with no contradicting evidence.'\n    WHEN initial_consistent\n         AND (surname_match OR a_sur = b_fore OR b_sur = a_fore\n              OR EDIT_DISTANCE(IFNULL(a_sur, ''), IFNULL(b_sur, ''), max_distance => 2) <= 1)\n         AND street_match\n         AND NOT unshared_email_both AND NOT unshared_acct_both\n      THEN 'Consistent forename initial, surname, and residential street number/name with no conflicting personal identifiers.'\n    WHEN (a_strength = 0 OR b_strength = 0)\n         AND NOT (email_match OR phone_match OR acct_match)\n         AND NOT semantic_strong\n         AND NOT (surname_match OR forename_match\n                  OR IFNULL(name_similarity, 0) >= ${CDP_MIN_NAME_SIMILARITY})\n      THEN 'Neither forename nor surname matches and no strong identifier connects them \u2014 not a candidate at any score.'\n    WHEN (a_strength = 0 OR b_strength = 0) AND NOT (email_match OR phone_match)\n         AND NOT semantic_strong AND combined_score < ${CDP_TAU_LOW_IDENTITY}\n      THEN 'One side carries almost no identity and the score is below the low-identity floor \u2014 nothing here for a human to adjudicate.'\n    WHEN (a_strength = 0 OR b_strength = 0) AND NOT (email_match OR phone_match)\n      THEN 'One side carries almost no identity; fuzzy similarity alone is not sufficient.'\n    WHEN combined_score >= ${CDP_TAU_HI} AND NOT forename_conflict\n      THEN 'Score above the auto-match threshold with no contradicting evidence.'\n    WHEN strong_signals >= 1 AND NOT semantic_strong\n         AND combined_score < ${CDP_TAU_SINGLE_SIGNAL}\n      THEN 'One strong identifier agrees but everything else disagrees \u2014 below the single-signal floor.'\n    WHEN strong_signals >= 1\n      THEN 'One strong identifier agrees, but not enough to act on alone.'\n    WHEN semantic_strong\n      THEN 'No shared identifiers, but a mutual top-ranked semantic neighbour \u2014 the case the embedding exists for.'\n    WHEN combined_score >= ${CDP_TAU_LO}\n      THEN 'Plausible but not conclusive.'\n    ELSE 'Below the rejection threshold.'\n  END AS tier_reason\nFROM `${CDP_PROJECT}.${CDP_DS}.pair_features` AS f;\n\n\n-- ---------------------------------------------------------------------\n-- 50e \u00b7 The funnel\n--\n-- The shape of this \u2014 a large base, a thin middle, a small top \u2014 is the\n-- entire cost argument. Only the grey zone pays for an LLM call.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_candidate_funnel` AS\nSELECT\n  tier,\n  COUNT(*)                                                  AS pairs,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2)          AS pct,\n  ROUND(MIN(combined_score), 3)                             AS min_score,\n  ROUND(AVG(combined_score), 3)                             AS avg_score,\n  ROUND(MAX(combined_score), 3)                             AS max_score,\n  COUNTIF(retrieved_by = 'SEMANTIC_ONLY')                   AS semantic_only,\n  COUNTIF(retrieved_by = 'LEXICAL_ONLY')                    AS lexical_only,\n  COUNTIF(retrieved_by = 'BOTH')                            AS both\nFROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers`\nGROUP BY tier\nORDER BY CASE tier WHEN 'AUTO_MATCH' THEN 1 WHEN 'GREY_ZONE' THEN 2 ELSE 3 END;\n\n\n-- ---------------------------------------------------------------------\n-- 50f \u00b7 What each leg found on its own\n--\n-- Truth-free, so it can be shown before the scorecard. Two numbers\n-- matter:\n--\n--   LEXICAL_ONLY pairs that scored well \u2014 these are the ACC-48213 cases.\n--     An embedding-only architecture never sees them.\n--   SEMANTIC_ONLY pairs that scored well \u2014 nicknames, transliterations,\n--     married names. A rules-only architecture never sees them.\n--\n-- If either column is near zero, the hybrid argument is weaker than the\n-- deck claims and the deck should be changed, not the query.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_retrieval_legs` AS\nSELECT\n  retrieved_by,\n  COUNT(*)                                      AS pairs_retrieved,\n  COUNTIF(tier = 'AUTO_MATCH')                  AS became_auto_match,\n  COUNTIF(tier = 'GREY_ZONE')                   AS became_grey_zone,\n  COUNTIF(tier = 'REJECT')                      AS became_reject,\n  ROUND(AVG(combined_score), 3)                 AS avg_score,\n  ROUND(AVG(rrf_score), 5)                      AS avg_rrf,\n  COUNTIF(acct_match)                           AS with_shared_account,\n  COUNTIF(NOT surname_match AND tier != 'REJECT') AS surname_differs_but_kept\nFROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers`\nGROUP BY retrieved_by\nORDER BY pairs_retrieved DESC;\n","sql_lines":633,"results":[{"view":"v_candidate_funnel","columns":["avg_score","both","lexical_only","max_score","min_score","pairs","pct","semantic_only","tier"],"rows":[{"avg_score":"0.926","both":"4314","lexical_only":"6","max_score":"1.0","min_score":"0.409","pairs":"4345","pct":"0.04","semantic_only":"25","tier":"AUTO_MATCH"},{"avg_score":"0.267","both":"8784","lexical_only":"31003","max_score":"1.0","min_score":"0.15","pairs":"41769","pct":"0.39","semantic_only":"1982","tier":"GREY_ZONE"},{"avg_score":"0.032","both":"71300","lexical_only":"10414356","max_score":"1.0","min_score":"0.0","pairs":"10727728","pct":"99.57","semantic_only":"242072","tier":"REJECT"}],"row_count":3},{"view":"v_retrieval_legs","columns":["avg_rrf","avg_score","became_auto_match","became_grey_zone","became_reject","pairs_retrieved","retrieved_by","surname_differs_but_kept","with_shared_account"],"rows":[{"avg_rrf":"0.01538","avg_score":"0.025","became_auto_match":"6","became_grey_zone":"31003","became_reject":"10414356","pairs_retrieved":"10445365","retrieved_by":"LEXICAL_ONLY","surname_differs_but_kept":"28545","with_shared_account":"27"},{"avg_rrf":"0.01398","avg_score":"0.311","became_auto_match":"25","became_grey_zone":"1982","became_reject":"242072","pairs_retrieved":"244079","retrieved_by":"SEMANTIC_ONLY","surname_differs_but_kept":"1254","with_shared_account":"0"},{"avg_rrf":"0.03002","avg_score":"0.339","became_auto_match":"4314","became_grey_zone":"8784","became_reject":"71300","pairs_retrieved":"84398","retrieved_by":"BOTH","surname_differs_but_kept":"5234","with_shared_account":"1213"}],"row_count":3},{"view":"v_retrieval_recall","columns":["pairs_a_lexical_system_would_miss","pairs_a_semantic_system_would_miss","pairs_neither_leg_found","pct_recall_hybrid","pct_recall_lexical_only_architecture","pct_recall_semantic_only_architecture","retrieved_by_hybrid","retrieved_by_lexical","retrieved_by_semantic","true_pairs"],"rows":[{"pairs_a_lexical_system_would_miss":"2441","pairs_a_semantic_system_would_miss":"4298","pairs_neither_leg_found":"1067","pct_recall_hybrid":"94.32","pct_recall_lexical_only_architecture":"81.32","pct_recall_semantic_only_architecture":"71.43","retrieved_by_hybrid":"17709","retrieved_by_lexical":"15268","retrieved_by_semantic":"13411","true_pairs":"18776"}],"row_count":1}],"run":{"statements":6,"steps":[{"op":"create table","object":"candidate_pairs_semantic","kind":"table","rows":328477},{"op":"create table","object":"candidate_pairs_fused","kind":"table","rows":10773842},{"op":"create table","object":"pair_features","kind":"table","rows":10773842},{"op":"create table","object":"pair_tiers","kind":"table","rows":10773842},{"op":"create view","object":"v_candidate_funnel","kind":"view","rows":0},{"op":"create view","object":"v_retrieval_legs","kind":"view","rows":0}],"inputs":[{"object":"candidate_pairs_blocked","rows":10529763,"bytes":583100325,"modified":"2026-09-15 10:16:32.339+00","dataset":"cdp","kind":"table"},{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"},{"object":"party_vectors","rows":20000,"bytes":494670703,"modified":"2026-09-15 10:15:16.648+00","dataset":"cdp","kind":"table"},{"object":"profile_projection","rows":44944,"bytes":4539367,"modified":"2026-09-30 01:58:47.288+00","dataset":"cdp","kind":"table"},{"object":"stg_call_entities","rows":442,"bytes":95985,"modified":"2026-09-15 09:58:12.738+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"candidate_pairs_fused","rows":10773842,"bytes":937991508,"modified":"2026-09-15 23:07:08.971+00","dataset":"cdp","kind":"table"},{"object":"candidate_pairs_semantic","rows":328477,"bytes":14906239,"modified":"2026-09-15 23:07:00.036+00","dataset":"cdp","kind":"table"},{"object":"pair_features","rows":10773842,"bytes":5689368960,"modified":"2026-09-30 02:59:31.613+00","dataset":"cdp","kind":"table"},{"object":"pair_tiers","rows":10773842,"bytes":6997333222,"modified":"2026-09-30 02:59:43.166+00","dataset":"cdp","kind":"table"},{"object":"v_candidate_funnel","rows":0,"bytes":0,"modified":"2026-09-15 23:07:25.655+00","dataset":"cdp","kind":"view"},{"object":"v_retrieval_legs","rows":0,"bytes":0,"modified":"2026-09-15 23:07:26.281+00","dataset":"cdp","kind":"view"}]}},{"id":"60_adjudicate","num":"60","title":"Adjudicate","summary":"Sends only grey-zone pairs to Gemini 3.5 Flash. This is the expensive stage, which is why the tiering above it matters so much.","sql":"-- =====================================================================\n-- 60 \u00b7 Adjudicate\n--\n-- The LLM sees the grey zone and nothing else. Pairs that are obviously\n-- the same person, and pairs that are obviously not, never reach it \u2014\n-- they were settled in stage 50 for a fraction of a penny.\n--\n-- Three properties make this defensible rather than merely clever:\n--\n--   pinned      the model version and the prompt version are recorded\n--               with every verdict, so any decision can be reproduced\n--   evidence    the prompt carries structured comparison features, not\n--               raw records \u2014 the model is asked to weigh evidence, not\n--               to go fishing\n--   immutable   verdicts are appended, never overwritten. A re-run does\n--               not silently rewrite history, and does not re-pay for\n--               decisions already made.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 60a \u00b7 The ledger\n--\n-- Created once and appended to. Deliberately NOT a CREATE OR REPLACE:\n-- an audit record you can quietly regenerate is not an audit record.\n-- ---------------------------------------------------------------------\n\nCREATE TABLE IF NOT EXISTS `${CDP_PROJECT}.${CDP_DS}.adjudications`\n(\n  record_id_a        STRING    NOT NULL,\n  reco
