t","rows":9096,"bytes":1013704,"modified":"2026-09-30 23:02:41.820+00","dataset":"cdp","kind":"table"},{"object":"edge_member_of","rows":6531,"bytes":280833,"modified":"2026-09-30 23:02:43.640+00","dataset":"cdp","kind":"table"},{"object":"edge_related_to","rows":6,"bytes":504,"modified":"2026-09-30 23:02:57.960+00","dataset":"cdp","kind":"table"},{"object":"edge_resolves_to","rows":20000,"bytes":1010778,"modified":"2026-09-30 23:02:39.829+00","dataset":"cdp","kind":"table"},{"object":"edge_suspected_link","rows":3631,"bytes":739560,"modified":"2026-09-30 23:02:50.566+00","dataset":"cdp","kind":"table"},{"object":"edges_baseline_cc","rows":19062,"bytes":547522,"modified":"2026-09-30 23:03:01.129+00","dataset":"cdp","kind":"table"},{"object":"edges_weighted_cc","rows":13480,"bytes":383588,"modified":"2026-09-30 23:03:46.980+00","dataset":"cdp","kind":"table"},{"object":"graph_edges_all","rows":14544,"bytes":413708,"modified":"2026-09-30 23:01:10.333+00","dataset":"cdp","kind":"table"},{"object":"graph_edges_pruned","rows":14488,"bytes":412118,"modified":"2026-09-30 23:01:49.703+00","dataset":"cdp","kind":"table"},{"object":"graph_nodes","rows":20000,"bytes":284194,"modified":"2026-09-30 23:01:08.663+00","dataset":"cdp","kind":"table"},{"object":"node_account","rows":4309,"bytes":146030,"modified":"2026-09-30 23:02:35.888+00","dataset":"cdp","kind":"table"},{"object":"node_address","rows":8598,"bytes":1053885,"modified":"2026-09-30 23:02:30.611+00","dataset":"cdp","kind":"table"},{"object":"node_email","rows":7739,"bytes":553005,"modified":"2026-09-30 23:02:32.395+00","dataset":"cdp","kind":"table"},{"object":"node_household","rows":7641,"bytes":1074769,"modified":"2026-09-30 23:02:37.750+00","dataset":"cdp","kind":"table"},{"object":"node_person","rows":13566,"bytes":966462,"modified":"2026-09-30 23:02:26.929+00","dataset":"cdp","kind":"table"},{"object":"node_phone","rows":6669,"bytes":248523,"modified":"2026-09-30 23:02:34.183+00","dataset":"cdp","kind":"table"},{"object":"node_source_record","rows":20000,"bytes":1637059,"modified":"2026-09-30 23:02:28.746+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028413,"modified":"2026-09-30 23:02:19.996+00","dataset":"cdp","kind":"table"},{"object":"person_crosswalk","rows":20000,"bytes":1044194,"modified":"2026-09-30 23:02:22.073+00","dataset":"cdp","kind":"table"},{"object":"resolution_edges","rows":46114,"bytes":15198791,"modified":"2026-09-30 23:02:24.586+00","dataset":"cdp","kind":"table"},{"object":"resolution_runs","rows":3,"bytes":257,"modified":"2026-09-30 23:04:14.950+00","dataset":"cdp","kind":"table"},{"object":"v_cluster_sizes","rows":0,"bytes":0,"modified":"2026-09-30 23:02:59.070+00","dataset":"cdp","kind":"view"},{"object":"v_graph_summary","rows":0,"bytes":0,"modified":"2026-09-30 23:02:58.524+00","dataset":"cdp","kind":"view"},{"object":"wesid_assignments","rows":60000,"bytes":6237155,"modified":"2026-09-30 23:04:11.013+00","dataset":"cdp","kind":"table"},{"object":"wesid_cluster","rows":38706,"bytes":3898955,"modified":"2026-09-30 23:04:13.491+00","dataset":"cdp","kind":"table"}]}},{"id":"80_survivorship","num":"80","title":"Survivorship","summary":"Picks the winning value per field when sources disagree, weighted by source trust.","sql":"-- =====================================================================\n-- 80 \u00b7 Survivorship\n--\n-- Resolution decides which records belong to one person. Survivorship\n-- decides what that person's name, address and phone number actually are\n-- when the records disagree \u2014 which they almost always do.\n--\n-- Two principles run through this stage:\n--\n--   1. Survivorship is per FIELD, not per record. The best address and\n--      the best email routinely come from different systems. Picking a\n--      single \"winning record\" and copying it wholesale throws away the\n--      one thing every other source was right about.\n--\n--   2. Every surviving value keeps its provenance. \"Where did this\n--      address come from, and when\" must be answerable in one query, by\n--      someone who was not in the room when the rules were written.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 80a \u00b7 Field assertions\n--\n-- Every value every source ever claimed, flattened to one row per\n-- assertion. Nothing is discarded here \u2014 the losing values are kept, and\n-- they are what makes the conflict count meaningful later.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_assertions`\nCLUSTER BY person_id, field\nAS\nSELECT\n  a.person_id,\n  p.record_id,\n  p.source_system,\n  p.source_trust,\n  p.source_ts,\n  f.field,\n  f.value_norm,\n  f.value_raw\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id,\nUNNEST([\n  STRUCT('forename' AS field, p.forename_norm AS value_norm, COALESCE(NULLIF(p.raw_forename, ''), REGEXP_EXTRACT(p.raw_name, r'^\\S+'), p.forename_norm) AS value_raw),\n  STRUCT('surname',           p.surname_norm,                COALESCE(NULLIF(p.raw_surname, ''),  REGEXP_EXTRACT(p.raw_name, r'\\S+$'), p.surname_norm)),\n  STRUCT('full_name',         p.name_norm,                   p.raw_name),\n  STRUCT('address',           p.address_norm,                p.raw_address),\n  STRUCT('city',              UPPER(p.raw_city),             p.raw_city),\n  STRUCT('postcode',          p.postcode_norm,               p.raw_postcode),\n  STRUCT('email',             p.email_norm,                  p.raw_email),\n  STRUCT('phone',             p.phone_e164,                  p.raw_phone),\n  STRUCT('dob',               CAST(p.dob AS STRING),         CAST(p.dob AS STRING)),\n  STRUCT('account_number',    p.account_number,              p.account_number)\n]) AS f\nWHERE f.value_norm IS NOT NULL AND f.value_norm != '';\n\n\n-- ---------------------------------------------------------------------\n-- 80b \u00b7 The rule\n--\n-- Ordered, and the order is the policy:\n--\n--   1. source trust        a CRM address beats a bought one, always\n--   2. recency             within a trust tier, newer wins \u2014 this is what\n--                          makes a house move propagate\n--   3. corroboration       more sources asserting the same value\n--   4. record_id           a deterministic tie-break, so the same inputs\n--                          always produce the same golden record\n--\n-- Step 4 looks trivial and is not. Without it, two runs over identical\n-- data can disagree, and a customer's displayed address flickers between\n-- two equally-ranked values. That is the kind of bug that destroys trust\n-- in a platform and takes weeks to track down.\n--\n-- Recency is deliberately SECOND, not first. A fresh record from a\n-- third-party enrichment file should not overwrite a verified CRM\n-- address just because it arrived this morning.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nCLUSTER BY person_id, field\nAS\nWITH corroboration AS (\n  SELECT\n    person_id, field, value_norm,\n    COUNT(DISTINCT source_system) AS asserting_sources,\n    COUNT(*)                      AS assertions\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field, value_norm\n),\nranked AS (\n  SELECT\n    fa.*,\n    c.asserting_sources,\n    c.assertions,\n    ROW_NUMBER() OVER (\n      PARTITION BY fa.person_id, fa.field\n      ORDER BY\n        fa.source_trust DESC,\n        fa.source_ts DESC NULLS LAST,\n        c.asserting_sources DESC,\n        fa.record_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n  JOIN corroboration AS c\n    ON c.person_id = fa.person_id AND c.field = fa.field AND c.value_norm = fa.value_norm\n),\nconflict AS (\n  SELECT person_id, field, COUNT(DISTINCT value_norm) AS distinct_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field\n)\nSELECT\n  r.person_id,\n  r.field,\n  r.value_norm                       AS surviving_value_norm,\n  r.value_raw                        AS surviving_value,\n  r.record_id                        AS won_from_record_id,\n  r.source_system                    AS won_from_source,\n  r.source_trust,\n  r.source_ts                        AS asserted_at,\n  r.asserting_sources,\n  cf.distinct_values,\n  cf.distinct_values > 1             AS was_contested,\n  CONCAT(\n    'Selected from ', r.source_system,\n    ' (trust ', CAST(r.source_trust AS STRING), ')',\n    IF(cf.distinct_values > 1,\n       CONCAT(' over ', CAST(cf.distinct_values - 1 AS STRING), ' competing value(s)'),\n       ' \u2014 uncontested'),\n    '; corroborated by ', CAST(r.asserting_sources AS STRING), ' source(s).'\n  )                                  AS provenance\nFROM ranked AS r\nJOIN conflict AS cf ON cf.person_id = r.person_id AND cf.field = r.field\nWHERE r.rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 80c \u00b7 The golden record\n--\n-- The wide, consumable view of a person. This is what a marketer, an\n-- agent or a service desk actually reads.\n--\n-- Note the deliberate omission: no consent fields. Consent is computed in\n-- stage 85 under its own rules, and is never a survivorship outcome. If\n-- consent were resolved here it would inherit the \"highest trust wins\"\n-- logic, and a high-trust GRANTED would silently overwrite a\n-- low-trust WITHDRAWN. That is precisely the failure this build exists to\n-- prevent.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.golden_person`\nCLUSTER BY person_id\nAS\nWITH pivoted AS (\n  SELECT\n    np.person_id,\n    MAX(IF(s.field = 'full_name',      s.surviving_value,     NULL)) AS full_name,\n    MAX(IF(s.field = 'forename',       s.surviving_value,     NULL)) AS forename,\n    MAX(IF(s.field = 'surname',        s.surviving_value,     NULL)) AS surname,\n    MAX(IF(s.field = 'address',        s.surviving_value,     NULL)) AS address,\n    MAX(IF(s.field = 'address',        s.won_from_record_id,  NULL)) AS address_record_id,\n    MAX(IF(s.field = 'city',           s.surviving_value,     NULL)) AS field_city,\n    MAX(IF(s.field = 'postcode',       s.surviving_value,     NULL)) AS field_postcode,\n    MAX(IF(s.field = 'email',          s.surviving_value,     NULL)) AS email,\n    MAX(IF(s.field = 'phone',          s.surviving_value,     NULL)) AS phone,\n    SAFE.PARSE_DATE('%Y-%m-%d',\n      MAX(IF(s.field = 'dob',          s.surviving_value,     NULL))) AS dob,\n    MAX(IF(s.field = 'account_number', s.surviving_value,     NULL)) AS account_number,\n    COUNTIF(s.was_contested)                                         AS contested_fields,\n    COUNT(s.field)                                                   AS populated_fields,\n    MAX(s.source_trust)                                              AS best_source_trust,\n    MAX(s.asserted_at)                                               AS most_recent_assertion\n  FROM `${CDP_PROJECT}.${CDP_DS}.node_person` AS np\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\n    ON s.person_id = np.person_id\n  GROUP BY np.person_id\n)\nSELECT\n  p.person_id,\n  p.full_name,\n  p.forename,\n  p.surname,\n  p.address,\n  -- Keep address components as a coherent tuple from the winning address record\n  -- to prevent Chimera/Frankenstein addresses across cities/states.\n  COALESCE(addr_rec.raw_city,     p.field_city)     AS city,\n  COALESCE(addr_rec.raw_postcode, p.field_postcode) AS postcode,\n  p.email,\n  p.phone,\n  p.dob,\n  p.account_number,\n  p.contested_fields,\n  p.populated_fields,\n  p.best_source_trust,\n  p.most_recent_assertion\nFROM pivoted AS p\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS addr_rec\n  ON addr_rec.record_id = p.address_record_id;\n\n\n-- ---------------------------------------------------------------------\n-- 80d \u00b7 Which sources actually win\n--\n-- Worth showing, because it is usually a surprise. If a low-trust source\n-- is winning a large share of fields, it is not because the rule is\n-- broken \u2014 it is because the high-trust sources are silent, and that is a\n-- data-capture problem rather than a matching one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_survivorship_by_source` AS\nSELECT\n  won_from_source                                   AS source_system,\n  ANY_VALUE(source_trust)                           AS trust,\n  COUNT(*)                                          AS fields_won,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2)  AS pct_of_fields_won,\n  COUNTIF(was_contested)                            AS won_against_competition,\n  ARRAY_AGG(DISTINCT field ORDER BY field)          AS fields\nFROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nGROUP BY won_from_source\nORDER BY fields_won DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 80e \u00b7 Show me one person, end to end\n--\n-- The single most useful query in the whole demo. Give it a person_id and\n-- it returns every field, the value that survived, where it came from,\n-- and what it beat.\n--\n--   SELECT * FROM cdp.tf_explain_person('PER-00000000deadbeef');\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_explain_person`(p_person_id STRING)\nAS (\n  SELECT\n    s.field,\n    s.surviving_value,\n    s.won_from_source,\n    s.source_trust,\n    s.asserted_at,\n    s.was_contested,\n    s.provenance,\n    -- The values that lost, so the decision can be challenged rather than\n    -- merely accepted.\n    ARRAY(\n      SELECT AS STRUCT fa.source_system, fa.value_raw, fa.source_trust, fa.source_ts\n      FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n      WHERE fa.person_id = s.person_id\n        AND fa.field     = s.field\n        AND fa.value_norm != s.surviving_value_norm\n      ORDER BY fa.source_trust DESC\n    ) AS rejected_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\n  WHERE s.person_id = p_person_id\n);\n\n\n-- ---------------------------------------------------------------------\n-- 80f \u00b7 Bitemporal Attribute History (SCD Type 2)\n--\n-- golden_person is a current-state snapshot (SCD Type 1). For point-in-time\n-- analytics \u2014 e.g. attributing historical store revenue to the state or\n-- postcode where the customer lived WHEN THE ORDER WAS PLACED rather than\n-- where they moved years later \u2014 this view reconstructs the valid_from /\n-- valid_to timeline per attribute across all resolved records.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_golden_person_attribute_history` AS\nWITH ordered_changes AS (\n  SELECT\n    person_id,\n    field,\n    value_raw        AS attribute_value,\n    value_norm,\n    source_system,\n    record_id        AS asserted_by_record_id,\n    source_trust,\n    source_ts        AS valid_from,\n    LAG(value_norm) OVER (\n      PARTITION BY person_id, field\n      ORDER BY source_ts ASC, source_trust ASC, record_id ASC\n    ) AS prev_value_norm\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  WHERE source_ts IS NOT NULL\n),\ndistinct_transitions AS (\n  SELECT * EXCEPT (prev_value_norm)\n  FROM ordered_changes\n  WHERE prev_value_norm IS NULL OR value_norm != prev_value_norm\n)\nSELECT\n  person_id,\n  field,\n  attribute_value,\n  source_system,\n  asserted_by_record_id,\n  source_trust,\n  valid_from,\n  LEAD(valid_from) OVER (\n    PARTITION BY person_id, field\n    ORDER BY valid_from ASC\n  ) AS valid_to,\n  LEAD(valid_from) OVER (\n    PARTITION BY person_id, field\n    ORDER BY valid_from ASC\n  ) IS NULL AS is_current\nFROM distinct_transitions;\n\n","sql_lines":309,"results":[{"view":"v_survivorship_by_source","columns":["fields","fields_won","pct_of_fields_won","source_system","trust","won_against_competition"],"rows":[{"fields":["address","city","dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"37229","pct_of_fields_won":"43.21","source_system":"CRM","trust":"9","won_against_competition":"6128"},{"fields":["account_number","address","city","dob","forename","full_name","phone","postcode","surname"],"fields_won":"17077","pct_of_fields_won":"19.82","source_system":"LOYALTY","trust":"7","won_against_competition":"1671"},{"fields":["account_number","forename","full_name","surname"],"fields_won":"14023","pct_of_fields_won":"16.27","source_system":"POS","trust":"3","won_against_competition":"70"},{"fields":["dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"10900","pct_of_fields_won":"12.65","source_system":"ECOM","trust":"6","won_against_competition":"538"},{"fields":["address","email","forename","full_name","postcode","surname"],"fields_won":"4771","pct_of_fields_won":"5.54","source_system":"ENRICH","trust":"2","won_against_competition":"81"},{"fields":["account_number","address","email","forename","full_name","phone","postcode","surname"],"fields_won":"1525","pct_of_fields_won":"1.77","source_system":"SUPPORT","trust":"4","won_against_competition":"92"},{"fields":["account_number","address","dob","email","forename","full_name","postcode","surname"],"fields_won":"638","pct_of_fields_won":"0.74","source_system":"CALL","trust":"4","won_against_competition":"39"}],"row_count":7}],"run":{"statements":6,"steps":[{"op":"create table","object":"field_assertions","kind":"table","rows":120912},{"op":"create table","object":"field_survivorship","kind":"table","rows":86163},{"op":"create table","object":"golden_person","kind":"table","rows":13566},{"op":"create view","object":"v_survivorship_by_source","kind":"view","rows":0},{"op":"create table function","object":"tf_explain_person","kind":"routine","rows":null},{"op":"create view","object":"v_golden_person_attribute_history","kind":"view","rows":0}],"inputs":[{"object":"node_person","rows":13566,"bytes":966462,"modified":"2026-09-30 23:02:26.929+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7170102,"modified":"2026-09-30 02:49:20.854+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028413,"modified":"2026-09-30 23:02:19.996+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"field_assertions","rows":120912,"bytes":11319910,"modified":"2026-09-30 23:04:42.433+00","dataset":"cdp","kind":"table"},{"object":"field_survivorship","rows":86163,"bytes":16185921,"modified":"2026-09-30 23:04:45.747+00","dataset":"cdp","kind":"table"},{"object":"golden_person","rows":13566,"bytes":1835001,"modified":"2026-09-30 23:04:47.784+00","dataset":"cdp","kind":"table"},{"object":"v_golden_person_attribute_history","rows":0,"bytes":0,"modified":"2026-09-30 23:04:49.567+00","dataset":"cdp","kind":"view"},{"object":"v_survivorship_by_source","rows":0,"bytes":0,"modified":"2026-09-30 23:04:48.198+00","dataset":"cdp","kind":"view"}]}},{"id":"85_consent","num":"85","title":"Consent","summary":"Recomputes permissions at profile level. Merging two records never merges their consent.","sql":"-- =====================================================================\n-- 85 \u00b7 Consent\n--\n-- The stage that most MDM builds get wrong, and the one with legal\n-- consequences when they do.\n--\n-- Merging two records merges their behaviour, their orders and their\n-- addresses. It must NOT merge their permissions. Consent was given by a\n-- person, to a specific organisation, through a specific channel, for a\n-- specific purpose, at a specific moment \u2014 and joining two rows in a\n-- warehouse does not create permission that nobody ever gave.\n--\n-- Three rules, in order:\n--\n--   1. A suppression always wins. Deceased or minor indications override\n--      everything, including an explicit grant.\n--   2. An explicit withdrawal always wins over a grant, regardless of\n--      which is more recent. \"I changed my mind\" does not expire.\n--   3. Otherwise permission is the INTERSECTION, not the union. A profile\n--      may be contacted on a channel only where every contributing record\n--      agrees it may be.\n--\n-- Rule 3 is the expensive one, and the one commercial pressure pushes\n-- against. Stage 85d puts a number on exactly how many contacts it costs\n-- \u2014 and therefore how many unlawful contacts the union rule would have\n-- produced.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 85a \u00b7 Consent state per source record\n--\n-- Consent events are append-only, so the current state of a record is\n-- its most recent event for that channel and purpose. Nothing is\n-- rewritten; the history remains queryable.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.consent_record_state`\nCLUSTER BY record_id, channel\nAS\nSELECT * EXCEPT (rn)\nFROM (\n  SELECT\n    e.record_id,\n    e.channel,\n    e.purpose,\n    e.status,\n    e.captured_at,\n    e.consent_id,\n    ROW_NUMBER() OVER (\n      PARTITION BY e.record_id, e.channel, e.purpose\n      ORDER BY e.captured_at DESC,\n               CASE e.status WHEN 'WITHDRAWN' THEN 1 WHEN 'NOT_GIVEN' THEN 2 ELSE 3 END,\n               e.consent_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.src_consent_events` AS e\n)\nWHERE rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 85b \u00b7 Suppressions\n--\n-- Sourced from the risk classification in stage 20. These are not\n-- preferences and are not negotiable \u2014 a marketing send to a deceased\n-- customer's household is the kind of failure that reaches the press.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_suppression`\nCLUSTER BY person_id\nAS\nSELECT\n  a.person_id,\n  LOGICAL_OR(s.suppress_marketing)                            AS suppress_marketing,\n  ARRAY_AGG(DISTINCT s.risk_category IGNORE NULLS\n            ORDER BY s.risk_category)                         AS risk_categories,\n  ANY_VALUE(s.risk_evidence)                                  AS sample_evidence,\n  ARRAY_AGG(DISTINCT s.record_id ORDER BY s.record_id)        AS evidence_record_ids\nFROM `${CDP_PROJECT}.${CDP_DS}.stg_support_entities` AS s\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = s.record_id\nWHERE s.risk_category != 'NONE'\nGROUP BY a.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85c \u00b7 Effective permission per person, channel and purpose\n--\n-- Both rules are computed side by side. The union rule is not here\n-- because it is a reasonable option \u2014 it is here so that the cost of\n-- doing the right thing can be stated precisely instead of argued about.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_consent`\nCLUSTER BY person_id, channel\nAS\nWITH per_person_raw AS (\n  SELECT\n    a.person_id,\n    c.channel,\n    c.purpose,\n    COUNT(*)                                             AS contributing_records,\n    LOGICAL_OR(c.status = 'WITHDRAWN')                   AS any_withdrawn,\n    LOGICAL_OR(c.status = 'GRANTED')                     AS any_granted,\n    LOGICAL_AND(c.status = 'GRANTED')                    AS all_granted,\n    COUNTIF(c.status = 'GRANTED')                        AS granted_count,\n    COUNTIF(c.status = 'WITHDRAWN')                      AS withdrawn_count,\n    COUNTIF(c.status = 'NOT_GIVEN')                      AS not_given_count,\n    MIN(IF(c.status = 'WITHDRAWN', c.captured_at, NULL)) AS first_withdrawn_at,\n    MAX(c.captured_at)                                   AS latest_event_at,\n    ARRAY_AGG(STRUCT(c.record_id, c.status, c.captured_at)\n              ORDER BY c.captured_at)                    AS evidence\n  FROM `${CDP_PROJECT}.${CDP_DS}.consent_record_state` AS c\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = c.record_id\n  GROUP BY a.person_id, c.channel, c.purpose\n),\n-- Ensure suppressed persons appear on every marketing channel even if they\n-- have no explicit consent events recorded.\nsuppressed_channels AS (\n  SELECT\n    sp.person_id,\n    ch AS channel,\n    'MARKETING' AS purpose\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_suppression` AS sp,\n  UNNEST(['EMAIL', 'SMS', 'POST', 'PHONE']) AS ch\n  WHERE sp.suppress_marketing\n),\nspine AS (\n  SELECT person_id, channel, purpose FROM per_person_raw\n  UNION DISTINCT\n  SELECT person_id, channel, purpose FROM suppressed_channels\n),\nper_person AS (\n  SELECT\n    s.person_id,\n    s.channel,\n    s.purpose,\n    IFNULL(r.contributing_records, 0) AS contributing_records,\n    IFNULL(r.any_withdrawn, FALSE)    AS any_withdrawn,\n    IFNULL(r.any_granted, FALSE)      AS any_granted,\n    IFNULL(r.all_granted, FALSE)      AS all_granted,\n    IFNULL(r.granted_count, 0)        AS granted_count,\n    IFNULL(r.withdrawn_count, 0)      AS withdrawn_count,\n    IFNULL(r.not_given_count, 0)      AS not_given_count,\n    r.first_withdrawn_at,\n    r.latest_event_at,\n    r.evidence\n  FROM spine AS s\n  LEFT JOIN per_person_raw AS r USING (person_id, channel, purpose)\n),\n-- How many of a person's records could have carried a consent statement\n-- but do not. Under a strict reading, silence is not permission.\ncoverage AS (\n  SELECT person_id, COUNT(*) AS total_records\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment`\n  GROUP BY person_id\n)\nSELECT\n  p.person_id,\n  p.channel,\n  p.purpose,\n  p.contributing_records,\n  cv.total_records,\n  p.granted_count,\n  p.withdrawn_count,\n  p.not_given_count,\n\n  -- THE RULE\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted AND p.contributing_records > 0                     THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status,\n\n  -- The stricter reading: a record that never said anything counts\n  -- against permission rather than being ignored. Offered as a column\n  -- rather than imposed, because which reading applies is a legal\n  -- decision, not an engineering one \u2014 but it should be a decision\n  -- somebody consciously makes.\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted AND p.contributing_records = cv.total_records      THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status_strict,\n\n  -- The common, wrong implementation. Retained purely for comparison.\n  CASE\n    WHEN p.any_granted THEN 'GRANTED'\n    ELSE                    'NOT_GIVEN'\n  END                                        AS naive_union_status,\n\n  IFNULL(sp.suppress_marketing, FALSE)       AS suppressed,\n  sp.risk_categories,\n  p.first_withdrawn_at,\n  p.latest_event_at,\n  p.evidence,\n\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING'\n      THEN CONCAT('Suppressed: ', ARRAY_TO_STRING(sp.risk_categories, ', '),\n                  ' indication found in support contact.')\n    WHEN p.any_withdrawn\n      THEN CONCAT('Withdrawn on ', FORMAT_TIMESTAMP('%Y-%m-%d', p.first_withdrawn_at),\n                  '. Withdrawal is absolute and is not overridden by a later grant '\n                  'from another source.')\n    WHEN p.all_granted AND p.contributing_records > 0\n      THEN CONCAT('All ', CAST(p.contributing_records AS STRING),\n                  ' contributing record(s) granted permission on this channel.')\n    ELSE\n      CONCAT(CAST(p.granted_count AS STRING), ' of ',\n             CAST(p.contributing_records AS STRING),\n             ' contributing record(s) granted permission \u2014 not unanimous, '\n             'so permission is not inherited.')\n  END                                        AS explanation\nFROM per_person AS p\nJOIN coverage AS cv ON cv.person_id = p.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_suppression` AS sp ON sp.person_id = p.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85d \u00b7 What the rule costs, and what it prevents\n--\n-- The number to put in front of a CMO. The union rule produces a bigger\n-- audience; every extra contact in it is a contact the customer did not\n-- agree to, on a channel where at least one of their records says no.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_impact` AS\nSELECT\n  channel,\n  purpose,\n  COUNT(*)                                          AS people_with_a_stated_preference,\n  COUNTIF(naive_union_status = 'GRANTED')           AS audience_union_rule,\n  COUNTIF(effective_status = 'GRANTED')             AS audience_intersection_rule,\n  COUNTIF(effective_status_strict = 'GRANTED')      AS audience_strict_rule,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status != 'GRANTED')        AS contacts_the_union_rule_would_add,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status = 'WITHDRAWN')       AS of_which_explicitly_withdrawn,\n  COUNTIF(effective_status = 'SUPPRESSED')          AS suppressed_for_risk,\n  ROUND(100 * SAFE_DIVIDE(\n    COUNTIF(naive_union_status = 'GRANTED' AND effective_status != 'GRANTED'),\n    NULLIF(COUNTIF(naive_union_status = 'GRANTED'), 0)), 2) AS pct_of_union_audience_unlawful\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\nGROUP BY channel, purpose\nORDER BY channel, purpose;\n\n\n-- ---------------------------------------------------------------------\n-- 85e \u00b7 The conflict cases, named\n--\n-- The generator plants people whose records carry GRANTED, NOT_GIVEN and\n-- WITHDRAWN for the same channel across three different systems. This is\n-- not a contrived edge case: it is what happens when a customer signs up\n-- online, opts out in store, and never updates the app.\n--\n-- Put one of these on screen. It is the single clearest illustration of\n-- why \"merge the profiles\" and \"merge the permissions\" are different\n-- operations.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_conflicts` AS\nSELECT\n  c.person_id,\n  g.full_name,\n  c.channel,\n  c.purpose,\n  c.granted_count,\n  c.withdrawn_count,\n  c.not_given_count,\n  c.naive_union_status  AS would_have_been_contacted,\n  c.effective_status    AS actual_decision,\n  c.explanation,\n  c.evidence\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nWHERE c.granted_count > 0\n  AND (c.withdrawn_count > 0 OR c.not_given_count > 0)\nORDER BY c.withdrawn_count DESC, c.granted_count DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 85f \u00b7 The activation-safe audience\n--\n-- The only table any downstream campaign should read. If a marketer can\n-- reach person_consent directly, sooner or later somebody will write\n-- their own interpretation of the rules \u2014 and it will be the union one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS\nSELECT\n  c.person_id,\n  c.channel,\n  c.purpose,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS fs\n  ON fs.person_id = c.person_id\n AND fs.field = CASE c.channel\n                  WHEN 'EMAIL' THEN 'email'\n                  WHEN 'SMS'   THEN 'phone'\n                  WHEN 'PHONE' THEN 'phone'\n                  WHEN 'POST'  THEN 'address'\n                END\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.consent_record_state` AS crs\n  ON crs.record_id = fs.won_from_record_id\n AND crs.channel   = c.channel\n AND crs.purpose   = c.purpose\nWHERE c.effective_status = 'GRANTED'\n  -- Ensure the channel's contact attribute is populated on the golden record\n  AND CASE c.channel\n        WHEN 'EMAIL' THEN g.email    IS NOT NULL\n        WHEN 'SMS'   THEN g.phone    IS NOT NULL\n        WHEN 'PHONE' THEN g.phone    IS NOT NULL\n        WHEN 'POST'  THEN g.address  IS NOT NULL AND g.postcode IS NOT NULL\n        ELSE FALSE\n      END\n  -- Principle P7: Consent never travels across a merge. The specific source\n  -- record from which the surviving contact point was won must itself carry\n  -- GRANTED consent for this channel and purpose.\n  AND crs.status = 'GRANTED';\n","sql_lines":326,"results":[{"view":"v_consent_impact","columns":["audience_intersection_rule","audience_strict_rule","audience_union_rule","channel","contacts_the_union_rule_would_add","of_which_explicitly_withdrawn","pct_of_union_audience_unlawful","people_with_a_stated_preference","purpose","suppressed_for_risk"],"rows":[{"audience_intersection_rule":"1861" 9-30 23:05:00.694+00","dataset":"cdp","kind":"view"},{"object":"v_consent_impact","rows":0,"bytes":0,"modified":"2026-09-30 23:05:00.188+00","dataset":"cdp","kind":"view"},{"object":"v_contactable","rows":0,"bytes":0,"modified":"2026-09-30 23:05:01.425+00","dataset":"cdp","kind":"view"}]}},{"id":"90_downstream","num":"90","title":"Downstream","summary":"The outputs: segments, households, shared-identifier risk, agent grounding and activation audiences.","sql":"-- =====================================================================\n-- 90 \u00b7 Downstream\n--\n-- Everything to this point was cost. This is the return.\n--\n-- Five things that are either impossible or unreliable without a\n-- mastered customer graph, and straightforward with one. None of them\n-- requires data to leave BigQuery, and none of them requires a separate\n-- CDP product.\n--\n--   90a  segmentation   \u00b7 RFM + k-means, on people rather than records\n--   90b  household      \u00b7 the unit families actually buy as\n--   90c  graph risk     \u00b7 shared identifiers, which only a graph exposes\n--   90d  agent grounding\u00b7 a profile an LLM can read and answer from\n--   90e  activation     \u00b7 audiences that are consent-safe by construction\n--\n-- The recurring point: every one of these was previously computed per\n-- source system, and therefore computed wrongly.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 90a \u00b7 Segmentation\n--\n-- RFM at person level. The comparison worth drawing on screen: the same\n-- calculation over raw POS records treats one customer with three loyalty\n-- cards as three lukewarm customers rather than one very good one. Every\n-- decision downstream \u2014 budget, offer, priority \u2014 then follows from a\n-- number that was never true.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_rfm`\nCLUSTER BY person_id\nAS\nWITH txns AS (\n  SELECT\n    a.person_id,\n    t.txn_ts,\n    t.amount_aud,\n    t.category\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = t.record_id\n),\nbounds AS (\n  SELECT MAX(txn_ts) AS as_of FROM txns\n)\nSELECT\n  t.person_id,\n  DATE_DIFF(DATE(b.as_of), DATE(MAX(t.txn_ts)), DAY)      AS recency_days,\n  COUNT(*)                                                AS frequency,\n  ROUND(SUM(t.amount_aud), 2)                             AS monetary_aud,\n  ROUND(AVG(t.amount_aud), 2)                             AS avg_basket_aud,\n  COUNT(DISTINCT t.category)                              AS category_breadth,\n  ARRAY_AGG(DISTINCT t.category ORDER BY t.category)      AS categories,\n  MIN(t.txn_ts)                                           AS first_purchase_at,\n  MAX(t.txn_ts)                                           AS last_purchase_at\nFROM txns AS t, bounds AS b\nGROUP BY t.person_id, b.as_of;\n\n\n-- Trained on the resolved population. Five clusters is a starting point,\n-- not a finding \u2014 the right number comes from silhouette scores on real\n-- data, and claiming otherwise in a demo would be dishonest.\nCREATE OR REPLACE MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`\nOPTIONS (\n  model_type            = 'KMEANS',\n  num_clusters          = 5,\n  standardize_features  = TRUE,\n  kmeans_init_method    = 'KMEANS++'\n) AS\nSELECT\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`;\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_segments`\nCLUSTER BY person_id\nAS\n-- ML.PREDICT passes non-feature columns straight through, so person_id\n-- comes back attached to its own prediction. Joining the result back to\n-- the input on floating-point equality would work here and break the\n-- first time a feature is rounded differently.\nSELECT\n  person_id,\n  CENTROID_ID AS segment_id,\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM ML.PREDICT(\n  MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`,\n  (\n    SELECT person_id, recency_days, frequency, monetary_aud, category_breadth\n    FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n  )\n);\n\n\n-- Segments are numbers until somebody names them. AI.GENERATE reads the\n-- centroid statistics and produces a label a marketer can use, which is\n-- a small thing that removes a genuinely annoying manual step.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.segment_labels`\nAS\nWITH profile AS (\n  SELECT\n    segment_id,\n    COUNT(*)                        AS people,\n    ROUND(AVG(recency_days), 1)     AS avg_recency_days,\n    ROUND(AVG(frequency), 1)        AS avg_frequency,\n    ROUND(AVG(monetary_aud), 2)     AS avg_spend_aud,\n    ROUND(AVG(category_breadth), 1) AS avg_categories\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_segments`\n  GROUP BY segment_id\n)\nSELECT\n  p.*,\n  AI.GENERATE(\n    prompt => (\n      'Name and describe a retail customer segment from these averages. '\n   || 'Be plain and commercial; avoid jargon and avoid inventing facts not '\n   || 'present in the numbers. Statistics: ',\n      TO_JSON_STRING(p)\n    ),\n    connection_id => '${CDP_CONNECTION_PATH}',\n    endpoint      => '${CDP_EXTRACTION_MODEL}',\n    output_schema => 'segment_name STRING, description STRING, suggested_action STRING'\n  ) AS g\nFROM profile AS p;\n\n\n-- ---------------------------------------------------------------------\n-- 90b \u00b7 Household\n--\n-- Families buy as a unit and are marketed to as individuals, which is how\n-- four people at one address receive four copies of the same catalogue.\n--\n-- The household is derived from resolved people sharing a current\n-- address. Note what it is NOT: it is not a merge. The four people remain\n-- four people with four sets of preferences.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.household_profile`\nCLUSTER BY household_id\nAS\nSELECT\n  h.household_id,\n  h.address_norm,\n  h.postcode_norm,\n  COUNT(DISTINCT m.person_id)                          AS people,\n  ROUND(SUM(IFNULL(r.monetary_aud, 0)), 2)             AS household_spend_aud,\n  SUM(IFNULL(r.frequency, 0))                          AS household_transactions,\n  MIN(r.recency_days)                                  AS most_recent_purchase_days,\n  ARRAY_AGG(DISTINCT g.surname IGNORE NULLS\n            ORDER BY g.surname)                        AS surnames,\n  -- More than one surname at an address is normal and is not evidence of\n  -- anything. It is recorded because it changes how a household offer\n  -- should be worded, not whether one should be sent.\n  COUNT(DISTINCT g.surname) > 1                        AS multi_surname,\n  COUNTIF(c.effective_status = 'GRANTED') > 0          AS at_least_one_contactable\nFROM `${CDP_PROJECT}.${CDP_DS}.node_household` AS h\nJOIN `${CDP_PROJECT}.${CDP_DS}.edge_member_of` AS m USING (household_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g ON g.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm`   AS r ON r.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\n  ON c.person_id = m.person_id AND c.channel = 'POST' AND c.purpose = 'MARKETING'\nGROUP BY h.household_id, h.address_norm, h.postcode_norm;\n\n\n-- The catalogue-duplication number. Unglamorous, immediately credible,\n-- and usually larger than anyone expects.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_household_waste` AS\nSELECT\n  COUNT(*)                                                   AS households,\n  SUM(people)                                                AS people,\n  SUM(GREATEST(people - 1, 0))                               AS duplicate_mailings_avoided,\n  ROUND(100 * SAFE_DIVIDE(SUM(GREATEST(people - 1, 0)), SUM(people)), 2)\n                                                             AS pct_of_mailings_avoidable,\n  COUNTIF(people > 1)                                        AS multi_person_households,\n  COUNTIF(multi_surname)                                     AS multi_surname_households\nFROM `${CDP_PROJECT}.${CDP_DS}.household_profile`\nWHERE at_least_one_contactable;\n\n\n-- ---------------------------------------------------------------------\n-- 90c \u00b7 Shared identifiers\n--\n-- A graph question that a flat customer table cannot answer at all:\n-- which identifiers are shared by people we have decided are different?\n--\n-- Most sharing is innocent \u2014 couples share a landline, families share an\n-- email. A phone number attached to fifteen unrelated people, across\n-- multiple postcode districts, is not innocent. Either resolution is\n-- wrong, or something is.\n--\n-- Note the framing: this surfaces things to look at, and asserts nothing.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_shared_identifiers` AS\nWITH shared_phone AS (\n  SELECT\n    'PHONE'                              AS identifier_type,\n    e.phone_id                           AS identifier,\n    COUNT(DISTINCT e.person_id)          AS people,\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20) AS person_ids,\n    ANY_VALUE(n.is_mobile)               AS is_personal_device\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_phone` AS e\n  JOIN `${CDP_PROJECT}.${CDP_DS}.node_phone` AS n ON n.phone_id = e.phone_id\n  GROUP BY e.phone_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_email AS (\n  SELECT\n    'EMAIL',\n    e.email_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_email` AS e\n  GROUP BY e.email_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_account AS (\n  SELECT\n    'LOYALTY_ACCOUNT',\n    e.account_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_holds_account` AS e\n  GROUP BY e.account_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n)\nSELECT *,\n  CASE\n    WHEN identifier_type = 'PHONE' AND is_personal_device AND people >= 5\n      THEN 'REVIEW \u00b7 a personal mobile shared by five or more people is unusual'\n    WHEN people >= 10\n      THEN 'REVIEW \u00b7 sharing at this scale is rarely a household'\n    WHEN people BETWEEN 2 AND 4\n      THEN 'EXPECTED \u00b7 consistent with a household or a couple'\n    ELSE 'MONITOR'\n  END AS assessment\nFROM (\n  SELECT * FROM shared_phone\n  UNION ALL SELECT * FROM shared_email\n  UNION ALL SELECT * FROM shared_account\n)\nORDER BY people DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 90d \u00b7 Grounding for agents\n--\n-- An agent cannot reason about a customer scattered across eight systems.\n-- It can reason about one profile with stated provenance and explicit\n-- gaps.\n--\n-- The profile deliberately carries what is NOT known \u2014\n-- fields_with_conflicting_sources \u2014 because an agent told that a date of\n-- birth is contested will ask, where an agent given a single clean value\n-- will assert.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_context`\nCLUSTER BY person_id\nAS\nWITH interactions AS (\n  SELECT\n    a.person_id,\n    CONCAT('[', p.source_system, ' ',\n           IFNULL(FORMAT_TIMESTAMP('%Y-%m-%d', p.source_ts), 'undated'), '] ',\n           IFNULL(p.evidence_note, p.raw_name)) AS line\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\n  WHERE p.evidence_note IS NOT NULL\n),\n\n-- These three were ARRAY(SELECT ... WHERE x.person_id = g.person_id) against\n-- other tables. BigQuery cannot de-correlate a subquery that references\n-- another table once it carries ORDER BY or LIMIT:\n--   \"Correlated subqueries that reference other tables are not supported\n--    unless they can be de-correlated, such as by transforming them into an\n--    efficient JOIN.\"\n-- So each is pre-aggregated per person and LEFT JOINed below. A join miss\n-- yields a NULL array, which BigQuery stores as an empty array -- identical\n-- to what the empty subquery produced.\nconsent_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(STRUCT(channel, purpose, effective_status)\n              ORDER BY channel, purpose) AS permissions\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\n  GROUP BY person_id\n),\n\ninteraction_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(line LIMIT 10) AS notable_interactions\n  FROM interactions\n  GROUP BY person_id\n),\n\ncontested_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(field ORDER BY field) AS fields_with_conflicting_sources\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\n  WHERE was_contested\n  GROUP BY person_id\n)\n\nSELECT\n  g.person_id,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode,\n  g.contested_fields,\n  n.source_systems,\n  n.source_record_count,\n  r.recency_days,\n  r.frequency,\n  r.monetary_aud,\n  ca.permissions,\n  ia.notable_interactions,\n  -- Explicit uncertainty. This is the field that stops an agent asserting\n  -- something it should have asked about.\n  co.fields_with_conflicting_sources\nFROM `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_person`   AS n USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN consent_agg     AS ca ON ca.person_id = g.person_id\nLEFT JOIN interaction_agg AS ia ON ia.person_id = g.person_id\nLEFT JOIN contested_agg   AS co ON co.person_id = g.person_id;\n\n\n-- Ask a question about a customer. The prompt forbids invention and\n-- requires the answer to cite which part of the profile it came from,\n-- which is the difference between grounding and guessing.\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_ask_about_person`(\n  p_person_id STRING, question STRING\n)\nAS (\n  SELECT\n    c.person_id,\n    question AS asked,\n    AI.GENERATE(\n      prompt => (\n        '''Answer a question about a customer using ONLY the profile below.\n\nIf the profile does not contain the answer, say so plainly and say what would need\nto be checked. Never infer, estimate or fill a gap.\n\nCite which part of the profile your answer came from.\n\nIf fields_with_conflicting_sources lists a field you rely on, say that the value is\ncontested and give the caveat.\n\nNever state or imply permission to contact on a channel unless permissions shows\nGRANTED for that channel.\n\nQUESTION: ''',\n        question,\n        '''\n\nPROFILE:\n''',\n        TO_JSON_STRING(c)\n      ),\n      connection_id => '${CDP_CONNECTION_PATH}',\n      endpoint      => '${CDP_EXTRACTION_MODEL}',\n      output_schema => 'answer STRING, grounded_in STRING, confident BOOL'\n    ) AS response\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_context` AS c\n  WHERE c.person_id = p_person_id\n);\n\n\n-- ---------------------------------------------------------------------\n-- 90e \u00b7 Activation\n--\n-- The final audience. Consent-safe by construction: it reads\n-- v_contactable, which only ever contains people whose every contributing\n-- record agreed.\n--\n-- A marketer cannot accidentally widen this audience, because the\n-- permission logic is not theirs to reinterpret.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_audience_lapsed_high_value` AS\nSELECT\n  c.person_id,\n  c.full_name,\n  c.email,\n  c.postcode,\n  r.monetary_aud,\n  r.recency_days,\n  r.frequency,\n  s.segment_id,\n  -- Nested, not flat: segment_labels stores the whole AI.GENERATE result in\n  -- column g, matching the convention in stages 20 and 60. The notebook\n  -- reads g.segment_name too, so the struct stays and the view reaches in.\n  l.g.segment_name,\n  l.g.suggested_action\nFROM `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_segments` AS s USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.segment_labels`  AS l\n  ON l.segment_id = s.segment_id\nWHERE c.channel = 'EMAIL'\n  AND c.purpose = 'MARKETING'\n  AND r.recency_days > 180\n  AND r.monetary_aud > 500;\n\n\n-- The before/after that justifies the whole programme. The same audience\n-- definition, computed on unresolved source records and on resolved\n-- people, produces different customers and a different spend figure.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_activation_before_after` AS\nWITH unresolved AS (\n  -- What you get treating every loyalty card as a customer.\n  SELECT\n    COUNT(DISTINCT t.loyalty_account_number)          AS customers,\n    ROUND(SUM(t.amount_aud), 2)                       AS total_spend,\n    ROUND(AVG(t.amount_aud), 2)                       AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  WHERE t.loyalty_account_number IS NOT NULL\n),\nresolved AS (\n  SELECT\n    COUNT(*)                                          AS customers,\n    ROUND(SUM(monetary_aud), 2)                       AS total_spend,\n    ROUND(AVG(avg_basket_aud), 2)                     AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n)\nSELECT 'unresolved \u00b7 one loyalty card = one customer' AS basis,\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)  AS spend_per_customer\nFROM unresolved\nUNION ALL\nSELECT 'resolved \u00b7 one person = one customer',\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)\nFROM resolved;\n\n\n-- ---------------------------------------------------------------------\n-- 90f \u00b7 Semantic Property Graph with DDL MEASUREs (cdp_semantic_graph)\n--\n-- Exposes the identity graph as a star-shaped semantic layer with DDL\n-- MEASURE() definitions so GRAPH_EXPAND + AGG() aggregates metrics\n-- exactly once per entity key (preventing fan-out double counting across\n-- profile-identifier links).\n--\n-- Shape:\n--   Membership (root, one row per current record-identifier link)\n--     |-- LINKS_PROFILE ----> Profile    (with baseline_cc, weighted_cc,\n--     |                                   and composable_cdp clusters)\n--     '-- LINKS_IDENTIFIER -> Identifier (with degree, IDF, promiscuity)\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.sem_membership`\nAS\nSELECT\n  record_id,\n  record_id                 AS profile_id,\n  identifier_id,\n  identifier_type,\n  IF(is_anchor, 1, 0)       AS anchor_flag,\n  sources,\n  first_seen_in,\n  from_ts                   AS available_from_ts\nFROM `${CDP_PROJECT}.${CDP_DS}.has_identifier`;\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.sem_identifier`\nAS\nSELECT\n  identifier_id,\n  identifier_type,\n  degree,\n  degree_all_time,\n  idf_weight,\n  is_promiscuous,\n  IF(is_promiscuous, 1, 0)  AS promiscuous_flag,\n  sources,\n  first_seen_ts,\n  last_seen_ts\nFROM `${CDP_PROJECT}.${CDP_DS}.identifier`;\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.sem_profile`\nAS\nWITH id_summary AS (\n  SELECT\n    h.record_id,\n    COUNT(DISTINCT h.identifier_id)                            AS n_identifiers,\n    COUNTIF(h.is_anchor)                                       AS n_anchor,\n    LOGICAL_OR(h.identifier_type = 'email')                    AS has_email,\n    LOGICAL_OR(h.identifier_type = 'phone')                    AS has_phone,\n    LOGICAL_OR(h.identifier_type = 'loyalty_account')          AS has_loyalty_id,\n    MAX(IF(i.is_promiscuous, 1, 0))                            AS touches_hub_flag\n  FROM `${CDP_PROJECT}.${CDP_DS}.has_identifier` AS h\n  JOIN `${CDP_PROJECT}.${CDP_DS}.identifier`     AS i USING (identifier_id)\n  GROUP BY h.record_id\n),\nlatest AS (\n  SELECT\n    a.record_id,\n    a.method,\n    a.wesid,\n    c.n_profiles AS cluster_size,\n    c.is_hairball\n  FROM `${CDP_PROJECT}.${CDP_DS}.wesid_assignments` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.wesid_cluster`     AS c\n    ON c.wesid = a.wesid AND c.run_id = a.run_id\n  WHERE a.is_latest AND c.is_latest\n)\nSELECT\n  p.record_id,\n  p.record_id                                                  AS profile_id,\n  p.source_system                                              AS sources,\n  1                                                            AS n_sources,\n  IFNULL(s.n_identifiers, 0)                                   AS n_identifiers,\n  IFNULL(s.n_anchor, 0)                                        AS n_anchor,\n  IFNULL(s.has_email, FALSE)                                   AS has_email,\n  IFNULL(s.has_phone, FALSE)                                   AS has_phone,\n  IFNULL(s.has_loyalty_id, FALSE)                              AS has_loyalty_id,\n  p.source_system                                              AS first_seen_in,\n  p.source_ts                                                  AS first_seen_ts,\n  IFNULL(s.touches_hub_flag, 0)                                AS touches_hub_flag,\n  b.wesid                                                      AS baseline_wesid,\n  b.cluster_size                                               AS baseline_cluster_size,\n  IF(b.is_hairball, 1, 0)                                      AS baseline_hairball_flag,\n  w.wesid                                                      AS weighted_wesid,\n  w.cluster_size                                               AS weighted_cluster_size,\n  IF(w.is_hairball, 1, 0)                                      AS weighted_hairball_flag,\n  c.wesid                                                      AS composable_wesid,\n  c.cluster_size                                               AS composable_cluster_size,\n  IF(c.is_hairball, 1, 0)                                      AS composable_hairball_flag,\n  IF(b.cluster_size != c.cluster_size, 1, 0)                   AS baseline_composable_disagree_flag\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nLEFT JOIN id_summary AS s USING (record_id)\nLEFT JOIN latest     AS b ON b.record_id = p.record_id AND b.method = 'baseline_cc'\nLEFT JOIN latest     AS w ON w.record_id = p.record_id AND w.method = 'weighted_cc'\nLEFT JOIN latest     AS c ON c.record_id = p.record_id AND c.method = 'composable_cdp';\n\nCREATE OR REPLACE PROPERTY GRAPH `${CDP_PROJECT}.${CDP_DS}.cdp_semantic_graph`\n  NODE TABLES (\n    `${CDP_PROJECT}.${CDP_DS}.sem_membership` AS Membership\n      KEY (record_id, identifier_id)\n      DEFAULT LABEL OPTIONS (\n        description = 'One current link between a customer source record and a normalised identifier. Root table of the semantic graph.',\n        synonyms = ['link', 'identifier membership', 'record-identifier pair']\n      )\n      PROPERTIES (\n        record_id         OPTIONS (description = 'Customer source record key', synonyms = ['profile_id', 'customer id']),\n        profile_id        OPTIONS (description = 'Alias of record_id for cross-notebook compatibility'),\n        identifier_id     OPTIONS (description = 'Normalised identifier value (EM:, PH:, AC:, DV:)'),\n        identifier_type   OPTIONS (description = 'Kind of identifier: email, phone, loyalty_account, device_id', synonyms = ['id type']),\n        anchor_flag       OPTIONS (description = '1 if primary anchor identifier in the source system, else 0'),\n        sources           OPTIONS (description = 'Originating source system (CRM, LOYALTY, ECOMM, POS, CALL, SURVEY)', synonyms = ['source systems', 'brands']),\n        first_seen_in     OPTIONS (description = 'Source system where the link was first observed'),\n        available_from_ts OPTIONS (description = 'Timestamp when the link was recorded'),\n        MEASURE(COUNT(record_id))   AS link_count        OPTIONS (description = 'Number of record-identifier links', synonyms = ['links', 'memberships']),\n        MEASURE(SUM(anchor_flag))   AS anchor_link_count OPTIONS (description = 'Number of links that are anchor identifiers')\n      ),\n    `${CDP_PROJECT}.${CDP_DS}.sem_profile` AS Profile\n      KEY (record_id)\n      DEFAULT LABEL OPTIONS (\n        description = 'A customer source record plus where each identity-resolution method (baseline_cc, weighted_cc, composable_cdp) placed it.',\n        synonyms = ['customer', 'customer profile', 'record']\n      )\n      PROPERTIES (\n        record_id                         OPTIONS (description = 'Source record key', synonyms = ['profile_id']),\n        profile_id                        OPTIONS (description = 'Customer profile key'),\n        sources                           OPTIONS (description = 'Originating source system', synonyms = ['brand', 'source system']),\n        n_sources                         OPTIONS (description = 'Number of source systems for this record'),\n        n_identifiers                     OPTIONS (description = 'Number of current identifiers held by the record'),\n        n_anchor                          OPTIONS (description = 'Number of anchor identifiers held'),\n        has_email                         OPTIONS (description = 'Record holds an email address'),\n        has_phone                         OPTIONS (description = 'Record holds a phone number'),\n        has_loyalty_id                    OPTIONS (description = 'Record holds a loyalty account number'),\n        first_seen_in                     OPTIONS (description = 'Originating source system'),\n        first_seen_ts                     OPTIONS (description = 'Record timestamp'),\n        touches_hub_flag                  OPTIONS (description = '1 if the record touches at least one promiscuous hub identifier (degree > 25), else 0'),\n        baseline_wesid                    OPTIONS (description = 'Cluster assigned by baseline_cc (naive connected components)'),\n        baseline_cluster_size             OPTIONS (description = 'Number of records in the baseline_cc cluster'),\n        baseline_hairball_flag            OPTIONS (description = '1 if the baseline_cc cluster is a hairball (>= 20 records), else 0'),\n        weighted_wesid                    OPTIONS (description = 'Cluster assigned by weighted_cc (IDF-weighted bipartite projection)'),\n        weighted_cluster_size             OPTIONS (description = 'Number of records in the weighted_cc cluster'),\n        weighted_hairball_flag            OPTIONS (description = '1 if the weighted_cc cluster is a hairball (>= 20 records), else 0'),\n        composable_wesid                  OPTIONS (description = 'Cluster assigned by composable_cdp (2-Hop Graph + Hybrid Search + Gemini Adjudicator + Contradiction Guard)'),\n        composable_cluster_size           OPTIONS (description = 'Number of records in the composable_cdp cluster'),\n        composable_hairball_flag          OPTIONS (description = '1 if the composable_cdp cluster is a hairball (>= 20 records), else 0'),\n        baseline_composable_disagree_flag OPTIONS (description = '1 if baseline_cc and composable_cdp place the record in clusters of different size'),\n        MEASURE(COUNT(record_id))                         AS profile_count                      OPTIONS (description = 'Number of distinct customer records', synonyms = ['profiles', 'records']),\n        MEASURE(AVG(n_identifiers))                       AS avg_identifiers_per_profile        OPTIONS (description = 'Average number of current identifiers per record'),\n        MEASURE(SUM(touches_hub_flag))                    AS profiles_touching_hubs             OPTIONS (description = 'Number of records holding at least one promiscuous hub identifier'),\n        MEASURE(COUNT(DISTINCT baseline_wesid))           AS baseline_wesid_count               OPTIONS (description = 'Number of distinct clusters produced by baseline_cc'),\n        MEASURE(COUNT(DISTINCT weighted_wesid))           AS weighted_wesid_count               OPTIONS (description = 'Number of distinct clusters produced by weighted_cc'),\n        MEASURE(COUNT(DISTINCT composable_wesid))         AS composable_wesid_count             OPTIONS (description = 'Number of distinct clusters produced by composable_cdp'),\n        MEASURE(SUM(baseline_hairball_flag))              AS profiles_in_baseline_hairballs     OPTIONS (description = 'Number of records inside a hairball under baseline_cc'),\n        MEASURE(SUM(weighted_hairball_flag))              AS profiles_in_weighted_hairballs     OPTIONS (description = 'Number of records inside a hairball under weighted_cc'),\n        MEASURE(SUM(composable_hairball_flag))            AS profiles_in_composable_hairballs   OPTIONS (description = 'Number of records inside a hairball under composable_cdp'),\n        MEASURE(MAX(baseline_cluster_size))               AS largest_baseline_cluster           OPTIONS (description = 'Largest baseline_cc cluster size'),\n        MEASURE(MAX(weighted_cluster_size))               AS largest_weighted_cluster           OPTIONS (description = 'Largest weighted_cc cluster size'),\n        MEASURE(MAX(composable_cluster_size))             AS largest_composable_cluster         OPTIONS (description = 'Largest composable_cdp cluster size'),\n        MEASURE(AVG(baseline_cluster_size))               AS avg_baseline_cluster_size          OPTIONS (description = 'Average baseline_cc cluster size'),\n        MEASURE(AVG(composable_cluster_size))             AS avg_composable_cluster_size        OPTIONS (description = 'Average composable_cdp cluster size'),\n        MEASURE(SUM(baseline_composable_disagree_flag))   AS review_candidates                  OPTIONS (description = 'Number of records where baseline_cc and composable_cdp disagree on cluster size')\n      ),\n    `${CDP_PROJECT}.${CDP_DS}.sem_identifier` AS Identifier\n      KEY (identifier_id)\n      DEFAULT LABEL OPTIONS (\n        description = 'A normalised identifier with degree, IDF rarity weight, and promiscuity.',\n        synonyms = ['identity key', 'contact point']\n      )\n      PROPERTIES (\n        identifier_id    OPTIONS (description = 'Normalised identifier value'),\n        identifier_type  OPTIONS (description = 'Kind of identifier: email, phone, loyalty_account, device_id'),\n        degree           OPTIONS (description = 'Number of distinct records currently holding this identifier'),\n        degree_all_time  OPTIONS (description = 'Number of distinct records that ever held this identifier'),\n        idf_weight       OPTIONS (description = 'IDF rarity weight ln(N / degree)'),\n        is_promiscuous   OPTIONS (description = 'TRUE if shared by more than 25 records (hub)'),\n        promiscuous_flag OPTIONS (description = '1 if promiscuous hub, else 0'),\n        sources          OPTIONS (description = 'Pipe-separated source systems that reported the identifier'),\n        first_seen_ts    OPTIONS (description = 'First timestamp the identifier was observed'),\n        last_seen_ts     OPTIONS (description = 'Most recent timestamp the identifier was observed'),\n        MEASURE(COUNT(identifier_id))  AS identifier_count             OPTIONS (description = 'Number of distinct identifiers'),\n        MEASURE(SUM(promiscuous_flag)) AS promiscuous_identifier_count OPTIONS (description = 'Number of promiscuous hub identifiers'),\n        MEASURE(MAX(degree))           AS max_degree                   OPTIONS (description = 'Largest number of records sharing one identifier'),\n        MEASURE(AVG(degree))           AS avg_degree                   OPTIONS (description = 'Average number of records per identifier'),\n        MEASURE(AVG(idf_weight))       AS avg_idf_weight               OPTIONS (description = 'Average IDF rarity weight')\n      )\n  )\n  EDGE TABLES (\n    `${CDP_PROJECT}.${CDP_DS}.sem_membership` AS LINKS_PROFILE\n      KEY (record_id, identifier_id)\n      SOURCE KEY (record_id, identifier_id) REFERENCES Membership (record_id, identifier_id)\n      DESTINATION KEY (record_id) REFERENCES Profile (record_id)\n      DEFAULT LABEL OPTIONS (description = 'The profile/record side of an identifier membership link')\n      NO PROPERTIES,\n    `${CDP_PROJECT}.${CDP_DS}.sem_membership` AS LINKS_IDENTIFIER\n      KEY (record_id, identifier_id)\n      SOURCE KEY (record_id, identifier_id) REFERENCES Membership (record_id, identifier_id)\n      DESTINATION KEY (identifier_id) REFERENCES Identifier (identifier_id)\n      DEFAULT LABEL OPTIONS (description = 'The identifier side of an identifier membership link')\n      NO PROPERTIES\n  );\n\n","sql_lines":652,"results":[{"view":"v_household_waste","columns":["duplicate_mailings_avoided","households","multi_person_households","multi_surname_households","pct_of_mailings_avoidable","people"],"rows":[{"duplicate_mailings_avoided":"111","households":"753","multi_person_households":"100","multi_surname_households":"30","pct_of_mailings_avoidable":"12.85","people":"864"}],"row_count":1},{"view":"v_shared_identifiers","columns":["assessment","identifier","identifier_type","is_personal_device","people","person_ids"],"rows":[{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"+61489347586","identifier_type":"PHONE","is_personal_device":"true","people":"3","person_ids":["PER-249933749b7fcb6b","PER-552f6a5486f2a32a","PER-6d1b116d06b4b808"]},{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"howard.jaxson@icloud.com","identifier_type":"EMAIL","is_personal_device":"false","people":"3","person_ids":["PER-30d09fc4b5ba4095","PER-46432a1a09e67c20","PER-4c7e0fed4c825679"]},{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"stacy
