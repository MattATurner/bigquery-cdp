he closure quietly\n-- asserts that A is C \u2014 even though A and C were never compared and are\n-- demonstrably different people.\n--\n-- This is the OVERMERGE_BAIT case in the generator, and it is the failure\n-- mode that turns a CDP into a data breach. So the closure is not\n-- trusted: every component is checked for internal contradiction.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.component_conflicts`\nAS\nWITH members AS (\n  SELECT c.comp, c.node AS record_id, p.dob, p.name_norm, p.account_number\n  FROM `${CDP_PROJECT}.${CDP_DS}.cc_pass1` AS c\n  JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS p ON p.record_id = c.node\n)\nSELECT\n  comp,\n  COUNT(*)                                                    AS members,\n  COUNT(DISTINCT dob)                                         AS distinct_dobs,\n  ARRAY_AGG(DISTINCT CAST(dob AS STRING) IGNORE NULLS\n            ORDER BY CAST(dob AS STRING))                     AS dobs,\n  -- More than one date of birth in a cluster means the cluster contains\n  -- more than one person. There is no benign reading of this.\n  COUNT(DISTINCT dob) > 1                                     AS dob_contradiction\nFROM members\nGROUP BY comp\nHAVING COUNT(DISTINCT dob) > 1;\n\n\n-- ---------------------------------------------------------------------\n-- 70d \u00b7 Pass two \u2014 prune, then re-resolve\n--\n-- Contradicted components are rebuilt using only edges strong enough to\n-- stand on their own: a shared account number, email, phone or date of\n-- birth, or a near-certain score. The weak middle link of an A\u2013B\u2013C chain\n-- falls away and the cluster splits where it should have split.\n--\n-- Edges outside contradicted components are untouched. A problem in one\n-- cluster does not get to raise the bar for everybody else.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.graph_edges_pruned`\nAS\nWITH suspect_nodes AS (\n  SELECT c.node\n  FROM `${CDP_PROJECT}.${CDP_DS}.cc_pass1` AS c\n  JOIN `${CDP_PROJECT}.${CDP_DS}.component_conflicts` AS x USING (comp)\n),\nlinks AS (\n  SELECT\n    d.record_id_a,\n    d.record_id_b,\n    d.confidence,\n    t.a_dob, t.b_dob,\n    t.acct_match, t.email_match, t.phone_match, t.dob_match, t.dob_conflict,\n    t.combined_score\n  FROM `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\n  JOIN `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS t\n    ON t.record_id_a = d.record_id_a AND t.record_id_b = d.record_id_b\n  WHERE d.decision = 'LINK'\n),\nundirected AS (\n  SELECT record_id_a AS u, record_id_b AS v, dob_conflict FROM links\n  UNION ALL\n  SELECT record_id_b AS u, record_id_a AS v, dob_conflict FROM links\n),\n-- Triangle support (local clustering consensus): an edge (a, b) that shares\n-- a common neighbour c with no DOB conflict belongs to a dense sub-cluster\n-- rather than a single weak bridge between two distinct people.\ntriangle_edges AS (\n  SELECT DISTINCT\n    l.record_id_a,\n    l.record_id_b\n  FROM links AS l\n  JOIN undirected AS e1\n    ON e1.u = l.record_id_a AND NOT e1.dob_conflict\n  JOIN undirected AS e2\n    ON e2.u = l.record_id_b AND e2.v = e1.v AND NOT e2.dob_conflict\n  WHERE e1.v != l.record_id_a AND e1.v != l.record_id_b\n),\nclassified AS (\n  SELECT\n    l.*,\n    (l.record_id_a IN (SELECT node FROM suspect_nodes)\n     OR l.record_id_b IN (SELECT node FROM suspect_nodes))        AS in_suspect_component,\n    -- In a component already proven to contain conflicting dates of birth,\n    -- an edge involving a NULL DOB cannot be trusted as a strong bridge\n    -- between two different people. Require explicit DOB agreement.\n    (NOT l.dob_conflict\n     AND l.a_dob IS NOT NULL AND l.b_dob IS NOT NULL\n     AND (l.acct_match OR l.email_match OR l.phone_match OR l.dob_match\n          OR l.combined_score >= 0.95))                           AS strong,\n    (tr.record_id_a IS NOT NULL AND NOT l.dob_conflict)           AS has_triangle_support\n  FROM links AS l\n  LEFT JOIN triangle_edges AS tr\n    ON tr.record_id_a = l.record_id_a AND tr.record_id_b = l.record_id_b\n),\nkept AS (\n  SELECT record_id_a, record_id_b\n  FROM classified\n  WHERE NOT in_suspect_component OR strong OR has_triangle_support\n)\nSELECT record_id_a AS src, record_id_b AS dst FROM kept\nUNION ALL\nSELECT record_id_b, record_id_a FROM kept;\n\nCALL `${CDP_PROJECT}.${CDP_DS}.sp_connected_components`(\n  '${CDP_PROJECT}.${CDP_DS}.graph_nodes',\n  '${CDP_PROJECT}.${CDP_DS}.graph_edges_pruned',\n  '${CDP_PROJECT}.${CDP_DS}.cc_final',\n  20\n);\n\n\n-- ---------------------------------------------------------------------\n-- 70e \u00b7 Stable person identifiers\n--\n-- The hardest unglamorous problem in the whole build.\n--\n-- A person_id derived from the cluster itself \u2014 the minimum record_id,\n-- a hash of the members \u2014 changes every time a record is added or\n-- removed. Downstream, that means audience memberships churn, suppression\n-- lists break, and a customer who was excluded from a campaign last month\n-- silently reappears. The identifier has to outlive the cluster that\n-- produced it.\n--\n-- So identifiers are persisted in a crosswalk and inherited: a cluster\n-- adopts the person_id already held by the plurality of its members, and\n-- only a genuinely new cluster mints a new one. Splits and merges are\n-- recorded rather than applied silently.\n-- ---------------------------------------------------------------------\n\nCREATE TABLE IF NOT EXISTS `${CDP_PROJECT}.${CDP_DS}.person_crosswalk`\n(\n  record_id  STRING    NOT NULL,\n  person_id  STRING    NOT NULL,\n  first_seen TIMESTAMP NOT NULL,\n  last_seen  TIMESTAMP NOT NULL\n)\nCLUSTER BY record_id\nOPTIONS (\n  description = 'Durable record_id \u2192 person_id assignment. Survives re-runs so that '\n             || 'downstream audiences and suppression lists remain stable.'\n);\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_assignment`\nAS\nWITH comp_members AS (\n  SELECT comp, node AS record_id FROM `${CDP_PROJECT}.${CDP_DS}.cc_final`\n),\n-- Which existing person_id does each component already mostly hold?\ninherited AS (\n  SELECT comp, person_id, COUNT(*) AS n\n  FROM comp_members\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_crosswalk` USING (record_id)\n  GROUP BY comp, person_id\n),\nbest AS (\n  SELECT comp, person_id AS inherited_person_id\n  FROM (\n    SELECT comp, person_id,\n           ROW_NUMBER() OVER (PARTITION BY comp ORDER BY n DESC, person_id)      AS rn_comp,\n           -- Ensure a historical person_id can be inherited by at most ONE\n           -- component, so that a split cluster does not re-merge downstream.\n           ROW_NUMBER() OVER (PARTITION BY person_id ORDER BY n DESC, comp)      AS rn_person\n    FROM inherited\n  )\n  WHERE rn_comp = 1 AND rn_person = 1\n)\nSELECT\n  m.comp,\n  m.record_id,\n  COALESCE(\n    b.inherited_person_id,\n    -- Minted from the component anchor. Deterministic for a given run, and\n    -- immediately persisted so it never needs to be derived again.\n    CONCAT('PER-', FORMAT('%016x', FARM_FINGERPRINT(m.comp) & 0x7fffffffffffffff))\n  ) AS person_id,\n  b.inherited_person_id IS NULL AS newly_minted\nFROM comp_members AS m\nLEFT JOIN best AS b USING (comp);\n\nMERGE `${CDP_PROJECT}.${CDP_DS}.person_crosswalk` AS x\nUSING `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\nON x.record_id = a.record_id\nWHEN MATCHED THEN\n  UPDATE SET person_id = a.person_id, last_seen = CURRENT_TIMESTAMP()\nWHEN NOT MATCHED THEN\n  INSERT (record_id, person_id, first_seen, last_seen)\n  VALUES (a.record_id, a.person_id, CURRENT_TIMESTAMP(), CURRENT_TIMESTAMP());\n\n\n-- ---------------------------------------------------------------------\n-- 70f \u00b7 Resolution graph\n--\n-- Every edge that was considered, with how it was decided and why. This\n-- is the audit surface: \"why is this record on this profile\" has a\n-- one-row answer.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.resolution_edges`\nCLUSTER BY record_id_a, record_id_b\nAS\nSELECT\n  d.record_id_a,\n  d.record_id_b,\n  d.decision,\n  d.decided_by,\n  d.confidence,\n  d.rationale,\n  d.contradiction,\n  d.retrieved_by,\n  d.combined_score,\n  d.rule_score,\n  d.similarity,\n  pa.person_id AS person_id_a,\n  pb.person_id AS person_id_b,\n  -- An edge the pruning step removed: it was accepted, but the cluster it\n  -- would have created contradicted itself.\n  d.decision = 'LINK' AND pa.person_id != pb.person_id AS suppressed_by_contradiction\nFROM `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pa ON pa.record_id = d.record_id_a\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pb ON pb.record_id = d.record_id_b;\n\n\n-- ---------------------------------------------------------------------\n-- 70g \u00b7 Mastered graph \u2014 nodes\n--\n-- Seven node types. Emails, phones, addresses and accounts are first\n-- class nodes rather than attributes, because that is what makes the\n-- interesting questions cheap: \"who else uses this phone number\", \"how\n-- many people share this address\", \"which accounts span households\".\n-- ---------------------------------------------------------------------\n\n-- 1 \u00b7 Person\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_person`\nCLUSTER BY person_id\nAS\nSELECT\n  a.person_id,\n  COUNT(*)                                     AS source_record_count,\n  COUNT(DISTINCT p.source_system)              AS source_system_count,\n  ARRAY_AGG(DISTINCT p.source_system ORDER BY p.source_system) AS source_systems,\n  MAX(p.identity_strength)                     AS best_identity_strength,\n  MIN(p.source_ts)                             AS first_seen_at,\n  MAX(p.source_ts)                             AS last_seen_at,\n  LOGICAL_OR(a.newly_minted)                   AS minted_this_run\nFROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\nJOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS p ON p.record_id = a.record_id\nGROUP BY a.person_id;\n\n-- 2 \u00b7 Source record\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_source_record`\nCLUSTER BY record_id\nAS\nSELECT\n  p.record_id,\n  p.source_system,\n  p.source_trust,\n  p.source_natural_key,\n  p.source_ts,\n  p.raw_name,\n  p.raw_postcode,\n  p.identity_strength,\n  p.evidence_note,\n  p.injection_attempt\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p;\n\n-- 3 \u00b7 Address\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_address`\nAS\nSELECT\n  TO_HEX(SHA256(CONCAT(address_norm, '|', IFNULL(postcode_norm, '')))) AS address_id,\n  address_norm,\n  postcode_norm,\n  postcode_out,\n  COUNT(DISTINCT record_id) AS record_count\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records`\nWHERE address_norm IS NOT NULL\nGROUP BY address_norm, postcode_norm, postcode_out;\n\n-- 4 \u00b7 Email\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_email`\nAS\nSELECT\n  email_norm AS email_id,\n  email_norm,\n  REGEXP_EXTRACT(email_norm, r'@(.+)$') AS domain,\n  COUNT(DISTINCT record_id)             AS record_count\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records`\nWHERE email_norm IS NOT NULL\nGROUP BY email_norm;\n\n-- 5 \u00b7 Phone\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_phone`\nAS\nSELECT\n  phone_e164 AS phone_id,\n  phone_e164,\n  -- Mobiles are personal; landlines are household-level, and that difference\n  -- should change how much weight a shared number carries.\n  --\n  -- Every Australian mobile number begins 04, so once norm_phone applies the\n  -- +61 country code and drops the trunk zero they all begin '+614'. Australia\n  -- has exactly four geographic area codes -- 02, 03, 07 and 08 -- which\n  -- normalise to +612, +613, +617 and +618. There is no area code 4, so no\n  -- landline can begin '+614' and the test needs no further qualification.\n  --\n  -- Keep this constant pointed at whatever norm_phone actually emits. It has\n  -- been wrong before: the corpus was relocalised, norm_phone changed its\n  -- output prefix, and this consumer was not updated, so the test matched\n  -- nothing and is_mobile was FALSE for every record in the corpus -- silently,\n  -- because a predicate that is always false produces no error and no empty\n  -- result, just a quietly wrong weight. Worth remembering when localising\n  -- anything else here: update the producer AND grep for its output format.\n  STARTS_WITH(phone_e164, '+614') AS is_mobile,\n  COUNT(DISTINCT record_id)       AS record_count\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records`\nWHERE phone_e164 IS NOT NULL\nGROUP BY phone_e164;\n\n-- 6 \u00b7 Loyalty account\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_account`\nAS\nSELECT\n  account_number AS account_id,\n  account_number,\n  COUNT(DISTINCT record_id) AS record_count\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records`\nWHERE account_number IS NOT NULL\nGROUP BY account_number;\n\n-- 7 \u00b7 Household\n--\n-- Inferred from a shared address, and deliberately NOT from a shared\n-- surname: that would miss unmarried partners, lodgers and house shares,\n-- and would wrongly group unrelated people who happen to share a common\n-- surname in a block of flats.\n--\n-- A household is an inference, not a fact. It is useful for targeting and\n-- suppression. It must never be used as evidence that two people are one\n-- person.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.node_household`\nAS\nSELECT\n  CONCAT('HH-', SUBSTR(address_id, 1, 16)) AS household_id,\n  address_id,\n  address_norm,\n  postcode_norm,\n  person_count\nFROM (\n  SELECT\n    TO_HEX(SHA256(CONCAT(p.address_norm, '|', IFNULL(p.postcode_norm, '')))) AS address_id,\n    p.address_norm,\n    p.postcode_norm,\n    COUNT(DISTINCT a.person_id) AS person_count\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\n  WHERE p.address_norm IS NOT NULL AND p.postcode_norm IS NOT NULL\n  GROUP BY address_norm, postcode_norm\n);\n\n\n-- ---------------------------------------------------------------------\n-- 70h \u00b7 Mastered graph \u2014 edges\n-- ---------------------------------------------------------------------\n\n-- 1 \u00b7 SourceRecord \u2014RESOLVES_TO\u2192 Person\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to`\nCLUSTER BY person_id\nAS\nSELECT\n  a.record_id,\n  a.person_id,\n  p.source_system,\n  p.source_trust\nFROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\nJOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS p ON p.record_id = a.record_id;\n\n-- 2 \u00b7 Person \u2014LIVES_AT\u2192 Address\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_lives_at`\nAS\nSELECT\n  a.person_id,\n  TO_HEX(SHA256(CONCAT(p.address_norm, '|', IFNULL(p.postcode_norm, '')))) AS address_id,\n  MAX(p.source_ts)                    AS last_asserted_at,\n  MAX(p.source_trust)                 AS best_source_trust,\n  COUNT(*)                            AS assertions,\n  -- The most recently asserted address from a trustworthy source is the\n  -- current one. Everything else is history, and history is worth keeping:\n  -- a stale address is how you find someone who has moved.\n  ROW_NUMBER() OVER (\n    PARTITION BY a.person_id\n    ORDER BY MAX(p.source_trust) DESC, MAX(p.source_ts) DESC\n  ) = 1                               AS is_current\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\nWHERE p.address_norm IS NOT NULL\nGROUP BY a.person_id, address_id;\n\n-- 3 \u00b7 Person \u2014MEMBER_OF\u2192 Household\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_member_of`\nAS\nSELECT DISTINCT\n  e.person_id,\n  h.household_id\nFROM `${CDP_PROJECT}.${CDP_DS}.edge_lives_at` AS e\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_household` AS h USING (address_id)\nWHERE e.is_current;\n\n-- 4 \u00b7 Person \u2014HAS_EMAIL\u2192 Email\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_has_email`\nAS\nSELECT\n  a.person_id,\n  p.email_norm AS email_id,\n  MAX(p.source_trust) AS best_source_trust,\n  MAX(p.source_ts)    AS last_asserted_at,\n  COUNT(*)            AS assertions\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\nWHERE p.email_norm IS NOT NULL\nGROUP BY a.person_id, p.email_norm;\n\n-- 5 \u00b7 Person \u2014HAS_PHONE\u2192 Phone\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_has_phone`\nAS\nSELECT\n  a.person_id,\n  p.phone_e164 AS phone_id,\n  MAX(p.source_trust) AS best_source_trust,\n  MAX(p.source_ts)    AS last_asserted_at,\n  COUNT(*)            AS assertions\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\nWHERE p.phone_e164 IS NOT NULL\nGROUP BY a.person_id, p.phone_e164;\n\n-- 6 \u00b7 Person \u2014HOLDS_ACCOUNT\u2192 LoyaltyAccount\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_holds_account`\nAS\nSELECT\n  a.person_id,\n  p.account_number AS account_id,\n  COUNT(*) AS assertions\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\nWHERE p.account_number IS NOT NULL\nGROUP BY a.person_id, p.account_number;\n\n-- 7 \u00b7 Person \u2014SUSPECTED_LINK\u2192 Person\n--\n-- The steward queue, expressed as graph edges rather than a side table.\n-- These are pairs the system refused to decide. Keeping them in the graph\n-- means downstream consumers can see that a profile is provisional,\n-- instead of discovering it when a customer complains.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_suspected_link`\nAS\nSELECT DISTINCT\n  LEAST(pa.person_id, pb.person_id)    AS person_id_a,\n  GREATEST(pa.person_id, pb.person_id) AS person_id_b,\n  d.confidence,\n  d.rationale,\n  d.contradiction,\n  d.decided_by,\n  d.retrieved_by\nFROM `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pa ON pa.record_id = d.record_id_a\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS pb ON pb.record_id = d.record_id_b\nWHERE d.decision = 'STEWARD'\n  AND pa.person_id != pb.person_id;\n\n-- 8 \u00b7 Person \u2014RELATED_TO\u2192 Person\n--\n-- Asserted relationships, taken only from what somebody actually said.\n-- The call transcript case \u2014 \"I'm ringing about my wife's account\" \u2014\n-- produces a relationship edge, which is the correct outcome. The wrong\n-- outcome, and the easy one, is a merge.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.edge_related_to`\nAS\nSELECT DISTINCT\n  caller.person_id                     AS person_id,\n  holder.person_id                     AS related_person_id,\n  IFNULL(c.relationship_to_account, 'UNSPECIFIED') AS relationship,\n  'CALL_TRANSCRIPT'                    AS asserted_by,\n  c.record_id                          AS evidence_record_id\nFROM `${CDP_PROJECT}.${CDP_DS}.stg_call_entities` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS caller\n  ON caller.record_id = c.record_id\n-- The account holder is identified by the account number the caller quoted.\nJOIN `${CDP_PROJECT}.${CDP_DS}.edge_holds_account` AS ha\n  ON ha.account_id = c.account_number\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_person` AS holder\n  ON holder.person_id = ha.person_id\nWHERE NOT c.caller_is_account_holder\n  AND c.account_number IS NOT NULL\n  AND caller.person_id != ha.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 70i \u00b7 Shape of the result\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_graph_summary` AS\nSELECT 'node \u00b7 person'         AS element, COUNT(*) AS n FROM `${CDP_PROJECT}.${CDP_DS}.node_person`\nUNION ALL SELECT 'node \u00b7 source record', COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_source_record`\nUNION ALL SELECT 'node \u00b7 household',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_household`\nUNION ALL SELECT 'node \u00b7 address',       COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_address`\nUNION ALL SELECT 'node \u00b7 email',         COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_email`\nUNION ALL SELECT 'node \u00b7 phone',         COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_phone`\nUNION ALL SELECT 'node \u00b7 account',       COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.node_account`\nUNION ALL SELECT 'edge \u00b7 resolves_to',   COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_resolves_to`\nUNION ALL SELECT 'edge \u00b7 lives_at',      COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_lives_at`\nUNION ALL SELECT 'edge \u00b7 member_of',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_member_of`\nUNION ALL SELECT 'edge \u00b7 has_email',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_email`\nUNION ALL SELECT 'edge \u00b7 has_phone',     COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_phone`\nUNION ALL SELECT 'edge \u00b7 holds_account', COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_holds_account`\nUNION ALL SELECT 'edge \u00b7 suspected_link',COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_suspected_link`\nUNION ALL SELECT 'edge \u00b7 related_to',    COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.edge_related_to`;\n\n\n-- ---------------------------------------------------------------------\n-- 70j \u00b7 Cluster size distribution\n--\n-- The distribution is more informative than the count. A long tail of\n-- enormous clusters is the signature of runaway transitive closure, and\n-- it is visible here before anyone looks at a single profile.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_cluster_sizes` AS\nSELECT\n  source_record_count AS cluster_size,\n  COUNT(*)            AS people,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2) AS pct_of_people\nFROM `${CDP_PROJECT}.${CDP_DS}.node_person`\nGROUP BY cluster_size\nORDER BY cluster_size;\n","sql_lines":648,"results":[{"view":"v_graph_summary","columns":["element","n"],"rows":[{"element":"node \u00b7 person","n":"12878"},{"element":"node \u00b7 source record","n":"20000"},{"element":"node \u00b7 household","n":"7641"},{"element":"node \u00b7 address","n":"8598"},{"element":"node \u00b7 email","n":"7739"},{"element":"node \u00b7 phone","n":"6669"},{"element":"node \u00b7 account","n":"4309"},{"element":"edge \u00b7 resolves_to","n":"20000"},{"element":"edge \u00b7 lives_at","n":"9088"},{"element":"edge \u00b7 member_of","n":"6435"},{"element":"edge \u00b7 has_email","n":"7875"},{"element":"edge \u00b7 has_phone","n":"6710"},{"element":"edge \u00b7 holds_account","n":"4327"},{"element":"edge \u00b7 suspected_link","n":"2874"},{"element":"edge \u00b7 related_to","n":"1"}],"row_count":15},{"view":"v_cluster_sizes","columns":["cluster_size","pct_of_people","people"],"rows":[{"cluster_size":"1","pct_of_people":"63.07","people":"8122"},{"cluster_size":"2","pct_of_people":"23.04","people":"2967"},{"cluster_size":"3","pct_of_people":"10.16","people":"1308"},{"cluster_size":"4","pct_of_people":"3.3","people":"425"},{"cluster_size":"5","pct_of_people":"0.29","people":"37"},{"cluster_size":"6","pct_of_people":"0.11","people":"14"},{"cluster_size":"8","pct_of_people":"0.03","people":"4"},{"cluster_size":"19","pct_of_people":"0.01","people":"1"}],"row_count":8}],"run":{"statements":31,"steps":[{"op":"create procedure","object":"sp_connected_components","kind":"routine","rows":null},{"op":"create table","object":"%s","kind":"table","rows":null},{"op":"create table","object":"%s_next","kind":"table","rows":null},{"op":"create table","object":"%s","kind":"table","rows":null},{"op":"create table","object":"graph_nodes","kind":"table","rows":20000},{"op":"create table","object":"graph_edges_all","kind":"table","rows":13994},{"op":"call procedure","object":"sp_connected_components","kind":"routine","rows":null},{"op":"create table","object":"component_conflicts","kind":"table","rows":11},{"op":"create table","object":"graph_edges_pruned","kind":"table","rows":13930},{"op":"call procedure","object":"sp_connected_components","kind":"routine","rows":null},{"op":"create table if absent","object":"person_crosswalk","kind":"table","rows":36079},{"op":"create table","object":"person_assignment","kind":"table","rows":20000},{"op":"merge into","object":"person_crosswalk","kind":"table","rows":36079},{"op":"create table","object":"resolution_edges","kind":"table","rows":72883},{"op":"create table","object":"node_person","kind":"table","rows":12878},{"op":"create table","object":"node_source_record","kind":"table","rows":20000},{"op":"create table","object":"node_address","kind":"table","rows":8598},{"op":"create table","object":"node_email","kind":"table","rows":7739},{"op":"create table","object":"node_phone","kind":"table","rows":6669},{"op":"create table","object":"node_account","kind":"table","rows":4309},{"op":"create table","object":"node_household","kind":"table","rows":7641},{"op":"create table","object":"edge_resolves_to","kind":"table","rows":20000},{"op":"create table","object":"edge_lives_at","kind":"table","rows":9088},{"op":"create table","object":"edge_member_of","kind":"table","rows":6435},{"op":"create table","object":"edge_has_email","kind":"table","rows":7875},{"op":"create table","object":"edge_has_phone","kind":"table","rows":6710},{"op":"create table","object":"edge_holds_account","kind":"table","rows":4327},{"op":"create table","object":"edge_suspected_link","kind":"table","rows":2649},{"op":"create table","object":"edge_related_to","kind":"table","rows":1},{"op":"create view","object":"v_graph_summary","kind":"view","rows":0},{"op":"create view","object":"v_cluster_sizes","kind":"view","rows":0}],"inputs":[{"object":"cc_final","rows":20000,"bytes":568376,"modified":"2026-09-15 23:10:15.965+00","dataset":"cdp","kind":""},{"object":"cc_pass1","rows":20000,"bytes":568405,"modified":"2026-09-15 23:09:40.683+00","dataset":"cdp","kind":""},{"object":"match_decisions","rows":72883,"bytes":22428786,"modified":"2026-09-15 23:08:37.317+00","dataset":"cdp","kind":"table"},{"object":"pair_tiers","rows":10773842,"bytes":5751979787,"modified":"2026-09-15 23:07:24.604+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7050270,"modified":"2026-09-15 10:01:14.980+00","dataset":"cdp","kind":"table"},{"object":"party_search","rows":20000,"bytes":496278562,"modified":"2026-09-15 10:14:56.234+00","dataset":"cdp","kind":"table"},{"object":"stg_call_entities","rows":442,"bytes":95985,"modified":"2026-09-15 09:58:12.738+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"component_conflicts","rows":11,"bytes":624,"modified":"2026-09-15 23:09:42.497+00","dataset":"cdp","kind":"table"},{"object":"edge_has_email","rows":7875,"bytes":554571,"modified":"2026-09-15 23:10:45.569+00","dataset":"cdp","kind":"table"},{"object":"edge_has_phone","rows":6710,"bytes":403485,"modified":"2026-09-15 23:10:47.600+00","dataset":"cdp","kind":"table"},{"object":"edge_holds_account","rows":4327,"bytes":185809,"modified":"2026-09-15 23:10:49.389+00","dataset":"cdp","kind":"table"},{"object":"edge_lives_at","rows":9088,"bytes":1012856,"modified":"2026-09-15 23:10:41.997+00","dataset":"cdp","kind":"table"},{"object":"edge_member_of","rows":6435,"bytes":276705,"modified":"2026-09-15 23:10:43.791+00","dataset":"cdp","kind":"table"},{"object":"edge_related_to","rows":1,"bytes":85,"modified":"2026-09-15 23:10:53.279+00","dataset":"cdp","kind":"table"},{"object":"edge_resolves_to","rows":20000,"bytes":1010778,"modified":"2026-09-15 23:10:40.180+00","dataset":"cdp","kind":"table"},{"object":"edge_suspected_link","rows":2649,"bytes":480905,"modified":"2026-09-15 23:10:51.492+00","dataset":"cdp","kind":"table"},{"object":"graph_edges_all","rows":13994,"bytes":398088,"modified":"2026-09-15 23:08:57.907+00","dataset":"cdp","kind":"table"},{"object":"graph_edges_pruned","rows":13930,"bytes":396254,"modified":"2026-09-15 23:09:45.210+00","dataset":"cdp","kind":"table"},{"object":"graph_nodes","rows":20000,"bytes":284194,"modified":"2026-09-15 23:08:56.129+00","dataset":"cdp","kind":"table"},{"object":"node_account","rows":4309,"bytes":146030,"modified":"2026-09-15 23:10:36.173+00","dataset":"cdp","kind":"table"},{"object":"node_address","rows":8598,"bytes":1053885,"modified":"2026-09-15 23:10:30.618+00","dataset":"cdp","kind":"table"},{"object":"node_email","rows":7739,"bytes":553005,"modified":"2026-09-15 23:10:32.375+00","dataset":"cdp","kind":"table"},{"object":"node_household","rows":7641,"bytes":1074769,"modified":"2026-09-15 23:10:38.205+00","dataset":"cdp","kind":"table"},{"object":"node_person","rows":12878,"bytes":922266,"modified":"2026-09-15 23:10:26.521+00","dataset":"cdp","kind":"table"},{"object":"node_phone","rows":6669,"bytes":248523,"modified":"2026-09-15 23:10:34.392+00","dataset":"cdp","kind":"table"},{"object":"node_source_record","rows":20000,"bytes":1637059,"modified":"2026-09-15 23:10:28.309+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028376,"modified":"2026-09-15 23:10:18.534+00","dataset":"cdp","kind":"table"},{"object":"person_crosswalk","rows":36079,"bytes":1883872,"modified":"2026-09-15 23:10:20.805+00","dataset":"cdp","kind":"table"},{"object":"resolution_edges","rows":72883,"bytes":25635638,"modified":"2026-09-15 23:10:24.307+00","dataset":"cdp","kind":"table"},{"object":"v_cluster_sizes","rows":0,"bytes":0,"modified":"2026-09-15 23:10:54.568+00","dataset":"cdp","kind":"view"},{"object":"v_graph_summary","rows":0,"bytes":0,"modified":"2026-09-15 23:10:53.908+00","dataset":"cdp","kind":"view"}]}},{"id":"80_survivorship","num":"80","title":"Survivorship","summary":"Picks the winning value per field when sources disagree, weighted by source trust.","sql":"-- =====================================================================\n-- 80 \u00b7 Survivorship\n--\n-- Resolution decides which records belong to one person. Survivorship\n-- decides what that person's name, address and phone number actually are\n-- when the records disagree \u2014 which they almost always do.\n--\n-- Two principles run through this stage:\n--\n--   1. Survivorship is per FIELD, not per record. The best address and\n--      the best email routinely come from different systems. Picking a\n--      single \"winning record\" and copying it wholesale throws away the\n--      one thing every other source was right about.\n--\n--   2. Every surviving value keeps its provenance. \"Where did this\n--      address come from, and when\" must be answerable in one query, by\n--      someone who was not in the room when the rules were written.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 80a \u00b7 Field assertions\n--\n-- Every value every source ever claimed, flattened to one row per\n-- assertion. Nothing is discarded here \u2014 the losing values are kept, and\n-- they are what makes the conflict count meaningful later.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_assertions`\nCLUSTER BY person_id, field\nAS\nSELECT\n  a.person_id,\n  p.record_id,\n  p.source_system,\n  p.source_trust,\n  p.source_ts,\n  f.field,\n  f.value_norm,\n  f.value_raw\nFROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id,\nUNNEST([\n  STRUCT('forename' AS field, p.forename_norm AS value_norm, COALESCE(NULLIF(p.raw_forename, ''), REGEXP_EXTRACT(p.raw_name, r'^\\S+'), p.forename_norm) AS value_raw),\n  STRUCT('surname',           p.surname_norm,                COALESCE(NULLIF(p.raw_surname, ''),  REGEXP_EXTRACT(p.raw_name, r'\\S+$'), p.surname_norm)),\n  STRUCT('full_name',         p.name_norm,                   p.raw_name),\n  STRUCT('address',           p.address_norm,                p.raw_address),\n  STRUCT('city',              UPPER(p.raw_city),             p.raw_city),\n  STRUCT('postcode',          p.postcode_norm,               p.raw_postcode),\n  STRUCT('email',             p.email_norm,                  p.raw_email),\n  STRUCT('phone',             p.phone_e164,                  p.raw_phone),\n  STRUCT('dob',               CAST(p.dob AS STRING),         CAST(p.dob AS STRING)),\n  STRUCT('account_number',    p.account_number,              p.account_number)\n]) AS f\nWHERE f.value_norm IS NOT NULL AND f.value_norm != '';\n\n\n-- ---------------------------------------------------------------------\n-- 80b \u00b7 The rule\n--\n-- Ordered, and the order is the policy:\n--\n--   1. source trust        a CRM address beats a bought one, always\n--   2. recency             within a trust tier, newer wins \u2014 this is what\n--                          makes a house move propagate\n--   3. corroboration       more sources asserting the same value\n--   4. record_id           a deterministic tie-break, so the same inputs\n--                          always produce the same golden record\n--\n-- Step 4 looks trivial and is not. Without it, two runs over identical\n-- data can disagree, and a customer's displayed address flickers between\n-- two equally-ranked values. That is the kind of bug that destroys trust\n-- in a platform and takes weeks to track down.\n--\n-- Recency is deliberately SECOND, not first. A fresh record from a\n-- third-party enrichment file should not overwrite a verified CRM\n-- address just because it arrived this morning.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nCLUSTER BY person_id, field\nAS\nWITH corroboration AS (\n  SELECT\n    person_id, field, value_norm,\n    COUNT(DISTINCT source_system) AS asserting_sources,\n    COUNT(*)                      AS assertions\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field, value_norm\n),\nranked AS (\n  SELECT\n    fa.*,\n    c.asserting_sources,\n    c.assertions,\n    ROW_NUMBER() OVER (\n      PARTITION BY fa.person_id, fa.field\n      ORDER BY\n        fa.source_trust DESC,\n        fa.source_ts DESC NULLS LAST,\n        c.asserting_sources DESC,\n        fa.record_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n  JOIN corroboration AS c\n    ON c.person_id = fa.person_id AND c.field = fa.field AND c.value_norm = fa.value_norm\n),\nconflict AS (\n  SELECT person_id, field, COUNT(DISTINCT value_norm) AS distinct_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  GROUP BY person_id, field\n)\nSELECT\n  r.person_id,\n  r.field,\n  r.value_norm                       AS surviving_value_norm,\n  r.value_raw                        AS surviving_value,\n  r.record_id                        AS won_from_record_id,\n  r.source_system                    AS won_from_source,\n  r.source_trust,\n  r.source_ts                        AS asserted_at,\n  r.asserting_sources,\n  cf.distinct_values,\n  cf.distinct_values > 1             AS was_contested,\n  CONCAT(\n    'Selected from ', r.source_system,\n    ' (trust ', CAST(r.source_trust AS STRING), ')',\n    IF(cf.distinct_values > 1,\n       CONCAT(' over ', CAST(cf.distinct_values - 1 AS STRING), ' competing value(s)'),\n       ' \u2014 uncontested'),\n    '; corroborated by ', CAST(r.asserting_sources AS STRING), ' source(s).'\n  )                                  AS provenance\nFROM ranked AS r\nJOIN conflict AS cf ON cf.person_id = r.person_id AND cf.field = r.field\nWHERE r.rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 80c \u00b7 The golden record\n--\n-- The wide, consumable view of a person. This is what a marketer, an\n-- agent or a service desk actually reads.\n--\n-- Note the deliberate omission: no consent fields. Consent is computed in\n-- stage 85 under its own rules, and is never a survivorship outcome. If\n-- consent were resolved here it would inherit the \"highest trust wins\"\n-- logic, and a high-trust GRANTED would silently overwrite a\n-- low-trust WITHDRAWN. That is precisely the failure this build exists to\n-- prevent.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.golden_person`\nCLUSTER BY person_id\nAS\nWITH pivoted AS (\n  SELECT\n    np.person_id,\n    MAX(IF(s.field = 'full_name',      s.surviving_value,     NULL)) AS full_name,\n    MAX(IF(s.field = 'forename',       s.surviving_value,     NULL)) AS forename,\n    MAX(IF(s.field = 'surname',        s.surviving_value,     NULL)) AS surname,\n    MAX(IF(s.field = 'address',        s.surviving_value,     NULL)) AS address,\n    MAX(IF(s.field = 'address',        s.won_from_record_id,  NULL)) AS address_record_id,\n    MAX(IF(s.field = 'city',           s.surviving_value,     NULL)) AS field_city,\n    MAX(IF(s.field = 'postcode',       s.surviving_value,     NULL)) AS field_postcode,\n    MAX(IF(s.field = 'email',          s.surviving_value,     NULL)) AS email,\n    MAX(IF(s.field = 'phone',          s.surviving_value,     NULL)) AS phone,\n    SAFE.PARSE_DATE('%Y-%m-%d',\n      MAX(IF(s.field = 'dob',          s.surviving_value,     NULL))) AS dob,\n    MAX(IF(s.field = 'account_number', s.surviving_value,     NULL)) AS account_number,\n    COUNTIF(s.was_contested)                                         AS contested_fields,\n    COUNT(s.field)                                                   AS populated_fields,\n    MAX(s.source_trust)                                              AS best_source_trust,\n    MAX(s.asserted_at)                                               AS most_recent_assertion\n  FROM `${CDP_PROJECT}.${CDP_DS}.node_person` AS np\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\n    ON s.person_id = np.person_id\n  GROUP BY np.person_id\n)\nSELECT\n  p.person_id,\n  p.full_name,\n  p.forename,\n  p.surname,\n  p.address,\n  -- Keep address components as a coherent tuple from the winning address record\n  -- to prevent Chimera/Frankenstein addresses across cities/states.\n  COALESCE(addr_rec.raw_city,     p.field_city)     AS city,\n  COALESCE(addr_rec.raw_postcode, p.field_postcode) AS postcode,\n  p.email,\n  p.phone,\n  p.dob,\n  p.account_number,\n  p.contested_fields,\n  p.populated_fields,\n  p.best_source_trust,\n  p.most_recent_assertion\nFROM pivoted AS p\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_records` AS addr_rec\n  ON addr_rec.record_id = p.address_record_id;\n\n\n-- ---------------------------------------------------------------------\n-- 80d \u00b7 Which sources actually win\n--\n-- Worth showing, because it is usually a surprise. If a low-trust source\n-- is winning a large share of fields, it is not because the rule is\n-- broken \u2014 it is because the high-trust sources are silent, and that is a\n-- data-capture problem rather than a matching one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_survivorship_by_source` AS\nSELECT\n  won_from_source                                   AS source_system,\n  ANY_VALUE(source_trust)                           AS trust,\n  COUNT(*)                                          AS fields_won,\n  ROUND(100 * COUNT(*) / SUM(COUNT(*)) OVER (), 2)  AS pct_of_fields_won,\n  COUNTIF(was_contested)                            AS won_against_competition,\n  ARRAY_AGG(DISTINCT field ORDER BY field)          AS fields\nFROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\nGROUP BY won_from_source\nORDER BY fields_won DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 80e \u00b7 Show me one person, end to end\n--\n-- The single most useful query in the whole demo. Give it a person_id and\n-- it returns every field, the value that survived, where it came from,\n-- and what it beat.\n--\n--   SELECT * FROM cdp.tf_explain_person('PER-00000000deadbeef');\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_explain_person`(p_person_id STRING)\nAS (\n  SELECT\n    s.field,\n    s.surviving_value,\n    s.won_from_source,\n    s.source_trust,\n    s.asserted_at,\n    s.was_contested,\n    s.provenance,\n    -- The values that lost, so the decision can be challenged rather than\n    -- merely accepted.\n    ARRAY(\n      SELECT AS STRUCT fa.source_system, fa.value_raw, fa.source_trust, fa.source_ts\n      FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions` AS fa\n      WHERE fa.person_id = s.person_id\n        AND fa.field     = s.field\n        AND fa.value_norm != s.surviving_value_norm\n      ORDER BY fa.source_trust DESC\n    ) AS rejected_values\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS s\n  WHERE s.person_id = p_person_id\n);\n\n\n-- ---------------------------------------------------------------------\n-- 80f \u00b7 Bitemporal Attribute History (SCD Type 2)\n--\n-- golden_person is a current-state snapshot (SCD Type 1). For point-in-time\n-- analytics \u2014 e.g. attributing historical store revenue to the state or\n-- postcode where the customer lived WHEN THE ORDER WAS PLACED rather than\n-- where they moved years later \u2014 this view reconstructs the valid_from /\n-- valid_to timeline per attribute across all resolved records.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_golden_person_attribute_history` AS\nWITH ordered_changes AS (\n  SELECT\n    person_id,\n    field,\n    value_raw        AS attribute_value,\n    value_norm,\n    source_system,\n    record_id        AS asserted_by_record_id,\n    source_trust,\n    source_ts        AS valid_from,\n    LAG(value_norm) OVER (\n      PARTITION BY person_id, field\n      ORDER BY source_ts ASC, source_trust ASC, record_id ASC\n    ) AS prev_value_norm\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_assertions`\n  WHERE source_ts IS NOT NULL\n),\ndistinct_transitions AS (\n  SELECT * EXCEPT (prev_value_norm)\n  FROM ordered_changes\n  WHERE prev_value_norm IS NULL OR value_norm != prev_value_norm\n)\nSELECT\n  person_id,\n  field,\n  attribute_value,\n  source_system,\n  asserted_by_record_id,\n  source_trust,\n  valid_from,\n  LEAD(valid_from) OVER (\n    PARTITION BY person_id, field\n    ORDER BY valid_from ASC\n  ) AS valid_to,\n  LEAD(valid_from) OVER (\n    PARTITION BY person_id, field\n    ORDER BY valid_from ASC\n  ) IS NULL AS is_current\nFROM distinct_transitions;\n\n","sql_lines":309,"results":[{"view":"v_survivorship_by_source","columns":["fields","fields_won","pct_of_fields_won","source_system","trust","won_against_competition"],"rows":[{"fields":["address","city","dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"37148","pct_of_fields_won":"44.7","source_system":"CRM","trust":"9","won_against_competition":"6743"},{"fields":["account_number","address","city","dob","forename","full_name","phone","postcode","surname"],"fields_won":"16616","pct_of_fields_won":"19.99","source_system":"LOYALTY","trust":"7","won_against_competition":"1701"},{"fields":["account_number","forename","full_name","surname"],"fields_won":"13208","pct_of_fields_won":"15.89","source_system":"POS","trust":"3","won_against_competition":"148"},{"fields":["dob","email","forename","full_name","phone","postcode","surname"],"fields_won":"9840","pct_of_fields_won":"11.84","source_system":"ECOM","trust":"6","won_against_competition":"547"},{"fields":["address","email","forename","full_name","postcode","surname"],"fields_won":"4335","pct_of_fields_won":"5.22","source_system":"ENRICH","trust":"2","won_against_competition":"102"},{"fields":["account_number","address","email","forename","full_name","phone","postcode","surname"],"fields_won":"1482","pct_of_fields_won":"1.78","source_system":"SUPPORT","trust":"4","won_against_competition":"155"},{"fields":["account_number","address","dob","email","forename","full_name","postcode","surname"],"fields_won":"478","pct_of_fields_won":"0.58","source_system":"CALL","trust":"4","won_against_competition":"47"}],"row_count":7}],"run":{"statements":6,"steps":[{"op":"create table","object":"field_assertions","kind":"table","rows":120918},{"op":"create table","object":"field_survivorship","kind":"table","rows":83107},{"op":"create table","object":"golden_person","kind":"table","rows":12878},{"op":"create view","object":"v_survivorship_by_source","kind":"view","rows":0},{"op":"create table function","object":"tf_explain_person","kind":"routine","rows":null},{"op":"create view","object":"v_golden_person_attribute_history","kind":"view","rows":null}],"inputs":[{"object":"node_person","rows":12878,"bytes":922266,"modified":"2026-09-15 23:10:26.521+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7050270,"modified":"2026-09-15 10:01:14.980+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028376,"modified":"2026-09-15 23:10:18.534+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"field_assertions","rows":120918,"bytes":11320557,"modified":"2026-09-15 23:11:26.575+00","dataset":"cdp","kind":"table"},{"object":"field_survivorship","rows":83107,"bytes":15630408,"modified":"2026-09-15 23:11:29.899+00","dataset":"cdp","kind":"table"},{"object":"golden_person","rows":12878,"bytes":1760385,"modified":"2026-09-15 23:11:31.781+00","dataset":"cdp","kind":"table"},{"object":"v_survivorship_by_source","rows":0,"bytes":0,"modified":"2026-09-15 23:11:32.414+00","dataset":"cdp","kind":"view"}]}},{"id":"85_consent","num":"85","title":"Consent","summary":"Recomputes permissions at profile level. Merging two records never merges their consent.","sql":"-- =====================================================================\n-- 85 \u00b7 Consent\n--\n-- The stage that most MDM builds get wrong, and the one with legal\n-- consequences when they do.\n--\n-- Merging two records merges their behaviour, their orders and their\n-- addresses. It must NOT merge their permissions. Consent was given by a\n-- person, to a specific organisation, through a specific channel, for a\n-- specific purpose, at a specific moment \u2014 and joining two rows in a\n-- warehouse does not create permission that nobody ever gave.\n--\n-- Three rules, in order:\n--\n--   1. A suppression always wins. Deceased or minor indications override\n--      everything, including an explicit grant.\n--   2. An explicit withdrawal always wins over a grant, regardless of\n--      which is more recent. \"I changed my mind\" does not expire.\n--   3. Otherwise permission is the INTERSECTION, not the union. A profile\n--      may be contacted on a channel only where every contributing record\n--      agrees it may be.\n--\n-- Rule 3 is the expensive one, and the one commercial pressure pushes\n-- against. Stage 85d puts a number on exactly how many contacts it costs\n-- \u2014 and therefore how many unlawful contacts the union rule would have\n-- produced.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 85a \u00b7 Consent state per source record\n--\n-- Consent events are append-only, so the current state of a record is\n-- its most recent event for that channel and purpose. Nothing is\n-- rewritten; the history remains queryable.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.consent_record_state`\nCLUSTER BY record_id, channel\nAS\nSELECT * EXCEPT (rn)\nFROM (\n  SELECT\n    e.record_id,\n    e.channel,\n    e.purpose,\n    e.status,\n    e.captured_at,\n    e.consent_id,\n    ROW_NUMBER() OVER (\n      PARTITION BY e.record_id, e.channel, e.purpose\n      ORDER BY e.captured_at DESC,\n               CASE e.status WHEN 'WITHDRAWN' THEN 1 WHEN 'NOT_GIVEN' THEN 2 ELSE 3 END,\n               e.consent_id\n    ) AS rn\n  FROM `${CDP_PROJECT}.${CDP_DS}.src_consent_events` AS e\n)\nWHERE rn = 1;\n\n\n-- ---------------------------------------------------------------------\n-- 85b \u00b7 Suppressions\n--\n-- Sourced from the risk classification in stage 20. These are not\n-- preferences and are not negotiable \u2014 a marketing send to a deceased\n-- customer's household is the kind of failure that reaches the press.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_suppression`\nCLUSTER BY person_id\nAS\nSELECT\n  a.person_id,\n  LOGICAL_OR(s.suppress_marketing)                            AS suppress_marketing,\n  ARRAY_AGG(DISTINCT s.risk_category IGNORE NULLS\n            ORDER BY s.risk_category)                         AS risk_categories,\n  ANY_VALUE(s.risk_evidence)                                  AS sample_evidence,\n  ARRAY_AGG(DISTINCT s.record_id ORDER BY s.record_id)        AS evidence_record_ids\nFROM `${CDP_PROJECT}.${CDP_DS}.stg_support_entities` AS s\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = s.record_id\nWHERE s.risk_category != 'NONE'\nGROUP BY a.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85c \u00b7 Effective permission per person, channel and purpose\n--\n-- Both rules are computed side by side. The union rule is not here\n-- because it is a reasonable option \u2014 it is here so that the cost of\n-- doing the right thing can be stated precisely instead of argued about.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_consent`\nCLUSTER BY person_id, channel\nAS\nWITH per_person_raw AS (\n  SELECT\n    a.person_id,\n    c.channel,\n    c.purpose,\n    COUNT(*)                                             AS contributing_records,\n    LOGICAL_OR(c.status = 'WITHDRAWN')                   AS any_withdrawn,\n    LOGICAL_OR(c.status = 'GRANTED')                     AS any_granted,\n    LOGICAL_AND(c.status = 'GRANTED')                    AS all_granted,\n    COUNTIF(c.status = 'GRANTED')                        AS granted_count,\n    COUNTIF(c.status = 'WITHDRAWN')                      AS withdrawn_count,\n    COUNTIF(c.status = 'NOT_GIVEN')                      AS not_given_count,\n    MIN(IF(c.status = 'WITHDRAWN', c.captured_at, NULL)) AS first_withdrawn_at,\n    MAX(c.captured_at)                                   AS latest_event_at,\n    ARRAY_AGG(STRUCT(c.record_id, c.status, c.captured_at)\n              ORDER BY c.captured_at)                    AS evidence\n  FROM `${CDP_PROJECT}.${CDP_DS}.consent_record_state` AS c\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = c.record_id\n  GROUP BY a.person_id, c.channel, c.purpose\n),\n-- Ensure suppressed persons appear on every marketing channel even if they\n-- have no explicit consent events recorded.\nsuppressed_channels AS (\n  SELECT\n    sp.person_id,\n    ch AS channel,\n    'MARKETING' AS purpose\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_suppression` AS sp,\n  UNNEST(['EMAIL', 'SMS', 'POST', 'PHONE']) AS ch\n  WHERE sp.suppress_marketing\n),\nspine AS (\n  SELECT person_id, channel, purpose FROM per_person_raw\n  UNION DISTINCT\n  SELECT person_id, channel, purpose FROM suppressed_channels\n),\nper_person AS (\n  SELECT\n    s.person_id,\n    s.channel,\n    s.purpose,\n    IFNULL(r.contributing_records, 0) AS contributing_records,\n    IFNULL(r.any_withdrawn, FALSE)    AS any_withdrawn,\n    IFNULL(r.any_granted, FALSE)      AS any_granted,\n    IFNULL(r.all_granted, FALSE)      AS all_granted,\n    IFNULL(r.granted_count, 0)        AS granted_count,\n    IFNULL(r.withdrawn_count, 0)      AS withdrawn_count,\n    IFNULL(r.not_given_count, 0)      AS not_given_count,\n    r.first_withdrawn_at,\n    r.latest_event_at,\n    r.evidence\n  FROM spine AS s\n  LEFT JOIN per_person_raw AS r USING (person_id, channel, purpose)\n),\n-- How many of a person's records could have carried a consent statement\n-- but do not. Under a strict reading, silence is not permission.\ncoverage AS (\n  SELECT person_id, COUNT(*) AS total_records\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment`\n  GROUP BY person_id\n)\nSELECT\n  p.person_id,\n  p.channel,\n  p.purpose,\n  p.contributing_records,\n  cv.total_records,\n  p.granted_count,\n  p.withdrawn_count,\n  p.not_given_count,\n\n  -- THE RULE\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted AND p.contributing_records > 0                     THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status,\n\n  -- The stricter reading: a record that never said anything counts\n  -- against permission rather than being ignored. Offered as a column\n  -- rather than imposed, because which reading applies is a legal\n  -- decision, not an engineering one \u2014 but it should be a decision\n  -- somebody consciously makes.\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING' THEN 'SUPPRESSED'\n    WHEN p.any_withdrawn                                                  THEN 'WITHDRAWN'\n    WHEN p.all_granted AND p.contributing_records = cv.total_records      THEN 'GRANTED'\n    ELSE                                                                       'NOT_GIVEN'\n  END                                        AS effective_status_strict,\n\n  -- The common, wrong implementation. Retained purely for comparison.\n  CASE\n    WHEN p.any_granted THEN 'GRANTED'\n    ELSE                    'NOT_GIVEN'\n  END                                        AS naive_union_status,\n\n  IFNULL(sp.suppress_marketing, FALSE)       AS suppressed,\n  sp.risk_categories,\n  p.first_withdrawn_at,\n  p.latest_event_at,\n  p.evidence,\n\n  CASE\n    WHEN IFNULL(sp.suppress_marketing, FALSE) AND p.purpose = 'MARKETING'\n      THEN CONCAT('Suppressed: ', ARRAY_TO_STRING(sp.risk_categories, ', '),\n                  ' indication found in support contact.')\n    WHEN p.any_withdrawn\n      THEN CONCAT('Withdrawn on ', FORMAT_TIMESTAMP('%Y-%m-%d', p.first_withdrawn_at),\n                  '. Withdrawal is absolute and is not overridden by a later grant '\n                  'from another source.')\n    WHEN p.all_granted AND p.contributing_records > 0\n      THEN CONCAT('All ', CAST(p.contributing_records AS STRING),\n                  ' contributing record(s) granted permission on this channel.')\n    ELSE\n      CONCAT(CAST(p.granted_count AS STRING), ' of ',\n             CAST(p.contributing_records AS STRING),\n             ' contributing record(s) granted permission \u2014 not unanimous, '\n             'so permission is not inherited.')\n  END                                        AS explanation\nFROM per_person AS p\nJOIN coverage AS cv ON cv.person_id = p.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_suppression` AS sp ON sp.person_id = p.person_id;\n\n\n-- ---------------------------------------------------------------------\n-- 85d \u00b7 What the rule costs, and what it prevents\n--\n-- The number to put in front of a CMO. The union rule produces a bigger\n-- audience; every extra contact in it is a contact the customer did not\n-- agree to, on a channel where at least one of their records says no.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_impact` AS\nSELECT\n  channel,\n  purpose,\n  COUNT(*)                                          AS people_with_a_stated_preference,\n  COUNTIF(naive_union_status = 'GRANTED')           AS audience_union_rule,\n  COUNTIF(effective_status = 'GRANTED')             AS audience_intersection_rule,\n  COUNTIF(effective_status_strict = 'GRANTED')      AS audience_strict_rule,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status != 'GRANTED')        AS contacts_the_union_rule_would_add,\n  COUNTIF(naive_union_status = 'GRANTED'\n          AND effective_status = 'WITHDRAWN')       AS of_which_explicitly_withdrawn,\n  COUNTIF(effective_status = 'SUPPRESSED')          AS suppressed_for_risk,\n  ROUND(100 * SAFE_DIVIDE(\n    COUNTIF(naive_union_status = 'GRANTED' AND effective_status != 'GRANTED'),\n    NULLIF(COUNTIF(naive_union_status = 'GRANTED'), 0)), 2) AS pct_of_union_audience_unlawful\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\nGROUP BY channel, purpose\nORDER BY channel, purpose;\n\n\n-- ---------------------------------------------------------------------\n-- 85e \u00b7 The conflict cases, named\n--\n-- The generator plants people whose records carry GRANTED, NOT_GIVEN and\n-- WITHDRAWN for the same channel across three different systems. This is\n-- not a contrived edge case: it is what happens when a customer signs up\n-- online, opts out in store, and never updates the app.\n--\n-- Put one of these on screen. It is the single clearest illustration of\n-- why \"merge the profiles\" and \"merge the permissions\" are different\n-- operations.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_consent_conflicts` AS\nSELECT\n  c.person_id,\n  g.full_name,\n  c.channel,\n  c.purpose,\n  c.granted_count,\n  c.withdrawn_count,\n  c.not_given_count,\n  c.naive_union_status  AS would_have_been_contacted,\n  c.effective_status    AS actual_decision,\n  c.explanation,\n  c.evidence\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nWHERE c.granted_count > 0\n  AND (c.withdrawn_count > 0 OR c.not_given_count > 0)\nORDER BY c.withdrawn_count DESC, c.granted_count DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 85f \u00b7 The activation-safe audience\n--\n-- The only table any downstream campaign should read. If a marketer can\n-- reach person_consent directly, sooner or later somebody will write\n-- their own interpretation of the rules \u2014 and it will be the union one.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS\nSELECT\n  c.person_id,\n  c.channel,\n  c.purpose,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode\nFROM `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.field_survivorship` AS fs\n  ON fs.person_id = c.person_id\n AND fs.field = CASE c.channel\n                  WHEN 'EMAIL' THEN 'email'\n                  WHEN 'SMS'   THEN 'phone'\n                  WHEN 'PHONE' THEN 'phone'\n                  WHEN 'POST'  THEN 'address'\n                END\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.consent_record_state` AS crs\n  ON crs.record_id = fs.won_from_record_id\n AND crs.channel   = c.channel\n AND crs.purpose   = c.purpose\nWHERE c.effective_status = 'GRANTED'\n  -- Ensure the channel's contact attribute is populated on the golden record\n  AND CASE c.channel\n        WHEN 'EMAIL' THEN g.email    IS NOT NULL\n        WHEN 'SMS'   THEN g.phone    IS NOT NULL\n        WHEN 'PHONE' THEN g.phone    IS NOT NULL\n        WHEN 'POST'  THEN g.address  IS NOT NULL AND g.postcode IS NOT NULL\n        ELSE FALSE\n      END\n  -- Principle P7: Consent never travels across a merge. The specific source\n  -- record from which the surviving contact point was won must itself carry\n  -- GRANTED consent for this channel and purpose.\n  AND crs.status = 'GRANTED';\n","sql_lines":326,"results":[{"view":"v_consent_impact","columns":["audience_intersection_rule","audience_strict_rule","audience_union_rule","channel","contacts_the_union_rule_would_add","of_which_explicitly_withdrawn","pct_of_union_audience_unlawful","people_with_a_stated_preference","purpose","suppressed_for_risk"],"rows":[{"audience_intersection_rule":"1834","audience_strict_rule":"743","audience_union_rule":"2055","channel":"EMAIL","contacts_the_union_rule_would_add":"221","of_which_explicitly_withdrawn":"77","pct_of_union_audience_unlawful":"10.75","people_with_a_stated_preference":"3276","purpose":"MARKETING","suppressed_for_risk":"24"},{"audience_intersection_rule":"689","audience_strict_rule":"233","audience_union_rule":"703","channel":"EMAIL","contacts_the_union_rule_would_add":"14","of_which_explicitly_withdrawn":"4","pct_of_union_audience_unlawful":"1.99","people_with_a_stated_preference":"1140","purpose":"SERVICE","suppressed_for_risk":"0"},{"audience_intersection_rule":"726","audience_strict_rule":"223","audience_union_rule":"754","channel":"PHONE","contacts_the_union_rule_would_add":"28","of_which_explicitly_withdrawn":"8","pct_of_union_audience_unlawful":"3.71","people_with_a_stated_preference":"1207","purpose":"MARKETING","suppressed_for_risk":"10"},{"audience_intersection_rule":"212","audience_strict_rule":"61","audience_union_rule":"214","channel":"PHONE","contacts_the_union_rule_would_add":"2","of_which_explicitly_withdrawn":"1","pct_of_union_audience_unlawful":"0.93","people_with_a_stated_preference":"353","purpose":"SERVICE","suppressed_for_risk":"0"},{"audience_intersection_rule":"943","audience_strict_rule":
