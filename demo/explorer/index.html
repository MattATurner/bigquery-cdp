:0},{"op":"create view","object":"v_contactable","kind":"view","rows":0}],"inputs":[{"object":"field_survivorship","rows":83107,"bytes":15630408,"modified":"2026-09-15 23:11:29.899+00","dataset":"cdp","kind":"table"},{"object":"golden_person","rows":12878,"bytes":1760385,"modified":"2026-09-15 23:11:31.781+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028376,"modified":"2026-09-15 23:10:18.534+00","dataset":"cdp","kind":"table"},{"object":"src_consent_events","rows":13045,"bytes":794700,"modified":"2026-09-15 09:55:24.614+00","dataset":"cdp","kind":"table"},{"object":"stg_support_entities","rows":968,"bytes":450060,"modified":"2026-09-15 10:01:08.431+00","dataset":"cdp","kind":"table"}],"outputs":[{"object":"consent_record_state","rows":11985,"bytes":730319,"modified":"2026-09-15 23:11:40.199+00","dataset":"cdp","kind":"table"},{"object":"person_consent","rows":11152,"bytes":2621827,"modified":"2026-09-15 23:11:44.454+00","dataset":"cdp","kind":"table"},{"object":"person_suppression","rows":71,"bytes":3176,"modified":"2026-09-15 23:11:42.127+00","dataset":"cdp","kind":"table"},{"object":"v_consent_conflicts","rows":0,"bytes":0,"modified":"2026-09-15 23:11:45.714+00","dataset":"cdp","kind":"view"},{"object":"v_consent_impact","rows":0,"bytes":0,"modified":"2026-09-15 23:11:45.062+00","dataset":"cdp","kind":"view"},{"object":"v_contactable","rows":0,"bytes":0,"modified":"2026-09-15 23:11:46.328+00","dataset":"cdp","kind":"view"}]}},{"id":"90_downstream","num":"90","title":"Downstream","summary":"The outputs: segments, households, shared-identifier risk, agent grounding and activation audiences.","sql":"-- =====================================================================\n-- 90 \u00b7 Downstream\n--\n-- Everything to this point was cost. This is the return.\n--\n-- Five things that are either impossible or unreliable without a\n-- mastered customer graph, and straightforward with one. None of them\n-- requires data to leave BigQuery, and none of them requires a separate\n-- CDP product.\n--\n--   90a  segmentation   \u00b7 RFM + k-means, on people rather than records\n--   90b  household      \u00b7 the unit families actually buy as\n--   90c  graph risk     \u00b7 shared identifiers, which only a graph exposes\n--   90d  agent grounding\u00b7 a profile an LLM can read and answer from\n--   90e  activation     \u00b7 audiences that are consent-safe by construction\n--\n-- The recurring point: every one of these was previously computed per\n-- source system, and therefore computed wrongly.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 90a \u00b7 Segmentation\n--\n-- RFM at person level. The comparison worth drawing on screen: the same\n-- calculation over raw POS records treats one customer with three loyalty\n-- cards as three lukewarm customers rather than one very good one. Every\n-- decision downstream \u2014 budget, offer, priority \u2014 then follows from a\n-- number that was never true.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_rfm`\nCLUSTER BY person_id\nAS\nWITH txns AS (\n  SELECT\n    a.person_id,\n    t.txn_ts,\n    t.amount_aud,\n    t.category\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = t.record_id\n),\nbounds AS (\n  SELECT MAX(txn_ts) AS as_of FROM txns\n)\nSELECT\n  t.person_id,\n  DATE_DIFF(DATE(b.as_of), DATE(MAX(t.txn_ts)), DAY)      AS recency_days,\n  COUNT(*)                                                AS frequency,\n  ROUND(SUM(t.amount_aud), 2)                             AS monetary_aud,\n  ROUND(AVG(t.amount_aud), 2)                             AS avg_basket_aud,\n  COUNT(DISTINCT t.category)                              AS category_breadth,\n  ARRAY_AGG(DISTINCT t.category ORDER BY t.category)      AS categories,\n  MIN(t.txn_ts)                                           AS first_purchase_at,\n  MAX(t.txn_ts)                                           AS last_purchase_at\nFROM txns AS t, bounds AS b\nGROUP BY t.person_id, b.as_of;\n\n\n-- Trained on the resolved population. Five clusters is a starting point,\n-- not a finding \u2014 the right number comes from silhouette scores on real\n-- data, and claiming otherwise in a demo would be dishonest.\nCREATE OR REPLACE MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`\nOPTIONS (\n  model_type            = 'KMEANS',\n  num_clusters          = 5,\n  standardize_features  = TRUE,\n  kmeans_init_method    = 'KMEANS++'\n) AS\nSELECT\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`;\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_segments`\nCLUSTER BY person_id\nAS\n-- ML.PREDICT passes non-feature columns straight through, so person_id\n-- comes back attached to its own prediction. Joining the result back to\n-- the input on floating-point equality would work here and break the\n-- first time a feature is rounded differently.\nSELECT\n  person_id,\n  CENTROID_ID AS segment_id,\n  recency_days,\n  frequency,\n  monetary_aud,\n  category_breadth\nFROM ML.PREDICT(\n  MODEL `${CDP_PROJECT}.${CDP_DS}.model_person_segments`,\n  (\n    SELECT person_id, recency_days, frequency, monetary_aud, category_breadth\n    FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n  )\n);\n\n\n-- Segments are numbers until somebody names them. AI.GENERATE reads the\n-- centroid statistics and produces a label a marketer can use, which is\n-- a small thing that removes a genuinely annoying manual step.\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.segment_labels`\nAS\nWITH profile AS (\n  SELECT\n    segment_id,\n    COUNT(*)                        AS people,\n    ROUND(AVG(recency_days), 1)     AS avg_recency_days,\n    ROUND(AVG(frequency), 1)        AS avg_frequency,\n    ROUND(AVG(monetary_aud), 2)     AS avg_spend_aud,\n    ROUND(AVG(category_breadth), 1) AS avg_categories\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_segments`\n  GROUP BY segment_id\n)\nSELECT\n  p.*,\n  AI.GENERATE(\n    prompt => (\n      'Name and describe a retail customer segment from these averages. '\n   || 'Be plain and commercial; avoid jargon and avoid inventing facts not '\n   || 'present in the numbers. Statistics: ',\n      TO_JSON_STRING(p)\n    ),\n    connection_id => '${CDP_CONNECTION_PATH}',\n    endpoint      => '${CDP_EXTRACTION_MODEL}',\n    output_schema => 'segment_name STRING, description STRING, suggested_action STRING'\n  ) AS g\nFROM profile AS p;\n\n\n-- ---------------------------------------------------------------------\n-- 90b \u00b7 Household\n--\n-- Families buy as a unit and are marketed to as individuals, which is how\n-- four people at one address receive four copies of the same catalogue.\n--\n-- The household is derived from resolved people sharing a current\n-- address. Note what it is NOT: it is not a merge. The four people remain\n-- four people with four sets of preferences.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.household_profile`\nCLUSTER BY household_id\nAS\nSELECT\n  h.household_id,\n  h.address_norm,\n  h.postcode_norm,\n  COUNT(DISTINCT m.person_id)                          AS people,\n  ROUND(SUM(IFNULL(r.monetary_aud, 0)), 2)             AS household_spend_aud,\n  SUM(IFNULL(r.frequency, 0))                          AS household_transactions,\n  MIN(r.recency_days)                                  AS most_recent_purchase_days,\n  ARRAY_AGG(DISTINCT g.surname IGNORE NULLS\n            ORDER BY g.surname)                        AS surnames,\n  -- More than one surname at an address is normal and is not evidence of\n  -- anything. It is recorded because it changes how a household offer\n  -- should be worded, not whether one should be sent.\n  COUNT(DISTINCT g.surname) > 1                        AS multi_surname,\n  COUNTIF(c.effective_status = 'GRANTED') > 0          AS at_least_one_contactable\nFROM `${CDP_PROJECT}.${CDP_DS}.node_household` AS h\nJOIN `${CDP_PROJECT}.${CDP_DS}.edge_member_of` AS m USING (household_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g ON g.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm`   AS r ON r.person_id = m.person_id\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_consent` AS c\n  ON c.person_id = m.person_id AND c.channel = 'POST' AND c.purpose = 'MARKETING'\nGROUP BY h.household_id, h.address_norm, h.postcode_norm;\n\n\n-- The catalogue-duplication number. Unglamorous, immediately credible,\n-- and usually larger than anyone expects.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_household_waste` AS\nSELECT\n  COUNT(*)                                                   AS households,\n  SUM(people)                                                AS people,\n  SUM(GREATEST(people - 1, 0))                               AS duplicate_mailings_avoided,\n  ROUND(100 * SAFE_DIVIDE(SUM(GREATEST(people - 1, 0)), SUM(people)), 2)\n                                                             AS pct_of_mailings_avoidable,\n  COUNTIF(people > 1)                                        AS multi_person_households,\n  COUNTIF(multi_surname)                                     AS multi_surname_households\nFROM `${CDP_PROJECT}.${CDP_DS}.household_profile`\nWHERE at_least_one_contactable;\n\n\n-- ---------------------------------------------------------------------\n-- 90c \u00b7 Shared identifiers\n--\n-- A graph question that a flat customer table cannot answer at all:\n-- which identifiers are shared by people we have decided are different?\n--\n-- Most sharing is innocent \u2014 couples share a landline, families share an\n-- email. A phone number attached to fifteen unrelated people, across\n-- multiple postcode districts, is not innocent. Either resolution is\n-- wrong, or something is.\n--\n-- Note the framing: this surfaces things to look at, and asserts nothing.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_shared_identifiers` AS\nWITH shared_phone AS (\n  SELECT\n    'PHONE'                              AS identifier_type,\n    e.phone_id                           AS identifier,\n    COUNT(DISTINCT e.person_id)          AS people,\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20) AS person_ids,\n    ANY_VALUE(n.is_mobile)               AS is_personal_device\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_phone` AS e\n  JOIN `${CDP_PROJECT}.${CDP_DS}.node_phone` AS n ON n.phone_id = e.phone_id\n  GROUP BY e.phone_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_email AS (\n  SELECT\n    'EMAIL',\n    e.email_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_has_email` AS e\n  GROUP BY e.email_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n),\nshared_account AS (\n  SELECT\n    'LOYALTY_ACCOUNT',\n    e.account_id,\n    COUNT(DISTINCT e.person_id),\n    ARRAY_AGG(DISTINCT e.person_id ORDER BY e.person_id LIMIT 20),\n    FALSE\n  FROM `${CDP_PROJECT}.${CDP_DS}.edge_holds_account` AS e\n  GROUP BY e.account_id\n  HAVING COUNT(DISTINCT e.person_id) > 1\n)\nSELECT *,\n  CASE\n    WHEN identifier_type = 'PHONE' AND is_personal_device AND people >= 5\n      THEN 'REVIEW \u00b7 a personal mobile shared by five or more people is unusual'\n    WHEN people >= 10\n      THEN 'REVIEW \u00b7 sharing at this scale is rarely a household'\n    WHEN people BETWEEN 2 AND 4\n      THEN 'EXPECTED \u00b7 consistent with a household or a couple'\n    ELSE 'MONITOR'\n  END AS assessment\nFROM (\n  SELECT * FROM shared_phone\n  UNION ALL SELECT * FROM shared_email\n  UNION ALL SELECT * FROM shared_account\n)\nORDER BY people DESC;\n\n\n-- ---------------------------------------------------------------------\n-- 90d \u00b7 Grounding for agents\n--\n-- An agent cannot reason about a customer scattered across eight systems.\n-- It can reason about one profile with stated provenance and explicit\n-- gaps.\n--\n-- The profile deliberately carries what is NOT known \u2014\n-- fields_with_conflicting_sources \u2014 because an agent told that a date of\n-- birth is contested will ask, where an agent given a single clean value\n-- will assert.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.person_context`\nCLUSTER BY person_id\nAS\nWITH interactions AS (\n  SELECT\n    a.person_id,\n    CONCAT('[', p.source_system, ' ',\n           IFNULL(FORMAT_TIMESTAMP('%Y-%m-%d', p.source_ts), 'undated'), '] ',\n           IFNULL(p.evidence_note, p.raw_name)) AS line\n  FROM `${CDP_PROJECT}.${CDP_DS}.party_records` AS p\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a ON a.record_id = p.record_id\n  WHERE p.evidence_note IS NOT NULL\n),\n\n-- These three were ARRAY(SELECT ... WHERE x.person_id = g.person_id) against\n-- other tables. BigQuery cannot de-correlate a subquery that references\n-- another table once it carries ORDER BY or LIMIT:\n--   \"Correlated subqueries that reference other tables are not supported\n--    unless they can be de-correlated, such as by transforming them into an\n--    efficient JOIN.\"\n-- So each is pre-aggregated per person and LEFT JOINed below. A join miss\n-- yields a NULL array, which BigQuery stores as an empty array -- identical\n-- to what the empty subquery produced.\nconsent_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(STRUCT(channel, purpose, effective_status)\n              ORDER BY channel, purpose) AS permissions\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_consent`\n  GROUP BY person_id\n),\n\ninteraction_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(line LIMIT 10) AS notable_interactions\n  FROM interactions\n  GROUP BY person_id\n),\n\ncontested_agg AS (\n  SELECT\n    person_id,\n    ARRAY_AGG(field ORDER BY field) AS fields_with_conflicting_sources\n  FROM `${CDP_PROJECT}.${CDP_DS}.field_survivorship`\n  WHERE was_contested\n  GROUP BY person_id\n)\n\nSELECT\n  g.person_id,\n  g.full_name,\n  g.email,\n  g.phone,\n  g.postcode,\n  g.contested_fields,\n  n.source_systems,\n  n.source_record_count,\n  r.recency_days,\n  r.frequency,\n  r.monetary_aud,\n  ca.permissions,\n  ia.notable_interactions,\n  -- Explicit uncertainty. This is the field that stops an agent asserting\n  -- something it should have asked about.\n  co.fields_with_conflicting_sources\nFROM `${CDP_PROJECT}.${CDP_DS}.golden_person` AS g\nJOIN `${CDP_PROJECT}.${CDP_DS}.node_person`   AS n USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN consent_agg     AS ca ON ca.person_id = g.person_id\nLEFT JOIN interaction_agg AS ia ON ia.person_id = g.person_id\nLEFT JOIN contested_agg   AS co ON co.person_id = g.person_id;\n\n\n-- Ask a question about a customer. The prompt forbids invention and\n-- requires the answer to cite which part of the profile it came from,\n-- which is the difference between grounding and guessing.\nCREATE OR REPLACE TABLE FUNCTION `${CDP_PROJECT}.${CDP_DS}.tf_ask_about_person`(\n  p_person_id STRING, question STRING\n)\nAS (\n  SELECT\n    c.person_id,\n    question AS asked,\n    AI.GENERATE(\n      prompt => (\n        '''Answer a question about a customer using ONLY the profile below.\n\nIf the profile does not contain the answer, say so plainly and say what would need\nto be checked. Never infer, estimate or fill a gap.\n\nCite which part of the profile your answer came from.\n\nIf fields_with_conflicting_sources lists a field you rely on, say that the value is\ncontested and give the caveat.\n\nNever state or imply permission to contact on a channel unless permissions shows\nGRANTED for that channel.\n\nQUESTION: ''',\n        question,\n        '''\n\nPROFILE:\n''',\n        TO_JSON_STRING(c)\n      ),\n      connection_id => '${CDP_CONNECTION_PATH}',\n      endpoint      => '${CDP_EXTRACTION_MODEL}',\n      output_schema => 'answer STRING, grounded_in STRING, confident BOOL'\n    ) AS response\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_context` AS c\n  WHERE c.person_id = p_person_id\n);\n\n\n-- ---------------------------------------------------------------------\n-- 90e \u00b7 Activation\n--\n-- The final audience. Consent-safe by construction: it reads\n-- v_contactable, which only ever contains people whose every contributing\n-- record agreed.\n--\n-- A marketer cannot accidentally widen this audience, because the\n-- permission logic is not theirs to reinterpret.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_audience_lapsed_high_value` AS\nSELECT\n  c.person_id,\n  c.full_name,\n  c.email,\n  c.postcode,\n  r.monetary_aud,\n  r.recency_days,\n  r.frequency,\n  s.segment_id,\n  -- Nested, not flat: segment_labels stores the whole AI.GENERATE result in\n  -- column g, matching the convention in stages 20 and 60. The notebook\n  -- reads g.segment_name too, so the struct stays and the view reaches in.\n  l.g.segment_name,\n  l.g.suggested_action\nFROM `${CDP_PROJECT}.${CDP_DS}.v_contactable` AS c\nJOIN `${CDP_PROJECT}.${CDP_DS}.person_rfm` AS r USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.person_segments` AS s USING (person_id)\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.segment_labels`  AS l\n  ON l.segment_id = s.segment_id\nWHERE c.channel = 'EMAIL'\n  AND c.purpose = 'MARKETING'\n  AND r.recency_days > 180\n  AND r.monetary_aud > 500;\n\n\n-- The before/after that justifies the whole programme. The same audience\n-- definition, computed on unresolved source records and on resolved\n-- people, produces different customers and a different spend figure.\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_activation_before_after` AS\nWITH unresolved AS (\n  -- What you get treating every loyalty card as a customer.\n  SELECT\n    COUNT(DISTINCT t.loyalty_account_number)          AS customers,\n    ROUND(SUM(t.amount_aud), 2)                       AS total_spend,\n    ROUND(AVG(t.amount_aud), 2)                       AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.ext_pos_transactions` AS t\n  WHERE t.loyalty_account_number IS NOT NULL\n),\nresolved AS (\n  SELECT\n    COUNT(*)                                          AS customers,\n    ROUND(SUM(monetary_aud), 2)                       AS total_spend,\n    ROUND(AVG(avg_basket_aud), 2)                     AS avg_txn\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_rfm`\n)\nSELECT 'unresolved \u00b7 one loyalty card = one customer' AS basis,\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)  AS spend_per_customer\nFROM unresolved\nUNION ALL\nSELECT 'resolved \u00b7 one person = one customer',\n       customers, total_spend,\n       ROUND(SAFE_DIVIDE(total_spend, customers), 2)\nFROM resolved;\n","sql_lines":447,"results":[{"view":"v_household_waste","columns":["duplicate_mailings_avoided","households","multi_person_households","multi_surname_households","pct_of_mailings_avoidable","people"],"rows":[{"duplicate_mailings_avoided":"110","households":"761","multi_person_households":"100","multi_surname_households":"23","pct_of_mailings_avoidable":"12.63","people":"871"}],"row_count":1},{"view":"v_shared_identifiers","columns":["assessment","identifier","identifier_type","is_personal_device","people","person_ids"],"rows":[{"assessment":"EXPECTED \u00b7 consistent with a household or a couple","identifier":"stacy.biswas7@icloud.com","identifier_type":"EMAIL","is_personal_device":"false","people":"3","person_ids":["PER-43ef068467660145","PER-5ae36f9b48163bd2","PER-7f9b0357bd382a4d"]},{"assessment":"EXPECTED \u0 fied":"2026-09-15 23:10:26.521+00","dataset":"cdp","kind":"table"},{"object":"node_phone","rows":6669,"bytes":248523,"modified":"2026-09-15 23:10:34.392+00","dataset":"cdp","kind":"table"},{"object":"party_records","rows":20000,"bytes":7050270,"modified":"2026-09-15 10:01:14.980+00","dataset":"cdp","kind":"table"},{"object":"person_assignment","rows":20000,"bytes":1028376,"modified":"2026-09-15 23:10:18.534+00","dataset":"cdp","kind":"table"},{"object":"person_consent","rows":11152,"bytes":2621827,"modified":"2026-09-15 23:11:44.454+00","dataset":"cdp","kind":"table"},{"object":"v_contactable","rows":0,"bytes":0,"modified":"2026-09-15 23:11:46.328+00","dataset":"cdp","kind":"view"}],"outputs":[{"object":"household_profile","rows":6053,"bytes":667416,"modified":"2026-09-15 23:14:55.744+00","dataset":"cdp","kind":"table"},{"object":"person_context","rows":12878,"bytes":1849741,"modified":"2026-09-15 23:14:59.387+00","dataset":"cdp","kind":"table"},{"object":"person_rfm","rows":4951,"bytes":528756,"modified":"2026-09-15 23:11:53.961+00","dataset":"cdp","kind":"table"},{"object":"person_segments","rows":4951,"bytes":346570,"modified":"2026-09-15 23:12:34.694+00","dataset":"cdp","kind":"table"},{"object":"segment_labels","rows":5,"bytes":42331,"modified":"2026-09-15 23:14:53.573+00","dataset":"cdp","kind":"table"},{"object":"v_activation_before_after","rows":0,"bytes":0,"modified":"2026-09-15 23:15:01.768+00","dataset":"cdp","kind":"view"},{"object":"v_audience_lapsed_high_value","rows":0,"bytes":0,"modified":"2026-09-15 23:15:01.065+00","dataset":"cdp","kind":"view"},{"object":"v_household_waste","rows":0,"bytes":0,"modified":"2026-09-15 23:14:56.296+00","dataset":"cdp","kind":"view"},{"object":"v_shared_identifiers","rows":0,"bytes":0,"modified":"2026-09-15 23:14:56.723+00","dataset":"cdp","kind":"view"}]}},{"id":"95_scorecard","num":"95","title":"Scorecard","summary":"Marks its own homework against ground truth, per hard case, with a diagnosis of where each failure occurred.","sql":"-- =====================================================================\n-- 95 \u00b7 Scorecard\n--\n-- The only stage that is allowed to read ground truth, and the only one\n-- that matters.\n--\n-- Everything before this point is a demonstration of mechanism. A\n-- mechanism that has not been measured is a hypothesis. This stage\n-- measures it, including \u2014 especially \u2014 where it fails.\n--\n-- Two views are the deliverable:\n--   v_scorecard     the headline numbers, with the configuration that\n--                   produced them, so any figure can be reproduced\n--   v_case_results  the hard cases, one row each, pass or fail\n--\n-- If v_case_results shows failures, that is the correct outcome to\n-- present. A demo where every case passes on the first run is a demo\n-- whose cases are too easy, and an audience of practitioners will know it.\n-- =====================================================================\n\n\n-- ---------------------------------------------------------------------\n-- 95a \u00b7 Pair sets\n--\n-- Entity resolution is scored pairwise: for every pair of records, did\n-- the system agree with truth about whether they are the same person?\n--\n-- Pairwise scoring is used rather than cluster accuracy because it\n-- degrades gracefully. Cluster accuracy calls a nine-record cluster with\n-- one wrong member a total failure; pairwise scoring calls it eight\n-- correct decisions and one wrong one, which is a far more useful thing\n-- to act on.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE TABLE `${CDP_PROJECT}.${CDP_DS}.eval_pairs`\nCLUSTER BY record_id_a, record_id_b\nAS\nWITH truth_pairs AS (\n  SELECT\n    a.record_id AS record_id_a,\n    b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS b\n    ON a.true_person_id = b.true_person_id\n   AND a.record_id < b.record_id\n),\npredicted_pairs AS (\n  SELECT\n    a.record_id AS record_id_a,\n    b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS b\n    ON a.person_id = b.person_id\n   AND a.record_id < b.record_id\n),\ncombined AS (\n  SELECT record_id_a, record_id_b FROM truth_pairs\n  UNION DISTINCT\n  SELECT record_id_a, record_id_b FROM predicted_pairs\n)\nSELECT\n  c.record_id_a,\n  c.record_id_b,\n  t.record_id_a IS NOT NULL AS is_true_pair,\n  p.record_id_a IS NOT NULL AS is_predicted_pair,\n  CASE\n    WHEN t.record_id_a IS NOT NULL AND p.record_id_a IS NOT NULL THEN 'TP'\n    WHEN t.record_id_a IS     NULL AND p.record_id_a IS NOT NULL THEN 'FP'\n    ELSE                                                              'FN'\n  END AS outcome,\n  -- Why the system got it wrong, where that can be determined. A false\n  -- negative that was never retrieved is a search problem; one that was\n  -- retrieved and rejected is a scoring problem; one that reached the\n  -- adjudicator and was declined is a judgement problem. They need\n  -- completely different fixes.\n  f.retrieved_by,\n  ti.tier,\n  d.decision,\n  d.decided_by,\n  d.confidence\nFROM combined AS c\nLEFT JOIN truth_pairs AS t\n  ON t.record_id_a = c.record_id_a AND t.record_id_b = c.record_id_b\nLEFT JOIN predicted_pairs AS p\n  ON p.record_id_a = c.record_id_a AND p.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused` AS f\n  ON f.record_id_a = c.record_id_a AND f.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS ti\n  ON ti.record_id_a = c.record_id_a AND ti.record_id_b = c.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.match_decisions` AS d\n  ON d.record_id_a = c.record_id_a AND d.record_id_b = c.record_id_b;\n\n\n-- ---------------------------------------------------------------------\n-- 95b \u00b7 Headline scorecard\n--\n-- Every number here is measured on this run, on this corpus, with the\n-- configuration printed alongside it. None of it is quoted from anywhere\n-- else, and none of it should be repeated without the configuration\n-- attached.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_scorecard` AS\nWITH counts AS (\n  SELECT\n    COUNTIF(outcome = 'TP') AS tp,\n    COUNTIF(outcome = 'FP') AS fp,\n    COUNTIF(outcome = 'FN') AS fn\n  FROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs`\n),\nclusters AS (\n  SELECT\n    (SELECT COUNT(DISTINCT true_person_id)\n     FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth`)        AS true_people,\n    (SELECT COUNT(DISTINCT person_id)\n     FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment`)         AS predicted_people,\n    (SELECT COUNT(*) FROM `${CDP_PROJECT}.${CDP_DS}.party_records`) AS records\n),\n-- A predicted cluster containing two or more real people. The privacy\n-- failure, counted separately from the aggregate because it is not the\n-- same kind of error as a missed merge.\novermerges AS (\n  SELECT COUNT(*) AS n\n  FROM (\n    SELECT a.person_id\n    FROM `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a\n    JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS t USING (record_id)\n    GROUP BY a.person_id\n    HAVING COUNT(DISTINCT t.true_person_id) > 1\n  )\n),\n-- One real person spread across two or more predicted clusters.\nundermerges AS (\n  SELECT COUNT(*) AS n\n  FROM (\n    SELECT t.true_person_id\n    FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS t\n    JOIN `${CDP_PROJECT}.${CDP_DS}.person_assignment` AS a USING (record_id)\n    GROUP BY t.true_person_id\n    HAVING COUNT(DISTINCT a.person_id) > 1\n  )\n),\nsteward AS (\n  SELECT\n    COUNTIF(decision = 'STEWARD') AS queued,\n    COUNT(*)                      AS decisions\n  FROM `${CDP_PROJECT}.${CDP_DS}.match_decisions`\n),\nllm AS (\n  SELECT COUNT(*) AS adjudicated\n  FROM `${CDP_PROJECT}.${CDP_DS}.v_adjudications_current`\n),\ncandidates AS (\n  SELECT COUNT(*) AS evaluated FROM `${CDP_PROJECT}.${CDP_DS}.pair_tiers`\n)\nSELECT\n  -- Quality\n  c.tp, c.fp, c.fn,\n  ROUND(SAFE_DIVIDE(c.tp, c.tp + c.fp), 4)                    AS pairwise_precision,\n  ROUND(SAFE_DIVIDE(c.tp, c.tp + c.fn), 4)                    AS pairwise_recall,\n  ROUND(SAFE_DIVIDE(2 * c.tp, 2 * c.tp + c.fp + c.fn), 4)     AS pairwise_f1,\n\n  -- The two error types, kept apart on purpose. They are not\n  -- interchangeable: an over-merge is a privacy incident, an under-merge\n  -- is a data-quality ticket.\n  o.n                                                         AS clusters_containing_multiple_people,\n  u.n                                                         AS people_split_across_clusters,\n\n  -- Shape\n  cl.records,\n  cl.true_people,\n  cl.predicted_people,\n  ROUND(SAFE_DIVIDE(cl.predicted_people, cl.true_people), 4)  AS people_count_ratio,\n\n  -- Cost and effort\n  cand.evaluated                                              AS pairs_evaluated,\n  l.adjudicated                                               AS pairs_sent_to_llm,\n  ROUND(100 * SAFE_DIVIDE(l.adjudicated, cand.evaluated), 3)  AS pct_of_pairs_using_an_llm,\n  s.queued                                                    AS pairs_queued_for_a_human,\n  ROUND(100 * SAFE_DIVIDE(s.queued, s.decisions), 2)          AS pct_of_decisions_deferred,\n\n  -- Reproducibility. These belong on the same row as the results; a\n  -- score without its configuration is an anecdote.\n  '${CDP_SEED}'                                               AS generator_seed,\n  '${CDP_TAU_HI}'                                             AS tau_high,\n  '${CDP_TAU_LO}'                                             AS tau_low,\n  '${CDP_ACCEPT_CONFIDENCE}'                                  AS accept_confidence,\n  '${CDP_ADJUDICATOR_MODEL}'                                  AS adjudicator_model,\n  '${CDP_PROMPT_VERSION}'                                     AS prompt_version,\n  '${CDP_EMBEDDING_ENDPOINT}'                                 AS embedding_endpoint,\n  CURRENT_TIMESTAMP()                                         AS scored_at\nFROM counts AS c, clusters AS cl, overmerges AS o, undermerges AS u,\n     steward AS s, llm AS l, candidates AS cand;\n\n\n-- ---------------------------------------------------------------------\n-- 95c \u00b7 Hard cases\n--\n-- Each planted case, scored on the pairs that involve it. A case passes\n-- only on perfect precision AND perfect recall within its own pairs \u2014\n-- there is no partial credit, because a case that half works is a case\n-- that fails on the customer it matters to.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_case_results` AS\nWITH case_pairs AS (\n  SELECT\n    ct AS case_type,\n    e.outcome,\n    e.retrieved_by,\n    e.tier,\n    e.decision,\n    e.decided_by,\n    e.record_id_a,\n    e.record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs` AS e\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS ta ON ta.record_id = e.record_id_a\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS tb ON tb.record_id = e.record_id_b,\n  UNNEST(\n    CASE\n      WHEN ta.case_type NOT IN ('NORMAL', 'SINGLETON')\n           AND tb.case_type NOT IN ('NORMAL', 'SINGLETON')\n           AND ta.case_type != tb.case_type\n        THEN [ta.case_type, tb.case_type]\n      WHEN ta.case_type NOT IN ('NORMAL', 'SINGLETON') THEN [ta.case_type]\n      WHEN tb.case_type NOT IN ('NORMAL', 'SINGLETON') THEN [tb.case_type]\n      WHEN ta.case_type = 'SINGLETON' OR tb.case_type = 'SINGLETON' THEN ['SINGLETON']\n      ELSE ['NORMAL']\n    END\n  ) AS ct\n),\nin_scope AS (\n  SELECT * FROM case_pairs WHERE case_type != 'NORMAL'\n),\nscored AS (\n  SELECT\n    case_type,\n    COUNT(*)                AS pairs_evaluated,\n    COUNTIF(outcome = 'TP') AS tp,\n    COUNTIF(outcome = 'FP') AS fp,\n    COUNTIF(outcome = 'FN') AS fn,\n    -- Where the failures came from, so a fail is actionable rather than\n    -- merely embarrassing.\n    COUNTIF(outcome = 'FN' AND retrieved_by IS NULL)              AS fn_never_retrieved,\n    COUNTIF(outcome = 'FN' AND tier = 'REJECT')                   AS fn_scored_too_low,\n    COUNTIF(outcome = 'FN' AND decided_by = 'LLM')                AS fn_declined_by_llm,\n    COUNTIF(outcome = 'FN' AND decision = 'STEWARD')              AS fn_awaiting_a_human,\n    COUNTIF(outcome = 'FP' AND decided_by = 'RULE')               AS fp_from_rules,\n    COUNTIF(outcome = 'FP' AND decided_by = 'LLM')                AS fp_from_llm,\n    COUNTIF(retrieved_by = 'SEMANTIC_ONLY')                       AS found_only_semantically,\n    COUNTIF(retrieved_by = 'LEXICAL_ONLY')                        AS found_only_lexically\n  FROM in_scope\n  GROUP BY case_type\n)\nSELECT\n  s.case_type,\n  cc.description,\n  cc.expected_outcome,\n  cc.deck_slide,\n  cc.target_instances,\n  s.pairs_evaluated,\n  s.tp, s.fp, s.fn,\n  ROUND(SAFE_DIVIDE(s.tp, s.tp + s.fp), 3) AS precision,\n  ROUND(SAFE_DIVIDE(s.tp, s.tp + s.fn), 3) AS recall,\n  s.fp = 0 AND s.fn = 0                    AS passed,\n  s.fn_never_retrieved,\n  s.fn_scored_too_low,\n  s.fn_declined_by_llm,\n  s.fn_awaiting_a_human,\n  s.fp_from_rules,\n  s.fp_from_llm,\n  s.found_only_semantically,\n  s.found_only_lexically,\n  CASE\n    WHEN s.fp = 0 AND s.fn = 0                THEN 'Handled correctly.'\n    WHEN s.fp > 0 AND cc.expected_outcome LIKE 'DO_NOT_MERGE%'\n      THEN 'OVER-MERGED \u2014 this is the serious direction of failure. Tighten before demoing.'\n    WHEN s.fn > 0 AND s.fn_never_retrieved > 0\n      THEN 'Missed at retrieval. Neither search leg surfaced the pair; blocking or embedding text is the place to look.'\n    WHEN s.fn > 0 AND s.fn_scored_too_low > 0\n      THEN 'Retrieved but scored below the grey zone. A threshold problem, not a search problem.'\n    WHEN s.fn > 0 AND s.fn_declined_by_llm > 0\n      THEN 'Reached the adjudicator and was declined. A prompt or evidence problem.'\n    WHEN s.fn_awaiting_a_human > 0\n      THEN 'Deferred to a steward. Arguably correct behaviour rather than a failure.'\n    ELSE 'Mixed failure \u2014 inspect the pairs directly.'\n  END AS diagnosis\nFROM scored AS s\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.case_catalogue` AS cc USING (case_type)\nORDER BY passed, case_type;\n\n\n-- ---------------------------------------------------------------------\n-- 95d \u00b7 Does hybrid retrieval actually earn its place?\n--\n-- The claim in the deck is that semantic-only and lexical-only\n-- architectures each miss a distinct class of true match. This is the\n-- test of that claim, against truth.\n--\n-- The honest reading: if \"recall from semantic alone\" and \"recall from\n-- lexical alone\" are both close to the hybrid figure, then hybrid is\n-- costing complexity for very little, and the deck should say so.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_retrieval_recall` AS\nWITH truth_pairs AS (\n  SELECT a.record_id AS record_id_a, b.record_id AS record_id_b\n  FROM `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS a\n  JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS b\n    ON a.true_person_id = b.true_person_id AND a.record_id < b.record_id\n),\nretrieved AS (\n  SELECT\n    t.record_id_a,\n    t.record_id_b,\n    f.retrieved_by\n  FROM truth_pairs AS t\n  LEFT JOIN `${CDP_PROJECT}.${CDP_DS}.candidate_pairs_fused` AS f\n    ON f.record_id_a = t.record_id_a AND f.record_id_b = t.record_id_b\n)\nSELECT\n  COUNT(*)                                                       AS true_pairs,\n  COUNTIF(retrieved_by IS NOT NULL)                              AS retrieved_by_hybrid,\n  COUNTIF(retrieved_by IN ('LEXICAL_ONLY', 'BOTH'))              AS retrieved_by_lexical,\n  COUNTIF(retrieved_by IN ('SEMANTIC_ONLY', 'BOTH'))             AS retrieved_by_semantic,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IS NOT NULL), COUNT(*)), 2)\n                                                                 AS pct_recall_hybrid,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IN ('LEXICAL_ONLY','BOTH')), COUNT(*)), 2)\n                                                                 AS pct_recall_lexical_only_architecture,\n  ROUND(100 * SAFE_DIVIDE(COUNTIF(retrieved_by IN ('SEMANTIC_ONLY','BOTH')), COUNT(*)), 2)\n                                                                 AS pct_recall_semantic_only_architecture,\n  COUNTIF(retrieved_by = 'LEXICAL_ONLY')                         AS pairs_a_semantic_system_would_miss,\n  COUNTIF(retrieved_by = 'SEMANTIC_ONLY')                        AS pairs_a_lexical_system_would_miss,\n  COUNTIF(retrieved_by IS NULL)                                  AS pairs_neither_leg_found\nFROM retrieved;\n\n\n-- ---------------------------------------------------------------------\n-- 95e \u00b7 The failures, individually\n--\n-- For the inevitable question: \"show me one it got wrong.\"\n--\n-- Having this query ready, and offering it before being asked, is worth\n-- more to a technical audience than any headline number.\n-- ---------------------------------------------------------------------\n\nCREATE OR REPLACE VIEW `${CDP_PROJECT}.${CDP_DS}.v_failures` AS\nSELECT\n  e.outcome,\n  e.record_id_a,\n  e.record_id_b,\n  a.match_key                AS record_a,\n  b.match_key                AS record_b,\n  ta.case_type               AS case_a,\n  tb.case_type               AS case_b,\n  ta.notes                   AS truth_note_a,\n  e.retrieved_by,\n  e.tier,\n  e.decision,\n  e.decided_by,\n  e.confidence,\n  t.combined_score,\n  t.rule_score,\n  t.similarity,\n  t.dob_conflict,\n  j.rationale                AS llm_rationale,\n  j.contradiction            AS llm_contradiction\nFROM `${CDP_PROJECT}.${CDP_DS}.eval_pairs` AS e\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS a ON a.record_id = e.record_id_a\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.party_search` AS b ON b.record_id = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS ta ON ta.record_id = e.record_id_a\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS_TRUTH}.person_truth` AS tb ON tb.record_id = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.pair_tiers` AS t\n  ON t.record_id_a = e.record_id_a AND t.record_id_b = e.record_id_b\nLEFT JOIN `${CDP_PROJECT}.${CDP_DS}.v_adjudications_current` AS j\n  ON j.record_id_a = e.record_id_a AND j.record_id_b = e.record_id_b\nWHERE e.outcome != 'TP'\n-- False positives first: they are the ones that matter most.\n--\n-- This was `ORDER BY e.outcome`, which sorts ascending, and 'FN' < 'FP' --\n-- so it did exactly the opposite of what the comment claimed and led with\n-- false negatives. An explicit CASE says the intent rather than relying on\n-- the alphabet.\n--\n-- The trailing record_id keys are a deterministic tiebreak, not decoration.\n-- This view is read through a LIMIT in the notebook, and without a total\n-- order the set of rows a human actually sees is arbitrary and can change\n-- between runs. A stable order makes the visible rows a fixed, reviewable\n-- set -- which is what lets the displayed records be vetted at all.\nORDER BY\n  CASE e.outcome WHEN 'FP' THEN 0 WHEN 'FN' THEN 1 ELSE 2 END,\n  t.combined_score DESC,\n  e.record_id_a,\n  e.record_id_b;\n","sql_lines":394,"results":[{"view":"v_scorecard","columns":["accept_confidence","adjudicator_model","clusters_containing_multiple_people","embedding_endpoint","fn","fp","generator_seed","pairs_evaluated","pairs_queued_for_a_human","pairs_sent_to_llm","pairwise_f1","pairwise_precision","pairwise_recall","pct_of_decisions_deferred","pct_of_pairs_using_an_llm","people_count_ratio","people_split_across_clusters","predicted_people","prompt_version","records","scored_at","tau_high","tau_low","tp","true_people"],"rows":[{"accept_confidence":"0.85","adjudicator_model":"gemini-3.5-flash","clusters_c
